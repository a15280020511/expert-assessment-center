name: Validate V5 Ticket Gate

on:
  pull_request:
    paths:
      - "open-model-market/v5_ticket_gate.py"
      - "tests/test_v5_ticket_gate.py"
      - ".github/workflows/v5-ticket-gate-validate.yml"
  push:
    branches: [main]
    paths:
      - "open-model-market/v5_ticket_gate.py"
      - "tests/test_v5_ticket_gate.py"
      - ".github/workflows/v5-ticket-gate-validate.yml"

permissions:
  contents: read

jobs:
  validate-ticket-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile immutable ticket gate
        run: python -m py_compile open-model-market/v5_ticket_gate.py
      - name: Run fail-closed gate tests
        run: python -m unittest tests.test_v5_ticket_gate -v
