name: One-Time Granular Stress Audit 2026-08-03

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: granular-stress-audit-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ""
  MODEL_MAX_RETRIES: "0"

jobs:
  full-suite-and-structure:
    name: Full suite, P0, line and duplication audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Bind exact source to production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts audit-logs
          checked="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$checked" = "$expected"
          test "$base" = "$production"
          test "$main" = "$production"
          printf 'checked_sha=%s\nbase_sha=%s\nproduction_sha=%s\nmain_sha=%s\n' \
            "$checked" "$base" "$production" "$main" | tee audit-artifacts/source-binding.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt \
            2>&1 | tee audit-logs/dependency-install.log
          python -m pip check 2>&1 | tee audit-logs/pip-check.log

      - name: Run canonical static and full regression gates
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee audit-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee audit-logs/full-unit-suite.log
          grep -q '^OK$' audit-logs/full-unit-suite.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee audit-logs/p0-regressions.log
          grep -q 'failures=0, errors=0, skipped=0' audit-logs/p0-regressions.log

      - name: Inspect every repository line
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir audit-artifacts \
            --fail-on high \
            2>&1 | tee audit-logs/repository-line-audit.log

      - name: Audit duplicate implementations, patching and workflow drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee audit-logs/structural-audit.log
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          root = Path("open-model-market")
          files = sorted(root.glob("*.py"))
          fatal: list[str] = []
          warnings: list[str] = []
          exact_files: dict[str, list[str]] = defaultdict(list)
          function_bodies: dict[str, list[str]] = defaultdict(list)
          definitions: dict[str, list[str]] = defaultdict(list)
          imports: dict[str, set[str]] = defaultdict(set)

          removed_modules = {
              "v5_executor",
              "v5_empty_output_recovery",
              "v5_total_call_cap",
              "v5_production_hardening",
              "v5_r8_executor",
              "v5_r8_gate_wiring",
              "v5_r8_policy",
              "v5_r8_provider_policy",
              "v5_r8_retry_policy",
              "v5_resilient_executor",
              "v5_stage_d_provider_compat",
          }

          for module in sorted(removed_modules):
              if (root / f"{module}.py").exists():
                  fatal.append(f"legacy production file remains: {module}.py")

          for path in files:
              text = path.read_text(encoding="utf-8")
              exact_files[hashlib.sha256(text.encode()).hexdigest()].append(str(path))
              tree = ast.parse(text, filename=str(path))
              local: dict[str, int] = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if node.name in local:
                          fatal.append(
                              f"duplicate top-level definition: {path}:{node.lineno}:{node.name}"
                          )
                      local[node.name] = node.lineno
                      definitions[node.name].append(f"{path}:{node.lineno}")
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == "install" and node.col_offset == 0:
                          fatal.append(f"top-level monkey-patch installer: {path}:{node.lineno}")
                      size = sum(1 for _ in ast.walk(node))
                      if size >= 80:
                          body = ast.Module(body=node.body, type_ignores=[])
                          digest = hashlib.sha256(
                              ast.dump(body, include_attributes=False).encode()
                          ).hexdigest()
                          function_bodies[digest].append(
                              f"{path}:{node.lineno}:{node.name}:{size}"
                          )
                  if isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name) and node.func.id in {"eval", "exec"}:
                          fatal.append(f"dynamic code execution: {path}:{node.lineno}")
                      if isinstance(node.func, ast.Attribute) and node.func.attr == "install":
                          fatal.append(f"monkey-patch install call: {path}:{node.lineno}")
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          imports[path.stem].add(alias.name.rsplit(".", 1)[-1])
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports[path.stem].add(node.module.rsplit(".", 1)[-1])

          duplicate_file_groups = [v for v in exact_files.values() if len(v) > 1]
          for group in duplicate_file_groups:
              fatal.append("exact duplicate production files: " + ", ".join(group))

          duplicate_function_groups = [
              v for v in function_bodies.values() if len(v) > 1
          ]
          warnings.extend(
              "large identical function body: " + ", ".join(group)
              for group in duplicate_function_groups
          )

          facade_families = {
              "issue_ticket": [
                  name for name in ("issue_ticket", "issue_ticket_hardened", "v5_issue_ticket")
                  if (root / f"{name}.py").exists()
              ],
              "validation_workflows": [
                  str(path) for path in sorted(Path(".github/workflows").glob("*validate*.yml"))
              ],
          }
          workflow_text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in sorted(Path(".github/workflows").glob("*.yml"))
          )
          ticket_references = {
              name: len(re.findall(rf"(?<![A-Za-z0-9_]){re.escape(name)}\.py(?![A-Za-z0-9_])", workflow_text))
              for name in facade_families["issue_ticket"]
          }
          active_ticket_facades = [name for name, count in ticket_references.items() if count]
          if len(active_ticket_facades) > 1:
              fatal.append(
                  "multiple ticket facades referenced by workflows: "
                  + ", ".join(active_ticket_facades)
              )
          for name in facade_families["issue_ticket"]:
              if not ticket_references[name]:
                  warnings.append(f"ticket facade not referenced by workflows: {name}.py")

          action_pattern = re.compile(r"^\s*uses:\s*([^#\s]+)")
          pinned_pattern = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              for lineno, line in enumerate(text.splitlines(), 1):
                  if re.match(r"^\s*pull_request_target\s*:", line):
                      fatal.append(f"unsafe pull_request_target trigger: {path}:{lineno}")
                  match = action_pattern.match(line)
                  if (
                      match
                      and not match.group(1).startswith(("./", "docker://"))
                      and not pinned_pattern.match(match.group(1))
                  ):
                      fatal.append(f"unpinned action: {path}:{lineno}:{match.group(1)}")

          report = {
              "status": "PASS" if not fatal else "FAIL",
              "production_python_files": len(files),
              "production_lines": sum(
                  len(path.read_text(encoding="utf-8").splitlines()) for path in files
              ),
              "exact_duplicate_file_groups": duplicate_file_groups,
              "large_identical_function_groups": duplicate_function_groups,
              "facade_families": facade_families,
              "ticket_workflow_references": ticket_references,
              "repeated_definition_names": {
                  name: locations
                  for name, locations in sorted(definitions.items())
                  if len(locations) > 1
              },
              "fatal": sorted(set(fatal)),
              "warnings": sorted(set(warnings)),
          }
          Path("audit-artifacts/structural-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          if fatal:
              raise SystemExit(1)
          PY

      - name: Create full-suite receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          logs = Path("audit-logs")
          artifacts = Path("audit-artifacts")
          artifacts.mkdir(exist_ok=True)
          unit = (logs / "full-unit-suite.log").read_text(errors="replace") if (logs / "full-unit-suite.log").exists() else ""
          p0 = (logs / "p0-regressions.log").read_text(errors="replace") if (logs / "p0-regressions.log").exists() else ""
          unit_count = None
          matches = re.findall(r"^Ran (\d+) tests? in ", unit, flags=re.MULTILINE)
          if matches:
              unit_count = int(matches[-1])
          receipt = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "paid_model_calls": 0,
              "model_cost_usd": 0.0,
              "full_unit_tests": unit_count,
              "p0_zero_failures": "failures=0, errors=0, skipped=0" in p0,
          }
          (artifacts / "full-suite-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: granular-full-suite-${{ github.run_id }}
          path: |
            audit-artifacts/
            audit-logs/
          if-no-files-found: error
          retention-days: 14

  randomized-semantic-planning:
    name: Semantic and planning seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 7, 42, 99, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run semantic, contract and graph matrix
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_v5_general_task_planning \
            tests.test_v5_planning_scenario_matrix \
            tests.test_v5_long_markdown_contract_integrity \
            tests.test_v5_explicit_contract_pipeline_integrity \
            tests.test_v5_output_contract_delivery \
            tests.test_execution_graph_properties \
            tests.test_v5_deterministic_answer_normalization

  parallel-runtime-recovery:
    name: Runtime, recovery and failure-evidence load ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 42, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run parallel runtime and recovery stress modules
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_v5_full_load_stability \
            tests.test_v5_stress_stability \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_v4_contract_isolation \
            tests.test_v5_failure_evidence \
            tests.test_v5_task_isolation

  control-plane-contracts:
    name: Admission, workflow, release and cutover contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Revalidate control-plane contracts
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_workflow_contract \
            tests.test_v5_release_command_contract \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed \
            tests.test_v5_command_trigger \
            tests.test_v5_ticket_gate \
            tests.test_ticket_security
