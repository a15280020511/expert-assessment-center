name: One-Time Granular Stress Audit 2026-08-03 Rerun

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: granular-stress-audit-rerun-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ""
  MODEL_MAX_RETRIES: "0"

jobs:
  source-binding:
    name: Verify production source and audit-only diff
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind base to main and production
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$base" = "$main"
          test "$main" = "$production"
          changed="$(git diff --name-only "$base"...HEAD)"
          test "$changed" = ".github/workflows/one-time-granular-stress-audit-20260803.yml"

  runtime-recovery-load:
    name: Runtime recovery isolation load seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 42, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run concurrency, recovery, failure-evidence and isolation stress
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_v5_full_load_stability \
            tests.test_v5_stress_stability \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_v4_contract_isolation \
            tests.test_v5_failure_evidence_chain \
            tests.test_v5_failure_evidence_persistence \
            tests.test_v5_admission_task_isolation \
            tests.test_v5_final_contract_runtime_isolation \
            tests.test_objective_isolation \
            tests.test_v5_operational_resilience \
            tests.test_v5_operational_resilience_scope \
            tests.test_v5_reasoning_saturation_recovery \
            tests.test_v5_recovery_absolute_budget_feasibility \
            tests.test_v5_recovery_guard_production_regression
