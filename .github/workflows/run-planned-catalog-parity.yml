name: Run Planned Catalog Parity

on:
  push:
    branches:
      - "fix/planned-catalog-parity"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "fix/planned-catalog-parity"
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Apply source patch
        run: python tools/apply_planned_catalog_parity_patch.py
      - name: Run zero-call regression tests
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python -m unittest \
            tests.test_v5_endpoint_catalog \
            tests.test_v5_planned_catalog_scope \
            tests.test_v5_governed_plan_orchestrator \
            tests.test_v5_governance_model_plan -v
      - name: Commit source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            open-model-market/v5_catalog_view.py \
            open-model-market/v5_endpoint_catalog.py \
            open-model-market/v5_price_ranked_pipeline.py \
            tests/test_v5_endpoint_catalog.py \
            tests/test_v5_planned_catalog_scope.py; then
            echo "Source already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            open-model-market/v5_catalog_view.py \
            open-model-market/v5_endpoint_catalog.py \
            open-model-market/v5_price_ranked_pipeline.py \
            tests/test_v5_endpoint_catalog.py \
            tests/test_v5_planned_catalog_scope.py
          git commit -m "fix: resolve only governance-planned live endpoints"
          git push origin HEAD:fix/planned-catalog-parity
