name: Apply Verified Claude Cleanup Remediation

on:
  pull_request:
    paths:
      - ".github/workflows/validate.yml"

permissions:
  contents: write

concurrency:
  group: apply-claude-cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply-remediation:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Reconstruct and verify bound patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8b1ceecd9b1f3b880f7ba540b73e9607316039ab HEAD
          mapfile -t parts < <(find .remediation -maxdepth 1 -type f -name 'claude-cleanup-20260803.*.b64' | sort)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" > /tmp/remediation.xz.b64
          printf '%s  %s\n' \
            d197d44a1400a2bc21b33905797c2394ea217163c52a8666b98774f2e34c918d \
            /tmp/remediation.xz.b64 | sha256sum -c -
          base64 -d /tmp/remediation.xz.b64 | xz -dc > /tmp/remediation.patch
          printf '%s  %s\n' \
            34d5d8a2dd1d90de6c4cb8d7b332c713587ef0a18b4d5aebdb7fae0d856c7378 \
            /tmp/remediation.patch | sha256sum -c -
          git apply --check /tmp/remediation.patch

      - name: Apply, qualify and clean temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/remediation.patch
          rm -rf .remediation
          rm -f .github/workflows/one-time-apply-claude-remediation-20260803.yml
          git show 8b1ceecd9b1f3b880f7ba540b73e9607316039ab:.github/workflows/validate.yml \
            > .github/workflows/validate.yml
          git diff --check
          python -m compileall -q open-model-market tests tools
          python tools/run_v5_p0_regressions.py | tee /tmp/p0.log
          grep -q 'P0 REGRESSION RESULT: run=62, passed=62, failures=0, errors=0, skipped=0' /tmp/p0.log

      - name: Commit authoritative remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix(runtime): unify Claude red-team and remove legacy planning residue'
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
