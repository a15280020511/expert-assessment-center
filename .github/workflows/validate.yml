name: Validate Expert Team

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/execution-ticket.yml"
      - ".github/workflows/expert-team.yml"
      - ".github/workflows/expert-team-canary.yml"
      - ".github/workflows/expert-integrity-validate.yml"
      - ".github/workflows/validate.yml"
      - ".github/dependabot.yml"
      - "requirements*.txt"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/execution-ticket.yml"
      - ".github/workflows/expert-team.yml"
      - ".github/workflows/expert-team-canary.yml"
      - ".github/workflows/expert-integrity-validate.yml"
      - ".github/workflows/validate.yml"
      - ".github/dependabot.yml"
      - "requirements*.txt"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    name: Validate toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Verify OR-Tools runtime
        run: python -c "from ortools.sat.python import cp_model; print(cp_model.CpModel())"
      - name: Run Ruff safety checks
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check --select E9,F63,F7,F82 open-model-market tests 2>&1 | tee ruff.log
      - name: Compile Python
        run: python -m py_compile open-model-market/*.py
      - name: Verify center-local maintenance and delivery controls exist
        run: |
          test -s .github/dependabot.yml
          test -s .github/workflows/validate.yml
          test -s .github/workflows/expert-integrity-validate.yml
          test -s .github/workflows/expert-team-canary.yml
          test -s .github/workflows/expert-team.yml
          test -s .github/workflows/execution-ticket.yml
          test -s open-model-market/optimization_policy.json
          test -s open-model-market/parameter_templates.json
          test -s open-model-market/team_optimizer.py
          test -s open-model-market/dynamic_runtime.py
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit-test.log
      - name: Verify secure dynamic dry-run
        run: |
          python open-model-market/expert_team_hardened.py \
            --task "Static validation: compare a software investment with technical, financial and risk constraints" \
            --catalog-file tests/fixtures/models.json --dry-run --output-dir validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("validation-artifacts/model-selection.json").read_text())
          optimization = json.loads(Path("validation-artifacts/team-optimization.json").read_text())
          dry = json.loads(Path("validation-artifacts/expert-team-dry-run.json").read_text())
          routing = json.loads(Path("validation-artifacts/task-routing.json").read_text())
          request_audit = json.loads(Path("validation-artifacts/request-audit.json").read_text())
          config = json.loads(Path("open-model-market/config.json").read_text())
          forbidden = {"tools", "tool_choice", "plugins", "web_search_options", "file_search", "models"}
          expert_count = int(plan["expert_count"])
          assert 1 <= expert_count <= 4
          assert config["routing"]["enabled"] is False
          assert config["selection"]["optimizer"]["engine"] == "google-or-tools-cp-sat"
          assert plan["orchestration"] == "google-or-tools-cp-sat-dynamic-team"
          assert plan["team_pattern"] == f"{expert_count}-experts-plus-one-judge"
          assert plan["external_tools_allowed"] is False
          assert optimization["optimizer"] == "google-or-tools-cp-sat"
          assert optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"}
          assert optimization["fallback_used"] is False
          assert len(plan["experts"]) == expert_count
          assert len(plan["inference_parameters"]) == expert_count + 1
          providers = {item["model_id"].split("/", 1)[0] for item in plan["experts"]}
          providers.add(plan["judge"]["model_id"].split("/", 1)[0])
          assert len(providers) == expert_count + 1
          assert plan["approved_total_model_calls"] >= expert_count + 1
          assert plan["model_call_allocation"]["semantic_router_calls"] == 0
          assert plan["estimated_cost_policy"] == "provider-max-theoretical-not-a-limit"
          assert plan["hard_cost_limit_usd"] is None
          assert routing["attempted"] is False
          assert routing["call_consumed"] is False
          assert routing["request_payload"] is None
          assert routing["request_token_ceiling_sent"] is False
          assert routing["status"] == "disabled"
          assert dry["task_routing"]["call_consumed"] is False
          assert dry["optimizer"] == "google-or-tools-cp-sat"
          assert request_audit["status"] == "PASS"
          assert request_audit["expected_request_count"] == 0
          for parameters in plan["inference_parameters"].values():
              assert parameters["request_token_ceiling_sent"] is False
              assert parameters["reasoning_token_ceiling_sent"] is False
              assert parameters["output_token_policy"] == "provider-model-limit-only"
              assert parameters["parameter_template"]
              assert "max_tokens" not in parameters
              assert parameters["provider_max_completion_tokens"] > 0
          for request in dry["expert_requests"]:
              assert not forbidden.intersection(request)
              assert not request["model"].startswith("openrouter/")
              assert ":online" not in request["model"]
              assert ":batch" not in request["model"]
              assert "max_tokens" not in request
              assert "max_completion_tokens" not in request
          assert Path("validation-artifacts/artifact-manifest.json").exists()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: expert-team-validation-${{ github.run_id }}
          path: |
            validation-artifacts/
            unit-test.log
            ruff.log
          if-no-files-found: warn
          retention-days: 7
