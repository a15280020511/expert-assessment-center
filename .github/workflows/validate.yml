name: Validate Expert Team

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-expert-team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run Ruff static gate
        run: |
          set -euo pipefail
          python -m ruff check .

      - name: Run compileall gate
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests tools

      - name: Run full unittest gate
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Validate governance-plan execution boundary
        run: |
          set -euo pipefail
          rm -rf validation-artifacts
          mkdir -p validation-artifacts
          cp tests/fixtures/governance-ticket.json validation-artifacts/ticket.json
          python open-model-market/v5_price_ranked_pipeline.py \
            --task "仅依据题面比较A与B，禁止工具，输出已知事实和最终建议。" \
            --governance-plan-file validation-artifacts/ticket.json \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 8 \
            --maximum-recovery-calls 1 \
            --output-dir validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("validation-artifacts")
          plan = json.loads((root / "governance-model-plan.json").read_text())
          selection = json.loads((root / "v5-price-ranked-selection.json").read_text())
          runtime = json.loads((root / "v5-runtime-config.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          assert selection["selection_authority"] == "decision-system-governance"
          assert selection["plan_sha256"] == plan["plan_sha256"]
          assert selection["model_selection_performed_locally"] is False
          assert selection["model_reranking_performed_locally"] is False
          assert selection["model_substitution_performed_locally"] is False
          assert runtime["governance_model_calls"] == 0
          assert runtime["model_loop_allowed"] is False
          assert runtime["provider_routing_mode"] == "unrestricted-openrouter"
          assert runtime["provider_restrictions_applied"] is False
          assert runtime["provider_fallback_allowed"] is True
          assert runtime["unrestricted_provider_fallback_allowed"] is True
          assert runtime["provider_lock_required"] is False
          assert runtime["openrouter_selects_provider"] is True
          assert [node["model"] for node in graph["nodes"]] == [
              row["model"] for row in plan["selected_models"]
          ]
          PY

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-plan-validation-${{ github.run_id }}
          path: validation-artifacts/
          if-no-files-found: warn
          retention-days: 14
