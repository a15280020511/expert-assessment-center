name: Validate Expert Team

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/execution-ticket.yml"
      - ".github/workflows/expert-integrity-validate.yml"
      - ".github/workflows/v5-validate.yml"
      - ".github/workflows/validate.yml"
      - ".github/workflows/promote-v5-production.yml"
      - ".github/workflows/v5-one-time-paid-acceptance.yml"
      - ".github/dependabot.yml"
      - "requirements*.txt"
      - "ruff.toml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/execution-ticket.yml"
      - ".github/workflows/expert-integrity-validate.yml"
      - ".github/workflows/v5-validate.yml"
      - ".github/workflows/validate.yml"
      - ".github/workflows/promote-v5-production.yml"
      - ".github/workflows/v5-one-time-paid-acceptance.yml"
      - ".github/dependabot.yml"
      - "requirements*.txt"
      - "ruff.toml"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    name: Validate V5 toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify dependencies and OR-Tools
        run: |
          python -m pip check
          python -c "from ortools.sat.python import cp_model; print(cp_model.CpModel())"
      - name: Run canonical Ruff checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-logs
          python -m ruff check . 2>&1 | tee validation-logs/ruff.log
      - name: Compile canonical Python tree
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-logs
          python -m compileall -q open-model-market tests tools 2>&1 | tee validation-logs/compileall.log
      - name: Verify constitutional V5 production files
        run: |
          test -s .github/dependabot.yml
          test -s .github/workflows/validate.yml
          test -s .github/workflows/v5-validate.yml
          test -s .github/workflows/expert-integrity-validate.yml
          test -s .github/workflows/execution-ticket.yml
          test -s .github/workflows/promote-v5-production.yml
          test -s .github/workflows/v5-one-time-paid-acceptance.yml
          test -s ruff.toml
          test -s open-model-market/v5_pipeline.py
          test -s open-model-market/v5_constitutional_pipeline.py
          test -s open-model-market/v5_task_constraints.py
          test -s open-model-market/v5_constitutional_runtime.py
          test -s open-model-market/v5_production_ticket.py
          test -s open-model-market/v5_issue_ticket.py
          test -s open-model-market/v5_admission_lock.py
          test -s open-model-market/v5_execution_auditor.py
          test -s open-model-market/v5_execution_auditor_integrity.py
          test -s open-model-market/v5_independent_artifact_revalidation.py
          test -s open-model-market/v5_final_status.py
          test -s open-model-market/v5_final_attestation.py
          test -s open-model-market/v5_general_task_planning.py
          test -s open-model-market/v5_planning_diagnostics.py
          test -s open-model-market/v5_quality_status_integrity.py
          test -s open-model-market/v5_truncation_budget_policy.py
          test -s open-model-market/v5_empty_output_recovery.py
          test -s open-model-market/v5_total_call_cap.py
          test -s open-model-market/v5_planner.py
          test -s open-model-market/v5_value_optimizer.py
          test -s tests/test_v5_task_constraints.py
          test -s tests/test_v5_dynamic_model_fit.py
          test -s tests/test_v5_general_task_planning.py
          test -s tests/test_v5_general_task_full_planning.py
          test -s tests/test_v5_planning_scenario_matrix.py
          test -s tests/test_v5_quality_status_integrity.py
          test -s tests/test_v5_empty_output_recovery.py
          test -s tools/run_v5_p0_regressions.py
      - name: Run canonical full unit test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation-logs
          python -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee validation-logs/unit-test.log
      - name: Run mandatory P0 regressions
        shell: bash
        run: |
          set -o pipefail
          python tools/run_v5_p0_regressions.py 2>&1 | tee p0-regressions.log
          grep -q "REGISTERED V5GeneralTaskPlanningTests: 6" p0-regressions.log
          grep -q "REGISTERED V5GeneralTaskFullPlanningTests: 4" p0-regressions.log
          grep -q "REGISTERED V5PlanningScenarioMatrixTests: 4" p0-regressions.log
          grep -q "REGISTERED V5QualityStatusIntegrityTests: 6" p0-regressions.log
          grep -q "REGISTERED V5EmptyOutputRecoveryTests: 6" p0-regressions.log
          grep -q "REGISTERED TOTAL: 26" p0-regressions.log
          grep -q "P0 REGRESSION RESULT: run=26, passed=26, failures=0, errors=0, skipped=0" p0-regressions.log
      - name: Run deterministic constitutional V5 end-to-end dry-run
        run: |
          python open-model-market/v5_constitutional_pipeline.py \
            --task "比较三个城市公共投资方案，完成财务建模、政策与法律合规、证据核验、预测推演、独立红队反证和最终决策。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 16 \
            --maximum-recovery-calls 2 \
            --quality-tier value \
            --output-dir validation-artifacts
          test -s validation-artifacts/v5-execution-graph.json
          test -s validation-artifacts/v5-planning-benchmark.json
          test -s validation-artifacts/task-constraints.json
          test -s validation-artifacts/v5-model-endpoint-market.json
          test -s validation-artifacts/artifact-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("validation-artifacts")
          constraints = json.loads((root / "task-constraints.json").read_text())
          market = json.loads((root / "v5-model-endpoint-market.json").read_text())
          dry = json.loads((root / "v5-dry-run.json").read_text())
          assert constraints["external_tools_allowed"] is False
          assert constraints["fail_closed"] is True
          assert market["fixed_preselection_weight_tuple_used"] is False
          assert market["fixed_task_fit_weight_tuple_used"] is False
          assert dry["global_monkey_patching"] is False
          assert dry["task_constraints"] == constraints
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v5-toolkit-validation-${{ github.run_id }}
          path: |
            validation-artifacts/
            validation-logs/
            p0-regressions.log
          if-no-files-found: warn
          retention-days: 7
