name: Apply V5 Spatial Anchor Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v5-spatial-anchor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-fact-provenance-structured-revalidation-20260802' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply exact spatial anchor replacements
        run: |
          set -euo pipefail
          python tools/v5_spatial_anchor_guard.py
          git diff --check
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run targeted spatial and closed-world regressions
        run: |
          set -euo pipefail
          python -m ruff check open-model-market/v5_task_constraints.py tests/test_v5_fact_provenance_semantic_normalization.py
          python -m compileall -q open-model-market tests
          python -m unittest -v \
            tests.test_v5_fact_provenance_semantic_normalization \
            tests.test_v5_quantity_binding_context \
            tests.test_v5_task_constraints \
            tests.test_v5_fact_label_purity_normalization
          PYTHONPATH=open-model-market python - <<'PY'
          from v5_task_constraints import fact_claim_supported
          task = (
              '东侧出口外地面干燥但有玻璃碎片；'
              '西侧出口外有不明液体，无法确认来源及是否存在电气风险。'
              '门外有2名无法核验身份的人。'
          )
          assert fact_claim_supported(task, '东侧出口外地面干燥但有玻璃碎片')
          assert fact_claim_supported(task, '西侧出口外有不明液体')
          assert not fact_claim_supported(task, '东侧出口外有不明液体')
          assert not fact_claim_supported(task, '西侧出口外地面干燥但有玻璃碎片')
          assert not fact_claim_supported(task, '门内有2名无法核验身份的人')
          PY
      - name: Remove one-time patch entry
        run: |
          rm -f tools/v5_spatial_anchor_guard.py
          rm -f .github/workflows/v5-apply-spatial-anchor-guard.yml
      - name: Commit clean production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(evidence): preserve spatial fact anchors'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
