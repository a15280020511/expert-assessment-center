name: Apply V5 Spatial Anchor Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v5-spatial-anchor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-fact-provenance-structured-revalidation-20260802' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply exact clause-local spatial replacements
        run: |
          set -euo pipefail
          python tools/v5_spatial_anchor_guard.py
          python tools/v5_quantity_binding_fail_closed.py
          git diff --check
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Diagnose reordered quantity binding
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          from difflib import SequenceMatcher
          import v5_task_constraints as c

          task = '纸质登记表显示4件反光背心已领用，但现场只能确认3件。'
          claim = '现场只能确认3件，登记表显示已领用4件反光背心'
          rows = c._source_evidence_rows(task)
          report = {
              'claim': claim,
              'claim_fragments': [],
              'claim_result': c.fact_claim_supported(task, claim),
              'quantity_mentions_claim': c._quantity_mentions(claim),
              'quantity_mentions_task': c._quantity_mentions(task),
          }
          for fragment in c._evidence_fragments(claim, include_whole=False):
              normalized = c._normalize_claim(fragment)
              polarity = c._negation_polarity(fragment)
              quantities = sorted(c.normalized_quantities(fragment))
              item = {
                  'fragment': fragment,
                  'normalized': normalized,
                  'polarity': polarity,
                  'quantities': quantities,
                  'quantity_binding_supported': c._quantity_bindings_supported(fragment, task) if quantities else None,
                  'quantity_skeleton': c._quantity_skeleton(fragment),
                  'source_candidates': [],
              }
              for row in rows:
                  if row['polarity'] != polarity:
                      continue
                  item['source_candidates'].append({
                      'raw': row['raw'],
                      'context_raw': row['context_raw'],
                      'normalized': row['normalized'],
                      'contextual_normalized': row['contextual_normalized'],
                      'quantities': sorted(row['quantities']),
                      'contextual_quantities': sorted(row['contextual_quantities']),
                      'quantity_skeleton': row['quantity_skeleton'],
                      'contextual_quantity_skeleton': row['contextual_quantity_skeleton'],
                      'spatially_compatible': c._spatially_compatible(fragment, row['context_raw']),
                      'semantic_reorder_supported': c._semantic_reorder_supported(fragment, row),
                      'fragment_ratio': SequenceMatcher(None, normalized, row['normalized']).ratio(),
                      'context_ratio': SequenceMatcher(None, normalized, row['contextual_normalized']).ratio(),
                  })
              report['claim_fragments'].append(item)
          print(json.dumps(report, ensure_ascii=False, indent=2, default=list))
          PY
      - name: Run targeted spatial and closed-world regressions
        run: |
          set -euo pipefail
          python -m ruff check open-model-market/v5_task_constraints.py tests/test_v5_fact_provenance_semantic_normalization.py
          python -m compileall -q open-model-market tests
          python -m unittest -v \
            tests.test_v5_fact_provenance_semantic_normalization \
            tests.test_v5_quantity_binding_context \
            tests.test_v5_task_constraints \
            tests.test_v5_fact_label_purity_normalization
          PYTHONPATH=open-model-market python - <<'PY'
          from v5_task_constraints import fact_claim_supported
          task = (
              '东侧出口外地面干燥但有玻璃碎片；'
              '西侧出口外有不明液体，无法确认来源及是否存在电气风险。'
              '门外有2名无法核验身份、自称维修人员的人要求进入。'
              '纸质登记表显示4件反光背心已领用，但现场只能确认3件。'
          )
          assert fact_claim_supported(task, '东侧出口外地面干燥但有玻璃碎片')
          assert fact_claim_supported(task, '西侧出口外有不明液体')
          assert fact_claim_supported(task, '门外有自称维修人员要求进入且无法核验身份')
          assert fact_claim_supported(task, '反光背心已领用4件，现场只能确认3件')
          assert fact_claim_supported(task, '现场只能确认3件，登记表显示已领用4件反光背心')
          assert not fact_claim_supported(task, '东侧出口外有不明液体')
          assert not fact_claim_supported(task, '西侧出口外地面干燥但有玻璃碎片')
          assert not fact_claim_supported(task, '门内有2名无法核验身份的人')
          assert not fact_claim_supported(task, '登记表显示3件反光背心已领用')
          assert not fact_claim_supported(task, '现场确认4件反光背心')
          PY
      - name: Remove one-time patch entry
        run: |
          rm -f tools/v5_spatial_anchor_guard.py
          rm -f tools/v5_spatial_reorder_guard.py
          rm -f tools/v5_quantity_binding_fail_closed.py
          rm -f .github/workflows/v5-apply-spatial-anchor-guard.yml
      - name: Commit clean production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(evidence): preserve clause-local spatial facts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
