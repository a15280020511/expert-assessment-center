name: V5 Price-Ranked Free Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "README.md"
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-price-ranked-free-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free-model-qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "120"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-price-ranked-free-qualification
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run complete zero-call validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p free-qualification/logs free-qualification/artifacts
          python -m ruff check . 2>&1 | tee free-qualification/logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee free-qualification/logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee free-qualification/logs/unit-tests.log
          python open-model-market/v5_price_ranked_pipeline.py \
            --task "仅依据题面比较A与B，禁止工具，输出已知事实和最终建议。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 8 \
            --maximum-recovery-calls 1 \
            --expert-count 4 \
            --output-dir free-qualification/artifacts/dry-run
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("free-qualification/artifacts/dry-run")
          dry = json.loads((root / "v5-dry-run.json").read_text())
          selection = json.loads(
              (root / "v5-price-ranked-selection.json").read_text()
          )
          runtime = json.loads((root / "v5-runtime-config.json").read_text())
          assert dry["status"] == "validated-not-executed"
          assert dry["model_calls"] == 0
          assert dry["claude_calls"] == 0
          assert selection["status"] == "PASS"
          assert selection["claude_calls"] == 0
          assert selection["gpt_selection_calls"] == 0
          assert selection["networkx_used_for_dag_validation"] is True
          assert selection["expert_count"] == 4
          costs = [
              row["estimated_call_cost_usd"]
              for row in selection["cheapest_candidate_set"]
          ]
          assert costs == sorted(costs)
          companies = [
              row["company"]
              for row in selection["cheapest_candidate_set"]
          ]
          assert len(companies) == len(set(companies))
          assert runtime["governance_model_calls"] == 0
          assert runtime["orchestration_library"] == "networkx"
          PY

      - name: Run one real zero-cost exact-model Canary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          import os
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from typing import Any, Mapping

          from openrouter_api import CHAT_URL, MODELS_URL, request_json
          from v5_execution_primitives import actual_cost, extract_answer

          def zero_price(value: Any) -> bool:
              try:
                  return Decimal(str(value)) == Decimal("0")
              except (InvalidOperation, TypeError, ValueError):
                  return False

          key = os.environ["OPENROUTER_API_KEY"]
          response = request_json(MODELS_URL, key, 120, 0)
          rows = response.get("data")
          if not isinstance(rows, list):
              raise RuntimeError("OpenRouter model catalog is unavailable")
          candidates = []
          for row in rows:
              if not isinstance(row, Mapping):
                  continue
              model_id = str(row.get("id") or "")
              pricing = row.get("pricing")
              if not model_id.endswith(":free") or not isinstance(pricing, Mapping):
                  continue
              if not zero_price(pricing.get("prompt")) or not zero_price(pricing.get("completion")):
                  continue
              architecture = row.get("architecture")
              architecture = architecture if isinstance(architecture, Mapping) else {}
              inputs = {str(v).casefold() for v in architecture.get("input_modalities", [])}
              outputs = {str(v).casefold() for v in architecture.get("output_modalities", [])}
              if inputs and "text" not in inputs:
                  continue
              if outputs and "text" not in outputs:
                  continue
              candidates.append({
                  "id": model_id,
                  "created": int(row.get("created") or 0),
                  "context_length": int(row.get("context_length") or 0),
              })
          if not candidates:
              raise RuntimeError("no exact zero-price text model is available")
          selected = sorted(
              candidates,
              key=lambda row: (-row["created"], -row["context_length"], row["id"]),
          )[0]
          result = request_json(
              CHAT_URL,
              key,
              120,
              0,
              {
                  "model": selected["id"],
                  "messages": [
                      {"role": "system", "content": "Return only the requested final answer."},
                      {"role": "user", "content": "Reply with exactly PASS and nothing else."},
                  ],
                  "stream": False,
                  "provider": {
                      "data_collection": "allow",
                      "zdr": False,
                      "require_parameters": True,
                  },
              },
          )
          answer = extract_answer(result).strip()
          cost = float(actual_cost(result))
          if answer.upper() != "PASS":
              raise RuntimeError("free Canary response is invalid")
          if abs(cost) > 1e-12:
              raise RuntimeError(f"free Canary returned positive cost: {cost}")
          receipt = {
              "schema_version": "v5-price-ranked-free-qualification-1",
              "target_sha": os.environ["TARGET_SHA"],
              "zero_call_validation": "PASS",
              "free_canary": {
                  "status": "PASS",
                  "requested_model": selected["id"],
                  "response_model": str(result.get("model") or ""),
                  "provider": str(result.get("provider") or ""),
                  "actual_cost_usd": cost,
              },
              "claude_mechanism_enabled": False,
              "governance_model_calls": 0,
              "production_ref_moved": False,
          }
          Path("free-qualification/free-qualification.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-price-ranked-free-qualification-${{ github.run_id }}
          path: free-qualification/
          if-no-files-found: error
          retention-days: 14
