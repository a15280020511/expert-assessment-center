name: V5 Governance-Plan Zero-Call Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "README.md"
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-zero-call-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-plan-qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run complete zero-call validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p free-qualification/logs free-qualification/artifacts/dry-run
          python -m ruff check . 2>&1 | tee free-qualification/logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee free-qualification/logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee free-qualification/logs/unit-tests.log
          cp tests/fixtures/governance-ticket.json \
            free-qualification/artifacts/dry-run/ticket.json
          python open-model-market/v5_price_ranked_pipeline.py \
            --task "仅依据题面比较A与B，禁止工具，输出已知事实和最终建议。" \
            --governance-plan-file free-qualification/artifacts/dry-run/ticket.json \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 8 \
            --maximum-recovery-calls 1 \
            --output-dir free-qualification/artifacts/dry-run
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("free-qualification/artifacts/dry-run")
          ticket = json.loads((root / "ticket.json").read_text())
          plan = ticket["governance_model_plan"]
          dry = json.loads((root / "v5-dry-run.json").read_text())
          selection = json.loads(
              (root / "v5-price-ranked-selection.json").read_text()
          )
          runtime = json.loads((root / "v5-runtime-config.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          assert dry["status"] == "validated-not-executed"
          assert dry["model_calls"] == 0
          assert selection["status"] == "PASS"
          assert selection["selection_authority"] == "decision-system-governance"
          assert selection["plan_sha256"] == plan["plan_sha256"]
          assert selection["model_selection_performed_locally"] is False
          assert selection["model_reranking_performed_locally"] is False
          assert selection["model_substitution_performed_locally"] is False
          assert selection["provider_resolution_performed_locally"] is True
          assert selection["networkx_used_for_dag_validation"] is True
          assert runtime["selection_authority"] == "decision-system-governance"
          assert runtime["model_selection_performed_locally"] is False
          assert runtime["model_reranking_performed_locally"] is False
          assert runtime["model_substitution_allowed"] is False
          assert runtime["governance_model_calls"] == 0
          assert runtime["orchestration_library"] == "networkx"
          planned = [row["model"] for row in plan["selected_models"]]
          executed = [row["model"] for row in graph["nodes"]]
          assert executed == planned
          PY

      - name: Write zero-call qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("free-qualification/artifacts/dry-run")
          plan = json.loads((root / "governance-model-plan.json").read_text())
          receipt = {
              "schema_version": "v5-governance-plan-zero-call-qualification-1",
              "target_sha": os.environ["TARGET_SHA"],
              "status": "PASS",
              "model_calls": 0,
              "selection_authority": "decision-system-governance",
              "governance_model_plan_sha256": plan["plan_sha256"],
              "model_selection_performed_locally": False,
              "model_reranking_performed_locally": False,
              "model_substitution_allowed": False,
              "provider_resolution_only": True,
              "claude_mechanism_enabled": False,
              "governance_model_calls_in_expert_center": 0,
              "production_ref_moved": False,
          }
          Path("free-qualification/free-qualification.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-plan-zero-call-${{ github.run_id }}
          path: free-qualification/
          if-no-files-found: error
          retention-days: 14
