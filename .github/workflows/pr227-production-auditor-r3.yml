name: PR227 Production Auditor R3

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.pr227-production-auditor-r3.patch
      - tools/.pr227-production-auditor-complexity.patch
      - tools/.pr227-auditor-complexity-rewrite.py
      - .github/workflows/pr227-production-auditor-r3.yml

permissions:
  contents: write

concurrency:
  group: pr227-production-auditor-r3
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply production-auditor changes
        run: |
          set -euo pipefail
          echo "0536e3a78dd48486e8b687e549dcd03fdf81cdf5e7f4bbf8c350fb14ce576de5  tools/.pr227-production-auditor-r3.patch" | sha256sum --check
          git apply --check tools/.pr227-production-auditor-r3.patch
          git apply tools/.pr227-production-auditor-r3.patch
          python -m py_compile tools/.pr227-auditor-complexity-rewrite.py
          python tools/.pr227-auditor-complexity-rewrite.py
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked development dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and focused production-audit gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest \
            tests.test_v5_native_audit_contract \
            tests.test_v5_production_cutover \
            tests.test_v5_independent_artifact_revalidation \
            tests.test_v5_evidence_bundle \
            -v

      - name: Run complete regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run eight-seed production-evidence order stress
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import os
          import random
          import sys
          import unittest

          def flatten(suite: unittest.TestSuite) -> list[unittest.TestCase]:
              rows: list[unittest.TestCase] = []
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      rows.extend(flatten(item))
                  else:
                      rows.append(item)
              return rows

          names = [
              "tests.test_v5_native_audit_contract",
              "tests.test_v5_production_cutover",
              "tests.test_v5_independent_artifact_revalidation",
              "tests.test_v5_evidence_bundle",
          ]
          for seed in (0, 1, 7, 42, 31337, 65535, 99991, 104729):
              os.environ["PYTHONHASHSEED"] = str(seed)
              cases = flatten(unittest.defaultTestLoader.loadTestsFromNames(names))
              random.Random(seed).shuffle(cases)
              result = unittest.TextTestRunner(verbosity=1).run(
                  unittest.TestSuite(cases)
              )
              if not result.wasSuccessful():
                  sys.exit(1)
          PY

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-production-auditor-audit \
            --fail-on medium

      - name: Commit validated fix and remove staging assets
        run: |
          set -euo pipefail
          rm tools/.pr227-production-auditor-r3.patch
          rm tools/.pr227-production-auditor-complexity.patch
          rm tools/.pr227-auditor-complexity-rewrite.py
          rm .github/workflows/pr227-production-auditor-r3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: audit governance and expert budgets separately"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
