name: Export Verified Workflow Files 2026-08-03

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-complete-remediation-pr-r4-20260803.yml"
      - "tools/export_verified_workflows_20260803.py"

permissions:
  contents: read

jobs:
  export-workflows:
    if: github.actor == github.repository_owner && github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Export exact workflow replacements
        run: python tools/export_verified_workflows_20260803.py

      - name: Upload exact workflow replacements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-workflow-remediation-${{ github.run_id }}
          path: workflow-remediation/
          if-no-files-found: error
          retention-days: 7
