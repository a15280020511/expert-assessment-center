name: PR227 R6 Governance Input Compaction

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.pr227-r6-governance-input-compaction.patch.gz.b64
      - .github/workflows/pr227-r6-governance-input-compaction.yml

permissions:
  contents: write

concurrency:
  group: pr227-r6-governance-input-compaction
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified compressed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/.pr227-r6-governance-input-compaction.patch.gz.b64 \
            | gzip -d > /tmp/pr227-r6-governance-input-compaction.patch
          test "$(sha256sum /tmp/pr227-r6-governance-input-compaction.patch | awk '{print $1}')" \
            = "7e6c93b8e1fcb77284fad6003182cf5075a9700b685035c63f94b0f4911cddaa"
          git apply --check /tmp/pr227-r6-governance-input-compaction.patch
          git apply /tmp/pr227-r6-governance-input-compaction.patch
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and complete regression gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Validate live catalog projection without chat calls
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          mkdir -p /tmp/pr227-governance-input-evidence
          python - <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          import model_market
          from v5_catalog_view import (
              MINIMUM_EXPERT_COMPLETION_TOKENS,
              compact_endpoint_catalog,
              eligible_models,
          )
          from v5_endpoint_catalog import fetch_live_endpoint_payloads
          from v5_gpt_expert_selector import (
              build_proposal_request,
              build_synthesis_request,
              governance_prompt_catalog,
          )

          args = argparse.Namespace(
              task="仅依据题面比较A方案月费20元流量100GB与B方案月费30元流量150GB，给出唯一建议。",
              output_dir="/tmp/pr227-governance-input-evidence",
              config="open-model-market/config.json",
              catalog_file=None,
              ranking_limit=150,
              max_completion_tokens=512,
              reasoning_effort="low",
              maximum_total_calls=4,
              maximum_recovery_calls=0,
              require_live_catalog=True,
              dry_run=False,
          )
          run = model_market.build_run_config(args)
          models, source = model_market.fetch_catalog(run)
          ranked = eligible_models(
              models,
              requested_context=16_384,
              maximum_models=150,
          )
          payloads = fetch_live_endpoint_payloads(
              ranked,
              run,
              maximum_models=len(ranked),
          )
          catalog = compact_endpoint_catalog(
              ranked,
              payloads,
              required_context_tokens=16_384,
              minimum_completion_tokens=MINIMUM_EXPERT_COMPLETION_TOKENS,
          )
          view = governance_prompt_catalog(catalog)
          task_envelope = {
              "required_context_tokens": 16_384,
              "task_constraints": {},
              "explicit_delivery_contract": {},
          }
          proposal = {
              "work_items": [{
                  "work_id": "w1",
                  "objective": "比较两个题面方案并给出唯一建议",
                  "dependencies": [],
                  "required_outputs": ["唯一建议"],
              }],
              "nodes": [{
                  "node_id": "n1",
                  "work_ids": ["w1"],
                  "role": "题面比较专家",
                  "functions": [],
                  "model": catalog["endpoints"][0]["model"],
                  "provider": catalog["endpoints"][0]["provider"],
                  "reasoning_effort": "low",
                  "max_output_tokens": 512,
                  "recovery": [],
              }],
              "edges": [],
              "final_nodes": ["n1"],
          }
          proposal_request = build_proposal_request(
              task=args.task,
              task_envelope=task_envelope,
              catalog=catalog,
              approved_total_calls=4,
              governance_calls_reserved=3,
              approved_recovery_calls=0,
              cost_anomaly_usd=0.25,
          )
          synthesis_request = build_synthesis_request(
              task=args.task,
              initial_proposal=proposal,
              claude_advice={"suggestions": []},
              task_envelope=task_envelope,
              catalog=catalog,
              approved_total_calls=4,
              governance_calls_reserved=3,
              approved_recovery_calls=0,
              cost_anomaly_usd=0.25,
          )
          source_pairs = {
              (row["model"], row["provider"])
              for row in catalog["endpoints"]
          }
          projected_pairs = {
              (model_row[0], provider_row[0])
              for model_row in view["models"]
              for provider_row in model_row[3]
          }
          message_characters = [
              len(proposal_request["messages"][1]["content"]),
              len(synthesis_request["messages"][1]["content"]),
          ]
          assert source_pairs == projected_pairs
          assert view["source_endpoint_count"] == len(source_pairs)
          assert sum(message_characters) < 75_000
          assert view["local_score_computed"] is False
          assert view["optimizer_used"] is False
          assert view["pareto_pruning_used"] is False
          result = {
              "schema_version": "pr227-live-governance-input-compaction-1",
              "status": "PASS",
              "chat_model_calls": 0,
              "catalog_source": source,
              "ranked_models": len(ranked),
              "source_endpoint_count": len(source_pairs),
              "projected_endpoint_count": len(projected_pairs),
              "prompt_model_count": view["model_count"],
              "gpt_user_message_characters": message_characters,
              "total_gpt_user_message_characters": sum(message_characters),
              "candidate_pruning_used": False,
              "local_scoring_used": False,
              "optimizer_used": False,
          }
          Path(
              "/tmp/pr227-governance-input-evidence/live-result.json"
          ).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Run eight-seed order stress
        run: |
          set -euo pipefail
          for seed in 0 1 7 42 31337 65535 99991 104729; do
            PYTHONHASHSEED="$seed" python -m unittest \
              tests.test_v5_gpt_selector_contract \
              tests.test_v5_governance_cost_guard_evidence \
              tests.test_v5_extreme_advisory_stress \
              -q
          done

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-governance-input-audit \
            --fail-on medium

      - name: Upload zero-call validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-governance-input-compaction-${{ github.run_id }}
          path: |
            /tmp/pr227-governance-input-evidence/
            /tmp/pr227-governance-input-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated repair and remove staging assets
        run: |
          set -euo pipefail
          rm tools/.pr227-r6-governance-input-compaction.patch.gz.b64
          rm .github/workflows/pr227-r6-governance-input-compaction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: compact complete governance catalog without pruning"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
