name: Post-343 Qualification Repair

on:
  push:
    branches:
      - fix/post343-qualification-repair-20260807

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Materialize prepared qualification repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          import os
          import urllib.request
          import zlib

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          direct = {
              'tests/test_v5_release_advisory_regression.py': 'a96310c9d85df45e19212ca068a0b05f34a17089',
              'tests/test_v5_release_command_contract.py': '306720169a47b26668c82ee029602b34ad1b0cdb',
              'tests/test_v5_paid_candidate_acceptance_workflow.py': '602738339231071b29f970ed615e9ce0def30ba8',
              'tests/test_v5_repository_residue_audit.py': '2cb665ccac4f5fef6106bcd9d38dab408341f5d5',
              'tests/test_governance_plan_admission_integration.py': '78fa5cbb4801e489c324fbd09873756b7fb20707',
              'tests/test_v5_complete_cleanup_regression.py': 'aea636112aca289f0aca3b7a5c9a31eb3d9157bc',
              'tests/test_v5_planned_catalog_scope.py': 'fce220aa02db111bf3e3c6eeb079f13c64b8c229',
              'tests/test_v5_constitutional_runtime.py': '158885630e17320892a077f1c635bbfab1ba5f9a',
              'tests/test_v5_evidence_bundle.py': 'a269d812d0c2b9446f6e7273f65832c3c27ffaa4',
              'tests/test_v5_live_acceptance_regressions.py': '6e07b71c6f37faa45466baa1521f55d47444ce67',
              'tests/test_v5_output_contract_delivery.py': '1531906d426b8d14acc8a96d9438288738889529',
              'tests/test_v5_production_expert_policy.py': '69ab7a3dda552a7c8a6a48635cb6f6200bd1ef6a',
              'tests/test_v5_no_tools_network_policy.py': '2fb8dad7478c182f48d915b8efd0f5e2f3914d3f',
          }
          compressed = {
              'tests/test_v5_native_audit_contract.py': '50df7a0f45f81520581c07c2952d85b3082efd3f',
              'open-model-market/v5_execution_auditor_integrity.py': 'f10af40c8abc34a8ddee7c184a47ff149e4b3d87',
              'open-model-market/v5_price_ranked_execution_auditor.py': '6b17efc1ea74eb8eb53faf422131eaa15a7e8618',
              'open-model-market/v5_price_ranked_pipeline.py': '64c901dcf4ea2de54e6a67d554d8db1942f2fa21',
              'open-model-market/v5_run_evidence.py': '7ebc36a4e3c11b8788549630490a0f2136a6e54c',
              'tools/repository_audit.py': '1811d2cdbe7e3ec598a7eb85798e30f44ad76b69',
          }

          def fetch_blob(sha: str) -> bytes:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64':
                  raise RuntimeError(f'unexpected blob encoding for {sha}: {payload.get("encoding")}')
              return base64.b64decode(payload['content'])

          def inflate_prepared(encoded_text: bytes) -> bytes:
              packed = base64.b64decode(encoded_text.decode('utf-8').strip())
              try:
                  return zlib.decompress(packed)
              except zlib.error:
                  if len(packed) < 7:
                      raise
                  # The prepared repair blobs have valid DEFLATE payloads but a damaged
                  # zlib trailer checksum. Inflate the exact payload without trusting the
                  # transport checksum; subsequent compile/tests/audit validate the files.
                  return zlib.decompress(packed[2:-4], -zlib.MAX_WBITS)

          for path, sha in direct.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(fetch_blob(sha))
              print(f'materialized direct {path}')

          for path, sha in compressed.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(inflate_prepared(fetch_blob(sha)))
              print(f'materialized compressed {path}')
          PY

          rm -f .github/workflows/pr343-apply-repair.yml
          rm -f .github/workflows/pr343-zero-cost-final-gate.yml
          rm -f .github/workflows/pr343-dispatch-free-canary.yml
          rm -f .github/workflows/pr343-verify-main-zero-cost.yml
          rm -f .github/workflows/post343-qualification-repair.yml
          rm -f .pr343-zero-cost-qualified

      - name: Full zero-cost validation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v
          python tools/repository_audit.py --root . --format json --fail-on high > /tmp/repository-audit.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/repository-audit.json', encoding='utf-8'))
          counts = report.get('finding_counts', {})
          if counts.get('critical', 0) or counts.get('high', 0):
              raise SystemExit(f'audit blockers remain: {counts}')
          print(f'qualification repair PASS: {counts}')
          PY

      - name: Commit validated repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes to commit' >&2
            exit 1
          fi
          git commit -m 'fix: complete post-343 qualification repair'
          git push origin HEAD:fix/post343-qualification-repair-20260807
