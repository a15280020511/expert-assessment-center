name: PR227 Governance Token Envelope Remediation

on:
  push:
    branches:
      - fix/v5-claude-unified-red-team-cleanup-20260803
    paths:
      - .github/workflows/pr227-governance-token-envelope-remediation.yml

permissions:
  contents: write

concurrency:
  group: pr227-governance-token-envelope-remediation
  cancel-in-progress: false

jobs:
  validate-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact governance token-envelope patch
        run: |
          set -euo pipefail
          python -m py_compile tools/pr227_governance_token_envelope_patch.py
          python tools/pr227_governance_token_envelope_patch.py
          rm tools/pr227_governance_token_envelope_patch.py
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and complete regression gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run focused governance envelope stress
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr227-governance-token-envelope
          for seed in 0 1 7 42 31337 65535 99991 104729; do
            PYTHONPATH=tests PYTHONHASHSEED="$seed" python -m unittest \
              test_v5_governance_completion_envelope \
              test_v5_production_ticket_token_envelope \
              test_v5_governance_model_resolution \
              test_v5_gpt_selector_contract \
              -q
          done
          python - <<'PY'
          import json
          from pathlib import Path

          result = {
              "schema_version": "pr227-governance-token-envelope-remediation-1",
              "status": "PASS",
              "chat_model_calls": 0,
              "paid_model_calls": 0,
              "gpt_proposal_protocol_limit": 10000,
              "gpt_proposal_effective_limit": 8000,
              "claude_protocol_limit": 512,
              "claude_effective_limit": 512,
              "gpt_synthesis_protocol_limit": 10000,
              "gpt_synthesis_effective_limit": 8000,
              "default_behavior_unchanged_when_omitted": True,
              "random_seeds": [0, 1, 7, 42, 31337, 65535, 99991, 104729],
          }
          root = Path('/tmp/pr227-governance-token-envelope')
          (root / 'result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-governance-token-envelope/repository-audit \
            --fail-on none
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/pr227-governance-token-envelope/repository-audit/repository-audit.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          blockers = [
              item
              for item in report.get('findings', [])
              if item.get('severity') in {'critical', 'high', 'medium'}
          ]
          print(json.dumps({'blocking_findings': blockers}, ensure_ascii=False, indent=2))
          if blockers:
              raise SystemExit(1)
          PY

      - name: Upload zero-call validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-governance-token-envelope-${{ github.run_id }}
          path: /tmp/pr227-governance-token-envelope/
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push validated non-workflow changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --name-only -- .github/workflows | grep -q .; then
            echo 'workflow change unexpectedly staged' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "fix: enforce governance completion token envelope"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
