name: PR227 Repair Finalize

on:
  push:
    branches:
      - fix/v5-claude-unified-red-team-cleanup-20260803
    paths:
      - ".github/pr227-final-fixup.patch.b64"
      - ".github/workflows/pr227-repair-finalize.yml"

permissions:
  contents: write

concurrency:
  group: pr227-repair-finalize
  cancel-in-progress: false

jobs:
  repair-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Apply verified cleanup and fixup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr227-final-evidence
          tr -d '\r\n' < tools/.pr227-final-dedup.patch.b64 \
            | base64 --decode | gzip --decompress --stdout \
            > /tmp/pr227-original-cleanup.patch
          git apply --check /tmp/pr227-original-cleanup.patch
          git apply /tmp/pr227-original-cleanup.patch
          tr -d '\r\n' < .github/pr227-final-fixup.patch.b64 \
            | base64 --decode | gzip --decompress --stdout \
            > /tmp/pr227-final-fixup.patch
          echo "ee32b364dc89e921197f846ece41c57d05cf2ebcc26e49c1cd2136f1877e5a7e  /tmp/pr227-final-fixup.patch" \
            | sha256sum --check
          git apply --check /tmp/pr227-final-fixup.patch
          git apply /tmp/pr227-final-fixup.patch
          rm -f \
            tools/.pr227-final-dedup.patch.b64 \
            .github/pr227-final-fixup.patch.b64 \
            .github/workflows/pr227-final-granular-audit.yml \
            .github/workflows/pr227-repair-finalize.yml
          git diff --check
          git diff --stat | tee /tmp/pr227-final-evidence/diff-stat.txt
          git diff --name-status | tee /tmp/pr227-final-evidence/changed-files.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check | tee /tmp/pr227-final-evidence/pip-check.log

      - name: Run static, compilation and complete regression gates
        run: |
          set -euo pipefail
          python -m ruff check . | tee /tmp/pr227-final-evidence/ruff.log
          python -m compileall -q open-model-market tests tools
          echo compileall=PASS | tee /tmp/pr227-final-evidence/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee /tmp/pr227-final-evidence/full-regression.log

      - name: Run eight-seed full-load and extreme stress
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pr227-final-evidence/eight-seed-stress.log
          for seed in 0 1 7 42 31337 65535 99991 104729; do
            echo "=== seed=$seed ===" | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
            PYTHONHASHSEED="$seed" python -m unittest discover \
              -s tests -p 'test_v5_full_load_stability.py' -v \
              2>&1 | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
            PYTHONHASHSEED="$seed" python -m unittest discover \
              -s tests -p 'test_v5_extreme_advisory_stress.py' -v \
              2>&1 | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
          done

      - name: Run eight-seed randomized same-process suite
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee /tmp/pr227-final-evidence/random-order.log
          import os, random, sys, unittest
          def flatten(suite):
              rows=[]
              for item in suite:
                  rows.extend(flatten(item) if isinstance(item, unittest.TestSuite) else [item])
              return rows
          for seed in (0, 1, 7, 42, 31337, 65535, 99991, 104729):
              os.environ["PYTHONHASHSEED"] = str(seed)
              cases=flatten(unittest.defaultTestLoader.discover("tests", pattern="test*.py"))
              random.Random(seed).shuffle(cases)
              print(f"seed={seed} cases={len(cases)}", flush=True)
              if not unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(cases)).wasSuccessful():
                  sys.exit(1)
          PY

      - name: Run architecture residue and duplicate audit
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/pr227-final-evidence/architecture-audit.json
          import ast, hashlib, json, re
          from pathlib import Path
          root=Path('.')
          prod=root/'open-model-market'
          workflows=root/'.github/workflows'
          removed={
              'v5_value_optimizer.py','v5_planner.py','v5_planning_runtime.py',
              'v5_constitutional_pipeline.py','v5_cross_endpoint_planner.py',
              'v5_cross_endpoint_planner_impl.py','v5_operational_resilience.py',
              'v5_general_task_planning.py','task_semantic_compiler.py',
              'resource_matrix.py','atomic_work_graph.py','team_policy.json',
              'parameter_templates.json','model-reliability-ledger.schema.json',
              'issue_ticket.py','issue_ticket_hardened.py',
          }
          old_workflows={
              'v5-one-time-paid-acceptance.yml',
              'v5-one-time-paid-claude-acceptance-20260803.yml',
              'pr227-final-granular-audit.yml','pr227-repair-finalize.yml',
          }
          forbidden_modules={
              'ortools','v5_value_optimizer','v5_planner','v5_planning_runtime',
              'v5_constitutional_pipeline','v5_cross_endpoint_planner',
              'v5_cross_endpoint_planner_impl','v5_operational_resilience',
              'v5_general_task_planning','task_semantic_compiler',
              'resource_matrix','atomic_work_graph',
          }
          forbidden_symbols={'cp_model','optimize_execution_graph','pareto_prune','compile_v5_task_resources','compile_task_semantics'}
          imports=[]; symbols=[]; writes=[]; bodies={}; quality=[]
          residue=[str(prod/p) for p in removed if (prod/p).exists()]
          stale_workflows=[str(workflows/p) for p in old_workflows if (workflows/p).exists()]
          for base in (prod, workflows):
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix in {'.py','.json','.yml','.yaml','.md','.txt'}:
                      for line_no,line in enumerate(path.read_text(encoding='utf-8',errors='ignore').splitlines(),1):
                          if re.search(r'quality[_-]tier', line, re.I): quality.append(f'{path}:{line_no}')
          for path in prod.rglob('*.py'):
              text=path.read_text(encoding='utf-8'); tree=ast.parse(text,filename=str(path)); aliases=set()
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          aliases.add(a.asname or a.name.split('.')[0])
                          if a.name.split('.')[0] in forbidden_modules: imports.append(f'{path}:{node.lineno}:{a.name}')
                  elif isinstance(node,ast.ImportFrom):
                      aliases.update(a.asname or a.name for a in node.names)
                      if (node.module or '').split('.')[0] in forbidden_modules: imports.append(f'{path}:{node.lineno}:{node.module}')
                  elif isinstance(node,ast.Name) and node.id in forbidden_symbols: symbols.append(f'{path}:{node.lineno}:{node.id}')
                  elif isinstance(node,(ast.Assign,ast.AnnAssign,ast.AugAssign)):
                      targets=node.targets if isinstance(node,ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target,ast.Attribute) and isinstance(target.value,ast.Name) and target.value.id in aliases:
                              writes.append(f'{path}:{node.lineno}:{target.value.id}.{target.attr}')
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.end_lineno and node.end_lineno-node.lineno+1 >= 4:
                      key=hashlib.sha256(ast.dump(node,include_attributes=False).encode()).hexdigest()
                      bodies.setdefault(key,[]).append(f'{path}:{node.name}:{node.lineno}')
          duplicates=[v for v in bodies.values() if len(v)>1]
          result={
              'status':'PASS' if not any((residue,stale_workflows,quality,imports,symbols,writes,duplicates)) else 'FAIL',
              'old_file_residue':residue,'old_workflow_residue':stale_workflows,
              'quality_tier_hits':quality,'forbidden_imports':imports,
              'forbidden_symbols':symbols,'module_attribute_assignments':writes,
              'duplicate_function_groups':duplicates,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['status']=='PASS', result
          PY
          python tools/repository_audit.py \
            --root . --output-dir /tmp/pr227-final-evidence/repository-audit --fail-on medium

      - name: Record zero-cost validation context
        run: |
          {
            echo "source_head=${GITHUB_SHA}"
            echo "openrouter_key_present=no"
            echo "anthropic_key_present=no"
            echo "model_calls=0"
            echo "model_cost_usd=0"
            echo "main_or_production_moved=no"
          } > /tmp/pr227-final-evidence/validation-context.txt

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-repair-final-${{ github.run_id }}
          path: /tmp/pr227-final-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit validated repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: finalize deterministic runtime cleanup"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
