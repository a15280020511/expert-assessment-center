name: One-Time Actions Constitutional Rebuild

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-actions-constitutional-rebuild.yml"
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: one-time-actions-constitutional-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.repository == 'a15280020511/expert-assessment-center' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-constitutional-semantic-evidence-dynamic-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current remediation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Rebuild all remediation changes from immutable baseline
        env:
          BASE_SHA: be9529ad2e38380954373c129250e6e24f8d3d11
          TARGET_BRANCH: actions/v5-constitutional-remediation-20260801
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary "$BASE_SHA" HEAD -- \
            . \
            ':(exclude).github/workflows/one-time-actions-constitutional-rebuild.yml' \
            > /tmp/constitutional-remediation.patch
          test -s /tmp/constitutional-remediation.patch
          git switch --detach "$BASE_SHA"
          git switch -C "$TARGET_BRANCH"
          git apply --index /tmp/constitutional-remediation.patch

          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          ROOT = Path("open-model-market")

          def replace_top_level_function(
              path: Path,
              name: str,
              replacement: str,
          ) -> None:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              matches = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one top-level {name} in {path}, got {len(matches)}"
                  )
              node = matches[0]
              lines = source.splitlines(keepends=True)
              start = node.lineno - 1
              end = node.end_lineno
              lines[start:end] = [replacement.rstrip() + "\n\n"]
              path.write_text("".join(lines), encoding="utf-8")

          runtime_path = ROOT / "v5_runtime.py"
          runtime_source = runtime_path.read_text(encoding="utf-8")
          old_import = "import v5_executor as legacy_executor\n"
          if runtime_source.count(old_import) != 1:
              raise SystemExit("unexpected legacy executor import count")
          runtime_source = runtime_source.replace(old_import, "")
          marker = 'STRICT_SUCCESS_STATUSES = {"success", "success_retried", "success_recovered"}\n'
          if runtime_source.count(marker) != 1:
              raise SystemExit("unexpected native runtime constant marker count")
          native = '''STRICT_SUCCESS_STATUSES = {"success", "success_retried", "success_recovered"}\nFORBIDDEN_REQUEST_FIELDS = {\n    "tools",\n    "tool_choice",\n    "plugins",\n    "web_search",\n    "web_search_options",\n    "file_search",\n    "browser",\n    "code_interpreter",\n    "models",\n}\n'''
          runtime_source = runtime_source.replace(marker, native)
          old_reference = "legacy_executor.FORBIDDEN_FIELDS"
          if runtime_source.count(old_reference) < 1:
              raise SystemExit("legacy forbidden-field reference is missing")
          runtime_source = runtime_source.replace(
              old_reference,
              "FORBIDDEN_REQUEST_FIELDS",
          )
          runtime_path.write_text(runtime_source, encoding="utf-8")

          replace_top_level_function(
              ROOT / "v5_task_constraints.py",
              "dynamic_objective_weights",
              '''def dynamic_objective_weights(profile: Any, task: str) -> dict[str, float]:
    """Derive a normalized objective vector from current-task pressure signals."""
    constraints = compile_task_constraints(task)
    complexity = max(
        0.0,
        min(1.0, float(getattr(profile, "complexity_score", 0) or 0) / 7.0),
    )
    high_stakes = float(bool(getattr(profile, "high_stakes", False)))
    closed_world = float(not constraints.external_facts_allowed)
    domains = {
        str(value)
        for value in (getattr(profile, "domains", []) or [])
        if str(value)
    }
    domain_breadth = min(1.0, max(0.0, float(len(domains) - 1) / 3.0))
    requested_context = max(
        1.0,
        float(getattr(profile, "requested_context", 1) or 1),
    )
    context_pressure = min(1.0, requested_context / 131_072.0)
    long_context = float(bool(getattr(profile, "long_context", False)))
    strictness = max(complexity, high_stakes, closed_world)
    epsilon = 1e-9
    raw = {
        "intelligence": max(epsilon, strictness),
        "task_fit": 1.0 + domain_breadth,
        "value": max(epsilon, 1.0 - strictness),
        "context": max(epsilon, context_pressure, long_context),
    }
    total = sum(raw.values())
    return {key: value / total for key, value in raw.items()}''',
          )

          replace_top_level_function(
              ROOT / "v5_constitutional_pipeline.py",
              "_task_fit_feature_weights",
              '''def _task_fit_feature_weights(profile: Any) -> dict[str, float]:
    """Normalize task-fit needs without a fixed feature-weight tuple."""
    complexity = max(
        0.0,
        min(1.0, float(getattr(profile, "complexity_score", 0) or 0) / 7.0),
    )
    primary = str(getattr(profile, "primary_domain", "") or "")
    secondary = str(getattr(profile, "secondary_domain", "") or "")
    secondary_needed = float(bool(secondary and secondary != primary))
    high_stakes = float(bool(getattr(profile, "high_stakes", False)))
    chinese = float(bool(getattr(profile, "chinese", False)))
    return _normalized(
        {
            "primary_domain": 1.0,
            "secondary_domain": secondary_needed,
            "reasoning_capability": complexity,
            "structured_output": max(complexity, high_stakes),
            "language_fit": chinese,
        }
    )''',
          )

          replace_top_level_function(
              ROOT / "v5_constitutional_pipeline.py",
              "_dynamic_quality_tolerance",
              '''def _dynamic_quality_tolerance(
    profile: Any,
    constraints: TaskConstraints,
    shape: Mapping[str, int | bool],
    platform_ceiling: float,
) -> float:
    complexity = max(
        0.0,
        min(1.0, float(profile.complexity_score) / 7.0),
    )
    strictness = max(
        complexity,
        float(bool(profile.high_stakes)),
        float(not constraints.external_facts_allowed),
        float(bool(shape["explicit_output_contract"])),
    )
    ceiling = max(0.0, min(20.0, float(platform_ceiling)))
    return ceiling * (1.0 - strictness)''',
          )

          legacy_pipeline = ROOT / "v5_pipeline.py"
          legacy_source = legacy_pipeline.read_text(encoding="utf-8")
          old_main = 'if __name__ == "__main__":\n    raise SystemExit(main())\n'
          delegated_main = '''if __name__ == "__main__":
    from v5_constitutional_pipeline import main as constitutional_main

    raise SystemExit(constitutional_main())
'''
          if legacy_source.count(old_main) != 1:
              raise SystemExit("legacy CLI delegation marker is missing")
          legacy_pipeline.write_text(
              legacy_source.replace(old_main, delegated_main),
              encoding="utf-8",
          )

          test_path = Path("tests/test_v5_capability_calibration.py")
          test_source = test_path.read_text(encoding="utf-8")
          needle = '        self.assertNotIn(".install()", recovery)\n'
          addition = '''        self.assertNotIn(".install()", recovery)\n        native_runtime = (\n            ROOT / "open-model-market" / "v5_runtime.py"\n        ).read_text(encoding="utf-8")\n        self.assertNotIn("import v5_executor", native_runtime)\n        self.assertNotIn("legacy_executor", native_runtime)\n        legacy_pipeline = (\n            ROOT / "open-model-market" / "v5_pipeline.py"\n        ).read_text(encoding="utf-8")\n        self.assertIn("constitutional_main()", legacy_pipeline)\n'''
          if needle not in test_source:
              raise SystemExit("runtime decoupling test insertion point missing")
          test_path.write_text(
              test_source.replace(needle, addition, 1),
              encoding="utf-8",
          )

          modules = {
              path.stem: path
              for path in ROOT.glob("*.py")
              if path.name != "__init__.py"
          }
          dependencies: dict[str, set[str]] = {name: set() for name in modules}
          install_definitions: dict[str, list[int]] = {}
          install_calls: dict[str, list[int]] = {}
          for name, path in modules.items():
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root = alias.name.split(".", 1)[0]
                          if root in modules:
                              dependencies[name].add(root)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      root = node.module.split(".", 1)[0]
                      if root in modules:
                          dependencies[name].add(root)
                  elif (
                      isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name == "install"
                      and node.col_offset == 0
                  ):
                      install_definitions.setdefault(name, []).append(node.lineno)
                  elif (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "install"
                  ):
                      install_calls.setdefault(name, []).append(node.lineno)

          roots = {
              "v5_production_ticket",
              "v5_constitutional_pipeline",
              "v5_constitutional_runtime",
              "v5_recovery_runtime",
              "v5_execution_auditor_integrity",
              "v5_independent_artifact_revalidation",
              "artifact_manifest",
              "v5_final_status",
              "v5_final_attestation",
              "v5_issue_ticket",
              "v5_admission_lock",
          }
          reachable = set(roots)
          pending = list(roots)
          while pending:
              current = pending.pop()
              for dependency in dependencies.get(current, set()):
                  if dependency not in reachable:
                      reachable.add(dependency)
                      pending.append(dependency)

          prohibited_names = {
              name
              for name in modules
              if name.startswith("v5_r8_")
              or name in {
                  "v5_production_hardening",
                  "v5_resilient_executor",
                  "v5_stage_d_provider_compat",
              }
          }
          report = {
              "production_roots": sorted(roots),
              "production_reachable_module_count": len(reachable),
              "production_install_definitions": {
                  name: install_definitions[name]
                  for name in sorted(reachable.intersection(install_definitions))
              },
              "production_install_calls": {
                  name: install_calls[name]
                  for name in sorted(reachable.intersection(install_calls))
              },
              "prohibited_legacy_reachable": sorted(
                  reachable.intersection(prohibited_names)
              ),
              "prohibited_legacy_unreachable": sorted(
                  prohibited_names - reachable
              ),
          }
          print("LEGACY_DEPENDENCY_REPORT=" + json.dumps(report, sort_keys=True))
          if report["production_install_calls"]:
              raise SystemExit("production still executes global install hooks")
          if report["prohibited_legacy_reachable"]:
              raise SystemExit("prohibited legacy modules remain production-reachable")
          PY

          test ! -e .github/workflows/one-time-actions-constitutional-rebuild.yml
          ! grep -q "import v5_executor" open-model-market/v5_runtime.py
          ! grep -q "legacy_executor" open-model-market/v5_runtime.py
          git diff --cached --check

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Validate rebuilt constitutional branch
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Commit and push Actions-authored branch
        env:
          TARGET_BRANCH: actions/v5-constitutional-remediation-20260801
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v5): constitutional semantic evidence and dynamic remediation"
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
