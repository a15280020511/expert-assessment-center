name: Validate V5 Consumer Decision

on:
  pull_request:
    paths:
      - "open-model-market/team_policy.json"
      - "open-model-market/v5_pipeline.py"
      - "tests/test_v5_consumer_decision_budget.py"
      - ".github/workflows/v5-consumer-decision-validate.yml"
  push:
    branches: [main]
    paths:
      - "open-model-market/team_policy.json"
      - "open-model-market/v5_pipeline.py"
      - "tests/test_v5_consumer_decision_budget.py"
      - ".github/workflows/v5-consumer-decision-validate.yml"

permissions:
  contents: read

jobs:
  validate-consumer-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run consumer decision regression tests
        run: python -m unittest tests.test_v5_consumer_decision_budget -v
      - name: Run exact four-call zero-cost planning rehearsal
        shell: bash
        run: |
          TASK='真实决策任务：用户在福州市担任小学夜班保安，独自在岗亭值班；岗亭无法申请学校有线网络或室内Wi-Fi，但移动4G/5G流量可用；每月流量需求约100GB以上；希望长期月成本尽量控制在20元人民币左右，可以接受一次性购买随身Wi-Fi设备。请比较方案A：继续使用手机热点，与方案B：购买并使用随身Wi-Fi。仅依据题面已知条件分析，不调用外部工具、不联网、不编造具体套餐价格。必须给出：1）关键假设与未知信息；2）一次性成本和月成本的比较公式及盈亏平衡阈值；3）稳定性、信号、电池、发热、携带、维护和故障风险；4）什么条件下选A、什么条件下选B；5）明确推荐；6）一个低成本、可撤销的7天验证步骤。事实、假设和推断必须分开。'
          python open-model-market/v5_pipeline.py \
            --task "$TASK" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 4 \
            --maximum-recovery-calls 1 \
            --cost-anomaly-usd 0.25 \
            --quality-tier value \
            --output-dir v5-consumer-decision-artifacts
      - name: Verify real-task planning contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("v5-consumer-decision-artifacts")
          semantics = json.loads((root / "task-interpretations.json").read_text())
          optimization = json.loads((root / "v5-optimization.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          dry = json.loads((root / "v5-dry-run.json").read_text())
          runtime = json.loads((root / "v5-runtime-config.json").read_text())
          parity = optimization["budget_preflight_parity"]

          signals = semantics["task_signals"]
          assert signals["active_domains"] == ["business"]
          assert signals["high_stakes"] is False
          assert optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"}
          assert len(graph["nodes"]) <= 3
          assert len(dry["requests"]) == len(graph["nodes"])
          assert dry["approved_budget"]["maximum_total_calls"] == 4
          assert dry["approved_budget"]["maximum_initial_calls"] == 3
          assert dry["approved_budget"]["maximum_recovery_calls"] == 1
          assert runtime["configuration"]["cost_risk_multiplier"] == 1.18
          assert parity["cost_risk_multiplier"] == 1.18
          assert abs(parity["planning_raw_budget_usd"] - 0.25 / 1.18) < 1e-8
          assert parity["selected_risk_adjusted_cost_usd"] <= 0.25
          assert dry["global_monkey_patching"] is False
          assert dry["legacy_runtime_present"] is False
          PY
