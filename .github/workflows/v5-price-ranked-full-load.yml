name: V5 Governance-Plan Full-Load Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "open-model-market/v5_task_adaptive_scoring.py"
      - "open-model-market/v5_top50_pool_optimizer.py"
      - "open-model-market/v5_dynamic_role_assignment.py"
      - "open-model-market/v5_parameter_design_planner.py"
      - "open-model-market/v5_hierarchical_candidate_optimizer.py"
      - "open-model-market/v5_governance_model_plan.py"
      - "open-model-market/v5_dynamic_pipeline.py"
      - "open-model-market/v5_runtime.py"
      - "tests/test_v5_task_adaptive_scoring.py"
      - "tests/test_top50_pool_optimizer.py"
      - "tests/test_v5_initial_company_heterogeneity.py"
      - "tests/test_v5_parameter_design_meta.py"
      - "tests/test_v5_dynamic_recovery_resilience.py"
      - ".github/workflows/v5-price-ranked-full-load.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-full-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-load-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run adaptive scoring and dynamic candidate-pool contracts
        run: |
          set -euo pipefail
          mkdir -p full-load-evidence
          PYTHONPATH=open-model-market coverage run --branch \
            --source=v5_task_adaptive_scoring \
            -m unittest \
            tests.test_v5_task_adaptive_scoring \
            tests.test_top50_pool_optimizer \
            tests.test_v5_initial_company_heterogeneity \
            tests.test_v5_parameter_design_meta \
            tests.test_v5_dynamic_recovery_resilience -v \
            2>&1 | tee full-load-evidence/targeted-tests.log
          coverage report --show-missing --fail-under=85 \
            2>&1 | tee full-load-evidence/coverage.log

      - name: Produce deterministic production-planner full-load receipt
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market:. python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path

          from tests.test_top50_pool_optimizer import _packet
          from v5_governance_model_plan import validate_governance_model_plan
          from v5_hierarchical_candidate_optimizer import materialize_candidate_pool_selection

          def run_one(index: int) -> tuple[str, int, int, int, int]:
              packet = _packet(complex_task=bool(index % 2))
              materialized, receipt = materialize_candidate_pool_selection(packet)
              plan = validate_governance_model_plan(materialized)
              selected = list(plan['selected_models'])
              recoveries = list(plan['recovery_models'])
              standby = list(plan['expert_center_ordered_standby'])
              candidates = list(plan['expert_candidate_pool'])
              audit = plan['optimizer_audit']

              assert receipt['model_calls'] == 0
              assert len(selected) >= 1
              assert len(recoveries) >= 0
              assert len(selected) == plan['expert_count'] == receipt['primary_expert_count']
              assert len(recoveries) == plan['recovery_count'] == receipt['recovery_count']
              assert len(selected) + len(recoveries) + len(standby) == len(candidates)
              assert audit['fixed_four_plus_four_used'] is False
              assert audit['fixed_team_size_used'] is False
              assert audit['fixed_role_topology_used'] is False
              assert audit['company_uniqueness_constraint_used'] is False
              assert audit['company_heterogeneity_soft_objective'] is True
              assert audit['company_diversity_is_execution_gate'] is False
              assert audit['hard_company_diversity_constraint'] is False
              assert audit['cross_task_company_history_used'] is False
              assert audit['assigned_position_count'] == len(selected) + len(recoveries)
              assert 1 <= audit['assigned_distinct_company_count'] <= audit['assigned_position_count']
              assert 0.0 < audit['company_heterogeneity_ratio'] <= 1.0
              assert audit['same_company_position_reuse_count'] == (
                  audit['assigned_position_count'] - audit['assigned_distinct_company_count']
              )
              assert audit['objective_priority'] == [
                  'current-task-role-quality-risk-objective',
                  'maximize-distinct-company-coverage',
                  'stable-deterministic-tie-break',
              ]
              assert audit['top50_membership_constraint_used'] is False
              assert audit['budget_constraint_used'] is False
              assert audit['price_gate_used'] is False
              assert audit['flagship_gate_used'] is False
              assert audit['free_first_gate_used'] is False
              assert audit['canary_gate_used'] is False
              assert audit['provider_constraint_used'] is False
              assert audit['capacity_gate_used'] is False
              assert audit['optimizer_optimality_required'] is False
              assert audit['semantic_keyword_routing_used'] is False
              assert audit['all_calculable_planning_parameters_dynamic'] is True
              assert audit['parameter_design_completed_before_parameter_resolution'] is True
              assert audit['parameter_design_status'] == 'PASS'
              assert audit['all_parameter_design_dimensions_classified'] is True
              assert audit['hard_model_eligibility_gates'] == []
              assert audit['only_hard_model_boundary'] == 'no-tools'
              assert audit['tool_use_forbidden'] is True
              if audit.get('fallback_used') is False:
                  assert audit['solver_status'] in {'OPTIMAL', 'FEASIBLE'}
              assert plan['provider_routing_mode'] == 'unrestricted-openrouter'
              assert plan['provider_restrictions_applied'] is False
              assert plan['model_substitution_allowed'] is True
              assert plan['tool_use_forbidden'] is True
              assert plan['tools_allowed'] is False
              assert plan['selection_principles'] == [
                  'concrete-problem-concrete-analysis',
                  'dynamic-adaptation',
                  'small-effort-large-return',
              ]

              stable = {
                  'complex': bool(index % 2),
                  'candidate_count': len(candidates),
                  'selected': [row['model'] for row in selected],
                  'recovery': [row['model'] for row in recoveries],
                  'expert_count': len(selected),
                  'recovery_count': len(recoveries),
                  'role_plan': audit['role_plan'],
                  'parameter_design_status': audit['parameter_design_status'],
                  'optimizer': audit['optimizer'],
                  'solver_status': audit['solver_status'],
                  'fallback_used': audit['fallback_used'],
                  'dynamic_solver_profile': audit['dynamic_solver_profile'],
                  'pressure': audit['task_demand_profile']['pressure']['overall'],
                  'company_sequence': audit['assigned_company_sequence'],
                  'distinct_company_count': audit['assigned_distinct_company_count'],
                  'company_heterogeneity_ratio': audit['company_heterogeneity_ratio'],
              }
              digest = hashlib.sha256(
                  json.dumps(stable, sort_keys=True).encode()
              ).hexdigest()
              return (
                  digest,
                  stable['pressure'],
                  len(selected),
                  len(recoveries),
                  len(candidates),
              )

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              results = list(pool.map(run_one, range(64)))

          simple_digests = {
              digest
              for index, (digest, _, _, _, _) in enumerate(results)
              if index % 2 == 0
          }
          complex_digests = {
              digest
              for index, (digest, _, _, _, _) in enumerate(results)
              if index % 2 == 1
          }
          assert len(simple_digests) == 1
          assert len(complex_digests) == 1

          simple_pressure, simple_primary, simple_recovery, simple_candidates = results[0][1:]
          complex_pressure, complex_primary, complex_recovery, complex_candidates = results[1][1:]
          assert complex_pressure > simple_pressure
          assert complex_primary >= simple_primary
          assert complex_primary + complex_recovery >= simple_primary + simple_recovery
          assert simple_candidates == complex_candidates
          assert simple_candidates > 0

          budget_probe = _packet()
          budget_probe['approved_budget'] = {'calls': 1, 'maximum_recovery_calls': 0}
          budget_materialized, _ = materialize_candidate_pool_selection(budget_probe)
          budget_plan = validate_governance_model_plan(budget_materialized)
          assert budget_plan['expert_count'] >= 1
          assert budget_plan['optimizer_audit']['budget_constraint_used'] is False
          assert budget_plan['optimizer_audit']['company_heterogeneity_soft_objective'] is True
          assert budget_plan['optimizer_audit']['company_diversity_is_execution_gate'] is False

          receipt = {
              'schema_version': 'v5-fully-dynamic-full-load-7-company-heterogeneity',
              'status': 'PASS',
              'target_sha': os.environ['TARGET_SHA'],
              'parallel_runs': 64,
              'worker_count': 16,
              'simple_deterministic_digest_count': len(simple_digests),
              'complex_deterministic_digest_count': len(complex_digests),
              'candidate_count': simple_candidates,
              'simple_task_pressure': simple_pressure,
              'complex_task_pressure': complex_pressure,
              'simple_primary_expert_count': simple_primary,
              'simple_recovery_count': simple_recovery,
              'complex_primary_expert_count': complex_primary,
              'complex_recovery_count': complex_recovery,
              'planner': 'v5_hierarchical_candidate_optimizer',
              'candidate_pool_authority': 'decision-system-governance',
              'model_assignment_authority': 'expert-assessment-center-dynamic-ortools',
              'optimizer': 'ortools-cp-sat-with-feasible-or-heuristic-fallback',
              'all_calculable_planning_parameters_dynamic': True,
              'parameter_design_completed_before_parameter_resolution': True,
              'hard_model_eligibility_gates': [],
              'only_hard_model_boundary': 'no-tools',
              'tool_use_forbidden': True,
              'fixed_four_plus_four_required': False,
              'company_uniqueness_required': False,
              'company_heterogeneity_soft_objective': True,
              'company_diversity_is_execution_gate': False,
              'company_heterogeneity_priority': 'after-current-task-quality-risk-before-stable-tie-break',
              'optimizer_optimality_required': False,
              'budget_admission_gate_enabled': False,
              'selection_principles': [
                  'concrete-problem-concrete-analysis',
                  'dynamic-adaptation',
                  'small-effort-large-return',
              ],
              'provider_routing_mode': 'unrestricted-openrouter',
              'provider_metric_used': False,
              'model_calls': 0,
          }
          Path('full-load-evidence/full-load-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Upload full-load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-plan-full-load-${{ github.run_id }}
          path: full-load-evidence/
          if-no-files-found: error
          retention-days: 14
