name: V5 Governance-Plan Full-Load Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "open-model-market/v5_governance_model_plan.py"
      - "open-model-market/v5_governed_plan_orchestrator.py"
      - "open-model-market/v5_price_ranked_pipeline.py"
      - "tests/test_v5_governance_model_plan.py"
      - "tests/test_v5_governed_plan_orchestrator.py"
      - "tests/fixtures/governance-ticket.json"
      - ".github/workflows/v5-price-ranked-full-load.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-full-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-load-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run governance-plan branch coverage and complex stress tests
        run: |
          set -euo pipefail
          mkdir -p full-load-evidence
          PYTHONPATH=open-model-market coverage run --branch \
            --source=v5_governance_model_plan,v5_governed_plan_orchestrator \
            -m unittest \
            tests.test_v5_governance_model_plan \
            tests.test_v5_governed_plan_orchestrator -v \
            2>&1 | tee full-load-evidence/targeted-tests.log
          coverage report --show-missing --fail-under=85 \
            2>&1 | tee full-load-evidence/coverage.log

      - name: Produce deterministic full-load receipt
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import concurrent.futures
          import copy
          import hashlib
          import json
          import os
          import random
          from pathlib import Path

          from v5_governed_plan_orchestrator import (
              GovernedPlanOrchestrationError,
              build_governed_proposal,
          )
          from v5_governance_model_plan import validate_governance_model_plan

          ticket = json.loads(
              Path("tests/fixtures/governance-ticket.json").read_text()
          )
          plan = validate_governance_model_plan(ticket)
          def endpoint(model, provider, prompt=1.0, completion=3.0):
              return {
                  "model": model,
                  "provider": provider,
                  "provider_endpoint": f"{model}@{provider}",
                  "official_intelligence_rank": 1,
                  "context_length": 131072,
                  "max_completion_tokens": 16000,
                  "prompt_price_per_million": prompt,
                  "completion_price_per_million": completion,
                  "supported_parameters": ["max_tokens", "reasoning"],
                  "input_modalities": ["text"],
                  "output_modalities": ["text"],
              }

          endpoint_rows = [
              endpoint("gamma/fast", "gamma-expensive", 5.0, 15.0),
              endpoint("gamma/fast", "gamma-cheap", 0.5, 1.5),
              endpoint("deepseek/china", "deepseek-cloud"),
              endpoint("beta/value", "beta-cloud"),
              endpoint("tau/math", "tau-cloud"),
              endpoint("rho/forecast", "rho-cloud"),
          ] + [
              endpoint(f"unused{i}/model", f"unused{i}-cloud")
              for i in range(2000)
          ]
          catalog = {"endpoints": endpoint_rows}
          envelope = {
              "task_characters": 1200,
              "required_context_tokens": 65536,
              "completion_capacity_advisory_tokens": 8192,
          }
          expected_models = [row["model"] for row in plan["selected_models"]]

          def run(seed: int):
              rows = copy.deepcopy(endpoint_rows)
              random.Random(seed).shuffle(rows)
              proposal, audit = build_governed_proposal(
                  ticket=copy.deepcopy(ticket),
                  catalog={"endpoints": rows},
                  task_envelope=envelope,
              )
              models = [row["model"] for row in proposal["nodes"]]
              digest = hashlib.sha256(
                  json.dumps(proposal, sort_keys=True).encode()
              ).hexdigest()
              assert models == expected_models
              assert audit["selection_authority"] == "decision-system-governance"
              assert audit["model_selection_performed_locally"] is False
              assert audit["model_reranking_performed_locally"] is False
              assert audit["model_substitution_performed_locally"] is False
              return digest

          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as pool:
              digests = list(pool.map(run, range(256)))
          assert len(set(digests)) == 1

          broken = copy.deepcopy(catalog)
          broken["endpoints"] = [
              row for row in broken["endpoints"]
              if row.get("model") != expected_models[0]
          ]
          try:
              build_governed_proposal(
                  ticket=ticket,
                  catalog=broken,
                  task_envelope=envelope,
              )
          except GovernedPlanOrchestrationError:
              unavailable_fails_closed = True
          else:
              unavailable_fails_closed = False
          assert unavailable_fails_closed

          receipt = {
              "schema_version": "v5-governance-plan-full-load-1",
              "status": "PASS",
              "target_sha": os.environ["TARGET_SHA"],
              "parallel_runs": 256,
              "worker_count": 32,
              "deterministic_digest_count": len(set(digests)),
              "selection_authority": "decision-system-governance",
              "governance_model_plan_sha256": plan["plan_sha256"],
              "planned_models": expected_models,
              "model_selection_performed_locally": False,
              "model_reranking_performed_locally": False,
              "model_substitution_allowed": False,
              "unavailable_model_fails_closed": unavailable_fails_closed,
              "model_calls": 0,
          }
          Path("full-load-evidence/full-load-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload full-load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-plan-full-load-${{ github.run_id }}
          path: full-load-evidence/
          if-no-files-found: error
          retention-days: 14
