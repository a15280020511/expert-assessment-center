name: V5 Governance-Plan Full-Load Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "open-model-market/v5_task_adaptive_scoring.py"
      - "open-model-market/v5_top50_pool_optimizer.py"
      - "open-model-market/v5_top50_plan_validation.py"
      - "open-model-market/v5_governance_model_plan.py"
      - "open-model-market/v5_dynamic_pipeline.py"
      - "open-model-market/v5_hierarchical_candidate_optimizer.py"
      - "open-model-market/v5_execution_transport.py"
      - "open-model-market/v5_runtime.py"
      - "open-model-market/v5_soft_resource_governance.py"
      - "tests/test_v5_task_adaptive_scoring.py"
      - "tests/test_top50_pool_optimizer.py"
      - "tests/test_v5_dynamic_recovery_resilience.py"
      - "tests/test_v5_execution_transport.py"
      - "tests/test_v5_production_standby_promotion.py"
      - ".github/workflows/v5-price-ranked-full-load.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-full-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-load-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run adaptive scoring, transport and runtime recovery contracts
        run: |
          set -euo pipefail
          mkdir -p full-load-evidence
          PYTHONPATH=open-model-market coverage run --branch \
            --source=v5_task_adaptive_scoring,v5_execution_transport,v5_runtime \
            -m unittest \
            tests.test_v5_task_adaptive_scoring \
            tests.test_top50_pool_optimizer \
            tests.test_v5_dynamic_recovery_resilience \
            tests.test_v5_execution_transport \
            tests.test_v5_production_standby_promotion -v \
            2>&1 | tee full-load-evidence/targeted-tests.log
          coverage report --show-missing --fail-under=55 \
            2>&1 | tee full-load-evidence/coverage.log

      - name: Produce deterministic dynamic full-load receipt
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market:. python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path

          from tests.test_top50_pool_optimizer import _packet
          from v5_governance_model_plan import validate_governance_model_plan
          from v5_top50_pool_optimizer import materialize_top50_selection

          target_sha = os.environ.get("TARGET_SHA", "")
          fixture = _packet()

          def once(_index: int):
              materialized, receipt = materialize_top50_selection(fixture)
              plan = validate_governance_model_plan(materialized)
              return {
                  "plan_sha256": plan["plan_sha256"],
                  "receipt_sha256": receipt["receipt_sha256"],
                  "selected_models": receipt["selected_models"],
                  "recovery_models": receipt["recovery_models"],
                  "optimizer_audit": receipt["optimizer_audit"],
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              rows = list(pool.map(once, range(64)))

          canonical = {
              json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              for row in rows
          }
          if len(canonical) != 1:
              raise SystemExit("dynamic optimizer is not deterministic under concurrent load")
          payload = rows[0]
          audit = payload["optimizer_audit"]
          if audit.get("hard_model_eligibility_gates") != []:
              raise SystemExit("business model gate reappeared")
          if audit.get("only_hard_model_boundary") != "no-tools":
              raise SystemExit("no-tools model boundary is not authoritative")
          if audit.get("fixed_team_size_used") is not False:
              raise SystemExit("fixed team size reappeared")
          if audit.get("fixed_role_topology_used") is not False:
              raise SystemExit("fixed role topology reappeared")
          if audit.get("company_uniqueness_constraint_used") is not False:
              raise SystemExit("company uniqueness gate reappeared")
          if audit.get("top50_membership_constraint_used") is not False:
              raise SystemExit("Top50 gate reappeared")
          if audit.get("budget_constraint_used") is not False:
              raise SystemExit("budget gate reappeared")
          receipt = {
              "schema_version": "v5-governance-plan-full-load-stress-receipt",
              "target_sha": target_sha,
              "parallel_runs": len(rows),
              "deterministic_result_count": len(canonical),
              "result_sha256": hashlib.sha256(next(iter(canonical)).encode()).hexdigest(),
              "primary_expert_count": len(payload["selected_models"]),
              "recovery_count": len(payload["recovery_models"]),
              "optimizer": audit.get("optimizer"),
              "solver_status": audit.get("solver_status"),
              "fixed_team_size_used": audit.get("fixed_team_size_used"),
              "fixed_role_topology_used": audit.get("fixed_role_topology_used"),
              "hard_model_eligibility_gates": audit.get("hard_model_eligibility_gates"),
              "only_hard_model_boundary": audit.get("only_hard_model_boundary"),
              "provider_routing_mode": audit.get("provider_routing_mode"),
          }
          Path("full-load-evidence/full-load-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload full-load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v5-governance-plan-full-load-${{ github.run_id }}
          path: full-load-evidence
          if-no-files-found: error
          retention-days: 30
