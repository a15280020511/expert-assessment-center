name: V5 Price-Ranked Full-Load Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "open-model-market/v5_price_ranked_*.py"
      - "tests/test_v5_price_ranked_*.py"
      - ".github/workflows/v5-price-ranked-full-load.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-price-ranked-full-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-load-stress:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run orchestrator branch coverage and complex stress tests
        env:
          PYTHONPATH: open-model-market
        run: |
          set -euo pipefail
          mkdir -p full-load
          python -m coverage erase
          python -m coverage run --branch \
            -m unittest \
            tests.test_v5_price_ranked_orchestrator \
            tests.test_v5_price_ranked_full_load -v \
            2>&1 | tee full-load/stress-tests.log
          python -m coverage json --include='*/v5_price_ranked_orchestrator.py' -o full-load/coverage.json
          python -m coverage report \
            --include='*/v5_price_ranked_orchestrator.py' \
            --fail-under=90 \
            2>&1 | tee full-load/coverage.txt

      - name: Produce deterministic full-load and package-utility receipt
        env:
          PYTHONPATH: open-model-market
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          import json
          import random
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          import networkx as nx
          from jsonschema import Draft202012Validator

          from v5_price_ranked_orchestrator import build_price_ranked_proposal

          def endpoint(index: int) -> dict[str, object]:
              author = f"stress-vendor-{index}"
              model = f"{author}/model-{index}"
              provider = f"provider-{index % 31}"
              return {
                  "model": model,
                  "provider": provider,
                  "company": author,
                  "provider_endpoint": f"{model}@{provider}",
                  "official_intelligence_rank": (index % 150) + 1,
                  "context_length": 131072,
                  "max_completion_tokens": 8192,
                  "prompt_price_per_million": 0.001 + (index % 500) / 100000,
                  "completion_price_per_million": 0.002 + (index % 500) / 50000,
                  "supported_parameters": ["max_tokens", "temperature"],
                  "input_modalities": ["text"],
                  "output_modalities": ["text"],
              }

          envelope = {
              "task_characters": 24000,
              "required_context_tokens": 65536,
              "completion_capacity_advisory_tokens": 8192,
          }
          rows = [endpoint(index) for index in range(1, 20001)]
          started = time.perf_counter()
          proposal, audit = build_price_ranked_proposal(
              catalog={"endpoints": rows},
              task_envelope=envelope,
              expert_count=6,
              recovery_calls=10,
          )
          large_catalog_seconds = time.perf_counter() - started
          if large_catalog_seconds >= 5.0:
              raise RuntimeError("large-catalog selection exceeded five seconds")

          def signature(source: list[dict[str, object]]) -> str:
              value, receipt = build_price_ranked_proposal(
                  catalog={"endpoints": source},
                  task_envelope=envelope,
                  expert_count=6,
                  recovery_calls=10,
              )
              return json.dumps(
                  {
                      "nodes": value["nodes"],
                      "edges": value["edges"],
                      "chosen": receipt["cheapest_candidate_set"],
                      "recoveries": receipt["recovery_endpoints"],
                  },
                  sort_keys=True,
              )

          baseline = signature(rows)
          permutation_signatures = []
          for seed in range(50):
              shuffled = list(rows)
              random.Random(seed).shuffle(shuffled)
              permutation_signatures.append(signature(shuffled))
          if set(permutation_signatures) != {baseline}:
              raise RuntimeError("catalog permutation changed deterministic selection")

          small_catalog = rows[:1500]
          started = time.perf_counter()
          with ThreadPoolExecutor(max_workers=32) as pool:
              concurrent_signatures = list(
                  pool.map(lambda _: signature(small_catalog), range(128))
              )
          concurrent_seconds = time.perf_counter() - started
          if set(concurrent_signatures) != {concurrent_signatures[0]}:
              raise RuntimeError("parallel orchestration produced divergent graphs")

          graph = nx.DiGraph()
          graph.add_nodes_from(node["node_id"] for node in proposal["nodes"])
          graph.add_edges_from(
              (edge["source"], edge["target"])
              for edge in proposal["edges"]
          )
          generations = [
              sorted(generation) for generation in nx.topological_generations(graph)
          ]
          if not nx.is_directed_acyclic_graph(graph) or len(generations) != 3:
              raise RuntimeError("NetworkX rejected the expert DAG")

          schema = json.loads(
              Path("open-model-market/execution-ticket.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          Draft202012Validator.check_schema(schema)
          invalid_ticket_errors = list(Draft202012Validator(schema).iter_errors({}))
          if not invalid_ticket_errors:
              raise RuntimeError("jsonschema did not reject an empty execution ticket")

          coverage = json.loads(Path("full-load/coverage.json").read_text())
          report = {
              "schema_version": "v5-price-ranked-full-load-1",
              "target_sha": "${{ env.TARGET_SHA }}",
              "status": "PASS",
              "model_calls": 0,
              "large_catalog": {
                  "endpoint_count": len(rows),
                  "selected_experts": audit["expert_count"],
                  "attached_recoveries": audit["attached_recovery_count"],
                  "elapsed_seconds": round(large_catalog_seconds, 6),
              },
              "determinism": {
                  "random_permutations": 50,
                  "unique_signatures": len(set(permutation_signatures)),
              },
              "concurrency": {
                  "parallel_builds": len(concurrent_signatures),
                  "worker_count": 32,
                  "unique_signatures": len(set(concurrent_signatures)),
                  "elapsed_seconds": round(concurrent_seconds, 6),
              },
              "topology": {
                  "node_count": graph.number_of_nodes(),
                  "edge_count": graph.number_of_edges(),
                  "directed_acyclic": nx.is_directed_acyclic_graph(graph),
                  "topological_generations": generations,
              },
              "packages": {
                  "networkx": {
                      "version": importlib.metadata.version("networkx"),
                      "used_for": ["DAG validation", "topological generations"],
                      "verified": True,
                  },
                  "jsonschema": {
                      "version": importlib.metadata.version("jsonschema"),
                      "used_for": ["execution ticket schema validation"],
                      "invalid_ticket_error_count": len(invalid_ticket_errors),
                      "verified": True,
                  },
                  "coverage": {
                      "version": importlib.metadata.version("coverage"),
                      "percent_covered": coverage["totals"]["percent_covered"],
                      "verified": coverage["totals"]["percent_covered"] >= 90,
                  },
                  "hypothesis": {
                      "version": importlib.metadata.version("hypothesis"),
                      "used_for": ["existing graph property tests"],
                      "verified": True,
                  },
                  "ruff": {
                      "version": importlib.metadata.version("ruff"),
                      "used_for": ["repository static validation"],
                      "verified": True,
                  },
              },
          }
          Path("full-load/full-load-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload full-load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-price-ranked-full-load-${{ github.run_id }}
          path: full-load/
          if-no-files-found: error
          retention-days: 30
