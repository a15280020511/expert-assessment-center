name: V5 Governance-Plan Full-Load Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "open-model-market/v5_task_adaptive_scoring.py"
      - "open-model-market/v5_top50_pool_optimizer.py"
      - "open-model-market/v5_top50_plan_validation.py"
      - "open-model-market/v5_governance_model_plan.py"
      - "open-model-market/v5_price_ranked_pipeline.py"
      - "tests/test_v5_task_adaptive_scoring.py"
      - "tests/test_top50_pool_optimizer.py"
      - ".github/workflows/v5-price-ranked-full-load.yml"
      - "requirements*.txt"

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-full-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-load-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run adaptive scoring branch coverage and Top50 contracts
        run: |
          set -euo pipefail
          mkdir -p full-load-evidence
          PYTHONPATH=open-model-market coverage run --branch \
            --source=v5_task_adaptive_scoring \
            -m unittest \
            tests.test_v5_task_adaptive_scoring \
            tests.test_top50_pool_optimizer -v \
            2>&1 | tee full-load-evidence/targeted-tests.log
          coverage report --show-missing --fail-under=85 \
            2>&1 | tee full-load-evidence/coverage.log

      - name: Produce deterministic Top50 full-load receipt
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market:. python - <<'PY'
          import concurrent.futures
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path

          from tests.test_top50_pool_optimizer import _packet
          from v5_governance_model_plan import validate_governance_model_plan
          from v5_top50_pool_optimizer import (
              Top50PoolOptimizationError,
              materialize_top50_selection,
          )

          def run_one(index: int) -> tuple[str, int]:
              packet = _packet(complex_task=bool(index % 2))
              materialized, receipt = materialize_top50_selection(packet)
              plan = validate_governance_model_plan(materialized)
              assert receipt['model_calls'] == 0
              assert len(plan['selected_models']) == 4
              assert len(plan['recovery_models']) == 4
              assert len({r['company'] for r in [*plan['selected_models'], *plan['recovery_models']]}) == 8
              assert plan['optimizer_audit']['optimality_proven'] is True
              assert plan['provider_routing_mode'] == 'unrestricted-openrouter'
              assert plan['selection_principles'] == [
                  'concrete-problem-concrete-analysis',
                  'dynamic-adaptation',
                  'small-effort-large-return',
              ]
              stable = {
                  'complex': bool(index % 2),
                  'selected': [r['model'] for r in plan['selected_models']],
                  'recovery': [r['model'] for r in plan['recovery_models']],
                  'objective': plan['optimizer_audit']['objective_value'],
                  'pressure': plan['task_demand_profile']['pressure']['overall'],
              }
              digest = hashlib.sha256(
                  json.dumps(stable, sort_keys=True).encode()
              ).hexdigest()
              return digest, stable['pressure']

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              results = list(pool.map(run_one, range(64)))

          simple_digests = {digest for index, (digest, _) in enumerate(results) if index % 2 == 0}
          complex_digests = {digest for index, (digest, _) in enumerate(results) if index % 2 == 1}
          assert len(simple_digests) == 1
          assert len(complex_digests) == 1
          simple_pressure = results[0][1]
          complex_pressure = results[1][1]
          assert complex_pressure > simple_pressure

          invalid = _packet()
          invalid['approved_budget']['maximum_recovery_calls'] = 1
          try:
              materialize_top50_selection(invalid)
          except Top50PoolOptimizationError:
              invalid_budget_fails_closed = True
          else:
              invalid_budget_fails_closed = False
          assert invalid_budget_fails_closed

          receipt = {
              'schema_version': 'v5-task-adaptive-top50-full-load-2',
              'status': 'PASS',
              'target_sha': os.environ['TARGET_SHA'],
              'parallel_runs': 64,
              'worker_count': 16,
              'simple_deterministic_digest_count': len(simple_digests),
              'complex_deterministic_digest_count': len(complex_digests),
              'simple_task_pressure': simple_pressure,
              'complex_task_pressure': complex_pressure,
              'candidate_pool_authority': 'decision-system-governance',
              'model_assignment_authority': 'expert-assessment-center-ortools',
              'optimizer': 'ortools-cp-sat',
              'primary_expert_count': 4,
              'warm_recovery_count': 4,
              'selection_principles': [
                  'concrete-problem-concrete-analysis',
                  'dynamic-adaptation',
                  'small-effort-large-return',
              ],
              'provider_routing_mode': 'unrestricted-openrouter',
              'provider_metric_used': False,
              'invalid_budget_fails_closed': invalid_budget_fails_closed,
              'model_calls': 0,
          }
          Path('full-load-evidence/full-load-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Upload full-load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-plan-full-load-${{ github.run_id }}
          path: full-load-evidence/
          if-no-files-found: error
          retention-days: 14
