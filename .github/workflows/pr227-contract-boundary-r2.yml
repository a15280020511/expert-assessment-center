name: PR227 Contract Boundary R2

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.pr227-contract-boundary-r2.patch
      - .github/workflows/pr227-contract-boundary-r2.yml

permissions:
  contents: write

concurrency:
  group: pr227-contract-boundary-r2
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply cross-stage contract patch
        run: |
          set -euo pipefail
          echo "215dc14083c4b7a095a52e966edd46f81b6bfd16d7feeb3ff92bb53fecf0a4b1  tools/.pr227-contract-boundary-r2.patch" | sha256sum --check
          git apply --check tools/.pr227-contract-boundary-r2.patch
          git apply tools/.pr227-contract-boundary-r2.patch
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked development dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and contract-focused gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest \
            tests.test_v5_claude_red_team_advice \
            tests.test_v5_gpt_selector_contract \
            -v

      - name: Run complete regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run same-process randomized contract stress
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import os
          import random
          import sys
          import unittest

          def flatten(suite: unittest.TestSuite) -> list[unittest.TestCase]:
              rows: list[unittest.TestCase] = []
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      rows.extend(flatten(item))
                  else:
                      rows.append(item)
              return rows

          for seed in (0, 1, 7, 42, 31337, 65535, 99991, 104729):
              os.environ["PYTHONHASHSEED"] = str(seed)
              suite = unittest.defaultTestLoader.loadTestsFromNames([
                  "tests.test_v5_claude_red_team_advice",
                  "tests.test_v5_gpt_selector_contract",
                  "tests.test_v5_extreme_advisory_stress",
              ])
              cases = flatten(suite)
              random.Random(seed).shuffle(cases)
              result = unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(cases))
              if not result.wasSuccessful():
                  sys.exit(1)
          PY

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-contract-boundary-audit \
            --fail-on medium

      - name: Commit validated fix and remove staging assets
        run: |
          set -euo pipefail
          rm tools/.pr227-contract-boundary-r2.patch
          rm .github/workflows/pr227-contract-boundary-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: align governance schemas with runtime parsers"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
