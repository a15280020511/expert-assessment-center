name: Validate Governance Expert Topology V6

on:
  pull_request:
    branches: [main]
    paths:
      - "CONTROL_TOPOLOGY.md"
      - "SECURITY.md"
      - "CONSTITUTION.md"
      - "governance-compatibility.json"
      - "open-model-market/v6_*.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "CONTROL_TOPOLOGY.md"
      - "SECURITY.md"
      - "CONSTITUTION.md"
      - "governance-compatibility.json"
      - "open-model-market/v6_*.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expert-governance-topology-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate governance-only V6 topology
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          row = json.loads((root / 'governance-compatibility.json').read_text(encoding='utf-8'))
          expected = {
              'schema_version': 'governance-compatibility-v2',
              'governance_version': '4.1.0',
              'compatible_governance_versions': '>=4.1.0,<5.0.0',
              'external_controller': 'a15280020511/decision-system-governance',
              'gpts_direct_control_allowed': False,
              'sole_cross_repository_relay': 'a15280020511/decision-system-governance',
              'direct_center_to_center_calls_allowed': False,
              'huggingface_direct_access_allowed': False,
              'hf_token_allowed': False,
              'compute_baseline_access_allowed': True,
              'compute_baseline_access_mode': 'governance-task-scoped-evidence-only',
              'compute_baseline_direct_repository_access_allowed': False,
              'compute_baseline_full_library_browse_allowed': False,
              'intelligence_artifact_access_allowed': False,
              'compute_artifact_access_allowed': False,
              'tools_allowed': False,
              'network_allowed': False,
          }
          bad = [key for key, value in expected.items() if row.get(key) != value]
          if bad:
              raise SystemExit(f'governance compatibility mismatch: {bad}')
          if row['governance_contract_sha256'] != 'a57f5cd754517a40e13bd7d15c45bc088651599dbc69e1113153e0372b73fc63':
              raise SystemExit('governance contract digest mismatch')

          topology = (root / 'CONTROL_TOPOLOGY.md').read_text(encoding='utf-8')
          security = (root / 'SECURITY.md').read_text(encoding='utf-8')
          constitution = (root / 'CONSTITUTION.md').read_text(encoding='utf-8')
          for marker in (
              '网页 GPTs 不得直接控制本仓库',
              'a15280020511/decision-system-governance',
              '不得直接访问 Hugging Face',
              '禁止工具和网络',
          ):
              if marker not in topology and marker not in security:
                  raise SystemExit(f'missing topology marker: {marker}')
          for marker in (
              '治理中心（按实际任务预计费用选择并签发模型名单）',
              'networkx==3.6.1',
              'Claude 红队机制、GPT 提案机制、GPT 综合机制以及任何其他治理模型链全部取消',
          ):
              if marker not in constitution:
                  raise SystemExit(f'missing V6 constitutional marker: {marker}')

          expression_open = '$' + '{{'
          expression_close = '}' + '}'
          violations = []
          for path in (root / '.github/workflows').glob('*.yml'):
              if path.name == 'governance-topology-validate.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              forbidden_patterns = (
                  'HF_TOKEN: ' + expression_open + ' secrets.HF_TOKEN ' + expression_close,
                  'HF_NUMERIC_BASELINE_DATASET_REPO: ' + expression_open,
                  'repository_dispatch:',
                  'uses: a15280020511/evidence-data-center',
                  'uses: a15280020511/compute-simulation-center',
                  'v5_claude_red_team_policy.py',
                  'v5_governance_runtime.py',
                  'v5_gpt_expert_selector.py',
              )
              for pattern in forbidden_patterns:
                  if pattern in text:
                      violations.append(f'{path}:{pattern}')
          if violations:
              raise SystemExit(f'workflow topology violations: {violations}')
          print(json.dumps({
              'status': 'EXPERT_GOVERNANCE_TOPOLOGY_V6_VALIDATED',
              'external_controller': row['external_controller'],
              'selection_authority': 'decision-system-governance',
              'orchestration_library': 'networkx==3.6.1',
              'gpts_direct_control_allowed': False,
              'direct_center_to_center_calls_allowed': False,
              'huggingface_direct_access_allowed': False,
              'tools_allowed': False,
              'expert_model_network_allowed': False,
              'governance_model_calls': 0,
              'claude_calls': 0,
              'secret_values_exposed': False,
          }, ensure_ascii=False, sort_keys=True))
          PY
          git diff --check
