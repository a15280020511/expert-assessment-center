name: V5 Live Acceptance Qualified Audit

on:
  pull_request:
    branches:
      - fix/v5-live-acceptance-contract-20260802

permissions:
  contents: read
  actions: read

env:
  OPENROUTER_API_KEY: ""
  OPENROUTER_MANAGEMENT_KEY: ""

concurrency:
  group: v5-live-acceptance-qualified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Canonical static, complete unit and mandatory P0 suite
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY || true
          mkdir -p audit-logs
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools 2>&1 | tee audit-logs/compile.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee audit-logs/full-unit.log
          grep -Eq '^Ran 341 tests? in ' audit-logs/full-unit.log
          grep -q '^OK$' audit-logs/full-unit.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee audit-logs/p0.log
          grep -q 'REGISTERED TOTAL: 52' audit-logs/p0.log
          grep -q 'P0 REGRESSION RESULT: run=52, passed=52, failures=0, errors=0, skipped=0' audit-logs/p0.log
          printf '{"status":"PASS","unit_tests":341,"p0_tests":52,"model_calls":0,"model_cost_usd":0}\n' \
            > audit-logs/zero-cost-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-acceptance-qualified-canonical-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: warn
          retention-days: 30

  semantic-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 7, 42, 99, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Semantic, failure evidence and independent revalidation matrix
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
          HYPOTHESIS_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY || true
          mkdir -p audit-logs
          python -m unittest -v \
            tests.test_v5_task_constraints \
            tests.test_v5_fact_label_purity_normalization \
            tests.test_v5_fact_provenance_semantic_normalization \
            tests.test_v5_inferential_anchor_threshold \
            tests.test_v5_independent_artifact_revalidation \
            tests.test_v5_failure_evidence_persistence \
            tests.test_v5_native_audit_contract \
            tests.test_v5_failure_evidence_chain \
            2>&1 | tee audit-logs/semantic-seed-${{ matrix.seed }}.log
          printf '{"status":"PASS","seed":%s,"model_calls":0,"model_cost_usd":0}\n' \
            '${{ matrix.seed }}' > audit-logs/zero-cost-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-acceptance-qualified-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: warn
          retention-days: 30

  parallel-runtime-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 42, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Concurrent runtime, recovery and evidence load
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
          HYPOTHESIS_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY || true
          mkdir -p audit-logs
          python -m unittest -v \
            tests.test_v5_full_load_stability \
            tests.test_v5_stress_stability \
            tests.test_v5_operational_resilience \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_recovery_absolute_budget_feasibility \
            tests.test_v5_recovery_guard_production_regression \
            tests.test_v5_failure_evidence_persistence \
            2>&1 | tee audit-logs/parallel-${{ matrix.seed }}.log
          printf '{"status":"PASS","seed":%s,"model_calls":0,"model_cost_usd":0}\n' \
            '${{ matrix.seed }}' > audit-logs/zero-cost-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-acceptance-qualified-parallel-${{ matrix.seed }}-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: warn
          retention-days: 30

  real-artifact-and-properties:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Download immutable failed production artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: "8828451845"
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > failed-production-artifact.zip
          mkdir replay-artifact
          unzip -q failed-production-artifact.zip -d replay-artifact
          test -f replay-artifact/expert-team-result.json
          test ! -f replay-artifact/v5-result.json
      - name: Fuzz label boundaries and replay primitive evidence
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY || true
          mkdir -p audit-logs
          PYTHONPATH=open-model-market python - <<'PY' | tee audit-logs/property-summary.json
          import json
          import random
          from pathlib import Path
          from v5_independent_artifact_revalidation import _canonical_task
          from v5_task_constraints import validate_answer_evidence

          root = Path('replay-artifact')
          ticket = json.loads((root / 'ticket.json').read_text(encoding='utf-8'))
          report = (root / 'v5-final-report.md').read_text(encoding='utf-8')
          task = _canonical_task(ticket)
          report_violations = validate_answer_evidence(task, report)
          assert not any(
              item.startswith('unsupported-fact-label:')
              for item in report_violations
          ), report_violations

          taxonomy_cases = 0
          formal_cases = 0
          rejected_cases = 0
          for seed in range(512):
              rng = random.Random(seed)
              separator = rng.choice(['、', '，', ' / ', '和'])
              taxonomy = f'事实{separator}假设{separator}推断{separator}未知四类标签必须区分。'
              assert not any(
                  item.startswith('unsupported-fact-label:')
                  for item in validate_answer_evidence('仅依据题面，不得编造。', taxonomy)
              )
              taxonomy_cases += 1

              prefix = rng.choice(['事实：', '已知事实：', '**事实｜来源：题面**：', '- 事实 - '])
              supported = prefix + '北门外地面干燥。'
              unsupported = prefix + '北门外发生坍塌。'
              closed = '仅依据题面，不得编造。北门外地面干燥。'
              assert not validate_answer_evidence(closed, supported)
              violations = validate_answer_evidence(closed, unsupported)
              assert any(
                  item.startswith('unsupported-fact-label:')
                  for item in violations
              )
              formal_cases += 1
              rejected_cases += 1

          print(json.dumps({
              'status': 'PASS',
              'taxonomy_cases': taxonomy_cases,
              'formal_fact_cases': formal_cases,
              'unsupported_fact_cases_rejected': rejected_cases,
              'real_report_fact_label_violations': [],
              'real_report_other_evidence_violations': report_violations,
              'model_calls': 0,
              'model_cost_usd': 0,
          }, ensure_ascii=False, sort_keys=True))
          PY
          set +e
          PYTHONPATH=open-model-market python \
            open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir replay-artifact \
            --expected-sha 7633ebab0eda1027df83a24cdfd5edd26f35e221 \
            --expected-run-id 30732177815 \
            --maximum-calls 5 \
            --maximum-cost-usd 0.35 \
            --archive failed-production-artifact.zip \
            --expected-artifact-digest sha256:c39cc969769134c3f8e85409bca9d1c004154f78f535cae39308118303ce7181 \
            --output audit-logs/replay-verdict.json
          code=$?
          set -e
          test "$code" -ne 0
          jq -e '.status == "FAIL"' audit-logs/replay-verdict.json
          jq -e '.recomputed_from_primitive_evidence == true' audit-logs/replay-verdict.json
          jq -e '.paid_acceptance_verdict_used_as_source == false' audit-logs/replay-verdict.json
          jq -e '.model_calls == 5 and .actual_cost_usd == 0.01439626' audit-logs/replay-verdict.json
          jq -e '.final_report_contract_violations == []' audit-logs/replay-verdict.json
          jq -e '.independently_recomputed_evidence_violations == []' audit-logs/replay-verdict.json
          printf '{"status":"PASS","historical_failure_reclassified":false,"model_calls":0,"model_cost_usd":0}\n' \
            > audit-logs/zero-cost-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-acceptance-qualified-properties-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: warn
          retention-days: 30

  granular-repository-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Inspect every repository file and source line
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY OPENROUTER_MANAGEMENT_KEY || true
          python tools/repository_audit.py \
            --root . \
            --output-dir audit-artifacts \
            --fail-on high
          tar --exclude=.git --exclude=audit-artifacts \
            -czf audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz .
          sha256sum audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz \
            > audit-artifacts/repository-source-${GITHUB_SHA}.sha256
          printf '{"status":"PASS","model_calls":0,"model_cost_usd":0}\n' \
            > audit-artifacts/zero-cost-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-acceptance-qualified-granular-${{ github.run_id }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 30
