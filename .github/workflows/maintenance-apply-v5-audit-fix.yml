name: Maintenance Apply V5 Audit Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-apply-v5-audit-fix
  cancel-in-progress: false

jobs:
  apply-validated-patch:
    if: >-
      github.actor == 'a15280020511' &&
      github.event.issue.title == '[maintenance-apply-v5-audit-fix] validated patch' &&
      github.event.comment.body == '/apply-v5-audit-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: fix/v5-production-stability-audit-r1
      EXPECTED_BASE: 95f6d295994e5dd7b2ef0cc54f22e43a1c620aa4
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Publish start receipt
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PATCH_VALIDATION_STARTED\n\n- Run: \`${context.runId}\`\n- Branch: \`${process.env.TARGET_BRANCH}\``
            })

      - name: Checkout exact target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true

      - name: Reconstruct and verify immutable patch
        shell: bash
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path

          event = json.loads(Path(os.environ['EVENT_PATH']).read_text(encoding='utf-8'))
          ticket = json.loads(event['issue']['body'])
          if ticket.get('target_branch') != os.environ['TARGET_BRANCH']:
              raise SystemExit('target branch mismatch')
          if ticket.get('base_commit') != os.environ['EXPECTED_BASE']:
              raise SystemExit('base commit mismatch')

          expected_count = int(ticket.get('part_count') or 0)
          expected_lengths = {int(key): int(value) for key, value in ticket.get('part_lengths', {}).items()}
          expected_hashes = {int(key): str(value) for key, value in ticket.get('part_sha256', {}).items()}
          if sorted(expected_lengths) != list(range(1, expected_count + 1)):
              raise SystemExit('expected part lengths are incomplete')
          if sorted(expected_hashes) != list(range(1, expected_count + 1)):
              raise SystemExit('expected part hashes are incomplete')

          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          parts = {}
          pattern = re.compile(r'^PATCH_PART (\d{3})/(\d{3})\n([A-Za-z0-9+/=]+)$')
          for row in comments:
              match = pattern.fullmatch(str(row.get('body') or '').strip())
              if not match:
                  continue
              index, total, payload = int(match.group(1)), int(match.group(2)), match.group(3)
              if total != expected_count or index in parts:
                  raise SystemExit('patch part metadata is invalid or duplicated')
              parts[index] = payload
          if sorted(parts) != list(range(1, expected_count + 1)):
              raise SystemExit('patch parts are missing')

          normalized = {}
          repairs = []
          for index in range(1, expected_count + 1):
              payload = parts[index]
              expected_length = expected_lengths[index]
              expected_hash = expected_hashes[index]
              actual_hash = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if len(payload) == expected_length and actual_hash == expected_hash:
                  normalized[index] = payload
                  continue

              delta = len(payload) - expected_length
              candidates = []
              if 0 < delta <= 4:
                  for offset in range(0, len(payload) - delta + 1):
                      candidate = payload[:offset] + payload[offset + delta:]
                      if hashlib.sha256(candidate.encode('ascii')).hexdigest() == expected_hash:
                          candidates.append((offset, candidate))
              if len(candidates) != 1:
                  raise SystemExit(
                      f'part {index} integrity mismatch: length={len(payload)} '
                      f'hash={actual_hash} repair_candidates={len(candidates)}'
                  )
              offset, candidate = candidates[0]
              normalized[index] = candidate
              repairs.append({'part': index, 'removed_chars': delta, 'offset': offset})

          patch = base64.b64decode(''.join(normalized[index] for index in range(1, expected_count + 1)), validate=True)
          digest = hashlib.sha256(patch).hexdigest()
          if digest != ticket.get('patch_sha256'):
              raise SystemExit('patch digest mismatch')
          if len(patch) != int(ticket.get('patch_bytes') or -1):
              raise SystemExit('patch byte count mismatch')
          Path('/tmp/v5-audit-fix.patch').write_bytes(patch)
          print(json.dumps({
              'patch_sha256': digest,
              'patch_bytes': len(patch),
              'parts': len(normalized),
              'transport_repairs': repairs,
          }, sort_keys=True))
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git apply --check /tmp/v5-audit-fix.patch

      - name: Apply patch and remove temporary export workflow
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v5-audit-fix.patch
          rm -f .github/workflows/maintenance-source-export.yml
          python -m compileall -q open-model-market tools tests

      - name: Install exact test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt -r requirements-dev.txt
          python -m pip check

      - name: Run complete deterministic test suite
        run: python -m pytest -q

      - name: Run full repository audit
        run: python tools/repository_audit.py --root . --output-dir audit-artifacts --fail-on high

      - name: Commit validated fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(v5): harden production evidence recovery and output stability"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Publish validation receipt
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PATCH_VALIDATED_AND_PUSHED\n\n- Run: \`${context.runId}\`\n- Branch: \`${process.env.TARGET_BRANCH}\`\n- Full tests: \`PASS\`\n- Repository audit: \`PASS\``
            })
