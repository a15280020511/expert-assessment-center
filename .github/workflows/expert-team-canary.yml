name: Expert Team Live Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: expert-team-live-canary
  cancel-in-progress: false

jobs:
  live-canary:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TOTAL_MODEL_CALLS: "4"
      QUALITY_TIER: value
      MODEL_HISTORY_PATH: canary-artifacts/model-performance.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
      - name: Execute one fixed 3+1 live canary
        id: canary
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPERT_TASK: >-
            对一个合成软件服务方案进行简短健康审计：方案采用单容器、无数据库、固定版本和健康检查。
            三名专家分别检查架构合理性、测试充分性和失效模式，裁判给出是否适合作为低维护基线的结论。
            只依据本任务文本，不使用网页、工具、插件或外部资料。
        run: |
          set -o pipefail
          test -n "$OPENROUTER_API_KEY"
          mkdir -p canary-artifacts
          printf '{"version":1,"models":{}}\n' > "$MODEL_HISTORY_PATH"
          python open-model-market/expert_team_hardened.py \
            --quality-tier "$QUALITY_TIER" \
            --require-live-catalog \
            --output-dir canary-artifacts \
            2>&1 | tee canary-artifacts/canary-console.log
      - name: Verify live canary artifacts
        id: verify
        if: steps.canary.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("canary-artifacts")
          result = json.loads((root / "expert-team-result.json").read_text(encoding="utf-8"))
          ledger = json.loads((root / "call-ledger.json").read_text(encoding="utf-8"))
          request_audit = json.loads((root / "request-audit.json").read_text(encoding="utf-8"))
          assert result["status"] in {"success", "success_partial"}
          assert request_audit["status"] == "PASS"
          assert request_audit["expected_request_count"] == 4
          assert ledger["summary"]["call_count"] == 4
          assert ledger["summary"]["semantic_router_calls"] == 0
          assert ledger["summary"]["expert_attempt_calls"] == 3
          assert ledger["summary"]["judge_attempt_calls"] == 1
          assert len(ledger["entries"]) == 4
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: expert-team-live-canary-${{ github.run_id }}
          path: canary-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Open or resolve live canary incident
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          title='[expert-canary] Live 3+1 canary failed'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Live 3+1 canary failed in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$CANARY_OUTCOME" != "success" || "$VERIFY_OUTCOME" != "success" ]]; then
            body="Live canary failed. canary=${CANARY_OUTCOME}; verify=${VERIFY_OUTCOME}; Run: ${run_url}"
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Recovered. Run: ${run_url}"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
      - name: Fail unsuccessful canary
        if: always() && (steps.canary.outcome != 'success' || steps.verify.outcome != 'success')
        run: exit 1
