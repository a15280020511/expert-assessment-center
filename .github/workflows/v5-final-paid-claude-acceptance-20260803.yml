name: V5 Final Paid Claude Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-EXACTLY-ONCE to authorize the bounded paid acceptance
        required: true
        type: string
  push:
    branches:
      - "acceptance/v5-final-paid-*"
    paths:
      - ".github/v5-final-paid-acceptance-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: v5-final-paid-claude-acceptance
  cancel-in-progress: false

jobs:
  paid-acceptance:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      target_sha: ${{ steps.request.outputs.target_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      maximum_total_calls: ${{ steps.request.outputs.maximum_total_calls }}
      cost_cap_usd: ${{ steps.request.outputs.cost_cap_usd }}
      artifact_name: v5-final-paid-claude-acceptance-${{ github.run_id }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "1"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-final-paid-acceptance
      COST_CAP_USD: "0.25"
      MAXIMUM_TOTAL_CALLS: "4"
      MAXIMUM_RECOVERY_CALLS: "0"
      MAX_COMPLETION_TOKENS: "512"
      GOVERNANCE_MAX_COMPLETION_TOKENS: "4096"
    steps:
      - name: Check out immutable authorization source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
          path: request-source

      - name: Resolve exact authorized target
        id: request
        env:
          DISPATCH_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$DISPATCH_CONFIRM" = "RUN-EXACTLY-ONCE"
            target="$(git -C request-source rev-parse HEAD)"
            request_id="manual-$GITHUB_RUN_ID"
          else
            request=request-source/.github/v5-final-paid-acceptance-request.json
            jq -e '
              type == "object" and
              (keys | sort) == [
                "authorization",
                "cost_cap_usd",
                "max_completion_tokens",
                "maximum_recovery_calls",
                "maximum_total_calls",
                "purpose",
                "request_id",
                "schema_version",
                "target_sha"
              ] and
              .schema_version == "v5-final-paid-acceptance-request-1" and
              .authorization == "RUN-EXACTLY-ONCE" and
              .purpose == "final-exact-gpt-claude-production-qualification" and
              (.request_id | test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
              (.target_sha | test("^[0-9a-f]{40}$")) and
              .maximum_total_calls == 4 and
              .maximum_recovery_calls == 0 and
              .cost_cap_usd == 0.25 and
              .max_completion_tokens == 512
            ' "$request" >/dev/null
            test "$(git -C request-source diff --name-only HEAD^ HEAD)" = ".github/v5-final-paid-acceptance-request.json"
            target="$(jq -er '.target_sha' "$request")"
            request_id="$(jq -er '.request_id' "$request")"
            test "$(git -C request-source rev-parse HEAD^)" = "$target"
          fi
          test "$target" != "$(git -C request-source rev-parse HEAD)" || [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          {
            echo "target_sha=$target"
            echo "request_id=$request_id"
            echo "maximum_total_calls=$MAXIMUM_TOTAL_CALLS"
            echo "cost_cap_usd=$COST_CAP_USD"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact target source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Verify immutable target checkout
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime-source/requirements-runtime.txt
            runtime-source/requirements-dev.txt

      - name: Install pinned validation runtime
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Complete all zero-call release gates before paid execution
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v
          PYTHONPATH=tests python -m unittest \
            test_v5_free_first_preflight \
            test_v5_governance_completion_envelope \
            test_v5_production_ticket_token_envelope \
            test_v5_independent_artifact_revalidation \
            -v

      - name: Run zero-cost free Canary and API-key limit preflight
        working-directory: runtime-source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf paid-acceptance-artifacts
          mkdir -p paid-acceptance-artifacts
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          from openrouter_api import CHAT_URL, request_json
          from v5_execution_primitives import actual_cost, extract_answer

          key = os.environ["OPENROUTER_API_KEY"]
          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/key",
              headers={"Authorization": f"Bearer {key}"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.loads(response.read().decode("utf-8")).get("data", {})
          if not isinstance(metadata, dict):
              raise RuntimeError("OpenRouter current-key metadata is unavailable")
          if metadata.get("is_free_tier") is True:
              raise RuntimeError("OpenRouter key remains free-tier; paid acceptance is blocked")
          remaining = metadata.get("limit_remaining")
          if remaining is not None and float(remaining) + 1e-12 < 0.25:
              raise RuntimeError("OpenRouter key limit remaining is below the 0.25 USD hard cap")

          payload = {
              "model": "openrouter/free",
              "messages": [
                  {"role": "system", "content": "Return only the requested final answer."},
                  {"role": "user", "content": "Reply with exactly PASS and nothing else."},
              ],
              "stream": False,
              "max_tokens": 256,
              "provider": {
                  "data_collection": "allow",
                  "zdr": False,
                  "require_parameters": True,
              },
          }
          response = request_json(CHAT_URL, key, 120, 0, payload)
          answer = extract_answer(response).strip()
          cost = float(actual_cost(response))
          if answer.upper() != "PASS":
              raise RuntimeError("free Canary response is invalid")
          if abs(cost) > 1e-12:
              raise RuntimeError(f"free Canary returned positive cost: {cost}")
          evidence = {
              "schema_version": "v5-final-paid-preflight-1",
              "status": "PASS",
              "zero_call_release_gates": "PASS",
              "free_canary": {
                  "status": "PASS",
                  "requested_model": "openrouter/free",
                  "response_model": str(response.get("model") or ""),
                  "provider": str(response.get("provider") or ""),
                  "actual_cost_usd": cost,
                  "paid_model_calls": 0,
              },
              "key_metadata": {
                  "is_free_tier": metadata.get("is_free_tier"),
                  "limit": metadata.get("limit"),
                  "limit_remaining": remaining,
                  "is_management_key": metadata.get("is_management_key"),
              },
              "paid_execution_started": False,
              "production_ref_moved": False,
          }
          Path("paid-acceptance-artifacts/preflight-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Materialize fixed low-cost acceptance ticket
        working-directory: runtime-source
        run: |
          set -euo pipefail
          task='仅依据以下题面，不得调用外部工具，不得补充外部事实：A方案月费20元、月流量100GB；B方案月费30元、月流量150GB。请严格按顺序输出两个Markdown二级标题：已知事实、最终建议。最终建议必须给出唯一推荐和两条理由，明确区分事实与推断，不得新增题面外数字。'
          jq -n --arg question "$task" '{
            schema_version: "v5-final-paid-acceptance-ticket-1",
            task: {
              question: $question,
              requirements: [
                "禁止外部工具和外部事实",
                "严格满足两个Markdown二级标题及顺序",
                "给出唯一推荐和两条理由",
                "事实与推断必须分离"
              ],
              language: "zh-CN"
            }
          }' > paid-acceptance-artifacts/ticket.json
          printf '%s\n' "$task" > paid-task.txt

      - name: Execute one bounded exact production task
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python open-model-market/v5_production_ticket.py \
            --task "$(cat paid-task.txt)" \
            --output-dir paid-acceptance-artifacts \
            --maximum-total-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --cost-anomaly-usd "$COST_CAP_USD" \
            --max-completion-tokens "$MAX_COMPLETION_TOKENS" \
            --governance-max-completion-tokens "$GOVERNANCE_MAX_COMPLETION_TOKENS" \
            --require-live-catalog

      - name: Verify exact paid-call constitution
        working-directory: runtime-source
        env:
          ACCEPTANCE_SHA: ${{ steps.request.outputs.target_sha }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("paid-acceptance-artifacts")
          calls = json.loads((root / "v5-governance-calls.json").read_text())
          governance = json.loads((root / "v5-governance-result.json").read_text())
          resolution = json.loads((root / "v5-governance-models.json").read_text())
          result = json.loads((root / "expert-team-result.json").read_text())
          summary = json.loads((root / "v5-execution-summary.json").read_text())
          audit = json.loads((root / "v5-request-audit.json").read_text())
          selection = json.loads((root / "v5-selection.json").read_text())
          ledger = json.loads((root / "call-ledger.json").read_text())
          runtime = json.loads((root / "v5-runtime-config.json").read_text())

          kinds = [row["kind"] for row in calls["calls"]]
          assert resolution["status"] == "PASS"
          assert resolution["provider_fallback_allowed"] is False
          assert resolution["gpt"]["logical_model"] == "~openai/gpt-latest"
          assert resolution["claude"]["logical_model"] == "~anthropic/claude-opus-latest"
          assert kinds == ["gpt_proposal", "claude_red_team", "gpt_synthesis"]
          assert calls["actual_governance_calls"] == 3
          assert governance["claude_review_count"] == 1
          assert governance["gpt_synthesis_count"] == 1
          assert governance["claude_is_advisory_only"] is True
          assert governance["claude_gatekeeping_allowed"] is False
          assert governance["second_claude_review_allowed"] is False
          assert governance["model_loop_allowed"] is False
          assert selection["local_task_classification_used"] is False
          assert selection["local_atomic_work_generation_used"] is False
          assert selection["local_resource_matrix_used"] is False
          assert selection["local_scoring_used"] is False
          assert selection["optimizer_used"] is False
          assert result["status"] == "success"
          assert result["completion_mode"] == "full"
          assert result["quality_status"] == "full_success"
          assert result["cross_task_history_used"] is False
          assert result["total_model_calls"] == 4
          assert summary["total_model_calls"] == 4
          assert result["actual_cost_usd"] <= 0.25 + 1e-12
          assert audit["status"] == "PASS"
          assert audit["request_count"] == 4
          assert audit["external_tools_allowed"] is False
          assert audit["provider_fallback_allowed"] is False
          assert ledger["summary"]["provider_actual_cost_usd"] is not None
          assert runtime["max_completion_tokens"] == 512
          assert runtime["governance_max_completion_tokens"] == 4096

          receipt = {
              "schema_version": "v5-final-paid-claude-acceptance-4",
              "status": "PASS",
              "request_id": os.environ["REQUEST_ID"],
              "commit_sha": os.environ["ACCEPTANCE_SHA"],
              "workflow_run_id": os.environ["ACCEPTANCE_RUN_ID"],
              "governance_sequence": kinds,
              "governance_calls": 3,
              "claude_calls": 1,
              "expert_calls": 1,
              "total_model_calls": result["total_model_calls"],
              "actual_cost_usd": result["actual_cost_usd"],
              "completion_mode": result["completion_mode"],
              "quality_status": result["quality_status"],
              "claude_is_advisory_only": True,
              "claude_gatekeeping_allowed": False,
              "old_local_planner_used": False,
              "optimizer_used": False,
              "cross_task_history_used": False,
              "independent_revalidation_pending": True,
              "production_ref_moved": False,
          }
          (root / "paid-acceptance-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          preflight = json.loads((root / "preflight-evidence.json").read_text())
          preflight["paid_execution_started"] = True
          (root / "preflight-evidence.json").write_text(
              json.dumps(preflight, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Freeze complete primitive evidence manifest
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          PYTHONPATH=open-model-market python - <<'PY'
          from pathlib import Path
          from artifact_manifest import write_manifest
          write_manifest(Path("paid-acceptance-artifacts"))
          PY

      - name: Upload paid primitive evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-final-paid-claude-acceptance-${{ github.run_id }}
          path: runtime-source/paid-acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30

  independently-recompute-paid-artifact:
    needs: paid-acceptance
    if: needs.paid-acceptance.result == 'success' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAID_RUN_ID: ${{ github.run_id }}
      TARGET_SHA: ${{ needs.paid-acceptance.outputs.target_sha }}
      REQUEST_ID: ${{ needs.paid-acceptance.outputs.request_id }}
      MAXIMUM_TOTAL_CALLS: ${{ needs.paid-acceptance.outputs.maximum_total_calls }}
      COST_CAP_USD: ${{ needs.paid-acceptance.outputs.cost_cap_usd }}
      EXPECTED_ARTIFACT_NAME: ${{ needs.paid-acceptance.outputs.artifact_name }}
    steps:
      - name: Check out exact independent validator source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.paid-acceptance.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Set up independent Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime-source/requirements-runtime.txt

      - name: Install independent validator dependencies
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Resolve and download this Run artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C runtime-source rev-parse HEAD)" = "$TARGET_SHA"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$PAID_RUN_ID/artifacts?per_page=100" \
            > paid-artifacts.json
          artifact_id=$(jq -er --arg name "$EXPECTED_ARTIFACT_NAME" '
            .artifacts
            | map(select(.name == $name and .expired == false))
            | if length == 1 then .[0].id else error("expected exactly one paid artifact") end
          ' paid-artifacts.json)
          artifact_digest=$(jq -er --argjson id "$artifact_id" '
            .artifacts[] | select(.id == $id) | .digest
          ' paid-artifacts.json)
          test -n "$artifact_digest"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > paid-evidence.zip
          rm -rf paid-evidence
          mkdir paid-evidence
          unzip -q paid-evidence.zip -d paid-evidence
          {
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Independently recompute verdict from primitive evidence
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          PYTHONPATH=runtime-source/open-model-market python \
            runtime-source/open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir paid-evidence \
            --expected-sha "$TARGET_SHA" \
            --expected-run-id "$PAID_RUN_ID" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-cost-usd "$COST_CAP_USD" \
            --archive paid-evidence.zip \
            --expected-artifact-digest "$ARTIFACT_DIGEST" \
            --output independent-revalidation.json

      - name: Create bound final attestation
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg run_id "$PAID_RUN_ID" \
            --arg target_sha "$TARGET_SHA" \
            --arg artifact_name "$EXPECTED_ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --slurpfile recomputed independent-revalidation.json \
            '{
              schema_version: "v5-final-paid-acceptance-attestation-4",
              status: (if $recomputed[0].status == "PASS" then "PASS" else "FAIL" end),
              request_id: $request_id,
              paid_workflow_run_id: $run_id,
              paid_target_sha: $target_sha,
              paid_artifact_id: $artifact_id,
              paid_artifact_name: $artifact_name,
              paid_artifact_digest: $artifact_digest,
              independent_revalidation: $recomputed[0],
              independently_recomputed_from_primitive_evidence: true,
              paid_acceptance_verdict_used_as_source: false,
              formal_model_identity_qualified: ($recomputed[0].status == "PASS"),
              merge_allowed: false,
              production_ref_moved: false,
              public_report_published: false
            }' > paid-acceptance-attestation.json
          test "$(jq -r '.status' paid-acceptance-attestation.json)" = "PASS"
          test "$(jq -r '.independently_recomputed_from_primitive_evidence' paid-acceptance-attestation.json)" = "true"
          test "$(jq -r '.paid_acceptance_verdict_used_as_source' paid-acceptance-attestation.json)" = "false"

      - name: Upload independent final attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-final-paid-acceptance-attestation-${{ github.run_id }}
          path: |
            independent-revalidation.json
            paid-acceptance-attestation.json
          if-no-files-found: error
          retention-days: 30
