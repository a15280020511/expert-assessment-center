name: Workflow Diagnostic Sweep

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/workflow_diagnostics.py"
      - ".github/workflows/diagnostic-sweep.yml"
      - "DIAGNOSTICS_IMPLEMENTATION.md"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Hours of workflow history to inspect
        required: false
        default: "2"
      max_runs:
        description: Maximum runs to inspect
        required: false
        default: "200"

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

concurrency:
  group: workflow-diagnostic-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIAGNOSTIC_CENTER: expert
      LOOKBACK_HOURS: ${{ inputs.lookback_hours || '2' }}
      MAX_RUNS: ${{ inputs.max_runs || '200' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: "3.12"
      - name: Collect and classify workflow diagnostics
        run: |
          set -euo pipefail
          python tools/workflow_diagnostics.py \
            --repository "${GITHUB_REPOSITORY}" \
            --center "${DIAGNOSTIC_CENTER}" \
            --lookback-hours "${LOOKBACK_HOURS}" \
            --max-runs "${MAX_RUNS}" \
            --exclude-workflow-path ".github/workflows/diagnostic-sweep.yml" \
            --output-dir diagnostic-bundle
      - name: Package diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          test -d diagnostic-bundle
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "workflow-diagnostics-${GITHUB_RUN_ID}.tar.gz" diagnostic-bundle
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7
        with:
          name: workflow-diagnostics-${{ github.run_id }}
          path: workflow-diagnostics-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Attest diagnostic artifact provenance
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: workflow-diagnostics-${{ github.run_id }}.tar.gz
