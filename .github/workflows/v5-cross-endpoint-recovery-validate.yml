name: Validate V5 Cross-Endpoint Recovery

on:
  pull_request:
    paths:
      - "open-model-market/v5_recovery_runtime.py"
      - "open-model-market/v5_production_ticket.py"
      - "open-model-market/publish_report.py"
      - "tests/test_v5_cross_endpoint_recovery.py"
      - ".github/workflows/v5-cross-endpoint-recovery-validate.yml"
  push:
    branches: [main]
    paths:
      - "open-model-market/v5_recovery_runtime.py"
      - "open-model-market/v5_production_ticket.py"
      - "open-model-market/publish_report.py"
      - "tests/test_v5_cross_endpoint_recovery.py"
      - ".github/workflows/v5-cross-endpoint-recovery-validate.yml"

permissions:
  contents: read

jobs:
  validate-cross-endpoint-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Compile changed modules
        run: |
          python -m py_compile \
            open-model-market/v5_recovery_runtime.py \
            open-model-market/v5_production_ticket.py \
            open-model-market/publish_report.py
      - name: Replay real empty response and report publication
        run: python -m unittest tests.test_v5_cross_endpoint_recovery -v
