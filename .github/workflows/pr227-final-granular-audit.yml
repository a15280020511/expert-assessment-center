name: PR227 Final Granular Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/.pr227-final-dedup.patch.b64"
      - ".github/workflows/pr227-final-granular-audit.yml"

permissions:
  contents: write

concurrency:
  group: pr227-final-granular-audit
  cancel-in-progress: false

jobs:
  audit-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Reconstruct and verify cleanup patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr227-final-evidence
          echo "941122f2e69f9c46ea4451a290a5dcc33e8ef4f0b2ab6ca71b8a0408bb6931a3  tools/.pr227-final-dedup.patch.b64" \
            | sha256sum --check
          tr -d '\r\n' < tools/.pr227-final-dedup.patch.b64 \
            | base64 --decode > /tmp/pr227-final-dedup.patch.gz
          echo "ab13eb916da268b98ea6ba113f84ee358427c6a602afdbe9237db32825506300  /tmp/pr227-final-dedup.patch.gz" \
            | sha256sum --check
          gzip --decompress --stdout /tmp/pr227-final-dedup.patch.gz \
            > /tmp/pr227-final-dedup.patch
          echo "b984022271262ebad6caa845a729be66fe294dd4eb9cdfa06c012efcd5953537  /tmp/pr227-final-dedup.patch" \
            | sha256sum --check
          git apply --check /tmp/pr227-final-dedup.patch
          git apply /tmp/pr227-final-dedup.patch
          git diff --check
          git diff --stat > /tmp/pr227-final-evidence/diff-stat.txt
          git diff --name-only > /tmp/pr227-final-evidence/changed-files.txt
          sha256sum \
            tools/.pr227-final-dedup.patch.b64 \
            /tmp/pr227-final-dedup.patch.gz \
            /tmp/pr227-final-dedup.patch \
            > /tmp/pr227-final-evidence/patch-sha256.txt

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-dev.txt
          python -m pip check | tee /tmp/pr227-final-evidence/pip-check.log

      - name: Run static and compilation gates
        run: |
          set -euo pipefail
          python -m ruff check . | tee /tmp/pr227-final-evidence/ruff.log
          python -m compileall -q open-model-market tests tools
          printf 'compileall=PASS\n' > /tmp/pr227-final-evidence/compileall.txt

      - name: Run complete regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee /tmp/pr227-final-evidence/full-regression.log

      - name: Run eight-seed full-load and extreme stress
        run: |
          set -euo pipefail
          : > /tmp/pr227-final-evidence/eight-seed-stress.log
          for seed in 0 1 7 42 31337 65535 99991 104729; do
            echo "=== seed=$seed full-load ===" | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
            PYTHONHASHSEED="$seed" python -m unittest discover \
              -s tests -p 'test_v5_full_load_stability.py' -v \
              2>&1 | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
            echo "=== seed=$seed extreme ===" | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
            PYTHONHASHSEED="$seed" python -m unittest discover \
              -s tests -p 'test_v5_extreme_advisory_stress.py' -v \
              2>&1 | tee -a /tmp/pr227-final-evidence/eight-seed-stress.log
          done

      - name: Run eight-seed randomized same-process suite
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee /tmp/pr227-final-evidence/random-order.log
          from __future__ import annotations

          import os
          import random
          import sys
          import unittest

          SEEDS = (0, 1, 7, 42, 31337, 65535, 99991, 104729)

          def flatten(suite: unittest.TestSuite) -> list[unittest.TestCase]:
              cases: list[unittest.TestCase] = []
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      cases.extend(flatten(item))
                  else:
                      cases.append(item)
              return cases

          for seed in SEEDS:
              os.environ["PYTHONHASHSEED"] = str(seed)
              discovered = unittest.defaultTestLoader.discover("tests", pattern="test*.py")
              cases = flatten(discovered)
              random.Random(seed).shuffle(cases)
              print(f"=== randomized seed={seed} cases={len(cases)} ===", flush=True)
              result = unittest.TextTestRunner(verbosity=1).run(unittest.TestSuite(cases))
              if not result.wasSuccessful():
                  sys.exit(1)
          PY

      - name: Run AST architecture and duplicate audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import json
          from collections import defaultdict, deque
          from pathlib import Path

          root = Path("open-model-market")
          files = sorted(root.glob("*.py"))
          modules = {path.stem: path for path in files}
          forbidden = {
              "v5_value_optimizer", "v5_planner", "v5_planning_runtime",
              "v5_constitutional_pipeline", "v5_cross_endpoint_planner",
              "v5_cross_endpoint_planner_impl", "v5_operational_resilience",
              "v5_general_task_planning", "task_semantic_compiler",
              "resource_matrix", "atomic_work_graph",
          }
          imports: dict[str, set[str]] = defaultdict(set)
          imported_module_writes: list[dict[str, object]] = []
          duplicate_bodies: dict[str, list[dict[str, object]]] = defaultdict(list)
          forbidden_imports: list[dict[str, object]] = []

          for module, path in modules.items():
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              imported_aliases: set[str] = set()
              for node in tree.body:
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          imported_aliases.add(alias.asname or alias.name.split(".")[0])
                          target = alias.name.split(".")[0]
                          if target in modules:
                              imports[module].add(target)
                          if target in forbidden or target == "ortools":
                              forbidden_imports.append({"path": str(path), "line": node.lineno, "name": alias.name})
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      target = node.module.split(".")[0]
                      for alias in node.names:
                          imported_aliases.add(alias.asname or alias.name)
                      if target in modules:
                          imports[module].add(target)
                      if target in forbidden or target == "ortools":
                          forbidden_imports.append({"path": str(path), "line": node.lineno, "name": node.module})
              for node in ast.walk(tree):
                  targets: list[ast.expr] = []
                  if isinstance(node, ast.Assign):
                      targets = list(node.targets)
                  elif isinstance(node, (ast.AnnAssign, ast.AugAssign)):
                      targets = [node.target]
                  for target in targets:
                      base = target
                      while isinstance(base, ast.Attribute):
                          base = base.value
                      if isinstance(target, ast.Attribute) and isinstance(base, ast.Name) and base.id in imported_aliases:
                          imported_module_writes.append({
                              "path": str(path),
                              "line": getattr(node, "lineno", None),
                              "target": ast.unparse(target),
                          })
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      line_count = (node.end_lineno or node.lineno) - node.lineno + 1
                      if line_count < 5:
                          continue
                      body = list(node.body)
                      if body and isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant) and isinstance(body[0].value.value, str):
                          body = body[1:]
                      key = ast.dump(ast.Module(body=body, type_ignores=[]), include_attributes=False)
                      duplicate_bodies[key].append({
                          "path": str(path), "name": node.name,
                          "line": node.lineno, "line_count": line_count,
                      })

          entries = ("v5_issue_ticket", "v5_production_ticket", "v5_pipeline")
          reachable: set[str] = set()
          queue = deque(entries)
          while queue:
              module = queue.popleft()
              if module in reachable or module not in modules:
                  continue
              reachable.add(module)
              queue.extend(sorted(imports[module]))

          hashes: dict[str, list[str]] = defaultdict(list)
          for path in files:
              hashes[hashlib.sha256(path.read_bytes()).hexdigest()].append(str(path))
          duplicate_files = [rows for rows in hashes.values() if len(rows) > 1]
          duplicate_functions = [rows for rows in duplicate_bodies.values() if len(rows) > 1]
          stale_paths = [
              str(path) for path in (
                  Path(".github/v5-paid-acceptance-request.json"),
                  Path(".github/v5-paid-acceptance-attestation.json"),
              ) if path.exists()
          ]
          result = {
              "schema_version": "pr227-final-architecture-audit-1",
              "reachable_module_count": len(reachable),
              "reachable_modules": sorted(reachable),
              "forbidden_reachable_modules": sorted(reachable & forbidden),
              "forbidden_imports": forbidden_imports,
              "imported_module_attribute_assignments": imported_module_writes,
              "duplicate_function_body_groups": duplicate_functions,
              "exact_duplicate_python_file_groups": duplicate_files,
              "stale_paid_acceptance_paths": stale_paths,
              "quality_tier_hits": sum(
                  path.read_text(encoding="utf-8").count("quality_tier")
                  for path in files
              ),
          }
          output = Path("/tmp/pr227-final-evidence/architecture-audit.json")
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          assert not result["forbidden_reachable_modules"], result
          assert not forbidden_imports, result
          assert not imported_module_writes, result
          assert not duplicate_functions, result
          assert not duplicate_files, result
          assert not stale_paths, result
          assert result["quality_tier_hits"] == 0, result
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Run granular repository audit with Medium blocking
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-final-evidence/repository-audit \
            --fail-on medium

      - name: Record zero-cost validation context
        run: |
          set -euo pipefail
          {
            echo "source_head=${GITHUB_SHA}"
            echo "runner=ubuntu-24.04"
            echo "python=$(python --version 2>&1)"
            echo "openrouter_key_present=no"
            echo "anthropic_key_present=no"
            echo "model_calls=0"
            echo "model_cost_usd=0"
          } > /tmp/pr227-final-evidence/validation-context.txt

      - name: Upload final granular evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-final-granular-audit-${{ github.run_id }}
          path: /tmp/pr227-final-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated cleanup and remove staging
        run: |
          set -euo pipefail
          rm tools/.pr227-final-dedup.patch.b64
          rm .github/workflows/pr227-final-granular-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: centralize deterministic helper primitives"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
