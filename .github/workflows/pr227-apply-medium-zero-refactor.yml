name: PR227 Apply Medium-Zero Refactor

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/.pr227-patch/**"
      - ".github/workflows/pr227-apply-medium-zero-refactor.yml"

permissions:
  contents: write

concurrency:
  group: pr227-apply-medium-zero-refactor
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Verify every staged patch chunk
        run: |
          set -euo pipefail
          wc -c tools/.pr227-patch/chunk-*
          sha256sum tools/.pr227-patch/chunk-*
          cat > /tmp/pr227-chunks.sha256 <<'EOF'
          bac8f441cb6937a626dd3654b2ef12de2593dc4d2ace5229197c2501dce7861b  tools/.pr227-patch/chunk-00
          cfb0caa05e3e999880c7677bd865308a0cd37697506db581ff1ebc18fd146e20  tools/.pr227-patch/chunk-01
          5edd1c8639bd5d204f70860f3f49d9d2eaed44208c81cc5ff97a8e9ea1be2b1b  tools/.pr227-patch/chunk-02
          fc43296487704ba930fefcdc043f147ea99fc326bfdb07bf6dd436a4b37666e6  tools/.pr227-patch/chunk-03
          cd0e26864568cb63b56f1c9b19410f9faa5f293f3988039609bf20acb8b18c6a  tools/.pr227-patch/chunk-04
          EOF
          sha256sum --check /tmp/pr227-chunks.sha256
          test "$(wc -c < tools/.pr227-patch/chunk-00)" -eq 8000
          test "$(wc -c < tools/.pr227-patch/chunk-01)" -eq 20000
          test "$(wc -c < tools/.pr227-patch/chunk-02)" -eq 20000
          test "$(wc -c < tools/.pr227-patch/chunk-03)" -eq 20000
          test "$(wc -c < tools/.pr227-patch/chunk-04)" -eq 19928

      - name: Reconstruct and verify refactor patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr227-evidence
          cat tools/.pr227-patch/chunk-* \
            | tr -d '\r\n' \
            | base64 --decode \
            > /tmp/pr227-medium-zero-refactor.patch.gz
          echo "af1205a7736ccf15c09a7633b92e7c9a870332cee7aabd666f974a06fcc7f1ed  /tmp/pr227-medium-zero-refactor.patch.gz" \
            | sha256sum --check
          gzip --decompress --stdout /tmp/pr227-medium-zero-refactor.patch.gz \
            > /tmp/pr227-medium-zero-refactor.patch
          echo "57ee513a827493ffdc164cb3f7d16d846cbfc31619af0e9a6f0282ce9fb40f2a  /tmp/pr227-medium-zero-refactor.patch" \
            | sha256sum --check
          git apply --check /tmp/pr227-medium-zero-refactor.patch
          sha256sum \
            /tmp/pr227-medium-zero-refactor.patch.gz \
            /tmp/pr227-medium-zero-refactor.patch \
            > /tmp/pr227-evidence/patch-sha256.txt

      - name: Apply staged refactor
        run: |
          set -euo pipefail
          git apply /tmp/pr227-medium-zero-refactor.patch
          git diff --check
          git diff --stat > /tmp/pr227-evidence/refactor-diff-stat.txt
          git diff --name-only > /tmp/pr227-evidence/refactor-changed-files.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-dev.txt
          python -m pip check | tee /tmp/pr227-evidence/pip-check.log

      - name: Run static and compilation gates
        run: |
          set -euo pipefail
          python -m ruff check . | tee /tmp/pr227-evidence/ruff.log
          python -m compileall -q open-model-market tests tools
          printf 'compileall=PASS\n' > /tmp/pr227-evidence/compileall.txt

      - name: Run complete zero-cost regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee /tmp/pr227-evidence/full-regression.log

      - name: Run granular repository audit with Medium blocking
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-evidence/repository-audit \
            --fail-on medium

      - name: Record isolated validation context
        run: |
          set -euo pipefail
          {
            echo "source_head=${GITHUB_SHA}"
            echo "event=pull_request"
            echo "runner=ubuntu-24.04"
            echo "python=$(python --version 2>&1)"
            echo "openrouter_key_present=no"
            echo "anthropic_key_present=no"
            echo "model_calls=0"
            echo "model_cost_usd=0"
          } > /tmp/pr227-evidence/validation-context.txt

      - name: Upload granular validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-medium-zero-refactor-${{ github.run_id }}
          path: /tmp/pr227-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Remove all temporary staging files
        run: |
          set -euo pipefail
          rm -rf tools/.pr227-patch
          rm .github/workflows/pr227-apply-medium-zero-refactor.yml

      - name: Commit validated refactor
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: eliminate medium-complexity audit debt"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
