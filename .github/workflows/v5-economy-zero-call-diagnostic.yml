name: V5 Economy Zero-Call Feasibility Diagnostic

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-economy-zero-call-feasibility
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[v5-economy-diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt

      - name: Prove zero-inference contract
        run: |
          python -m py_compile open-model-market/v5_economy_zero_call_diagnostic.py
          ! grep -q 'CHAT_URL' open-model-market/v5_economy_zero_call_diagnostic.py
          ! grep -q 'execute_v5_graph' open-model-market/v5_economy_zero_call_diagnostic.py
          ! grep -q '_direct_call' open-model-market/v5_economy_zero_call_diagnostic.py
          ! grep -q '_v3_strategy' open-model-market/v5_economy_zero_call_diagnostic.py

      - name: Parse diagnostic request
        id: prepare
        run: |
          python open-model-market/v5_economy_zero_call_diagnostic.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir v5-economy-zero-call-artifacts

      - name: Publish diagnostic acceptance
        run: |
          cat > diagnostic-accepted.md <<EOF
          ## V5_ECONOMY_ZERO_CALL_DIAGNOSTIC_ACCEPTED

          - Tasks: ${{ steps.prepare.outputs.task_count }}
          - Paid model calls allowed: ${{ steps.prepare.outputs.paid_model_calls_allowed }}
          - Actual model-cost ceiling: 0 USD
          - Scope: catalog metadata, provider endpoint metadata, candidate generation and CP-SAT feasibility only
          - V3 execution: forbidden
          - V5 model execution: forbidden
          - Production entrypoint changed: false
          - V3 deleted: false
          - Run: ${RUN_URL}
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@diagnostic-accepted.md

      - name: Check OpenRouter metadata credential
        id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run zero-call feasibility diagnostic
        id: execute
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_APP_NAME: Expert Assessment Center Zero-Call Diagnostic
          OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
        run: |
          set -o pipefail
          python open-model-market/v5_economy_zero_call_diagnostic.py run \
            --config v5-economy-zero-call-artifacts/zero-call-diagnostic-config.json \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-economy-zero-call-artifacts \
            2>&1 | tee v5-economy-zero-call-artifacts/diagnostic-console.log

      - name: Record missing metadata credential
        if: steps.secret.outputs.present != 'true'
        run: |
          cat > v5-economy-zero-call-artifacts/v5-economy-zero-call-summary.md <<EOF
          # V5 Economy Zero-Call Feasibility Diagnostic

          - Status: `missing-openrouter-metadata-credential`
          - Model inference calls: `0`
          - Actual model cost: `$0.000000`
          - Production entrypoint changed: `false`
          - V3 deleted: `false`
          EOF

      - name: Refresh artifact manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          root = Path("v5-economy-zero-call-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          write_manifest(root)
          PY

      - name: Upload zero-call diagnostic artifacts
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v5-economy-zero-call-${{ github.event.issue.number }}-${{ github.run_id }}
          path: v5-economy-zero-call-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish diagnostic result
        if: always()
        continue-on-error: true
        run: |
          if [[ -s v5-economy-zero-call-artifacts/v5-economy-zero-call-summary.md ]]; then
            cp v5-economy-zero-call-artifacts/v5-economy-zero-call-summary.md diagnostic-result.md
          else
            cat > diagnostic-result.md <<EOF
          ## V5_ECONOMY_ZERO_CALL_DIAGNOSTIC_FAILED

          - Execute outcome: ${{ steps.execute.outcome }}
          - Model inference calls: 0
          - Actual model cost: 0 USD
          - Production entrypoint changed: false
          - V3 deleted: false
          EOF
          fi
          cat >> diagnostic-result.md <<EOF

          - Run: ${RUN_URL}
          - Artifact ID: ${{ steps.upload.outputs.artifact-id }}
          - Artifact URL: ${{ steps.upload.outputs.artifact-url }}
          - Artifact digest: ${{ steps.upload.outputs.artifact-digest }}
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@diagnostic-result.md

      - name: Mark technical diagnostic failure
        if: >-
          always() &&
          (steps.secret.outputs.present != 'true' ||
           steps.execute.outcome == 'failure' ||
           steps.upload.outcome == 'failure')
        run: exit 1
