name: V5 Final Static Cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - "tools/apply_v5_final_static_cleanup.py"
      - ".github/workflows/v5-final-static-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: v5-final-static-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.actor == github.repository_owner &&
      github.head_ref == 'refactor/v5-explicit-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v5-explicit-runtime
          fetch-depth: 0
      - name: Apply deterministic cleanup
        run: python tools/apply_v5_final_static_cleanup.py
      - name: Remove one-shot files
        run: |
          rm tools/apply_v5_final_static_cleanup.py
          rm .github/workflows/v5-final-static-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v5): complete final static runtime cleanup"
          git push origin HEAD:refactor/v5-explicit-runtime
