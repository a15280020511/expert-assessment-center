name: Full Repository Line Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-line-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Compile deterministic audit scanner
        run: python -m py_compile tools/repository_audit.py

      - name: Inspect every repository file and source line
        run: |
          set +e
          python tools/repository_audit.py \
            --root . \
            --output-dir audit-artifacts \
            --fail-on medium
          status=$?
          if [[ -f audit-artifacts/repository-audit.json ]]; then
            cat audit-artifacts/repository-audit.json
          fi
          exit "$status"

      - name: Freeze reviewed source snapshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          tar --exclude=.git --exclude=audit-artifacts \
            -czf audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz .
          sha256sum audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz \
            > audit-artifacts/repository-source-${GITHUB_SHA}.sha256

      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-line-audit-${{ github.run_id }}
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 30
