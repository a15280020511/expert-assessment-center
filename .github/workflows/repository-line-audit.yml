name: Full Repository Line Audit

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: repository-line-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-paid-governance-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply verified fix, self-clean, and validate
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/paid-fix/fix.patch.b64
          base64 --decode "$payload" | gzip --decompress > /tmp/fix.patch
          test "$(sha256sum /tmp/fix.patch | awk '{print $1}')" = "6312fc0ed45dbd92347fee8793dd33ad28129b1bc8fab41600d60b0d730dc47e"
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git show 9467cdc0c6ce2d67bbf8e39642f4afbdfd7dcb95:.github/workflows/repository-line-audit.yml > .github/workflows/repository-line-audit.yml
          rm -rf .github/paid-fix
          rm -f .github/workflows/apply-paid-governance-fix-20260803.yml
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v
          python tools/repository_audit.py --root . --output-dir /tmp/repository-audit --fail-on info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve failed paid ledgers and separate governance output cap"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
