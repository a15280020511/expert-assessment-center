name: PR227 R6 Evidence Contract Remediation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr227-r6-evidence-contract-remediation.yml

permissions:
  contents: write

concurrency:
  group: pr227-r6-evidence-contract-remediation
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Apply R6 evidence phase-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1. Proposal materialization must explicitly preserve final-node identity.
          replace_once(
              'open-model-market/v5_task_envelope.py',
              '''    result = delivery_contract.apply_explicit_contract(task, operations, base)
    if not final_node:
        result["required_fields"] = fields
    return dict(result)
''',
