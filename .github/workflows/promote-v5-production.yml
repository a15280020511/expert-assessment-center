name: V5 Production Qualification Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/promote-v5-production.yml"
      - ".github/workflows/v5-price-ranked-paid-candidate-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: v5-production-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run canonical static and unit gates
        run: |
          set -euo pipefail
          mkdir -p release-validation-logs production-validation-artifacts
          python -m ruff check . 2>&1 | tee release-validation-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee release-validation-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee release-validation-logs/unit-tests.log

      - name: Verify top-50 OR-Tools and unrestricted Provider constitution
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("open-model-market/constitutional_policy.json").read_text())
          config = json.loads(Path("open-model-market/config.json").read_text())
          requirements = Path("requirements-runtime.txt").read_text()
          production_policy = Path("open-model-market/v5_production_expert_policy.py").read_text()
          pipeline = Path("open-model-market/v5_price_ranked_pipeline.py").read_text()
          gate = Path("open-model-market/v5_price_ranked_ticket_gate.py").read_text()
          auditor = Path("open-model-market/v5_price_ranked_execution_auditor.py").read_text()
          independent = Path("open-model-market/v5_price_ranked_independent_revalidation.py").read_text()

          assert policy["schema_version"] == "v5-constitutional-policy-7-top50-ortools-open-provider"
          assert policy["candidate_pool"]["pool_size"] == 50
          assert policy["candidate_pool"]["popularity_period"] == "week"
          assert policy["optimizer_runtime"]["engine"] == "ortools-cp-sat"
          assert policy["optimizer_runtime"]["required_solver_status"] == "OPTIMAL"
          assert policy["optimizer_runtime"]["provider_metric_used"] is False
          assert policy["governance_chain"]["candidate_pool_authority"] == "decision-system-governance"
          assert policy["governance_chain"]["assignment_authority"] == "expert-assessment-center-ortools-cp-sat"
          privacy = policy["expert_endpoint_privacy"]
          assert privacy["provider_routing_mode"] == "unrestricted-openrouter"
          assert privacy["zdr_required"] is False
          assert privacy["provider_allowlist_allowed"] is False
          assert privacy["provider_order_allowed"] is False
          assert privacy["provider_fallback_allowed"] is True
          assert privacy["unrestricted_provider_fallback_allowed"] is True
          assert privacy["model_substitution_allowed"] is False
          assert config["provider"]["routing_mode"] == "unrestricted-openrouter"
          assert config["provider"]["explicit_provider_lock_required"] is False
          assert config["provider"]["require_parameters"] is False
          assert "ortools==9.15.6755" in requirements
          assert 'payload.pop("provider", None)' in production_policy
          assert "EXPERT_ZDR_REQUIRED = False" in production_policy
          assert "provider_lock_required=False" in pipeline
          for source in (gate, auditor, independent):
              assert "unrestricted-openrouter" in source
          PY

      - name: Run top-50/open-provider focused regression gates
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python -m unittest -v \
            tests.test_top50_pool_optimizer \
            tests.test_v5_top50_provider_pool \
            tests.test_v5_constitution_policy \
            tests.test_v5_production_expert_policy

      - name: Run zero-call dry-run execution matrix
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          from v5_governance_model_plan import plan_sha256, task_sha256

          tasks = {
              "simple": "比较A与B，给出结论。",
              "contract": "比较A与B，并按结论、依据、风险、行动四节输出。",
              "complex": "比较A与B的成本、风险、执行条件、利益相关方和二阶效应。",
              "closed_world": "仅依据题面比较A与B，禁止工具，禁止补充外部事实。",
              "long": "比较A与B。" + "约束条件与现实扰动。" * 2000,
          }
          base = json.loads(Path("tests/fixtures/governance-ticket.json").read_text())
          summaries = {}
          for name, question in tasks.items():
              ticket = copy.deepcopy(base)
              ticket["task"]["question"] = question
              plan = ticket["governance_model_plan"]
              plan["task_sha256"] = task_sha256(ticket)
              plan["plan_sha256"] = plan_sha256(plan)
              root = Path("production-validation-artifacts") / name
              root.mkdir(parents=True, exist_ok=True)
              ticket_path = root / "ticket.json"
              ticket_path.write_text(json.dumps(ticket, ensure_ascii=False, indent=2))
              subprocess.run(
                  [
                      "python", "open-model-market/v5_price_ranked_pipeline.py",
                      "--task", question,
                      "--governance-plan-file", str(ticket_path),
                      "--catalog-file", "tests/fixtures/models.json",
                      "--endpoint-file", "tests/fixtures/endpoints.json",
                      "--dry-run",
                      "--maximum-total-calls", "8",
                      "--maximum-recovery-calls", "1",
                      "--output-dir", str(root),
                  ],
                  check=True,
              )
              dry = json.loads((root / "v5-dry-run.json").read_text())
              runtime = json.loads((root / "v5-runtime-config.json").read_text())
              assert dry["status"] == "validated-not-executed"
              assert dry["model_calls"] == 0
              assert runtime["governance_model_calls"] == 0
              assert runtime["model_loop_allowed"] is False
              assert runtime["provider_routing_mode"] == "unrestricted-openrouter"
              assert runtime["provider_restrictions_applied"] is False
              assert runtime["provider_fallback_allowed"] is True
              assert runtime["unrestricted_provider_fallback_allowed"] is True
              assert runtime["provider_lock_required"] is False
              assert runtime["openrouter_selects_provider"] is True
              summaries[name] = {
                  "plan_sha256": plan["plan_sha256"],
                  "node_count": len(dry["proposal"]["nodes"]),
              }
          Path("production-validation-artifacts/matrix-summary.json").write_text(
              json.dumps(summaries, ensure_ascii=False, indent=2)
          )
          PY

      - name: Enforce fail-closed promotion state
        run: |
          set -euo pipefail
          test ! -e .release-authorized
          printf '%s\n' \
            'Production ref movement remains disabled until explicit paid acceptance and independent revalidation.' \
            | tee release-validation-logs/promotion-state.log

      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-production-qualification-${{ github.run_id }}
          path: |
            release-validation-logs/
            production-validation-artifacts/
          if-no-files-found: warn
          retention-days: 30
