name: Promote V5 Production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact validated commit SHA to place on production
        required: true
        type: string
      action:
        description: Fast-forward promotion or validated ancestor rollback
        required: true
        default: promote
        type: choice
        options:
          - promote
          - rollback
  push:
    branches: [v5-production-release]

permissions:
  contents: write

concurrency:
  group: v5-production-release
  cancel-in-progress: false

jobs:
  validate-and-move-production:
    if: >-
      github.actor == github.repository_owner &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/v5-production-release' &&
          github.event.deleted == false
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable release request
        if: github.event_name == 'push'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve immutable release request
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
          DISPATCH_ACTION: ${{ inputs.action }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              target = os.environ.get("DISPATCH_TARGET_SHA", "").strip()
              action = os.environ.get("DISPATCH_ACTION", "").strip()
              request_id = "manual-dispatch"
          elif event_name == "push":
              if os.environ.get("REF_NAME") != "v5-production-release":
                  raise SystemExit("release request must use the fixed release branch")
              request_path = Path(".release-request.json")
              try:
                  request = json.loads(request_path.read_text(encoding="utf-8"))
              except (FileNotFoundError, json.JSONDecodeError, OSError) as exc:
                  raise SystemExit(f"invalid release request file: {exc}") from exc
              if not isinstance(request, dict):
                  raise SystemExit("release request must be one JSON object")
              expected = {"schema_version", "action", "target_sha", "request_id"}
              if set(request) != expected:
                  raise SystemExit("release request fields are not exact")
              if request.get("schema_version") != "v5-production-release-1":
                  raise SystemExit("unsupported release request schema")
              action = str(request.get("action") or "").strip()
              target = str(request.get("target_sha") or "").strip()
              request_id = str(request.get("request_id") or "").strip()
              if re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", request_id) is None:
                  raise SystemExit("invalid release request id")

              parent = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"],
                  text=True,
              ).strip()
              if parent != target:
                  raise SystemExit("release request commit parent differs from target")
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                  text=True,
              ).splitlines()
              if changed != [".release-request.json"]:
                  raise SystemExit("release request commit must change only .release-request.json")
          else:
              raise SystemExit("unsupported release event")

          if action not in {"promote", "rollback"}:
              raise SystemExit("invalid release action")
          if re.fullmatch(r"[0-9a-f]{40}", target) is None:
              raise SystemExit("target SHA must be exactly 40 lowercase hex characters")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"target_sha={target}\n")
              handle.write(f"action={action}\n")
              handle.write(f"request_id={request_id}\n")
          PY

      - name: Checkout target commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release direction
        id: direction
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_ACTION: ${{ steps.release.outputs.action }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main production --no-tags || git fetch origin main --no-tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          current="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          echo "current_production=$current" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_ACTION" == "promote" ]]; then
            if [[ -n "$current" ]]; then
              git merge-base --is-ancestor "$current" "$TARGET_SHA"
            fi
          else
            test -n "$current"
            git merge-base --is-ancestor "$TARGET_SHA" "$current"
          fi

      - name: Install pinned zero-cost validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and full unit validation
        run: |
          python -m ruff check .
          python -m compileall -q open-model-market tests
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run deterministic no-call V5 regression
        run: |
          rm -rf production-validation-artifacts
          python open-model-market/v5_pipeline.py \
            --task "生产发布零费用回归：比较三个公共投资方案，完成财务、合规、证据、预测、红队和最终决策。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 4 \
            --maximum-recovery-calls 1 \
            --quality-tier value \
            --output-dir production-validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('production-validation-artifacts')
          dry = json.loads((root / 'v5-dry-run.json').read_text())
          runtime = json.loads((root / 'v5-runtime-config.json').read_text())
          snapshot = json.loads((root / 'catalog-snapshot.json').read_text())
          assert dry['status'] == 'planned-not-executed'
          assert dry['approved_budget']['maximum_total_calls'] == 4
          assert dry['approved_budget']['maximum_recovery_calls'] == 1
          assert runtime['global_monkey_patching'] is False
          assert runtime['cross_task_history_used'] is False
          assert snapshot['cross_task_history_used'] is False
          assert snapshot['catalog_snapshot_id'] == dry['catalog_snapshot_id']
          PY

      - name: Move production ref
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_ACTION: ${{ steps.release.outputs.action }}
          CURRENT_PRODUCTION: ${{ steps.direction.outputs.current_production }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_ACTION" == "promote" ]]; then
            git push origin "$TARGET_SHA:refs/heads/production"
          else
            git push \
              --force-with-lease="refs/heads/production:$CURRENT_PRODUCTION" \
              origin "$TARGET_SHA:refs/heads/production"
          fi

      - name: Record release result
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_ACTION: ${{ steps.release.outputs.action }}
          REQUEST_ID: ${{ steps.release.outputs.request_id }}
        run: |
          {
            echo "## V5 production ref updated"
            echo
            echo "- Action: \`$RELEASE_ACTION\`"
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Request: \`$REQUEST_ID\`"
            echo "- Runtime: \`V5 native production runtime\`"
            echo "- Paid model calls: \`0\`"
            echo "- Cross-task model history: \`disabled\`"
          } >> "$GITHUB_STEP_SUMMARY"
