name: V5 Production Promotion Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/promote-v5-production.yml"

permissions:
  contents: read

concurrency:
  group: v5-production-qualification
  cancel-in-progress: false

jobs:
  constitutional-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run canonical static and unit gates
        run: |
          set -euo pipefail
          mkdir -p release-validation-logs
          python -m ruff check . 2>&1 | tee release-validation-logs/ruff.log
          python -m compileall -q open-model-market tests tools 2>&1 | tee release-validation-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee release-validation-logs/unit-test.log
      - name: Run task-independent constitutional matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production-validation-artifacts
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          tasks = {
              "simple": "比较方案A与方案B的成本并给出决策阈值。",
              "contract": (
                  "比较两个方案。严格使用以下4个Markdown二级标题，顺序不得改变，"
                  "每项不得为空：\n1）已知条件\n2）计算与比较\n3）风险与反证\n4）结论与下一步"
              ),
              "complex": (
                  "评估三个候选方案，分别完成定量分析、证据核验、情景推演、"
                  "独立红队反证和最终综合决策，并说明实施条件。"
              ),
          }
          root = Path("production-validation-artifacts")
          complexity = {}
          for name, task in tasks.items():
              output = root / name
              command = [
                  sys.executable,
                  "open-model-market/v5_pipeline.py",
                  "--task", task,
                  "--catalog-file", "tests/fixtures/models.json",
                  "--endpoint-file", "tests/fixtures/endpoints.json",
                  "--dry-run",
                  "--maximum-total-calls", "8",
                  "--maximum-recovery-calls", "2",
                  "--cost-anomaly-usd", "0.25",
                  "--quality-tier", "value",
                  "--output-dir", str(output),
              ]
              completed = subprocess.run(command, check=False, text=True, capture_output=True)
              if completed.returncode != 0:
                  raise SystemExit(completed.stdout + "\n" + completed.stderr)
              semantics = json.loads((output / "task-interpretations.json").read_text())
              search = json.loads((output / "v5-adaptive-search.json").read_text())
              optimization = json.loads((output / "v5-optimization.json").read_text())
              graph = json.loads((output / "v5-execution-graph.json").read_text())
              dry = json.loads((output / "v5-dry-run.json").read_text())
              signals = semantics["task_signals"]
              assert signals["task_specific_production_branching"] is False
              assert signals["case_derived_compaction_applied"] is False
              assert signals["architecture_selection_policy"] == "generic-semantic-matrix-only"
              assert search["policy"] == "task-shape-feasibility-marginal-value"
              assert search["attempts"]
              assert optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"}
              assert len(graph["nodes"]) <= dry["approved_budget"]["maximum_initial_calls"]
              companies = [node["parameter_profile"]["model_company"] for node in graph["nodes"]]
              assert len(companies) == len(set(companies))
              assert dry["model_company_policy"] == "task-global-all-different"
              assert dry["global_monkey_patching"] is False
              complexity[name] = signals["complexity_score"]

          contract = json.loads(
              (root / "contract" / "task-interpretations.json").read_text()
          )["task_signals"]["structural_signals"]
          assert contract["explicit_output_contract"] is True
          assert contract["explicit_contract_items"] == 4
          assert complexity["complex"] >= complexity["simple"]
          PY
      - name: Enforce fail-closed promotion state
        run: |
          echo "Constitutional zero-cost qualification passed."
          echo "Production ref movement remains disabled until paid generic acceptance is attached."
          test ! -e .release-authorized
      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-production-qualification-${{ github.run_id }}
          path: |
            release-validation-logs/
            production-validation-artifacts/
          if-no-files-found: warn
          retention-days: 30
