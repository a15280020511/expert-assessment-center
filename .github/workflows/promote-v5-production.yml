name: V5 Production Qualification Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/promote-v5-production.yml"

permissions:
  contents: read

concurrency:
  group: v5-production-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run canonical static and unit gates
        run: |
          set -euo pipefail
          mkdir -p release-validation-logs production-validation-artifacts
          python -m ruff check . 2>&1 | tee release-validation-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee release-validation-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee release-validation-logs/unit-tests.log

      - name: Verify cleaned advisory architecture
        run: |
          set -euo pipefail
          grep -q 'SELECTION_AUTHORITY = "decision-system-governance"' \
            open-model-market/v5_governance_model_plan.py
          test -f open-model-market/v5_governed_plan_orchestrator.py
          grep -q 'build_governed_proposal' \
            open-model-market/v5_price_ranked_pipeline.py
          ! grep -q 'build_price_ranked_proposal' \
            open-model-market/v5_price_ranked_pipeline.py
          ! grep -q 'v5_governance_runtime' \
            open-model-market/v5_price_ranked_pipeline.py
          ! grep -q 'v5_claude_red_team_policy' \
            open-model-market/v5_price_ranked_pipeline.py
          removed=(
            open-model-market/v5_planner.py
            open-model-market/v5_constitutional_pipeline.py
            open-model-market/v5_value_optimizer.py
            open-model-market/v5_cross_endpoint_planner.py
            open-model-market/v5_operational_resilience.py
            open-model-market/v5_general_task_planning.py
            open-model-market/task_semantic_compiler.py
            open-model-market/resource_matrix.py
            open-model-market/atomic_work_graph.py
          )
          for path in "${removed[@]}"; do test ! -e "$path"; done

      - name: Run task-independent advisory matrix
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          from v5_governance_model_plan import plan_sha256, task_sha256

          tasks = {
              "simple": "比较A与B，给出结论。",
              "contract": "比较A与B，并按结论、依据、风险、行动四节输出。",
              "complex": "比较A与B的成本、风险、执行条件、利益相关方和二阶效应。",
              "closed_world": "仅依据题面比较A与B，禁止工具，禁止补充外部事实。",
              "long": "比较A与B。" + "约束条件与现实扰动。" * 2000,
          }
          base = json.loads(
              Path("tests/fixtures/governance-ticket.json").read_text()
          )
          summaries = {}
          for name, question in tasks.items():
              ticket = copy.deepcopy(base)
              ticket["task"]["question"] = question
              plan = ticket["governance_model_plan"]
              plan["task_sha256"] = task_sha256(ticket)
              plan["plan_sha256"] = plan_sha256(plan)
              root = Path("production-validation-artifacts") / name
              root.mkdir(parents=True, exist_ok=True)
              ticket_path = root / "ticket.json"
              ticket_path.write_text(
                  json.dumps(ticket, ensure_ascii=False, indent=2)
              )
              subprocess.run(
                  [
                      "python", "open-model-market/v5_price_ranked_pipeline.py",
                      "--task", question,
                      "--governance-plan-file", str(ticket_path),
                      "--catalog-file", "tests/fixtures/models.json",
                      "--endpoint-file", "tests/fixtures/endpoints.json",
                      "--dry-run",
                      "--maximum-total-calls", "8",
                      "--maximum-recovery-calls", "1",
                      "--output-dir", str(root),
                  ],
                  check=True,
              )
              dry = json.loads((root / "v5-dry-run.json").read_text())
              selection = json.loads(
                  (root / "v5-price-ranked-selection.json").read_text()
              )
              runtime = json.loads((root / "v5-runtime-config.json").read_text())
              assert dry["status"] == "validated-not-executed"
              assert dry["model_calls"] == 0
              assert selection["selection_authority"] == "decision-system-governance"
              assert selection["model_selection_performed_locally"] is False
              assert selection["model_reranking_performed_locally"] is False
              assert selection["model_substitution_performed_locally"] is False
              assert selection["provider_resolution_performed_locally"] is True
              assert runtime["model_loop_allowed"] is False
              assert runtime["governance_model_calls"] == 0
              assert runtime["local_task_classification_used"] is False
              assert runtime["optimizer_present"] is False
              summaries[name] = {
                  "plan_sha256": plan["plan_sha256"],
                  "node_count": len(dry["proposal"]["nodes"]),
              }
          Path("production-validation-artifacts/matrix-summary.json").write_text(
              json.dumps(summaries, ensure_ascii=False, indent=2)
          )
          PY

      - name: Enforce fail-closed promotion state
        run: |
          set -euo pipefail
          test ! -e .release-authorized
          printf '%s\n' \
            'Production ref movement remains disabled until explicit acceptance.' \
            | tee release-validation-logs/promotion-state.log

      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-production-qualification-${{ github.run_id }}
          path: |
            release-validation-logs/
            production-validation-artifacts/
          if-no-files-found: warn
          retention-days: 30
