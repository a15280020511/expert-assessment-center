name: Maintenance Diagnose V5 Audit Patch V3

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose-patch:
    if: >-
      github.actor == 'a15280020511' &&
      github.event.issue.title == '[maintenance-apply-v5-audit-fix] validated patch' &&
      github.event.comment.body == '/diagnose-v5-audit-fix-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Publish diagnosis start
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## PATCH_DIAGNOSIS_V3_STARTED\n\n- Run: \`${context.runId}\``})

      - name: Diagnose per-part hashes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate > /tmp/comments.json
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          pattern = re.compile(r'^PATCH_PART (\d{3})/(\d{3})\n([A-Za-z0-9+/=]+)$')
          parts = {}
          for row in comments:
              match = pattern.fullmatch(str(row.get('body') or '').strip())
              if match:
                  parts[int(match.group(1))] = match.group(3)
          evidence = {
              str(index): {
                  'length': len(payload),
                  'sha256': hashlib.sha256(payload.encode('ascii')).hexdigest(),
              }
              for index, payload in sorted(parts.items())
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          Path('/tmp/diagnosis.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Publish diagnosis
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## PATCH_DIAGNOSIS_V3\n\n\`\`\`json\n${fs.readFileSync('/tmp/diagnosis.json', 'utf8')}\n\`\`\``})
