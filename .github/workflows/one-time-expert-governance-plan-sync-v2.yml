name: One-time Expert Governance Plan Sync V2

on:
  push:
    branches:
      - feat/execution-only-governance-model-plan

permissions:
  contents: write

concurrency:
  group: one-time-expert-governance-plan-sync-v2
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'a15280020511/expert-assessment-center'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout governance-plan branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/execution-only-governance-model-plan
          fetch-depth: 0

      - name: Verify and atomically apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/patches -maxdepth 1 -type f -name 'expert-governance-part-*.b64' | sort)
          test "${#parts[@]}" -eq 11
          cat "${parts[@]}" > /tmp/expert-governance-patch.b64
          test "$(wc -c < /tmp/expert-governance-patch.b64)" -eq 53852
          echo '370be7218291c29fc69c4203b91e5d0f776a0b5f416ca521845626f9b7277c23  /tmp/expert-governance-patch.b64' | sha256sum -c -
          base64 -d /tmp/expert-governance-patch.b64 > /tmp/expert-governance-patch.tar.gz
          echo '9ced0ff43fc8deda9c781f2478e11669e2a48dc2e3f705b89fb3831be0870cf0  /tmp/expert-governance-patch.tar.gz' | sha256sum -c -
          tar -tzf /tmp/expert-governance-patch.tar.gz >/tmp/expert-governance-patch.files
          tar -xzf /tmp/expert-governance-patch.tar.gz -C .

          rm -rf .github/patches
          rm -f \
            open-model-market/v5_price_ranked_orchestrator.py \
            tests/test_v5_price_ranked_orchestrator.py \
            tests/test_v5_price_ranked_full_load.py \
            .github/workflows/v5-live-flagship-price-ranking.yml \
            .github/workflows/one-time-expert-governance-plan-sync.yml \
            .github/workflows/one-time-expert-governance-plan-sync-v2.yml

          python -m compileall -q open-model-market tests
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              Path('open-model-market/v5_price_ranked_orchestrator.py'),
              Path('tests/test_v5_price_ranked_orchestrator.py'),
              Path('tests/test_v5_price_ranked_full_load.py'),
              Path('.github/workflows/v5-live-flagship-price-ranking.yml'),
          ]
          present = [str(path) for path in forbidden if path.exists()]
          if present:
              raise SystemExit(f'legacy selector residue remains: {present}')
          required = [
              Path('open-model-market/v5_governance_model_plan.py'),
              Path('open-model-market/v5_governed_plan_orchestrator.py'),
              Path('tests/fixtures/governance-ticket.json'),
              Path('tests/test_v5_governance_model_plan.py'),
              Path('tests/test_v5_governed_plan_orchestrator.py'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'governance-plan files missing: {missing}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: remove expert-local model selection'
          git push origin HEAD:feat/execution-only-governance-model-plan
