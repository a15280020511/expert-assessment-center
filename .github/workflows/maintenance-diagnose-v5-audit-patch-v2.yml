name: Maintenance Diagnose V5 Audit Patch V2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose-patch:
    if: >-
      github.actor == 'a15280020511' &&
      github.event.issue.title == '[maintenance-apply-v5-audit-fix] validated patch' &&
      github.event.comment.body == '/diagnose-v5-audit-fix-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Publish diagnosis start
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PATCH_DIAGNOSIS_V2_STARTED\n\n- Run: \`${context.runId}\``
            })

      - name: Diagnose immutable parts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          ticket = json.loads(event['issue']['body'])
          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          pattern = re.compile(r'^PATCH_PART (\d{3})/(\d{3})\n([A-Za-z0-9+/=]+)$')
          parts = {}
          for row in comments:
              match = pattern.fullmatch(str(row.get('body') or '').strip())
              if match:
                  parts[int(match.group(1))] = match.group(3)
          joined = ''.join(parts[index] for index in sorted(parts))
          evidence = {
              'expected_count': int(ticket['part_count']),
              'observed_indices': sorted(parts),
              'part_lengths': {str(index): len(parts[index]) for index in sorted(parts)},
              'joined_length': len(joined),
              'joined_mod4': len(joined) % 4,
              'joined_text_sha256': hashlib.sha256(joined.encode('ascii')).hexdigest(),
          }
          try:
              raw = base64.b64decode(joined, validate=True)
              evidence['decoded_bytes'] = len(raw)
              evidence['decoded_sha256'] = hashlib.sha256(raw).hexdigest()
          except Exception as exc:
              evidence['decode_error'] = f'{type(exc).__name__}: {exc}'
          print(json.dumps(evidence, indent=2, sort_keys=True))
          Path('/tmp/diagnosis.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Publish diagnosis
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PATCH_DIAGNOSIS_V2\n\n\`\`\`json\n${fs.readFileSync('/tmp/diagnosis.json', 'utf8')}\n\`\`\``
            })
