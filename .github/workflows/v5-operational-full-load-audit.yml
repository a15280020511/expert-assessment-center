name: V5 Operational Full-Load Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-operational-full-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Canonical static and full unit suite
        run: |
          set -euo pipefail
          mkdir -p audit-logs
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools 2>&1 | tee audit-logs/compile.log
          python -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee audit-logs/full-unit.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-canonical-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: error
          retention-days: 30

  deterministic-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 7, 42, 99, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Recovery, contract, budget and chaos matrix
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p audit-logs
          python -m unittest -v \
            tests.test_v5_operational_resilience \
            tests.test_v5_operational_resilience_scope \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_recovery_company_diversity \
            tests.test_v5_recovery_absolute_budget_feasibility \
            tests.test_v5_stress_stability \
            tests.test_v5_reasoning_saturation_recovery \
            tests.test_openrouter_hard_deadline \
            2>&1 | tee audit-logs/seed-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: error
          retention-days: 30

  parallel-dag-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 42, 31337]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Concurrent budgets, provider circuits and isolated DAG dry-runs
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p audit-logs
          python -m unittest -v tests.test_v5_full_load_stability \
            2>&1 | tee audit-logs/full-load-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-full-load-${{ matrix.seed }}-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: error
          retention-days: 30

  probability-properties:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check
      - name: Exhaustive recovery-tail and uptime calibration properties
        run: |
          set -euo pipefail
          mkdir -p audit-logs
          PYTHONPATH=open-model-market python - <<'PY' | tee audit-logs/properties.log
          import itertools
          from v5_operational_resilience import (
              calibrate_endpoint_operational_profile,
              poisson_binomial_tail,
              uniform_failure_cap,
          )

          cases = 0
          for node_count in range(1, 17):
              for recovery in range(0, min(4, node_count) + 1):
                  for target in (0.01, 0.025, 0.05, 0.08):
                      cap = uniform_failure_cap(node_count, recovery, target)
                      tail = poisson_binomial_tail([cap] * node_count, recovery)
                      assert 0.0 <= cap <= 1.0
                      assert tail <= target + 1e-9, (node_count, recovery, target, cap, tail)
                      if cap < 1.0:
                          higher = min(1.0, cap + 1e-5)
                          assert poisson_binomial_tail([higher] * node_count, recovery) >= tail - 1e-12
                      cases += 1

          for uptime_values in (
              (0.0, 0.5, 0.89, 0.90, 0.95, 0.99, 1.0),
              (0, 50, 89, 90, 95, 99, 100),
          ):
              previous = -1.0
              for value in uptime_values:
                  profile = calibrate_endpoint_operational_profile({
                      "status": 0,
                      "uptime_last_1d": value,
                      "uptime_last_30m": value,
                      "uptime_last_5m": value,
                  })
                  reliability = profile["operational_reliability"]
                  assert 0.0 <= reliability <= 0.995
                  assert reliability + 1e-12 >= previous, (value, previous, reliability)
                  previous = reliability
                  cases += 1

          for probabilities in itertools.product((0.0, 0.02, 0.05, 0.10), repeat=4):
              tails = [poisson_binomial_tail(probabilities, recovery) for recovery in range(5)]
              assert all(0.0 <= value <= 1.0 for value in tails)
              assert all(left + 1e-12 >= right for left, right in zip(tails, tails[1:]))
              cases += 1

          print({"status": "PASS", "property_cases": cases, "history_used": False})
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-properties-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: error
          retention-days: 30

  granular-repository-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Inspect every repository file and source line
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir audit-artifacts \
            --fail-on high
          tar --exclude=.git --exclude=audit-artifacts \
            -czf audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz .
          sha256sum audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz \
            > audit-artifacts/repository-source-${GITHUB_SHA}.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-granular-audit-${{ github.run_id }}
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 30
