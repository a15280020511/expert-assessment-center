name: V5 Governance Endpoint Diagnostic 2026-08-03

on:
  pull_request:
    paths:
      - ".github/workflows/v5-governance-endpoint-diagnostic-20260803.yml"

permissions:
  contents: read

jobs:
  endpoint-diagnostic:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Probe exact endpoint metadata without chat calls
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          mkdir -p governance-endpoint-diagnostic
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          from openrouter_api import request_json
          from v5_catalog_view import _endpoint_rows, _provider_slug, endpoint_url

          model_ids = [
              "openai/gpt-5.6-sol",
              "openai/gpt-5.6-terra",
              "openai/gpt-5.5",
              "anthropic/claude-opus-5",
              "anthropic/claude-opus-4.8",
          ]
          rows = []
          for model_id in model_ids:
              payload = request_json(
                  endpoint_url(model_id),
                  os.environ["OPENROUTER_API_KEY"],
                  30,
                  0,
              )
              endpoints = []
              for endpoint in _endpoint_rows(payload):
                  supported = sorted(
                      str(value)
                      for value in endpoint.get("supported_parameters", [])
                  )
                  endpoints.append(
                      {
                          "provider": _provider_slug(endpoint),
                          "context_length": int(endpoint.get("context_length") or 0),
                          "max_completion_tokens": int(endpoint.get("max_completion_tokens") or 0),
                          "supported_parameters": supported,
                          "supports_temperature": "temperature" in supported,
                          "supports_max_tokens": (
                              "max_tokens" in supported
                              or "max_completion_tokens" in supported
                          ),
                          "supports_reasoning": (
                              "reasoning" in supported
                              or "reasoning_effort" in supported
                          ),
                          "supports_response_format": (
                              "response_format" in supported
                              or "structured_outputs" in supported
                          ),
                      }
                  )
              rows.append(
                  {
                      "model": model_id,
                      "endpoint_count": len(endpoints),
                      "endpoints": endpoints,
                  }
              )

          report = {
              "schema_version": "v5-governance-endpoint-diagnostic-1",
              "status": "PASS",
              "chat_model_calls": 0,
              "models": rows,
          }
          Path("governance-endpoint-diagnostic/report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          assert report["chat_model_calls"] == 0
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-endpoint-diagnostic-${{ github.run_id }}
          path: governance-endpoint-diagnostic/
          if-no-files-found: error
          retention-days: 7
