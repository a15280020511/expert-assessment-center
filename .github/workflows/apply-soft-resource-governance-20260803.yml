name: Apply Soft Resource Governance 2026-08-03

on:
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - ".github/soft-resource-patch/**"
      - ".github/workflows/apply-soft-resource-governance-20260803.yml"

permissions:
  contents: write

concurrency:
  group: apply-soft-resource-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'fix/v5-soft-resource-governance-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Verify, apply, and validate soft-resource governance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/soft-resource-parts
          for part in .github/soft-resource-patch/part*; do
            tr -d '[:space:]' < "$part" > "/tmp/soft-resource-parts/$(basename "$part")"
          done
          sha256sum /tmp/soft-resource-parts/part*
          test "$(sha256sum /tmp/soft-resource-parts/part00 | awk '{print $1}')" = "d131fdac2b0f49bfde689c5dcb7c21d157d1e26dca602cedd3c13bced3dc00ba"
          test "$(sha256sum /tmp/soft-resource-parts/part01 | awk '{print $1}')" = "cff07298d5cc03a881f74d236963ddbfef836a9d74376eacc736c4e40755bcca"
          test "$(sha256sum /tmp/soft-resource-parts/part02 | awk '{print $1}')" = "78f37ca6be4d48307131fbd76967c5bb75bc3d22c5f5b518ecaabf9828b31462"
          test "$(sha256sum /tmp/soft-resource-parts/part03 | awk '{print $1}')" = "8a5ee0b359482788dfdda56be0328672336cc4d904091e69f6d3b11746f4a8c2"
          test "$(sha256sum /tmp/soft-resource-parts/part04 | awk '{print $1}')" = "5af06fc487c0024e0a43d3c6eb652f744f58a60906b33e3f8f0c8fd166920fdd"
          test "$(sha256sum /tmp/soft-resource-parts/part05 | awk '{print $1}')" = "cf530d4e15413e20397e66ba939f743e29749a1e6fe04d9f99350672b9f9dda0"
          cat /tmp/soft-resource-parts/part* > /tmp/soft-resource-transform.b64
          test "$(sha256sum /tmp/soft-resource-transform.b64 | awk '{print $1}')" = "8b21f43982f42fb519d41c7152668210798ef90de96d82fbbbcf4e132f65e06a"
          base64 --decode /tmp/soft-resource-transform.b64 > tools/apply_soft_resource_governance.py
          test "$(sha256sum tools/apply_soft_resource_governance.py | awk '{print $1}')" = "146d233cb36dd4411dd605448f456c2759518d86d1dedc4005718d824823457f"
          python -m py_compile tools/apply_soft_resource_governance.py
          python tools/apply_soft_resource_governance.py
          rm tools/apply_soft_resource_governance.py

          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v
          python tools/repository_audit.py --root . --output-dir /tmp/repository-audit --fail-on info

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-model-market tests
          git diff --cached --check
          git commit -m "refactor: make model resource controls advisory only"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
