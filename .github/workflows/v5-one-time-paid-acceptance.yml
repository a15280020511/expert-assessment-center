name: V5 One-Time Paid Acceptance

on:
  push:
    branches:
      - "fix/v5-**"
    paths:
      - ".github/v5-paid-acceptance-request.json"

permissions:
  contents: read

concurrency:
  group: v5-one-time-paid-acceptance
  cancel-in-progress: false

jobs:
  paid-generic-acceptance:
    if: github.actor == github.repository_owner
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ACCEPTANCE_COST_CAP_USD: "0.03"
      ACCEPTANCE_TOTAL_CALLS: "4"
      ACCEPTANCE_RECOVERY_CALLS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Validate immutable request-only trigger
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (keys | sort) == ["purpose", "request_id", "schema_version"] and
            .schema_version == "v5-paid-acceptance-1" and
            .purpose == "task-independent-low-cost-production-qualification" and
            (.request_id | test("^[a-z0-9][a-z0-9._-]{0,63}$"))
          ' .github/v5-paid-acceptance-request.json >/dev/null
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/v5-paid-acceptance-request.json"

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run release-critical zero-call regressions
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest \
            tests.test_workflow_contract \
            tests.test_v5_constitution \
            tests.test_v5_constitutional_runtime \
            tests.test_v5_paid_acceptance_revalidation \
            tests.test_v5_global_company_calibration \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            -v

      - name: Verify inference secret without disclosure
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20

      - name: Execute bounded generic live acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf paid-acceptance-artifacts
          mkdir -p paid-acceptance-artifacts
          task=$(cat <<'TASK'
          比较方案A“自建内部工单系统”和方案B“采用托管SaaS工单系统”。分别完成成本结构与选择阈值分析、实施与运营风险反证，并形成综合决策。不得调用外部工具。严格使用以下4个Markdown二级标题，顺序不得改变，每项不得为空：
          1）已知条件、假设与未知项
          2）成本结构、公式与选择阈值
          3）实施风险、运营风险与反证
          4）综合结论、适用条件与下一步
          TASK
          )
          printf '%s\n' "$task" > paid-acceptance-artifacts/paid-acceptance-task.txt
          python open-model-market/v5_pipeline.py \
            --task "$task" \
            --require-live-catalog \
            --maximum-total-calls "$ACCEPTANCE_TOTAL_CALLS" \
            --maximum-recovery-calls "$ACCEPTANCE_RECOVERY_CALLS" \
            --cost-anomaly-usd "$ACCEPTANCE_COST_CAP_USD" \
            --quality-tier value \
            --output-dir paid-acceptance-artifacts

      - name: Verify live acceptance evidence
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("paid-acceptance-artifacts")
          result = json.loads((root / "v5-result.json").read_text())
          summary = json.loads((root / "v5-execution-summary.json").read_text())
          audit = json.loads((root / "actual-model-company-audit.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          search = json.loads((root / "v5-adaptive-search.json").read_text())
          nodes = json.loads((root / "v5-node-results.json").read_text())
          report = (root / "v5-final-report.md").read_text()

          assert result["status"] == "success", result
          assert result["completion_mode"] == "full", result
          assert result["quality_status"] == "full_success", result
          assert summary["status"] == "success", summary
          assert summary["completion_mode"] == "full", summary
          assert audit["status"] == "PASS", audit
          assert audit["policy"] == "recompute-from-all-actual-cross-node-calls-and-successes"
          assert not audit["duplicate_successful_companies"]
          assert not audit["duplicate_called_companies"]
          assert not audit["unknown_company_models"]
          assert len(audit["successful_node_models"]) == len(graph["nodes"])
          companies = [row["company"] for row in audit["successful_node_models"]]
          assert len(companies) == len(set(companies)), companies
          called_by_company = {}
          for row in audit["all_called_models"]:
              called_by_company.setdefault(row["company"], set()).add(row["node_id"])
          assert not {
              company: sorted(node_ids)
              for company, node_ids in called_by_company.items()
              if len(node_ids) > 1
          }, called_by_company
          assert all(str(row.get("status", "")).startswith("success") for row in nodes)
          assert all(
              row.get("contract", {}).get("required_fields_complete") is True
              for row in nodes
          )
          budget = summary["execution_budget"]
          calls = int(budget["calls_reserved"])
          actual_cost = float(
              summary.get("actual_cost_usd")
              or budget.get("actual_cost_usd")
              or 0.0
          )
          assert 1 <= calls <= int(os.environ["ACCEPTANCE_TOTAL_CALLS"])
          assert 0.0 <= actual_cost <= float(os.environ["ACCEPTANCE_COST_CAP_USD"])
          assert search["policy"] == "task-shape-feasibility-marginal-value"
          assert search["attempts"]
          expected = [
              "已知条件、假设与未知项",
              "成本结构、公式与选择阈值",
              "实施风险、运营风险与反证",
              "综合结论、适用条件与下一步",
          ]
          actual = re.findall(r"(?m)^##\s+(.+?)\s*$", report)
          normalized = [value.strip().strip("#").strip() for value in actual]
          positions = [normalized.index(value) for value in expected]
          assert positions == sorted(positions), normalized
          verdict = {
              "schema_version": "v5-paid-acceptance-verdict-2",
              "status": "PASS",
              "head_sha": os.environ["HEAD_SHA"],
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_url": os.environ["RUN_URL"],
              "task_class": "generic-two-option-business-decision",
              "model_calls": calls,
              "actual_cost_usd": actual_cost,
              "cost_cap_usd": float(os.environ["ACCEPTANCE_COST_CAP_USD"]),
              "node_count": len(graph["nodes"]),
              "successful_models": audit["successful_node_models"],
              "actual_model_company_audit": audit["status"],
              "completion_mode": result["completion_mode"],
              "quality_status": result["quality_status"],
              "contract_heading_count": len(expected),
              "external_tools_allowed": False,
              "production_ref_moved": False,
              "public_report_published": False,
              "cross_task_history_used": False,
          }
          (root / "paid-acceptance-verdict.json").write_text(
              json.dumps(verdict, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          import sys
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(root)
          print(json.dumps(verdict, ensure_ascii=False))
          PY

      - name: Upload paid acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-paid-acceptance-${{ github.run_id }}
          path: paid-acceptance-artifacts/
          if-no-files-found: warn
          retention-days: 30

  independently-attest-paid-artifact:
    needs: paid-generic-acceptance
    if: >-
      ${{
        needs['paid-generic-acceptance'].result == 'success' &&
        github.actor == github.repository_owner
      }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      PAID_RUN_ID: ${{ github.run_id }}
      PAID_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PAID_HEAD_SHA: ${{ github.sha }}
      EXPECTED_ARTIFACT_NAME: v5-paid-acceptance-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve unique open Draft PR
        id: pr
        run: |
          set -euo pipefail
          pr_number=$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number,isDraft \
            --jq 'map(select(.isDraft == true)) | if length == 1 then .[0].number else error("expected exactly one open Draft PR") end')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Resolve and download this Run Artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PAID_HEAD_SHA"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$PAID_RUN_ID/artifacts?per_page=100" \
            > paid-artifacts.json
          artifact_id=$(jq -er --arg name "$EXPECTED_ARTIFACT_NAME" '
            .artifacts
            | map(select(.name == $name and .expired == false))
            | if length == 1 then .[0].id else error("expected exactly one artifact") end
          ' paid-artifacts.json)
          artifact_digest=$(jq -er --argjson id "$artifact_id" '
            .artifacts[] | select(.id == $id) | .digest
          ' paid-artifacts.json)
          test -n "$artifact_digest"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > paid-evidence.zip
          rm -rf paid-evidence
          mkdir paid-evidence
          unzip -q paid-evidence.zip -d paid-evidence
          {
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Independently recompute raw Artifact evidence
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python open-model-market/v5_paid_acceptance_revalidation.py \
            --root paid-evidence \
            --head-sha "$PAID_HEAD_SHA" \
            --run-id "$PAID_RUN_ID" \
            --run-url "$PAID_RUN_URL" \
            --maximum-calls 4 \
            --maximum-cost 0.03 \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$EXPECTED_ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --output v5-paid-acceptance-attestation.json
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path("v5-paid-acceptance-attestation.json").read_text()
          )
          companies = value["successful_companies"]
          Path("paid-acceptance-comment.md").write_text(
              "## V5 bounded paid acceptance: PASS\n\n"
              f"- Paid Run: `{value['paid_workflow_run_url']}`\n"
              f"- Paid head SHA: `{value['paid_head_sha']}`\n"
              f"- Paid Artifact ID: `{value['paid_artifact_id']}`\n"
              f"- Paid Artifact digest: `{value['paid_artifact_digest']}`\n"
              f"- Model calls: `{value['model_calls']}` / `4`\n"
              f"- Actual cost: `${value['actual_cost_usd']:.8f}` / `$0.03`\n"
              f"- Nodes: `{value['node_count']}`\n"
              f"- Companies: `{', '.join(companies)}`\n"
              "- Completion: `full`\n"
              "- Quality: `full_success`\n"
              "- Constitutional report validation: `PASS`\n"
              "- Manifest file revalidation: `PASS`\n"
              "- Raw evidence recomputation: `PASS`\n"
              "- External tools: `disabled`\n"
              "- Public publication: `none`\n"
              "- Production ref movement: `none`\n",
              encoding="utf-8",
          )
          PY

      - name: Commit authoritative paid acceptance attestation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PAID_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp v5-paid-acceptance-attestation.json .github/v5-paid-acceptance-attestation.json
          git add .github/v5-paid-acceptance-attestation.json
          git diff --cached --quiet && {
            echo "Attestation did not create a new evidence record" >&2
            exit 1
          }
          git commit -m "test(v5): record paid acceptance attestation $PAID_RUN_ID"
          git push origin HEAD:"$BRANCH"

      - name: Publish attestation to Draft PR
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "$REPOSITORY" \
            --body-file paid-acceptance-comment.md

      - name: Upload independent attestation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-paid-acceptance-attestation-${{ github.run_id }}
          path: |
            paid-artifacts.json
            paid-evidence/
            v5-paid-acceptance-attestation.json
            paid-acceptance-comment.md
          if-no-files-found: warn
          retention-days: 30

  report-paid-acceptance-failure:
    needs:
      - paid-generic-acceptance
      - independently-attest-paid-artifact
    if: >-
      ${{
        always() &&
        (
          needs['paid-generic-acceptance'].result != 'success' ||
          needs['independently-attest-paid-artifact'].result != 'success'
        )
      }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      PAID_RESULT: ${{ needs.paid-generic-acceptance.result }}
      ATTESTATION_RESULT: ${{ needs.independently-attest-paid-artifact.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Publish authoritative failure visibility
        run: |
          set -euo pipefail
          cat > failure.md <<EOF
          ## V5 bounded paid acceptance: NOT PASSED

          - Run: \`$RUN_URL\`
          - Head SHA: \`$HEAD_SHA\`
          - Paid Job: \`$PAID_RESULT\`
          - Independent attestation Job: \`$ATTESTATION_RESULT\`
          - Production movement: \`none\`
          - PR state: \`Draft\`

          No production qualification is granted. Inspect the Run and its uploaded evidence before another bounded attempt.
          EOF
          pr_number=$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number,isDraft \
            --jq 'map(select(.isDraft == true)) | if length == 1 then .[0].number else error("expected exactly one open Draft PR") end')
          gh pr comment "$pr_number" --repo "$REPOSITORY" --body-file failure.md
