name: V5 One-Time Paid Acceptance

on:
  push:
    branches:
      - "acceptance/**"
    paths:
      - ".github/v5-paid-acceptance-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: v5-one-time-paid-acceptance
  cancel-in-progress: false

jobs:
  paid-acceptance:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      target_sha: ${{ steps.request.outputs.target_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      maximum_total_calls: ${{ steps.request.outputs.maximum_total_calls }}
      maximum_recovery_calls: ${{ steps.request.outputs.maximum_recovery_calls }}
      cost_cap_usd: ${{ steps.request.outputs.cost_cap_usd }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: v5-paid-acceptance-${{ github.run_id }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout immutable acceptance request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
          path: request-source

      - name: Validate request-only commit
        id: request
        working-directory: request-source
        shell: bash
        run: |
          set -euo pipefail
          request=.github/v5-paid-acceptance-request.json
          jq -e '
            type == "object" and
            (keys | sort) == [
              "cost_cap_usd",
              "maximum_recovery_calls",
              "maximum_total_calls",
              "purpose",
              "quality_tier",
              "request_id",
              "schema_version",
              "target_sha",
              "task"
            ] and
            .schema_version == "v5-paid-acceptance-2" and
            .purpose == "task-independent-low-cost-production-qualification" and
            (.request_id | test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
            (.target_sha | test("^[0-9a-f]{40}$")) and
            (.quality_tier == "budget" or .quality_tier == "value" or .quality_tier == "quality") and
            (.maximum_total_calls | type == "number" and . >= 4 and . <= 16) and
            (.maximum_recovery_calls | type == "number" and . >= 0) and
            (.maximum_recovery_calls < .maximum_total_calls) and
            (.cost_cap_usd | type == "number" and . > 0) and
            (.task | type == "object") and
            (.task.question | type == "string" and length > 0) and
            (.task.requirements | type == "array") and
            (.task.language | type == "string" and length > 0)
          ' "$request" >/dev/null
          test "$(git diff --name-only HEAD^ HEAD)" = "$request"
          target="$(jq -er '.target_sha' "$request")"
          test "$(git rev-parse HEAD^)" = "$target"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$target" origin/main
          {
            echo "target_sha=$target"
            echo "request_id=$(jq -er '.request_id' "$request")"
            echo "quality_tier=$(jq -er '.quality_tier' "$request")"
            echo "maximum_total_calls=$(jq -er '.maximum_total_calls' "$request")"
            echo "maximum_recovery_calls=$(jq -er '.maximum_recovery_calls' "$request")"
            echo "cost_cap_usd=$(jq -er '.cost_cap_usd' "$request")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact target source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Verify exact target checkout
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime-source/requirements-runtime.txt
            runtime-source/requirements-dev.txt

      - name: Install pinned target dependencies
        working-directory: runtime-source
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run release-critical zero-call regressions
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Verify inference secret without disclosure
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20

      - name: Materialize immutable task ticket
        working-directory: runtime-source
        run: |
          set -euo pipefail
          rm -rf paid-acceptance-artifacts
          mkdir -p paid-acceptance-artifacts
          cp ../request-source/.github/v5-paid-acceptance-request.json paid-acceptance-request.json
          jq '{task: .task}' paid-acceptance-request.json > paid-acceptance-artifacts/ticket.json
          jq -r '
            .task.question,
            (if (.task.requirements | length) > 0 then
              "执行要求：\n" + (.task.requirements | map("- " + .) | join("\n"))
             else empty end),
            "输出语言：" + .task.language
          ' paid-acceptance-request.json > paid-task.txt

      - name: Execute bounded live production acceptance
        working-directory: runtime-source
        env:
          QUALITY_TIER: ${{ steps.request.outputs.quality_tier }}
          MAXIMUM_TOTAL_CALLS: ${{ steps.request.outputs.maximum_total_calls }}
          MAXIMUM_RECOVERY_CALLS: ${{ steps.request.outputs.maximum_recovery_calls }}
          COST_CAP_USD: ${{ steps.request.outputs.cost_cap_usd }}
        shell: bash
        run: |
          set -euo pipefail
          python open-model-market/v5_production_ticket.py \
            --task "$(cat paid-task.txt)" \
            --output-dir paid-acceptance-artifacts \
            --quality-tier "$QUALITY_TIER" \
            --maximum-total-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --cost-anomaly-usd "$COST_CAP_USD" \
            --require-live-catalog

      - name: Freeze complete paid artifact manifest
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(Path("paid-acceptance-artifacts"))
          PY

      - name: Upload paid acceptance primitive evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-paid-acceptance-${{ github.run_id }}
          path: runtime-source/paid-acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30

  independently-recompute-paid-artifact:
    needs: paid-acceptance
    if: >-
      needs.paid-acceptance.result == 'success' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAID_RUN_ID: ${{ github.run_id }}
      TARGET_SHA: ${{ needs.paid-acceptance.outputs.target_sha }}
      REQUEST_ID: ${{ needs.paid-acceptance.outputs.request_id }}
      MAXIMUM_TOTAL_CALLS: ${{ needs.paid-acceptance.outputs.maximum_total_calls }}
      COST_CAP_USD: ${{ needs.paid-acceptance.outputs.cost_cap_usd }}
      EXPECTED_ARTIFACT_NAME: ${{ needs.paid-acceptance.outputs.artifact_name }}
    steps:
      - name: Checkout exact attested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.paid-acceptance.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Resolve and download this Run artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C runtime-source rev-parse HEAD)" = "$TARGET_SHA"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$PAID_RUN_ID/artifacts?per_page=100" \
            > paid-artifacts.json
          artifact_id=$(jq -er --arg name "$EXPECTED_ARTIFACT_NAME" '
            .artifacts
            | map(select(.name == $name and .expired == false))
            | if length == 1 then .[0].id else error("expected exactly one artifact") end
          ' paid-artifacts.json)
          artifact_digest=$(jq -er --argjson id "$artifact_id" '
            .artifacts[] | select(.id == $id) | .digest
          ' paid-artifacts.json)
          test -n "$artifact_digest"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > paid-evidence.zip
          rm -rf paid-evidence
          mkdir paid-evidence
          unzip -q paid-evidence.zip -d paid-evidence
          {
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Recompute verdict from primitive evidence
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python runtime-source/open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir paid-evidence \
            --expected-sha "$TARGET_SHA" \
            --expected-run-id "$PAID_RUN_ID" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-cost-usd "$COST_CAP_USD" \
            --archive paid-evidence.zip \
            --expected-artifact-digest "$ARTIFACT_DIGEST" \
            --output independent-revalidation.json

      - name: Create bound independent attestation
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg run_id "$PAID_RUN_ID" \
            --arg target_sha "$TARGET_SHA" \
            --arg artifact_name "$EXPECTED_ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --slurpfile recomputed independent-revalidation.json \
            '{
              schema_version: "v5-paid-acceptance-attestation-3",
              status: (if $recomputed[0].status == "PASS" then "PASS" else "FAIL" end),
              request_id: $request_id,
              paid_workflow_run_id: $run_id,
              paid_target_sha: $target_sha,
              paid_artifact_id: $artifact_id,
              paid_artifact_name: $artifact_name,
              paid_artifact_digest: $artifact_digest,
              independent_revalidation: $recomputed[0],
              independently_recomputed_from_primitive_evidence: true,
              paid_acceptance_verdict_used_as_source: false,
              production_ref_moved: false,
              public_report_published: false
            }' > paid-acceptance-attestation.json
          test "$(jq -r '.status' paid-acceptance-attestation.json)" = "PASS"

      - name: Upload independent attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-paid-acceptance-attestation-${{ github.run_id }}
          path: |
            independent-revalidation.json
            paid-acceptance-attestation.json
          if-no-files-found: error
          retention-days: 30
