name: Invalid Expert Ticket Rejection

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reject-invalid-ticket:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[execution]') &&
      (startsWith(github.event.comment.body, '/run-expert-team ') ||
       startsWith(github.event.comment.body, '/retry-expert-team '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: expert-invalid-ticket-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout frozen production validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: production
          persist-credentials: false

      - name: Validate ticket without model access
        id: ticket
        continue-on-error: true
        run: |
          python open-model-market/v5_issue_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir invalid-ticket-artifacts

      - name: Render invalid-ticket terminal receipt
        if: steps.ticket.outcome == 'success' && steps.ticket.outputs.accepted != 'true'
        run: |
          python open-model-market/v5_issue_ticket.py render \
            --phase rejected \
            --output-dir invalid-ticket-artifacts \
            --run-url "$RUN_URL" > invalid-ticket-rejection.md

      - name: Give primary admission chain first publication window
        if: steps.ticket.outcome == 'success' && steps.ticket.outputs.accepted != 'true'
        run: sleep 45

      - name: Publish one task-bound trusted zero-call rejection
        if: steps.ticket.outcome == 'success' && steps.ticket.outputs.accepted != 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS_FILE: invalid-ticket-rejection.md
        with:
          script: |
            const fs = require('fs');
            const command = String(context.payload.comment?.body || '').trim();
            const match = command.match(/^\/(?:run|retry)-expert-team\s+([A-Za-z0-9][A-Za-z0-9._:-]{7,127})$/);
            if (!match) {
              throw new Error('unable to derive task identity from expert command');
            }
            const taskId = match[1];
            const raw = fs.readFileSync(process.env.STATUS_FILE, 'utf8');
            if (!raw.trimStart().startsWith('## EXECUTION_REJECTED')) {
              throw new Error('unexpected invalid-ticket receipt heading');
            }
            const body = raw.replace(
              /^## EXECUTION_REJECTED\s*/,
              `## EXECUTION_REJECTED\n\n- Task ID: \`${taskId}\`\n`
            );
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const taskLine = `- Task ID: \`${taskId}\``;
            const alreadyRejected = comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.trimStart().startsWith('## EXECUTION_REJECTED') &&
              comment.body?.includes(taskLine)
            );
            if (!alreadyRejected) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Assert zero-call scope
        if: always()
        run: |
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
