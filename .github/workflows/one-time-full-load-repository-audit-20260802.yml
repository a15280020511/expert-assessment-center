name: One-Time Full Load Repository Audit 2026-08-02

on:
  pull_request:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: one-time-full-load-repository-audit-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  comprehensive-audit:
    name: Full repository, load, chaos, and invariant audit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Bind audit to exact source and production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts audit-logs
          checked="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$expected"
          test -n "$production"
          test "$base" = "$production"
          {
            echo "checked_sha=$checked"
            echo "base_sha=$base"
            echo "production_sha=$production"
          } | tee audit-artifacts/source-binding.txt

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt \
            2>&1 | tee audit-logs/dependency-install.log
          python -m pip check 2>&1 | tee audit-logs/pip-check.log

      - name: Canonical static and compilation gates
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee audit-logs/compileall.log

      - name: Full unit and mandatory P0 regression gates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee audit-logs/full-unit-suite.log
          grep -Eq '^Ran [0-9]+ tests? in ' audit-logs/full-unit-suite.log
          grep -q '^OK$' audit-logs/full-unit-suite.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee audit-logs/p0-regressions.log
          grep -q 'P0 REGRESSION RESULT: run=50, passed=50, failures=0, errors=0, skipped=0' \
            audit-logs/p0-regressions.log

      - name: Repeated chaos and recovery stability matrix
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            tests.test_v5_full_load_stability
            tests.test_v5_extreme_chaos_stability
            tests.test_execution_graph_properties
            tests.test_v5_cross_endpoint_recovery
            tests.test_v5_critical_delivery_reliability
            tests.test_v5_v4_contract_isolation
            tests.test_v5_deterministic_answer_normalization
          )
          for seed in 0 1 7 42 99 31337; do
            echo "=== PYTHONHASHSEED=$seed ===" | tee -a audit-logs/repeated-chaos.log
            PYTHONHASHSEED="$seed" python -m unittest "${modules[@]}" -v \
              2>&1 | tee -a audit-logs/repeated-chaos.log
          done

      - name: Parallel dry-run saturation and determinism audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee audit-logs/parallel-saturation.log
          from __future__ import annotations

          import concurrent.futures
          import json
          import os
          import subprocess
          import sys
          from collections import defaultdict
          from pathlib import Path

          tasks = [
              "比较方案A与方案B，给出简洁、可执行的最终建议。",
              "仅依据题面：方案A成本100、收益130；方案B成本90、收益118。不得引入任何其他数字，完成比较与决策。",
              "比较三个城市公共投资方案，完成财务、法律合规、证据核验、预测推演、红队反证和最终决策。",
              "输出八个二级标题：问题、假设、证据、分析、风险、反例、实施、结论；不得调用外部工具。",
              "禁止降级交付，禁止外部工具，证据不足时必须失败关闭；评估两个候选方案。",
              "明确允许在完整交付不可行时降级，但必须标记缺口；评估三个候选方案。",
              "同时出现允许降级与禁止降级时，以禁止降级为准；分析两个运营方案。",
              "为一个资源受限项目设计多阶段决策，包含独立红队、恢复策略和最终综合，不设固定职业模板。",
              "Compare two infrastructure proposals with finance, compliance, uncertainty, red-team challenge, and a final recommendation.",
              "评估一项公共政策的法律、财政、执行、社会影响和不确定性，给出条件化结论。",
              "对高风险供应链中断方案进行情景推演、边界条件分析、失败模式审计和最终选择。",
              "题面不提供精确数字，不得自行生成阈值或概率；只做定性敏感性分析并给出决策条件。",
          ]
          seeds = [0, 1, 7, 42]
          root = Path("audit-artifacts/saturation")
          root.mkdir(parents=True, exist_ok=True)

          def run_case(case: tuple[int, int, str]) -> dict[str, object]:
              task_index, seed, task = case
              out = root / f"task-{task_index:02d}-seed-{seed}"
              env = dict(os.environ)
              env["PYTHONHASHSEED"] = str(seed)
              command = [
                  sys.executable,
                  "open-model-market/v5_constitutional_pipeline.py",
                  "--task",
                  task,
                  "--catalog-file",
                  "tests/fixtures/models.json",
                  "--endpoint-file",
                  "tests/fixtures/endpoints.json",
                  "--dry-run",
                  "--maximum-total-calls",
                  "16",
                  "--maximum-recovery-calls",
                  "2",
                  "--quality-tier",
                  "value",
                  "--output-dir",
                  str(out),
              ]
              completed = subprocess.run(
                  command,
                  check=False,
                  capture_output=True,
                  text=True,
                  env=env,
                  timeout=120,
              )
              if completed.returncode != 0:
                  return {
                      "task_index": task_index,
                      "seed": seed,
                      "ok": False,
                      "stdout": completed.stdout[-4000:],
                      "stderr": completed.stderr[-4000:],
                  }
              constraints = json.loads((out / "task-constraints.json").read_text())
              market = json.loads((out / "v5-model-endpoint-market.json").read_text())
              optimization = json.loads((out / "v5-optimization.json").read_text())
              graph = json.loads((out / "v5-execution-graph.json").read_text())
              dry = json.loads((out / "v5-dry-run.json").read_text())
              companies = [
                  node["parameter_profile"]["model_company"]
                  for node in graph["nodes"]
              ]
              signature = {
                  "constraints": constraints,
                  "weights": market["preselection_objective_weights"],
                  "fit_weights": market["task_fit_feature_weights"],
                  "solver_status": optimization["solver_status"],
                  "nodes": [
                      {
                          "id": node["id"],
                          "role": node["role"],
                          "depends_on": node.get("depends_on", []),
                          "company": node["parameter_profile"]["model_company"],
                          "model": node["parameter_profile"]["model"],
                      }
                      for node in graph["nodes"]
                  ],
                  "maximum_initial_calls": dry["approved_budget"]["maximum_initial_calls"],
              }
              checks = {
                  "solver": optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"},
                  "company_unique": len(companies) == len(set(companies)),
                  "tools_forbidden": constraints["external_tools_allowed"] is False,
                  "fail_closed": constraints["fail_closed"] is True,
                  "call_cap": len(graph["nodes"])
                  <= dry["approved_budget"]["maximum_initial_calls"],
                  "weight_sum": abs(
                      sum(market["preselection_objective_weights"].values()) - 1.0
                  )
                  < 1e-9,
                  "fit_weight_sum": abs(
                      sum(market["task_fit_feature_weights"].values()) - 1.0
                  )
                  < 1e-9,
                  "no_fixed_weights": market["fixed_preselection_weight_tuple_used"]
                  is False,
                  "no_fixed_fit": market["fixed_task_fit_weight_tuple_used"] is False,
              }
              return {
                  "task_index": task_index,
                  "seed": seed,
                  "ok": all(checks.values()),
                  "checks": checks,
                  "signature": signature,
              }

          cases = [
              (task_index, seed, task)
              for task_index, task in enumerate(tasks)
              for seed in seeds
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(run_case, cases))

          failures = [result for result in results if not result["ok"]]
          signatures: dict[int, list[str]] = defaultdict(list)
          for result in results:
              if result["ok"]:
                  signatures[int(result["task_index"])].append(
                      json.dumps(result["signature"], ensure_ascii=False, sort_keys=True)
                  )
          nondeterministic = {
              task_index: len(set(values))
              for task_index, values in signatures.items()
              if len(set(values)) != 1
          }
          summary = {
              "cases": len(cases),
              "passed": len(cases) - len(failures),
              "failed": len(failures),
              "nondeterministic_tasks": nondeterministic,
              "failures": failures,
          }
          Path("audit-artifacts/saturation-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          if failures or nondeterministic:
              raise SystemExit(1)
          PY

      - name: Granular repository structure and duplication audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee audit-logs/repository-structure.log
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          production_root = Path("open-model-market")
          python_roots = [production_root, Path("tests"), Path("tools")]
          workflow_root = Path(".github/workflows")
          fatal: list[str] = []
          warnings: list[str] = []
          metrics: dict[str, object] = {}

          python_files = sorted(
              path
              for root in python_roots
              for path in root.rglob("*.py")
              if path.is_file()
          )
          production_files = [path for path in python_files if production_root in path.parents]
          test_files = [path for path in python_files if Path("tests") in path.parents]
          metrics["python_file_count"] = len(python_files)
          metrics["production_python_file_count"] = len(production_files)
          metrics["test_python_file_count"] = len(test_files)
          metrics["production_lines"] = sum(
              len(path.read_text(encoding="utf-8").splitlines())
              for path in production_files
          )
          metrics["test_lines"] = sum(
              len(path.read_text(encoding="utf-8").splitlines())
              for path in test_files
          )

          file_hashes: dict[str, list[str]] = defaultdict(list)
          function_hashes: dict[str, list[dict[str, object]]] = defaultdict(list)
          forbidden_modules = {
              "v5_executor",
              "v5_empty_output_recovery",
              "v5_total_call_cap",
              "v5_production_hardening",
              "v5_r8_executor",
              "v5_r8_gate_wiring",
              "v5_r8_policy",
              "v5_r8_provider_policy",
              "v5_r8_retry_policy",
              "v5_resilient_executor",
              "v5_stage_d_provider_compat",
          }
          forbidden_paths = {
              production_root / f"{name}.py" for name in forbidden_modules
          }
          for path in sorted(forbidden_paths):
              if path.exists():
                  fatal.append(f"legacy production file still exists: {path}")

          for path in python_files:
              text = path.read_text(encoding="utf-8")
              try:
                  tree = ast.parse(text, filename=str(path))
              except SyntaxError as exc:
                  fatal.append(f"syntax error: {path}:{exc.lineno}:{exc.msg}")
                  continue
              if path in production_files and len(text) > 400:
                  digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
                  file_hashes[digest].append(str(path))
              top_level: dict[str, int] = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if node.name in top_level:
                          fatal.append(
                              f"duplicate top-level definition: {path}:{node.lineno}:{node.name}; "
                              f"first at {top_level[node.name]}"
                          )
                      top_level[node.name] = node.lineno
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == "install" and node.col_offset == 0:
                          fatal.append(f"top-level monkey-patch install definition: {path}:{node.lineno}")
                      node_count = sum(1 for _ in ast.walk(node))
                      if path in production_files and node_count >= 80:
                          normalized = ast.dump(
                              node,
                              annotate_fields=True,
                              include_attributes=False,
                          )
                          digest = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
                          function_hashes[digest].append(
                              {
                                  "path": str(path),
                                  "line": node.lineno,
                                  "name": node.name,
                                  "ast_nodes": node_count,
                              }
                          )
                      for default in [*node.args.defaults, *node.args.kw_defaults]:
                          if isinstance(default, (ast.List, ast.Dict, ast.Set)):
                              fatal.append(
                                  f"mutable default argument: {path}:{node.lineno}:{node.name}"
                              )
                  if (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "install"
                  ):
                      fatal.append(f"monkey-patch install call: {path}:{node.lineno}")
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                      if node.func.id in {"eval", "exec"}:
                          fatal.append(f"dynamic code execution: {path}:{node.lineno}:{node.func.id}")
                  if isinstance(node, ast.ExceptHandler) and node.type is None:
                      warnings.append(f"bare except: {path}:{node.lineno}")
                  if isinstance(node, (ast.Import, ast.ImportFrom)) and path in production_files:
                      names: list[str] = []
                      if isinstance(node, ast.Import):
                          names = [alias.name.rsplit(".", 1)[-1] for alias in node.names]
                      elif node.module:
                          names = [node.module.rsplit(".", 1)[-1]]
                      for name in names:
                          if name in forbidden_modules:
                              fatal.append(f"legacy production import: {path}:{node.lineno}:{name}")
              if path in production_files:
                  for marker in ("TODO", "FIXME", "HACK"):
                      if marker in text:
                          warnings.append(f"maintenance marker {marker}: {path}")

          duplicate_files = [paths for paths in file_hashes.values() if len(paths) > 1]
          for paths in duplicate_files:
              fatal.append("exact duplicate production files: " + ", ".join(paths))
          duplicate_large_functions = [
              locations for locations in function_hashes.values() if len(locations) > 1
          ]
          for locations in duplicate_large_functions:
              warnings.append(
                  "large duplicate function bodies: "
                  + ", ".join(
                      f"{item['path']}:{item['line']}:{item['name']}"
                      for item in locations
                  )
              )

          action_pattern = re.compile(r"^\s*uses:\s*([^#\s]+)")
          pinned_pattern = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          workflow_files = sorted(workflow_root.glob("*.yml")) + sorted(
              workflow_root.glob("*.yaml")
          )
          metrics["workflow_count"] = len(workflow_files)
          for path in workflow_files:
              text = path.read_text(encoding="utf-8")
              if "pull_request_target:" in text:
                  fatal.append(f"unsafe pull_request_target trigger: {path}")
              if re.search(r"persist-credentials:\s*true", text):
                  fatal.append(f"checkout credentials persisted: {path}")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  match = action_pattern.match(line)
                  if not match:
                      continue
                  action = match.group(1)
                  if action.startswith("./") or action.startswith("docker://"):
                      continue
                  if not pinned_pattern.match(action):
                      fatal.append(f"unpinned external action: {path}:{line_number}:{action}")

          metrics["exact_duplicate_production_file_groups"] = len(duplicate_files)
          metrics["large_duplicate_function_groups"] = len(duplicate_large_functions)
          metrics["fatal_count"] = len(fatal)
          metrics["warning_count"] = len(warnings)
          report = {
              "status": "PASS" if not fatal else "FAIL",
              "metrics": metrics,
              "fatal": sorted(set(fatal)),
              "warnings": sorted(set(warnings)),
              "large_duplicate_functions": duplicate_large_functions,
          }
          Path("audit-artifacts/repository-structure-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          markdown = [
              "# Repository Structure Audit",
              "",
              f"Status: **{report['status']}**",
              "",
              "## Metrics",
              "",
          ]
          markdown.extend(f"- {key}: {value}" for key, value in metrics.items())
          markdown.extend(["", "## Fatal findings", ""])
          markdown.extend(f"- {item}" for item in report["fatal"] or ["None"])
          markdown.extend(["", "## Warnings", ""])
          markdown.extend(f"- {item}" for item in report["warnings"] or ["None"])
          Path("audit-artifacts/repository-structure-audit.md").write_text(
              "\n".join(markdown) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          if fatal:
              raise SystemExit(1)
          PY

      - name: Workflow and release contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_workflow_contract \
            tests.test_v5_release_command_contract \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed \
            -v 2>&1 | tee audit-logs/workflow-release-contracts.log

      - name: Render final zero-cost audit receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("audit-artifacts")
          structure_path = root / "repository-structure-audit.json"
          saturation_path = root / "saturation-summary.json"
          structure = json.loads(structure_path.read_text()) if structure_path.exists() else None
          saturation = json.loads(saturation_path.read_text()) if saturation_path.exists() else None
          receipt = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "paid_model_calls": 0,
              "model_cost_usd": 0.0,
              "repository_structure": structure,
              "parallel_saturation": saturation,
          }
          root.mkdir(exist_ok=True)
          (root / "full-load-audit-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-load-repository-audit-${{ github.run_id }}
          path: |
            audit-artifacts/
            audit-logs/
          if-no-files-found: error
          retention-days: 14
