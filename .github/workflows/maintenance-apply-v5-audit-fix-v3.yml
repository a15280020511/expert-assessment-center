name: Maintenance Apply V5 Audit Fix V3

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-apply-v5-audit-fix-v3
  cancel-in-progress: false

jobs:
  validate-and-push:
    if: >-
      github.actor == 'a15280020511' &&
      github.event.issue.title == '[maintenance-apply-v5-audit-fix] validated patch' &&
      github.event.comment.body == '/apply-v5-audit-fix-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: fix/v5-production-stability-audit-r1
      EXPECTED_BASE: 95f6d295994e5dd7b2ef0cc54f22e43a1c620aa4
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Publish start receipt
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PATCH_VALIDATION_V3_STARTED\n\n- Run: \`${context.runId}\`\n- Branch: \`${process.env.TARGET_BRANCH}\``
            })

      - name: Checkout maintenance tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: maintenance-tool
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: work
          persist-credentials: true
          fetch-depth: 1

      - name: Reconstruct and verify immutable patches
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate > /tmp/comments.json
          python maintenance-tool/tools/maintenance_apply_verified_patch.py \
            --event "$GITHUB_EVENT_PATH" \
            --comments /tmp/comments.json \
            --output /tmp/v5-audit-fix.patch \
            --expected-branch "$TARGET_BRANCH" \
            --expected-base "$EXPECTED_BASE"
          test "$(git -C work rev-parse HEAD)" = "$EXPECTED_BASE"
          git -C work apply --check /tmp/v5-audit-fix.patch
          git -C work apply /tmp/v5-audit-fix.patch
          git -C work apply --check ../maintenance-tool/tools/v5_audit_followup.patch
          git -C work reset --hard "$EXPECTED_BASE"

      - name: Apply patches and compile
        shell: bash
        run: |
          set -euo pipefail
          git -C work apply /tmp/v5-audit-fix.patch
          git -C work apply ../maintenance-tool/tools/v5_audit_followup.patch
          rm -f work/.github/workflows/maintenance-source-export.yml
          cd work
          python -m py_compile open-model-market/*.py tests/*.py tools/*.py

      - name: Install exact dependencies
        working-directory: work
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
          python -c "from ortools.sat.python import cp_model; print(cp_model.CpModel())"

      - name: Run Ruff safety checks
        working-directory: work
        run: python -m ruff check --select E9,F63,F7,F82 open-model-market tests tools

      - name: Run complete unit suite
        working-directory: work
        run: python -m unittest discover -s tests -v

      - name: Run mandatory P0 regressions
        working-directory: work
        shell: bash
        run: |
          set -o pipefail
          python tools/run_v5_p0_regressions.py 2>&1 | tee /tmp/p0-regressions.log
          grep -q "REGISTERED TOTAL: 24" /tmp/p0-regressions.log
          grep -q "P0 REGRESSION RESULT: run=24, passed=24, failures=0, errors=0, skipped=0" /tmp/p0-regressions.log

      - name: Run deterministic end-to-end dry-run
        working-directory: work
        run: |
          python open-model-market/v5_pipeline.py \
            --task "比较三个城市公共投资方案，完成财务建模、政策与法律合规、证据核验、预测推演、独立红队反证和最终决策。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 16 \
            --maximum-recovery-calls 2 \
            --quality-tier quality \
            --output-dir validation-artifacts
          test -s validation-artifacts/v5-execution-graph.json
          test -s validation-artifacts/v5-planning-benchmark.json
          test -s validation-artifacts/artifact-manifest.json

      - name: Run full repository audit
        working-directory: work
        run: python tools/repository_audit.py --root . --output-dir audit-artifacts --fail-on high

      - name: Commit validated fix branch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(v5): harden production evidence recovery and output stability"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Publish validation receipt
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## PATCH_VALIDATED_AND_PUSHED\n\n- Run: \`${context.runId}\`\n- Branch: \`${process.env.TARGET_BRANCH}\`\n- Unit suite: \`PASS\`\n- P0 regressions: \`24/24 PASS\`\n- Dry-run: \`PASS\`\n- Repository audit: \`PASS\``
            })
