name: One-Time Apply Claude Cleanup 2026-08-03

on:
  push:
    branches:
      - fix/v5-claude-unified-red-team-cleanup-20260803
    paths:
      - .github/workflows/one-time-apply-claude-remediation-20260803.yml

permissions:
  contents: write

concurrency:
  group: one-time-claude-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-remediation:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify ancestry and reconstruct signed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8b1ceecd9b1f3b880f7ba540b73e9607316039ab HEAD
          mapfile -t parts < <(find .remediation -maxdepth 1 -type f -name 'claude-cleanup-20260803.*.b64' | sort)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" > /tmp/remediation.xz.b64
          printf '%s  %s\n' \
            d197d44a1400a2bc21b33905797c2394ea217163c52a8666b98774f2e34c918d \
            /tmp/remediation.xz.b64 | sha256sum -c -
          base64 -d /tmp/remediation.xz.b64 | xz -dc > /tmp/remediation.patch
          printf '%s  %s\n' \
            34d5d8a2dd1d90de6c4cb8d7b332c713587ef0a18b4d5aebdb7fae0d856c7378 \
            /tmp/remediation.patch | sha256sum -c -

      - name: Apply exact remediation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/remediation.patch
          git apply /tmp/remediation.patch
          rm -rf .remediation
          rm -f .github/workflows/one-time-apply-claude-remediation-20260803.yml
          git diff --check

      - name: Compile and execute mandatory P0 qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests tools
          python tools/run_v5_p0_regressions.py | tee /tmp/p0.log
          grep -q 'P0 REGRESSION RESULT: run=62, passed=62, failures=0, errors=0, skipped=0' /tmp/p0.log

      - name: Commit clean remediation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix(runtime): unify Claude red-team and remove legacy planning residue'
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
