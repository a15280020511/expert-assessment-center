name: Apply Explicit Contract Follow-up 2026-08-02

on:
  push:
    branches:
      - fix/v5-explicit-markdown-contract-20260802
    paths:
      - tools/apply_explicit_contract_followup_20260802.py
      - .github/workflows/apply-explicit-contract-followup-20260802.yml

permissions:
  contents: write

concurrency:
  group: apply-explicit-contract-followup-20260802
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-explicit-markdown-contract-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply and verify follow-up
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_explicit_contract_followup_20260802.py
          rm tools/apply_explicit_contract_followup_20260802.py
          rm .github/workflows/apply-explicit-contract-followup-20260802.yml
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m ruff check \
            open-model-market/v5_task_delivery_contract.py \
            open-model-market/v5_independent_artifact_revalidation.py \
            tests/test_v5_explicit_markdown_contract_revalidation.py
          python -m unittest \
            tests.test_v5_explicit_markdown_contract_revalidation \
            tests.test_v5_independent_artifact_revalidation \
            tests.test_v5_v4_contract_isolation \
            tests.test_v5_long_markdown_contract_integrity \
            tests.test_v5_explicit_contract_pipeline_integrity -v

      - name: Commit source-only follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(contract): trim trailing delivery requirements"
          git push origin HEAD:fix/v5-explicit-markdown-contract-20260802
