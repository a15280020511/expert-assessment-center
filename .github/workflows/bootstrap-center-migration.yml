name: Bootstrap Expert Assessment Center Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-center-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-center-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository_owner == 'a15280020511'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CENTER: expert-assessment-center
      SOURCE_REPOSITORY: a15280020511/test
      SOURCE_SHA: abac3d776340c8c162b8fc0c670167fde94f3baa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fetch immutable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source-repository
          git clone --quiet "https://github.com/$SOURCE_REPOSITORY.git" /tmp/source-repository
          git -C /tmp/source-repository checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C /tmp/source-repository rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Split center
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/source-repository/tools/split_repository.py \
            --center "$CENTER" \
            --source-dir /tmp/source-repository \
            --target-dir "$GITHUB_WORKSPACE" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_SHA" \
            --target-repository "$GITHUB_REPOSITORY"
          python -m compileall -q .

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate expert assessment center from test@$SOURCE_SHA"
          git push origin HEAD:main
