name: Apply V5 Fact Provenance Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v5-fact-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-fact-provenance-structured-revalidation-20260802' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply exact patch
        run: |
          set -euo pipefail
          git apply --check tools/v5_fact_provenance_structured_revalidation.patch
          git apply tools/v5_fact_provenance_structured_revalidation.patch

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run targeted evidence and failure-chain regression
        run: |
          set -euo pipefail
          python -m ruff check \
            open-model-market/v5_task_constraints.py \
            open-model-market/v5_deterministic_answer_normalization.py \
            open-model-market/v5_independent_artifact_revalidation.py \
            tests/test_v5_fact_provenance_semantic_normalization.py
          python -m compileall -q open-model-market tests
          python -m unittest -v tests.test_v5_fact_provenance_semantic_normalization
          python -m unittest -v \
            tests.test_v5_task_constraints \
            tests.test_v5_deterministic_answer_normalization \
            tests.test_v5_independent_artifact_revalidation

      - name: Remove one-time patch entry
        run: |
          rm -f tools/v5_fact_provenance_structured_revalidation.patch
          rm -f .github/workflows/v5-apply-fact-provenance-patch.yml

      - name: Commit clean production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(evidence): preserve semantic closed-world provenance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
