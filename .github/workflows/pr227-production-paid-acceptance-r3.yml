name: PR227 Production Paid Acceptance R3

on:
  push:
    branches:
      - acceptance/pr227-final-paid-20260803-r3
    paths:
      - .github/v5-paid-production-request-r3.json

permissions:
  contents: read
  actions: read

concurrency:
  group: pr227-production-paid-acceptance-r3
  cancel-in-progress: false

jobs:
  production-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "1"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-pr227-production-paid-r3
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TARGET_SHA: 0a44879e847251a202c73099b12201ec4cabd616
      MAXIMUM_TOTAL_CALLS: "4"
      MAXIMUM_RECOVERY_CALLS: "0"
      MAXIMUM_COST_USD: "0.25"
    steps:
      - name: Checkout immutable authorization request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 3
          persist-credentials: false
          path: request-source

      - name: Validate exact one-time authorization
        id: request
        working-directory: request-source
        shell: bash
        run: |
          set -euo pipefail
          request=.github/v5-paid-production-request-r3.json
          jq -e '
            type == "object" and
            (keys | sort) == [
              "authorization",
              "cost_cap_usd",
              "maximum_recovery_calls",
              "maximum_total_calls",
              "purpose",
              "schema_version",
              "target_sha",
              "task"
            ] and
            .schema_version == "pr227-production-paid-acceptance-3" and
            .authorization == "RUN-EXACTLY-ONCE" and
            .purpose == "final-pr227-complete-production-qualification" and
            .target_sha == "0a44879e847251a202c73099b12201ec4cabd616" and
            .maximum_total_calls == 4 and
            .maximum_recovery_calls == 0 and
            .cost_cap_usd == 0.25 and
            (.task | type == "object") and
            (.task.question | type == "string" and length > 0) and
            (.task.requirements | type == "array" and length > 0) and
            .task.language == "zh-CN"
          ' "$request" >/dev/null
          test "$(git diff --name-only HEAD^ HEAD)" = "$request"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD^
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Verify immutable clean source
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$TARGET_SHA" > ../checked-out-qualified-sha.txt

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime-source/requirements-runtime.txt
            runtime-source/requirements-dev.txt

      - name: Install and validate exact source
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -q

      - name: Verify inference secret without disclosure
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20

      - name: Materialize immutable admitted ticket
        working-directory: runtime-source
        run: |
          set -euo pipefail
          rm -rf ticket-artifacts
          mkdir -p ticket-artifacts
          cp ../request-source/.github/v5-paid-production-request-r3.json paid-request.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          from v5_ticket_identity import task_fingerprint

          request = json.loads(Path("paid-request.json").read_text(encoding="utf-8"))
          task_id = "pr227-production-paid-r3-20260803"
          task = request["task"]
          ticket = {
              "task_id": task_id,
              "route": "expert-team",
              "task": task,
              "approved_budget": {
                  "calls": request["maximum_total_calls"],
                  "maximum_recovery_calls": request["maximum_recovery_calls"],
                  "cost_policy": "unbounded_with_anomaly_guard",
                  "cost_anomaly_usd": request["cost_cap_usd"],
              },
              "private_output": False,
          }
          fingerprint = task_fingerprint(ticket)
          status = {
              "accepted": True,
              "task_id": task_id,
              "task_fingerprint": fingerprint,
              "calls": request["maximum_total_calls"],
              "maximum_recovery_calls": request["maximum_recovery_calls"],
              "maximum_replacements": request["maximum_recovery_calls"],
              "maximum_initial_calls": (
                  request["maximum_total_calls"]
                  - 3
                  - request["maximum_recovery_calls"]
              ),
              "max_cost_usd": request["cost_cap_usd"],
              "cost_anomaly_usd": request["cost_cap_usd"],
              "cost_policy": "unbounded_with_anomaly_guard",
              "private_output": False,
              "is_retry": False,
              "retry_id": "",
              "trigger_mode": "run",
              "execution_id": task_id,
              "analysis_owner": "github-v5-gpt-claude-expert-graph",
              "authoritative_trigger": "issue_comment.created",
              "runtime_version": "v5-native-runtime-1",
              "fallback_policy": "disabled-fail-closed",
              "legacy_runtime_present": False,
              "cross_task_history_used": False,
              "call_policy": (
                  "approved-total-includes-gpt-claude-governance-experts-and-recovery"
              ),
          }
          sections = [task["question"].strip()]
          requirements = [
              str(value).strip()
              for value in task.get("requirements", [])
              if str(value).strip()
          ]
          if requirements:
              sections.append(
                  "执行要求：\n" + "\n".join(f"- {value}" for value in requirements)
              )
          sections.append(f"输出语言：{task.get('language', 'zh-CN')}")
          root = Path("ticket-artifacts")
          root.joinpath("ticket.json").write_text(
              json.dumps(ticket, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          root.joinpath("ticket-status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          root.joinpath("task.txt").write_text(
              "\n\n".join(sections) + "\n",
              encoding="utf-8",
          )
          PY
          python open-model-market/v5_ticket_gate.py \
            --output-dir ticket-artifacts \
            --expected-calls "$MAXIMUM_TOTAL_CALLS" \
            --expected-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --expected-cost-anomaly-usd "$MAXIMUM_COST_USD"

      - name: Execute exact V5 production ticket
        id: execute
        continue-on-error: true
        working-directory: runtime-source
        run: |
          set -euo pipefail
          task="$(cat ticket-artifacts/task.txt)"
          python open-model-market/v5_production_ticket.py \
            --task "$task" \
            --output-dir ticket-artifacts \
            --maximum-total-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --cost-anomaly-usd "$MAXIMUM_COST_USD" \
            --require-live-catalog

      - name: Prepare strict report publication evidence
        id: prepare_report
        continue-on-error: true
        working-directory: runtime-source
        run: |
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

      - name: Audit complete native production evidence
        id: audit
        continue-on-error: true
        working-directory: runtime-source
        run: |
          python open-model-market/v5_execution_auditor_integrity.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.prepare_report.outcome }}"

      - name: Freeze primary Artifact manifest
        id: manifest
        continue-on-error: true
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload primary production Artifact
        id: primary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-production-primary-r3-${{ github.run_id }}
          path: runtime-source/ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Independently revalidate uploaded primary Artifact
        id: independent
        if: always()
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.primary.outputs.artifact-digest }}
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test -n "$PRIMARY_ARTIFACT_ID"
          test -n "$PRIMARY_ARTIFACT_DIGEST"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIMARY_ARTIFACT_ID}/zip" \
            > uploaded-primary-artifact.zip
          rm -rf independently-downloaded-primary
          mkdir independently-downloaded-primary
          unzip -q uploaded-primary-artifact.zip -d independently-downloaded-primary
          python open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir independently-downloaded-primary \
            --expected-sha "$TARGET_SHA" \
            --expected-run-id "${{ github.run_id }}" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-cost-usd "$MAXIMUM_COST_USD" \
            --archive uploaded-primary-artifact.zip \
            --expected-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --output independent-revalidation.json
          status="$(jq -r '.status // "FAIL"' independent-revalidation.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "PASS"

      - name: Render authoritative final status
        id: final
        if: always()
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.primary.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.primary.outputs.artifact-digest }}
        working-directory: runtime-source
        run: |
          effective_audit_outcome="${{ steps.audit.outcome }}"
          if [[ "${{ steps.independent.outcome }}" != "success" || \
                "${{ steps.independent.outputs.status }}" != "PASS" ]]; then
            effective_audit_outcome="independent-artifact-revalidation-failed"
          fi
          python open-model-market/v5_final_status.py \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" \
            --ticket-upload-outcome "${{ steps.primary.outcome }}" \
            --audit-outcome "$effective_audit_outcome" \
            --manifest-outcome "${{ steps.manifest.outcome }}" \
            --artifact-id "$PRIMARY_ARTIFACT_ID" \
            --artifact-url "$PRIMARY_ARTIFACT_URL" \
            --artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            | tee final-status.md

      - name: Generate final bound Attestation
        id: attest
        if: always()
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.primary.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.primary.outputs.artifact-digest }}
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python open-model-market/v5_final_attestation.py \
            --output-dir ticket-artifacts \
            --primary-artifact-id "$PRIMARY_ARTIFACT_ID" \
            --primary-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --primary-artifact-url "$PRIMARY_ARTIFACT_URL" \
            --audit-status "${{ steps.final.outputs.status }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "$TARGET_SHA" \
            --final-status-file final-status.md \
            --output final-attestation.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          independent_path = Path("independent-revalidation.json")
          if not independent_path.is_file():
              raise SystemExit("independent artifact revalidation is missing")
          independent = json.loads(independent_path.read_text(encoding="utf-8"))
          if independent.get("status") != "PASS":
              raise SystemExit("independent artifact revalidation did not pass")
          attestation_path = Path("final-attestation.json")
          attestation = json.loads(attestation_path.read_text(encoding="utf-8"))
          attestation["independent_artifact_revalidation"] = {
              **independent,
              "evidence_sha256": hashlib.sha256(independent_path.read_bytes()).hexdigest(),
          }
          attestation["evidence_chain"] = (
              "frozen-business-evidence -> primary-artifact -> "
              "independent-artifact-revalidation -> final-status -> "
              "final-attestation-artifact"
          )
          attestation_path.write_text(
              json.dumps(attestation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          test "$(jq -r '.status' final-attestation.json)" = "PASS"
          test "$(jq -r '.independent_artifact_revalidation.status' final-attestation.json)" = "PASS"
          test "$(jq -r '.event_context_commit_matched_checkout' final-attestation.json)" = "true"

      - name: Upload final status and Attestation Artifact
        id: proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-production-attestation-r3-${{ github.run_id }}
          path: |
            runtime-source/final-attestation.json
            runtime-source/final-status.md
            runtime-source/ticket-artifacts/final-status.json
            runtime-source/independent-revalidation.json
            checked-out-qualified-sha.txt
          if-no-files-found: error
          retention-days: 30

      - name: Verify final production qualification
        if: always()
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.prepare_report.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.status }}" = "PASS"
          test "${{ steps.manifest.outcome }}" = "success"
          test "${{ steps.primary.outcome }}" = "success"
          test "${{ steps.independent.outcome }}" = "success"
          test "${{ steps.independent.outputs.status }}" = "PASS"
          test "${{ steps.final.outcome }}" = "success"
          test "${{ steps.final.outputs.status }}" = "PASS"
          test "${{ steps.attest.outcome }}" = "success"
          test "${{ steps.proof.outcome }}" = "success"
          test "$(jq -r '.status' final-attestation.json)" = "PASS"
          test "$(jq -r '.independent_artifact_revalidation.status' final-attestation.json)" = "PASS"
