name: Apply No-Tools Audit Patch

on:
  push:
    branches:
      - codex/no-tools-network-granular-audit-20260804
    paths:
      - .github/audit_no_tools_patch.py
      - .github/audit_no_tools_patch_extra.py
      - .github/workflows/apply-no-tools-audit-patch.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - .github/audit_no_tools_patch.py
      - .github/audit_no_tools_patch_extra.py
      - .github/workflows/apply-no-tools-audit-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-no-tools-network-audit
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/no-tools-network-granular-audit-20260804
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Apply audited patch
        run: |
          set -euo pipefail
          python .github/audit_no_tools_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_v5_no_tools_network_policy.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'import json\n'
          if 'import re\n' not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError('test import anchor mismatch')
              text = text.replace(anchor, anchor + 'import re\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          python .github/audit_no_tools_patch_extra.py
      - name: Validate patch locally
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests tools
          python -m unittest tests.test_v5_no_tools_network_policy -v
      - name: Commit audited patch
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "audit: enforce no-tools and network isolation end to end"
          git push origin HEAD:codex/no-tools-network-granular-audit-20260804
