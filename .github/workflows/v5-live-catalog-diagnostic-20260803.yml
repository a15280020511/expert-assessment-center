name: V5 Live Catalog Diagnostic 2026-08-03

on:
  pull_request:
    paths:
      - ".github/workflows/v5-live-catalog-diagnostic-20260803.yml"

permissions:
  contents: read

jobs:
  catalog-diagnostic:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Collect model and endpoint metadata without chat calls
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          mkdir -p catalog-diagnostic
          python - <<'PY'
          import argparse
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          import model_market
          from openrouter_api import request_json
          from v5_catalog_view import (
              GOVERNANCE_COMPANIES,
              _endpoint_rows,
              _provider_slug,
              endpoint_url,
              stable_model_id,
          )
          from v5_model_company import canonical_model_company

          args = argparse.Namespace(
              task="实时目录零调用诊断",
              output_dir="catalog-diagnostic",
              config="open-model-market/config.json",
              catalog_file=None,
              ranking_limit=150,
              max_completion_tokens=512,
              reasoning_effort="low",
              maximum_total_calls=4,
              maximum_recovery_calls=0,
              require_live_catalog=True,
              dry_run=False,
          )
          run = model_market.build_run_config(args)
          models, source = model_market.fetch_catalog(run)
          context_floor = 16384
          limits = (12, 24, 50, 100, 150)
          totals = Counter()
          rows = []
          eligible_by_limit = {str(limit): [] for limit in limits}
          endpoint_probe_ids = []

          for model in models.values():
              model_id = str(model.id or "")
              rank = int((model.ranks or {}).get("intelligence-high-to-low", 999999))
              company = canonical_model_company(model_id)
              reasons = []
              if not stable_model_id(model_id):
                  reasons.append("unstable-id")
              if company in GOVERNANCE_COMPANIES:
                  reasons.append("governance-company")
              if int(model.context_length or 0) < context_floor:
                  reasons.append("context-too-small")
              if int(model.max_completion_tokens or 0) <= 0:
                  reasons.append("missing-max-completion")
              if model.input_modalities and "text" not in model.input_modalities:
                  reasons.append("no-text-input")
              if model.output_modalities and "text" not in model.output_modalities:
                  reasons.append("no-text-output")
              if model.prompt_price_per_million is None:
                  reasons.append("missing-prompt-price")
              if model.completion_price_per_million is None:
                  reasons.append("missing-completion-price")
              for reason in reasons:
                  totals[reason] += 1
              if not reasons:
                  totals["constitutionally-eligible-before-rank-limit"] += 1
                  for limit in limits:
                      if rank <= limit:
                          eligible_by_limit[str(limit)].append(model_id)
              non_completion_reasons = [
                  reason for reason in reasons if reason != "missing-max-completion"
              ]
              if rank <= 24 and not non_completion_reasons:
                  endpoint_probe_ids.append(model_id)
              if rank <= 40:
                  rows.append(
                      {
                          "rank": rank,
                          "model": model_id,
                          "company": company,
                          "context_length": int(model.context_length or 0),
                          "max_completion_tokens": int(model.max_completion_tokens or 0),
                          "supported_parameters": sorted(model.supported_parameters or []),
                          "input_modalities": list(model.input_modalities or []),
                          "output_modalities": list(model.output_modalities or []),
                          "has_prompt_price": model.prompt_price_per_million is not None,
                          "has_completion_price": model.completion_price_per_million is not None,
                          "rejection_reasons": reasons,
                      }
                  )

          def sanitized_endpoint_probe(model_id, url):
              try:
                  payload = request_json(
                      url,
                      run.api_key,
                      run.catalog_timeout_seconds,
                      0,
                  )
              except Exception as exc:
                  return {
                      "model": model_id,
                      "url_kind": url.split("/models/", 1)[-1],
                      "status": "ERROR",
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                      "endpoint_count": 0,
                      "endpoints": [],
                  }
              endpoint_rows = []
              for endpoint in _endpoint_rows(payload):
                  pricing = endpoint.get("pricing") if isinstance(endpoint.get("pricing"), dict) else {}
                  supported = sorted(str(value) for value in (endpoint.get("supported_parameters") or []))
                  endpoint_rows.append(
                      {
                          "provider": _provider_slug(endpoint),
                          "context_length": int(endpoint.get("context_length") or 0),
                          "max_completion_tokens": int(endpoint.get("max_completion_tokens") or 0),
                          "supported_parameters": supported,
                          "supports_temperature": "temperature" in supported,
                          "supports_max_tokens": "max_tokens" in supported or "max_completion_tokens" in supported,
                          "supports_reasoning": "reasoning" in supported,
                          "supports_structured_outputs": "structured_outputs" in supported or "response_format" in supported,
                          "has_prompt_price": pricing.get("prompt") not in (None, ""),
                          "has_completion_price": pricing.get("completion") not in (None, ""),
                      }
                  )
              return {
                  "model": model_id,
                  "url_kind": url.split("/models/", 1)[-1],
                  "status": "PASS",
                  "endpoint_count": len(endpoint_rows),
                  "endpoints": endpoint_rows,
              }

          endpoint_probes = []
          for model_id in endpoint_probe_ids:
              endpoint_probes.append(
                  sanitized_endpoint_probe(model_id, endpoint_url(model_id))
              )

          governance_catalog_rows = []
          for model in models.values():
              company = canonical_model_company(model.id)
              if company not in GOVERNANCE_COMPANIES:
                  continue
              rank = int((model.ranks or {}).get("intelligence-high-to-low", 999999))
              if rank > 80:
                  continue
              governance_catalog_rows.append(
                  {
                      "rank": rank,
                      "model": model.id,
                      "company": company,
                      "context_length": int(model.context_length or 0),
                      "max_completion_tokens": int(model.max_completion_tokens or 0),
                      "supported_parameters": sorted(model.supported_parameters or []),
                  }
              )
          governance_catalog_rows.sort(key=lambda row: (row["rank"], row["model"]))

          governance_urls = {
              "~openai/gpt-latest": "https://openrouter.ai/api/v1/models/~openai/gpt-latest/endpoints",
              "openai/gpt-latest": "https://openrouter.ai/api/v1/models/openai/gpt-latest/endpoints",
              "~anthropic/claude-opus-latest": "https://openrouter.ai/api/v1/models/~anthropic/claude-opus-latest/endpoints",
              "anthropic/claude-opus-latest": "https://openrouter.ai/api/v1/models/anthropic/claude-opus-latest/endpoints",
          }
          governance_alias_probes = [
              sanitized_endpoint_probe(model_id, url)
              for model_id, url in governance_urls.items()
          ]

          report = {
              "schema_version": "v5-live-catalog-diagnostic-3",
              "status": "PASS",
              "chat_model_calls": 0,
              "catalog_source": source,
              "catalog_models": len(models),
              "context_floor": context_floor,
              "run_maximum_replacements_when_requested_zero": run.maximum_replacements,
              "rejection_counts": dict(sorted(totals.items())),
              "eligible_counts_by_official_rank_ceiling": {
                  limit: len(values) for limit, values in eligible_by_limit.items()
              },
              "eligible_models_by_official_rank_ceiling": eligible_by_limit,
              "top_40_filter_trace": sorted(rows, key=lambda row: (row["rank"], row["model"])),
              "exact_endpoint_probes_top_24": endpoint_probes,
              "governance_catalog_rows_top_80": governance_catalog_rows,
              "governance_alias_endpoint_probes": governance_alias_probes,
              "current_governance_required_parameter_families": [
                  "temperature",
                  "max_tokens",
                  "reasoning",
                  "structured_outputs_or_response_format",
              ],
          }
          Path("catalog-diagnostic/report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          assert report["chat_model_calls"] == 0
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-live-catalog-diagnostic-${{ github.run_id }}
          path: catalog-diagnostic/
          if-no-files-found: error
          retention-days: 7
