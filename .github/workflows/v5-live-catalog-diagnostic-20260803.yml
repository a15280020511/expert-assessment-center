name: V5 Live Catalog Diagnostic 2026-08-03

on:
  pull_request:
    paths:
      - ".github/workflows/v5-live-catalog-diagnostic-20260803.yml"

permissions:
  contents: read

jobs:
  catalog-diagnostic:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Collect sanitized live catalog eligibility evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          mkdir -p catalog-diagnostic
          python - <<'PY'
          import argparse
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          import model_market
          from v5_catalog_view import GOVERNANCE_COMPANIES, stable_model_id
          from v5_model_company import canonical_model_company

          args = argparse.Namespace(
              task="实时目录零调用诊断",
              output_dir="catalog-diagnostic",
              config="open-model-market/config.json",
              catalog_file=None,
              ranking_limit=150,
              max_completion_tokens=512,
              reasoning_effort="low",
              maximum_total_calls=4,
              maximum_recovery_calls=0,
              require_live_catalog=True,
              dry_run=False,
          )
          run = model_market.build_run_config(args)
          models, source = model_market.fetch_catalog(run)
          context_floor = 16384
          limits = (12, 24, 50, 100, 150)
          totals = Counter()
          rows = []
          eligible_by_limit = {str(limit): [] for limit in limits}

          for model in models.values():
              model_id = str(model.id or "")
              rank = int((model.ranks or {}).get("intelligence-high-to-low", 999999))
              company = canonical_model_company(model_id)
              reasons = []
              if not stable_model_id(model_id):
                  reasons.append("unstable-id")
              if company in GOVERNANCE_COMPANIES:
                  reasons.append("governance-company")
              if int(model.context_length or 0) < context_floor:
                  reasons.append("context-too-small")
              if int(model.max_completion_tokens or 0) <= 0:
                  reasons.append("missing-max-completion")
              if model.input_modalities and "text" not in model.input_modalities:
                  reasons.append("no-text-input")
              if model.output_modalities and "text" not in model.output_modalities:
                  reasons.append("no-text-output")
              if model.prompt_price_per_million is None:
                  reasons.append("missing-prompt-price")
              if model.completion_price_per_million is None:
                  reasons.append("missing-completion-price")
              for reason in reasons:
                  totals[reason] += 1
              if not reasons:
                  totals["constitutionally-eligible-before-rank-limit"] += 1
                  for limit in limits:
                      if rank <= limit:
                          eligible_by_limit[str(limit)].append(model_id)
              if rank <= 40:
                  rows.append(
                      {
                          "rank": rank,
                          "model": model_id,
                          "company": company,
                          "context_length": int(model.context_length or 0),
                          "max_completion_tokens": int(model.max_completion_tokens or 0),
                          "input_modalities": list(model.input_modalities or []),
                          "output_modalities": list(model.output_modalities or []),
                          "has_prompt_price": model.prompt_price_per_million is not None,
                          "has_completion_price": model.completion_price_per_million is not None,
                          "rejection_reasons": reasons,
                      }
                  )

          report = {
              "schema_version": "v5-live-catalog-diagnostic-1",
              "status": "PASS",
              "model_calls": 0,
              "catalog_source": source,
              "catalog_models": len(models),
              "context_floor": context_floor,
              "rejection_counts": dict(sorted(totals.items())),
              "eligible_counts_by_official_rank_ceiling": {
                  limit: len(values) for limit, values in eligible_by_limit.items()
              },
              "eligible_models_by_official_rank_ceiling": eligible_by_limit,
              "top_40_filter_trace": sorted(rows, key=lambda row: (row["rank"], row["model"])),
          }
          Path("catalog-diagnostic/report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          assert report["model_calls"] == 0
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-live-catalog-diagnostic-${{ github.run_id }}
          path: catalog-diagnostic/
          if-no-files-found: error
          retention-days: 7
