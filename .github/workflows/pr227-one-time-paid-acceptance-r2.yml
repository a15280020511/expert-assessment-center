name: PR227 One-Time Paid Acceptance R2

on:
  push:
    branches:
      - acceptance/pr227-final-paid-20260803-r2
    paths:
      - .github/v5-paid-acceptance-request-r2.json

permissions:
  contents: read
  actions: read

concurrency:
  group: pr227-one-time-paid-acceptance-r2
  cancel-in-progress: false

jobs:
  paid-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      target_sha: ${{ steps.request.outputs.target_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_name: v5-pr227-paid-acceptance-r2-${{ github.run_id }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "1"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-pr227-paid-acceptance-r2
    steps:
      - name: Checkout immutable authorization request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 3
          persist-credentials: false
          path: request-source

      - name: Validate exact authorization and target
        id: request
        working-directory: request-source
        shell: bash
        run: |
          set -euo pipefail
          request=.github/v5-paid-acceptance-request-r2.json
          jq -e '
            type == "object" and
            (keys | sort) == [
              "authorization",
              "cost_cap_usd",
              "maximum_recovery_calls",
              "maximum_total_calls",
              "purpose",
              "schema_version",
              "target_sha",
              "task"
            ] and
            .schema_version == "pr227-paid-acceptance-2" and
            .authorization == "RUN-EXACTLY-ONCE" and
            .purpose == "final-pr227-production-qualification-after-contract-fix" and
            .target_sha == "f7f0bec6cbecee2314a352a736f45f92d82034f4" and
            .maximum_total_calls == 4 and
            .maximum_recovery_calls == 0 and
            .cost_cap_usd == 0.25 and
            (.task.question | type == "string" and length > 0) and
            (.task.requirements | type == "array" and length > 0) and
            .task.language == "zh-CN"
          ' "$request" >/dev/null
          test "$(git diff --name-only HEAD^ HEAD)" = "$request"
          target=$(jq -er '.target_sha' "$request")
          git merge-base --is-ancestor "$target" HEAD^
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Verify exact clean source
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime-source/requirements-runtime.txt
            runtime-source/requirements-dev.txt

      - name: Install and validate pinned source
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -q

      - name: Verify inference secret without disclosure
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20

      - name: Materialize immutable ticket
        working-directory: runtime-source
        run: |
          set -euo pipefail
          rm -rf paid-acceptance-artifacts
          mkdir -p paid-acceptance-artifacts
          jq '.task' ../request-source/.github/v5-paid-acceptance-request-r2.json \
            | jq '{task: .}' > paid-acceptance-artifacts/ticket.json
          python - <<'PY'
          import json
          from pathlib import Path
          ticket = json.loads(Path("paid-acceptance-artifacts/ticket.json").read_text(encoding="utf-8"))
          task = ticket["task"]
          sections = [task["question"].strip()]
          requirements = [str(item).strip() for item in task.get("requirements", []) if str(item).strip()]
          if requirements:
              sections.append("执行要求：\n" + "\n".join(f"- {item}" for item in requirements))
          sections.append(f"输出语言：{task.get('language', 'zh-CN')}")
          Path("paid-task.txt").write_text("\n\n".join(sections), encoding="utf-8")
          PY

      - name: Execute bounded real production acceptance
        working-directory: runtime-source
        shell: bash
        run: |
          set -euo pipefail
          python open-model-market/v5_pipeline.py \
            --task "$(cat paid-task.txt)" \
            --output-dir paid-acceptance-artifacts \
            --ranking-limit 12 \
            --maximum-total-calls 4 \
            --maximum-recovery-calls 0 \
            --cost-anomaly-usd 0.25 \
            --max-completion-tokens 768 \
            --reasoning-effort low \
            --require-live-catalog

      - name: Verify paid governance and execution constitution
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("paid-acceptance-artifacts")
          def load(name):
              return json.loads((root / name).read_text(encoding="utf-8"))
          calls = load("v5-governance-calls.json")
          governance = load("v5-governance-result.json")
          resolution = load("v5-governance-models.json")
          result = load("v5-result.json")
          audit = load("v5-request-audit.json")
          selection = load("v5-selection.json")
          kinds = [row["kind"] for row in calls["calls"]]
          assert resolution["status"] == "PASS"
          assert resolution["provider_fallback_allowed"] is False
          assert resolution["gpt"]["logical_model"] == "~openai/gpt-latest"
          assert resolution["claude"]["logical_model"] == "~anthropic/claude-opus-latest"
          assert kinds == ["gpt_proposal", "claude_red_team", "gpt_synthesis"]
          assert calls["actual_governance_calls"] == 3
          assert calls["claude_red_team_calls"] == 1
          assert calls["gpt_synthesis_calls"] == 1
          assert calls["claude_is_advisory_only"] is True
          assert calls["claude_gatekeeping_allowed"] is False
          assert calls["second_claude_review_allowed"] is False
          assert calls["model_loop_allowed"] is False
          assert governance["status"] == "PASS"
          assert governance["claude_review_count"] == 1
          assert governance["gpt_synthesis_count"] == 1
          assert governance["claude_gatekeeping_allowed"] is False
          for key in (
              "local_task_classification_used",
              "local_atomic_work_generation_used",
              "local_resource_matrix_used",
              "local_scoring_used",
              "optimizer_used",
          ):
              assert selection[key] is False
          assert result["total_model_calls"] == 4
          assert float(result["actual_cost_usd"]) <= 0.25 + 1e-12
          assert audit["status"] == "PASS"
          assert audit["request_count"] == 4
          assert audit["external_tools_allowed"] is False
          receipt = {
              "schema_version": "pr227-final-paid-acceptance-receipt-2",
              "status": "PASS",
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": os.environ["ACCEPTANCE_RUN_ID"],
              "governance_sequence": kinds,
              "governance_calls": 3,
              "claude_calls": 1,
              "expert_calls": 1,
              "total_model_calls": result["total_model_calls"],
              "actual_cost_usd": result["actual_cost_usd"],
              "claude_is_advisory_only": True,
              "claude_gatekeeping_allowed": False,
              "old_local_planner_used": False,
              "optimizer_used": False,
          }
          (root / "paid-acceptance-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Freeze complete artifact manifest
        if: success()
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(Path("paid-acceptance-artifacts"))
          PY

      - name: Upload primitive paid evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-pr227-paid-acceptance-r2-${{ github.run_id }}
          path: runtime-source/paid-acceptance-artifacts/
          if-no-files-found: error
          retention-days: 30

  independent-revalidation:
    needs: paid-acceptance
    if: needs.paid-acceptance.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}
      TARGET_SHA: ${{ needs.paid-acceptance.outputs.target_sha }}
      ARTIFACT_ID: ${{ needs.paid-acceptance.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.paid-acceptance.outputs.artifact_digest }}
      ARTIFACT_NAME: ${{ needs.paid-acceptance.outputs.artifact_name }}
    steps:
      - name: Checkout exact attested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.paid-acceptance.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime dependencies
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Download exact primitive Artifact
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > paid-evidence.zip
          mkdir paid-evidence
          unzip -q paid-evidence.zip -d paid-evidence

      - name: Independently recompute primitive evidence
        run: |
          set -euo pipefail
          python runtime-source/open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir paid-evidence \
            --expected-sha "$TARGET_SHA" \
            --expected-run-id "$ACCEPTANCE_RUN_ID" \
            --maximum-calls 4 \
            --maximum-cost-usd 0.25 \
            --archive paid-evidence.zip \
            --expected-artifact-digest "$ARTIFACT_DIGEST" \
            --output independent-revalidation.json
          test "$(jq -r '.status' independent-revalidation.json)" = "PASS"

      - name: Build final bound attestation
        run: |
          set -euo pipefail
          jq -n \
            --arg run_id "$ACCEPTANCE_RUN_ID" \
            --arg target_sha "$TARGET_SHA" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --slurpfile recomputed independent-revalidation.json \
            --slurpfile receipt paid-evidence/paid-acceptance-receipt.json \
            '{
              schema_version: "pr227-final-paid-attestation-2",
              status: (if $recomputed[0].status == "PASS" and $receipt[0].status == "PASS" then "PASS" else "FAIL" end),
              paid_workflow_run_id: $run_id,
              paid_target_sha: $target_sha,
              paid_artifact_id: $artifact_id,
              paid_artifact_name: $artifact_name,
              paid_artifact_digest: $artifact_digest,
              paid_receipt: $receipt[0],
              independent_revalidation: $recomputed[0],
              independently_recomputed_from_primitive_evidence: true,
              paid_acceptance_verdict_used_as_source: false,
              production_ref_moved: false
            }' > paid-acceptance-attestation.json
          test "$(jq -r '.status' paid-acceptance-attestation.json)" = "PASS"

      - name: Upload independent final attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-pr227-paid-attestation-r2-${{ github.run_id }}
          path: |
            independent-revalidation.json
            paid-acceptance-attestation.json
          if-no-files-found: error
          retention-days: 30
