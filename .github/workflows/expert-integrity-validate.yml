name: Expert Integrity Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: expert-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate V5 production integrity
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests
          PYTHONPATH=open-model-market python -m unittest \
            tests.test_v5_production_cutover \
            tests.test_workflow_contract \
            tests.test_legacy_runtime_removed \
            -v
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY
