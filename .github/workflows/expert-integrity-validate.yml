name: Expert Integrity Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m compileall -q open-model-market tests
          PYTHONPATH=open-model-market python -m unittest tests/test_report_integrity.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          PY
