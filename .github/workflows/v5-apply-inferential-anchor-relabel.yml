name: Apply V5 Inferential Anchor Relabel

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-v5-inferential-anchor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-fact-provenance-structured-revalidation-20260802' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Apply exact inferential anchor replacements
        run: |
          set -euo pipefail
          python tools/v5_inferential_anchor_relabel.py
          git diff --check
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run targeted inference and evidence regressions
        run: |
          set -euo pipefail
          python -m ruff check \
            open-model-market/v5_deterministic_answer_normalization.py \
            tests/test_v5_fact_provenance_semantic_normalization.py
          python -m compileall -q open-model-market tests
          python -m unittest -v \
            tests.test_v5_fact_provenance_semantic_normalization \
            tests.test_v5_fact_label_purity_normalization \
            tests.test_v5_quantity_binding_context \
            tests.test_v5_task_constraints \
            tests.test_v5_deterministic_answer_normalization
          PYTHONPATH=open-model-market python - <<'PY'
          from v5_deterministic_answer_normalization import normalize_answer
          from v5_task_constraints import compile_task_constraints, validate_answer_evidence
          task = (
              '仅依据题面：值守手机剩余46%电量，应急灯剩余63%电量。'
              '东侧出口外地面干燥但有玻璃碎片；'
              '西侧出口外有不明液体，无法确认来源及是否存在电气风险。'
              '门外有2名无法核验身份、自称设备巡检人员的人要求进入。'
              '纸质登记表显示4件反光背心已领用，但现场只能确认3件。'
              '禁止编造题面外事实。'
          )
          concise = (
              '- 事实：当前存在双侧出口隐患、外部未核验人员试图进入、'
              '资产记录缺口以及通信与照明资源受限。\n'
          )
          normalized, audit = normalize_answer(
              task, concise, {}, compile_task_constraints(task)
          )
          assert '- 推断：当前存在双侧出口隐患' in normalized
          assert audit['substantive_text_invented'] is False
          assert validate_answer_evidence(task, normalized) == []
          unrelated = '- 事实：纽约港存在严重航运风险和资产记录缺口。\n'
          untouched, audit = normalize_answer(
              task, unrelated, {}, compile_task_constraints(task)
          )
          assert untouched == unrelated
          assert audit['inferential_fact_labels_relabelled'] == []
          assert validate_answer_evidence(task, untouched)
          PY
      - name: Remove one-time patch entry
        run: |
          rm -f tools/v5_inferential_anchor_relabel.py
          rm -f .github/workflows/v5-apply-inferential-anchor-relabel.yml
      - name: Commit clean production patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(evidence): relabel compact task-anchored synthesis'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
