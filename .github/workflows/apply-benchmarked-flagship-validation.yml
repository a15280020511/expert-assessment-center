name: Apply Benchmarked Flagship Validation

on:
  push:
    branches:
      - fix/validate-benchmarked-reasoning-flagships

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/validate-benchmarked-reasoning-flagships
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Add fail-closed live flagship validation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new)

          path = Path("open-model-market/v5_governance_model_plan.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'ROLE_KINDS = {"independent", "review", "synthesis"}\n',
              'ROLE_KINDS = {"independent", "review", "synthesis"}\n'
              'LIVE_FETCH_MODE = "live-per-task-no-cross-task-cache"\n'
              'BENCHMARK_SOURCE = "artificial-analysis-via-openrouter"\n'
              'FLAGSHIP_DEFINITION = (\n'
              '    "strict-product-tier-or-benchmarked-company-natural-top-layer"\n'
              ')\n'
              'COMPANY_MODEL_POLICY = (\n'
              '    "one-highest-intelligence-verified-reasoning-flagship-per-company-then-price-rank"\n'
              ')\n'
              'ALLOWED_FLAGSHIP_BASES = {\n'
              '    "strict-product-tier",\n'
              '    "company-local-natural-top-layer",\n'
              '}\n'
              'SHA256_RE = re.compile(r"^[0-9a-f]{64}$")\n'
              'ECONOMY_MODEL_RE = re.compile(\n'
              '    r"(?:^|[-_/:])(luna|flash|mini|nano|micro|small|lite|fast|instant|"\n'
              '    r"turbo|haiku|spark)(?:$|[-_/:0-9])",\n'
              '    re.IGNORECASE,\n'
              ')\n'
              'SPECIALIZED_MODEL_RE = re.compile(\n'
              '    r"(?:^|[-_/:])(coder|code|safety|guard|embedding|embed|rerank|"\n'
              '    r"moderation|search)(?:$|[-_/:0-9])",\n'
              '    re.IGNORECASE,\n'
              ')\n',
              "live contract constants",
          )
          marker = '\n\ndef _validate_roles(selected: Sequence[Mapping[str, Any]]) -> None:\n'
          functions = '''


def _validate_live_flagship_row(
    row: Mapping[str, Any],
    *,
    field: str,
    index: int,
) -> None:
    model, _, _ = _validate_model_row(row, field=field, index=index)
    if ECONOMY_MODEL_RE.search(model):
        raise GovernanceModelPlanError(
            f"{field}[{index}] contains an economy-tier model"
        )
    if SPECIALIZED_MODEL_RE.search(model):
        raise GovernanceModelPlanError(
            f"{field}[{index}] contains a specialized model"
        )
    if row.get("flagship_verified") is not True:
        raise GovernanceModelPlanError(
            f"{field}[{index}] is not a governance-verified flagship"
        )
    basis = str(row.get("flagship_basis") or "").strip()
    if basis not in ALLOWED_FLAGSHIP_BASES:
        raise GovernanceModelPlanError(
            f"{field}[{index}].flagship_basis is invalid"
        )
    if row.get("benchmark_source") != BENCHMARK_SOURCE:
        raise GovernanceModelPlanError(
            f"{field}[{index}].benchmark_source is invalid"
        )
    for metric in (
        "intelligence_index",
        "coding_index",
        "agentic_index",
        "balanced_score",
    ):
        _positive_finite(row.get(metric), f"{field}[{index}].{metric}")
    benchmark_hash = str(row.get("benchmark_evidence_sha256") or "")
    if not SHA256_RE.fullmatch(benchmark_hash):
        raise GovernanceModelPlanError(
            f"{field}[{index}].benchmark_evidence_sha256 is invalid"
        )
    endpoint_hash = str(row.get("endpoint_inventory_sha256") or "")
    if not SHA256_RE.fullmatch(endpoint_hash):
        raise GovernanceModelPlanError(
            f"{field}[{index}].endpoint_inventory_sha256 is invalid"
        )
    providers = row.get("qualified_provider_count")
    if isinstance(providers, bool) or not isinstance(providers, int) or providers < 1:
        raise GovernanceModelPlanError(
            f"{field}[{index}].qualified_provider_count must be positive"
        )
    evidence = str(row.get("selection_evidence") or "")
    required_evidence = (
        "non-search",
        "verified-company-flagship-reasoning",
        basis,
        "live-exact-endpoint-qualified",
        "authenticated-zdr-endpoint-qualified",
    )
    if any(value not in evidence for value in required_evidence):
        raise GovernanceModelPlanError(
            f"{field}[{index}] lacks verified reasoning flagship evidence"
        )


def _validate_live_flagship_contract(
    plan: Mapping[str, Any],
    selected: Sequence[Mapping[str, Any]],
    recoveries: Sequence[Mapping[str, Any]],
) -> None:
    if plan.get("catalog_fetch_mode") != LIVE_FETCH_MODE:
        return
    expected = {
        "reasoning_model_required": True,
        "flagship_definition": FLAGSHIP_DEFINITION,
        "benchmark_source": BENCHMARK_SOURCE,
        "company_model_policy": COMPANY_MODEL_POLICY,
        "company_uniqueness_scope": "selected-and-recovery",
        "price_rank_basis": (
            "prompt_usd_per_million + completion_usd_per_million"
        ),
        "endpoint_qualification_performed_by_governance": True,
        "model_calls": 0,
    }
    for field, value in expected.items():
        if plan.get(field) != value:
            raise GovernanceModelPlanError(
                f"live governance flagship contract mismatch: {field}"
            )
    if len(selected) != 4 or len(recoveries) != 4:
        raise GovernanceModelPlanError(
            "live governance plan must contain four active and four recovery models"
        )
    ranked = _model_rows(plan.get("price_ranked_models"), "price_ranked_models")
    for field, rows in (
        ("selected_models", selected),
        ("recovery_models", recoveries),
        ("price_ranked_models", ranked),
    ):
        for index, row in enumerate(rows):
            _validate_live_flagship_row(row, field=field, index=index)
'''
          if marker not in text:
              raise SystemExit("live contract insertion marker missing")
          text = text.replace(marker, functions + marker, 1)
          text = replace_once(
              text,
              '    _validate_price_ranking(plan_value, selected, recoveries)\n'
              '    _validate_roles(selected)\n',
              '    _validate_price_ranking(plan_value, selected, recoveries)\n'
              '    _validate_live_flagship_contract(plan_value, selected, recoveries)\n'
              '    _validate_roles(selected)\n',
              "live contract invocation",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Replace focused live-contract tests
        run: |
          set -euo pipefail
          cat > tests/test_unique_company_price_ranking.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(ROOT / "open-model-market"))
          from v5_governance_model_plan import (  # noqa: E402
              BENCHMARK_SOURCE,
              FLAGSHIP_DEFINITION,
              GovernanceModelPlanError,
              plan_sha256,
              task_sha256,
              validate_governance_model_plan,
          )

          FIXTURE = ROOT / "tests" / "fixtures" / "governance-ticket.json"


          def digest(value: str) -> str:
              return hashlib.sha256(value.encode("utf-8")).hexdigest()


          def recovery(slot: int, company: str, cost: float) -> dict:
              return {
                  "slot": slot,
                  "model": f"{company}/reasoning-pro",
                  "company": company,
                  "estimated_task_cost_usd": cost,
                  "prompt_usd_per_million": cost / 3,
                  "completion_usd_per_million": cost * 2 / 3,
              }


          def enrich_row(row: dict, *, natural_top: bool = False) -> None:
              basis = (
                  "company-local-natural-top-layer"
                  if natural_top
                  else "strict-product-tier"
              )
              model = row["model"]
              row.update(
                  {
                      "price_rank_usd_per_million": row[
                          "estimated_task_cost_usd"
                      ],
                      "flagship_verified": True,
                      "flagship_basis": basis,
                      "company_flagship_method": "fixture-company-top",
                      "benchmark_source": BENCHMARK_SOURCE,
                      "intelligence_index": 50.0,
                      "coding_index": 50.0,
                      "agentic_index": 50.0,
                      "balanced_score": 50.0,
                      "benchmark_evidence_sha256": digest(
                          model + "-benchmark"
                      ),
                      "endpoint_inventory_sha256": digest(model + "-endpoint"),
                      "qualified_provider_count": 1,
                      "selection_evidence": (
                          "non-search+verified-company-flagship-reasoning+"
                          f"{basis}+price-order+live-exact-endpoint-qualified+"
                          "authenticated-zdr-endpoint-qualified+"
                          "minimum-one-zdr-provider-route"
                      ),
                  }
              )


          def resign(value: dict) -> None:
              plan = value["governance_model_plan"]
              plan["task_sha256"] = task_sha256(value)
              plan["plan_sha256"] = plan_sha256(plan)


          def ticket() -> dict:
              value = json.loads(FIXTURE.read_text(encoding="utf-8"))
              plan = value["governance_model_plan"]
              plan["recovery_models"].extend(
                  [
                      recovery(2, "epsilon", 0.06),
                      recovery(3, "zeta", 0.07),
                      recovery(4, "eta", 0.08),
                  ]
              )
              plan["recovery_count"] = 4
              value["approved_budget"]["calls"] = 8
              value["approved_budget"]["maximum_recovery_calls"] = 4
              plan["catalog_fetch_mode"] = "live-per-task-no-cross-task-cache"
              plan["company_uniqueness_scope"] = "selected-and-recovery"
              plan["company_model_policy"] = (
                  "one-highest-intelligence-verified-reasoning-flagship-"
                  "per-company-then-price-rank"
              )
              plan["flagship_definition"] = FLAGSHIP_DEFINITION
              plan["reasoning_model_required"] = True
              plan["benchmark_source"] = BENCHMARK_SOURCE
              plan["price_rank_basis"] = (
                  "prompt_usd_per_million + completion_usd_per_million"
              )
              plan["endpoint_qualification_performed_by_governance"] = True
              plan["model_calls"] = 0
              all_rows = plan["selected_models"] + plan["recovery_models"]
              for index, row in enumerate(all_rows):
                  enrich_row(row, natural_top=index in {1, 5})
              ranked = [dict(row) for row in all_rows]
              ranked.sort(key=lambda row: row["price_rank_usd_per_million"])
              for rank, row in enumerate(ranked, 1):
                  row["price_rank"] = rank
                  row["slot"] = rank
                  row.pop("role_id", None)
                  row.pop("role_kind", None)
                  row.pop("role", None)
              plan["price_ranked_models"] = ranked
              resign(value)
              return value


          class UniqueCompanyPriceRankingTests(unittest.TestCase):
              def test_valid_benchmarked_reasoning_flagship_plan_passes(self) -> None:
                  validate_governance_model_plan(ticket())

              def test_live_plan_requires_price_ranking(self) -> None:
                  value = ticket()
                  value["governance_model_plan"].pop("price_ranked_models")
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "price_ranked_models"
                  ):
                      validate_governance_model_plan(value)

              def test_price_ranking_must_be_ascending(self) -> None:
                  value = ticket()
                  rows = value["governance_model_plan"]["price_ranked_models"]
                  rows[0], rows[1] = rows[1], rows[0]
                  for rank, row in enumerate(rows, 1):
                      row["price_rank"] = rank
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "ascending price order"
                  ):
                      validate_governance_model_plan(value)

              def test_live_plan_requires_reasoning_models(self) -> None:
                  value = ticket()
                  value["governance_model_plan"]["reasoning_model_required"] = False
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "reasoning_model_required"
                  ):
                      validate_governance_model_plan(value)

              def test_luna_is_rejected_even_with_forged_evidence(self) -> None:
                  value = ticket()
                  plan = value["governance_model_plan"]
                  old_model = plan["selected_models"][0]["model"]
                  for row in plan["selected_models"] + plan["price_ranked_models"]:
                      if row["model"] == old_model:
                          row["model"] = "openai/gpt-5.6-luna-pro"
                          row["company"] = "openai"
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "economy-tier model"
                  ):
                      validate_governance_model_plan(value)

              def test_invalid_flagship_basis_is_rejected(self) -> None:
                  value = ticket()
                  row = value["governance_model_plan"]["selected_models"][0]
                  row["flagship_basis"] = "name-contains-pro"
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "flagship_basis is invalid"
                  ):
                      validate_governance_model_plan(value)

              def test_missing_benchmark_hash_is_rejected(self) -> None:
                  value = ticket()
                  value["governance_model_plan"]["recovery_models"][0].pop(
                      "benchmark_evidence_sha256"
                  )
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "benchmark_evidence_sha256"
                  ):
                      validate_governance_model_plan(value)

              def test_benchmark_source_mismatch_is_rejected(self) -> None:
                  value = ticket()
                  value["governance_model_plan"]["selected_models"][0][
                      "benchmark_source"
                  ] = "untrusted"
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError, "benchmark_source is invalid"
                  ):
                      validate_governance_model_plan(value)

              def test_missing_reasoning_flagship_evidence_is_rejected(self) -> None:
                  value = ticket()
                  value["governance_model_plan"]["price_ranked_models"][0][
                      "selection_evidence"
                  ] = "authenticated-zdr-endpoint-qualified"
                  resign(value)
                  with self.assertRaisesRegex(
                      GovernanceModelPlanError,
                      "lacks verified reasoning flagship evidence",
                  ):
                      validate_governance_model_plan(value)


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Run zero-call targeted validation
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_unique_company_price_ranking \
            tests.test_v5_governance_model_plan \
            tests.test_v5_governed_plan_orchestrator -v
      - name: Remove temporary workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/apply-benchmarked-flagship-validation.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate benchmarked reasoning flagships"
          git push origin HEAD:fix/validate-benchmarked-reasoning-flagships
