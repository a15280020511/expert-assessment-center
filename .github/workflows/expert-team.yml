name: Open Model Catalog Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  catalog-health:
    name: Live model catalog health
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile production modules
        run: python -m py_compile open-model-market/*.py
      - name: Verify live rankings and hardened direct-model plan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY"
          python open-model-market/expert_team_hardened.py \
            --task "Weekly market health check for research, coding, quantitative analysis and risk review" \
            --dry-run \
            --require-live-catalog \
            --output-dir catalog-health-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: expert-team-catalog-health-${{ github.run_id }}
          path: catalog-health-artifacts/
          if-no-files-found: warn
          retention-days: 14
