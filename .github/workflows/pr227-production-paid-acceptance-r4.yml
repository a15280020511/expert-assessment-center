name: PR227 Production Paid Acceptance R4

on:
  push:
    branches:
      - acceptance/pr227-final-paid-20260803-r4
    paths:
      - .github/v5-paid-production-request-r4.json

permissions:
  contents: read
  actions: read

concurrency:
  group: pr227-production-paid-acceptance-r4
  cancel-in-progress: false

jobs:
  production-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "1"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-pr227-production-paid-r4
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TARGET_SHA: add4a7bc94fccf57e2979103686887d6920eec66
      MAXIMUM_TOTAL_CALLS: "4"
      MAXIMUM_RECOVERY_CALLS: "0"
      MAXIMUM_COST_USD: "0.25"
    steps:
      - name: Checkout immutable authorization request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 3
          persist-credentials: false
          path: request-source

      - name: Validate exact one-time authorization
        id: request
        working-directory: request-source
        shell: bash
        run: |
          set -euo pipefail
          request=.github/v5-paid-production-request-r4.json
          jq -e '
            type == "object" and
            (keys | sort) == [
              "authorization",
              "cost_cap_usd",
              "maximum_recovery_calls",
              "maximum_total_calls",
              "purpose",
              "schema_version",
              "target_sha",
              "task"
            ] and
            .schema_version == "pr227-production-paid-acceptance-4" and
            .authorization == "RUN-EXACTLY-ONCE" and
            .purpose == "final-pr227-authoritative-production-qualification" and
            .target_sha == "add4a7bc94fccf57e2979103686887d6920eec66" and
            .maximum_total_calls == 4 and
            .maximum_recovery_calls == 0 and
            .cost_cap_usd == 0.25 and
            (.task | type == "object") and
            (.task.question | type == "string" and length > 0) and
            (.task.requirements | type == "array" and length > 0) and
            .task.language == "zh-CN"
          ' "$request" >/dev/null
          test "$(git diff --name-only HEAD^ HEAD)" = "$request"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD^
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Verify immutable clean source
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$TARGET_SHA" > ../checked-out-qualified-sha.txt

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime-source/requirements-runtime.txt
            runtime-source/requirements-dev.txt

      - name: Install and validate exact source
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -q

      - name: Verify inference secret without disclosure
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20

      - name: Materialize immutable admitted ticket
        working-directory: runtime-source
        run: |
          set -euo pipefail
          rm -rf ticket-artifacts
          mkdir -p ticket-artifacts
          cp ../request-source/.github/v5-paid-production-request-r4.json paid-request.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          from v5_ticket_identity import task_fingerprint

          request = json.loads(Path("paid-request.json").read_text(encoding="utf-8"))
          task_id = "pr227-production-paid-r4-20260803"
          task = request["task"]
          ticket = {
              "task_id": task_id,
              "route": "expert-team",
              "task": task,
              "approved_budget": {
                  "calls": request["maximum_total_calls"],
                  "maximum_recovery_calls": request["maximum_recovery_calls"],
                  "cost_policy": "unbounded_with_anomaly_guard",
                  "cost_anomaly_usd": request["cost_cap_usd"],
              },
              "private_output": False,
          }
          fingerprint = task_fingerprint(ticket)
          status = {
              "accepted": True,
              "task_id": task_id,
              "task_fingerprint": fingerprint,
              "calls": request["maximum_total_calls"],
              "maximum_recovery_calls": request["maximum_recovery_calls"],
              "maximum_replacements": request["maximum_recovery_calls"],
              "maximum_initial_calls": (
                  request["maximum_total_calls"]
                  - 3
                  - request["maximum_recovery_calls"]
              ),
              "max_cost_usd": request["cost_cap_usd"],
              "cost_anomaly_usd": request["cost_cap_usd"],
              "cost_policy": "unbounded_with_anomaly_guard",
              "private_output": False,
              "is_retry": False,
              "retry_id": "",
              "trigger_mode": "run",
              "execution_id": task_id,
              "analysis_owner": "github-v5-gpt-claude-expert-graph",
              "authoritative_trigger": "issue_comment.created",
              "runtime_version": "v5-native-runtime-1",
              "fallback_policy": "disabled-fail-closed",
              "legacy_runtime_present": False,
              "cross_task_history_used": False,
              "call_policy": (
                  "approved-total-includes-gpt-claude-governance-experts-and-recovery"
              ),
          }
          sections = [task["question"].strip()]
          requirements = [
              str(value).strip()
              for value in task.get("requirements", [])
              if str(value).strip()
          ]
          if requirements:
              sections.append(
                  "执行要求：\n" + "\n".join(f"- {value}" for value in requirements)
              )
          sections.append(f"输出语言：{task.get('language', 'zh-CN')}")
          root = Path("ticket-artifacts")
          root.joinpath("ticket.json").write_text(
              json.dumps(ticket, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          root.joinpath("ticket-status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          root.joinpath("task.txt").write_text(
              "\n\n".join(sections) + "\n",
              encoding="utf-8",
          )
          PY
          python open-model-market/v5_ticket_gate.py \
            --output-dir ticket-artifacts \
            --expected-calls "$MAXIMUM_TOTAL_CALLS" \
            --expected-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --expected-cost-anomaly-usd "$MAXIMUM_COST_USD"

      - name: Execute exact V5 production ticket
        id: execute
        continue-on-error: true
        working-directory: runtime-source
        shell: bash
        run: |
          set -uo pipefail
          task="$(cat ticket-artifacts/task.txt)"
          set +e
          python open-model-market/v5_production_ticket.py \
            --task "$task" \
            --output-dir ticket-artifacts \
            --maximum-total-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --cost-anomaly-usd "$MAXIMUM_COST_USD" \
            --require-live-catalog \
            > ticket-artifacts/production-execution.log 2>&1
          rc=$?
          set -e
          cat ticket-artifacts/production-execution.log
          if [[ -f ticket-artifacts/expert-team-error.json ]]; then
            jq '{error_code,stage,message,normalization_error}' \
              ticket-artifacts/expert-team-error.json
          fi
          exit "$rc"

      - name: Verify substantive execution result
        id: execution_result
        if: always()
        continue-on-error: true
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test ! -f ticket-artifacts/expert-team-error.json
          for file in \
            expert-team-result.json \
            v5-result.json \
            v5-execution-summary.json \
            v5-node-results.json \
            v5-request-audit.json \
            call-ledger.json \
            v5-governance-calls.json \
            v5-final-report.md; do
            test -s "ticket-artifacts/$file"
          done
          jq -e '.status == "success"' ticket-artifacts/expert-team-result.json >/dev/null
          jq -e '.status == "success"' ticket-artifacts/v5-result.json >/dev/null
          jq -e '
            .actual_governance_calls == 3 and
            .claude_red_team_calls == 1 and
            .gpt_synthesis_calls == 1 and
            [.calls[].kind] == ["gpt_proposal","claude_red_team","gpt_synthesis"] and
            .claude_is_advisory_only == true and
            .claude_gatekeeping_allowed == false and
            .second_claude_review_allowed == false and
            .model_loop_allowed == false
          ' ticket-artifacts/v5-governance-calls.json >/dev/null
          jq -e '
            .request_count == 4 and
            .governance_request_count == 3 and
            .expert_request_count == 1 and
            (.requests | length) == 4 and
            .external_tools_allowed == false and
            .provider_fallback_allowed == false
          ' ticket-artifacts/v5-request-audit.json >/dev/null
          jq -e '
            .summary.call_count == 4 and
            .summary.governance_calls == 3 and
            .summary.expert_calls == 1 and
            (.summary.provider_actual_cost_usd | tonumber) <= 0.25
          ' ticket-artifacts/call-ledger.json >/dev/null
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Prepare strict report publication evidence
        id: prepare_report
        if: always() && steps.execution_result.outcome == 'success'
        continue-on-error: true
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"
          test -s ticket-artifacts/report-comments/report-comments-manifest.json

      - name: Audit complete native production evidence
        id: audit
        if: always() && steps.prepare_report.outcome == 'success'
        continue-on-error: true
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python open-model-market/v5_execution_auditor_integrity.py \
            --output-dir ticket-artifacts \
            --execute-outcome "success" \
            --publish-outcome "success"
          status="$(jq -r '.status // "FAIL"' ticket-artifacts/execution-audit.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "PASS"

      - name: Freeze primary Artifact manifest
        id: manifest
        if: always() && steps.audit.outcome == 'success' && steps.audit.outputs.status == 'PASS'
        continue-on-error: true
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY
          test -s ticket-artifacts/artifact-manifest.json

      - name: Upload primary production Artifact
        id: primary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-production-primary-r4-${{ github.run_id }}
          path: runtime-source/ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Independently revalidate uploaded primary Artifact
        id: independent
        if: always() && steps.audit.outcome == 'success' && steps.manifest.outcome == 'success' && steps.primary.outcome == 'success'
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.primary.outputs.artifact-digest }}
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test -n "$PRIMARY_ARTIFACT_ID"
          test -n "$PRIMARY_ARTIFACT_DIGEST"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIMARY_ARTIFACT_ID}/zip" \
            > uploaded-primary-artifact.zip
          test "$(sha256sum uploaded-primary-artifact.zip | awk '{print "sha256:" $1}')" = "$PRIMARY_ARTIFACT_DIGEST"
          rm -rf independently-downloaded-primary
          mkdir independently-downloaded-primary
          unzip -q uploaded-primary-artifact.zip -d independently-downloaded-primary
          python open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir independently-downloaded-primary \
            --expected-sha "$TARGET_SHA" \
            --expected-run-id "${{ github.run_id }}" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-cost-usd "$MAXIMUM_COST_USD" \
            --archive uploaded-primary-artifact.zip \
            --expected-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --output independent-revalidation.json
          status="$(jq -r '.status // "FAIL"' independent-revalidation.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "PASS"
          jq -e '
            (.total_model_calls // .model_calls) == 4 and
            .governance_model_calls == 3 and
            .expert_model_calls == 1 and
            (.actual_cost_usd | tonumber) <= 0.25 and
            .recomputed_from_primitive_evidence == true and
            .paid_acceptance_verdict_used_as_source == false
          ' independent-revalidation.json >/dev/null

      - name: Render authoritative final status
        id: final
        if: always()
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.primary.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.primary.outputs.artifact-digest }}
        working-directory: runtime-source
        run: |
          set -euo pipefail
          audit_outcome="${{ steps.audit.outcome }}"
          if [[ "${{ steps.independent.outcome }}" != "success" || \
                "${{ steps.independent.outputs.status }}" != "PASS" ]]; then
            audit_outcome="independent-artifact-revalidation-failed"
          fi
          python open-model-market/v5_final_status.py \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" \
            --ticket-upload-outcome "${{ steps.primary.outcome }}" \
            --audit-outcome "$audit_outcome" \
            --manifest-outcome "${{ steps.manifest.outcome }}" \
            --artifact-id "$PRIMARY_ARTIFACT_ID" \
            --artifact-url "$PRIMARY_ARTIFACT_URL" \
            --artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            | tee final-status.md
          status="$(jq -r '.status // "FAIL"' ticket-artifacts/final-status.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "PASS"

      - name: Generate final bound Attestation
        id: attest
        if: always() && steps.final.outcome == 'success' && steps.final.outputs.status == 'PASS'
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.primary.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.primary.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.primary.outputs.artifact-digest }}
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python open-model-market/v5_final_attestation.py \
            --output-dir ticket-artifacts \
            --primary-artifact-id "$PRIMARY_ARTIFACT_ID" \
            --primary-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --primary-artifact-url "$PRIMARY_ARTIFACT_URL" \
            --audit-status "${{ steps.final.outputs.status }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "$TARGET_SHA" \
            --final-status-file final-status.md \
            --output final-attestation.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          independent_path = Path("independent-revalidation.json")
          if not independent_path.is_file():
              raise SystemExit("independent Artifact revalidation is missing")
          independent = json.loads(independent_path.read_text(encoding="utf-8"))
          if independent.get("status") != "PASS":
              raise SystemExit("independent Artifact revalidation did not pass")
          attestation_path = Path("final-attestation.json")
          attestation = json.loads(attestation_path.read_text(encoding="utf-8"))
          attestation["independent_artifact_revalidation"] = {
              **independent,
              "evidence_sha256": hashlib.sha256(independent_path.read_bytes()).hexdigest(),
          }
          attestation["evidence_chain"] = (
              "frozen-business-evidence -> primary-artifact -> "
              "independent-artifact-revalidation -> final-status -> "
              "final-attestation-artifact"
          )
          attestation_path.write_text(
              json.dumps(attestation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          jq -e --arg sha "$TARGET_SHA" '
            .status == "PASS" and
            .audit_status == "PASS" and
            .diagnosis_status == "PASS" and
            .business_evidence_frozen_before_upload == true and
            .report_present == true and
            .event_context_commit_matched_checkout == true and
            .commit_sha == $sha and
            .event_context_commit_sha == $sha and
            .independent_artifact_revalidation.status == "PASS"
          ' final-attestation.json >/dev/null
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Write local final diagnostic
        if: always()
        working-directory: runtime-source
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("ticket-artifacts")
          def load(path: Path):
              if not path.is_file():
                  return {}
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}
          result = {
              "schema_version": "pr227-production-paid-r4-local-diagnostic-1",
              "target_sha": os.environ["TARGET_SHA"],
              "expert_error": load(root / "expert-team-error.json"),
              "execution_audit": load(root / "execution-audit.json"),
              "final_status": load(root / "final-status.json"),
              "independent_revalidation": load(Path("independent-revalidation.json")),
              "final_attestation": load(Path("final-attestation.json")),
          }
          Path("r4-local-diagnostic.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload final status and Attestation Artifact
        id: proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-production-attestation-r4-${{ github.run_id }}
          path: |
            runtime-source/final-attestation.json
            runtime-source/final-status.md
            runtime-source/ticket-artifacts/final-status.json
            runtime-source/independent-revalidation.json
            runtime-source/r4-local-diagnostic.json
            checked-out-qualified-sha.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Verify final production qualification
        if: always()
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.execution_result.outcome }}" = "success"
          test "${{ steps.execution_result.outputs.status }}" = "PASS"
          test "${{ steps.prepare_report.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.status }}" = "PASS"
          test "${{ steps.manifest.outcome }}" = "success"
          test "${{ steps.primary.outcome }}" = "success"
          test "${{ steps.independent.outcome }}" = "success"
          test "${{ steps.independent.outputs.status }}" = "PASS"
          test "${{ steps.final.outcome }}" = "success"
          test "${{ steps.final.outputs.status }}" = "PASS"
          test "${{ steps.attest.outcome }}" = "success"
          test "${{ steps.attest.outputs.status }}" = "PASS"
          test "${{ steps.proof.outcome }}" = "success"
          test ! -f ticket-artifacts/expert-team-error.json
          jq -e '.status == "PASS"' final-attestation.json >/dev/null
