name: One-Time Full Load Repository Audit 2026-08-02 Qualified

on:
  pull_request:
    branches: [main]
    paths: ["**"]

permissions:
  contents: read

concurrency:
  group: one-time-full-load-qualified-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Exact-SHA full-load and repository qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Bind exact source and production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts audit-logs
          checked="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$expected"
          test "$base" = "$production"
          printf 'checked_sha=%s\nbase_sha=%s\nproduction_sha=%s\n' \
            "$checked" "$base" "$production" | tee audit-artifacts/source-binding.txt

      - name: Install pinned dependencies and run canonical gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt \
            2>&1 | tee audit-logs/dependency-install.log
          python -m pip check 2>&1 | tee audit-logs/pip-check.log
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee audit-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee audit-logs/full-unit-suite.log
          grep -Eq '^Ran 278 tests in ' audit-logs/full-unit-suite.log
          grep -q '^OK$' audit-logs/full-unit-suite.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee audit-logs/p0-regressions.log
          grep -q 'P0 REGRESSION RESULT: run=50, passed=50, failures=0, errors=0, skipped=0' \
            audit-logs/p0-regressions.log

      - name: Run six-seed full-load, chaos, recovery, and contract matrix
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            tests.test_v5_full_load_stability
            tests.test_v5_stress_stability
            tests.test_execution_graph_properties
            tests.test_v5_cross_endpoint_recovery
            tests.test_v5_critical_delivery_reliability
            tests.test_v5_v4_contract_isolation
            tests.test_v5_deterministic_answer_normalization
            tests.test_v5_general_task_planning
            tests.test_v5_planning_scenario_matrix
            tests.test_v5_long_markdown_contract_integrity
            tests.test_v5_explicit_contract_pipeline_integrity
          )
          for seed in 0 1 7 42 99 31337; do
            echo "=== PYTHONHASHSEED=$seed ===" | tee -a audit-logs/repeated-matrix.log
            PYTHONHASHSEED="$seed" python -m unittest "${modules[@]}" -v \
              2>&1 | tee -a audit-logs/repeated-matrix.log
          done
          test "$(grep -c '^Ran 53 tests in ' audit-logs/repeated-matrix.log)" -eq 6
          test "$(grep -c '^OK$' audit-logs/repeated-matrix.log)" -eq 6

      - name: Run granular line and structural duplication audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/repository_audit.py --root . --output-dir audit-artifacts --fail-on high \
            2>&1 | tee audit-logs/repository-line-audit.log
          python - <<'PY' 2>&1 | tee audit-logs/structure-audit.log
          from __future__ import annotations

          import ast
          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          production_root = Path("open-model-market")
          production_files = sorted(production_root.glob("*.py"))
          fatal: list[str] = []
          warnings: list[str] = []
          exact_files: dict[str, list[str]] = defaultdict(list)
          large_bodies: dict[str, list[str]] = defaultdict(list)
          removed_modules = {
              "v5_executor",
              "v5_empty_output_recovery",
              "v5_total_call_cap",
              "v5_production_hardening",
              "v5_r8_executor",
              "v5_r8_gate_wiring",
              "v5_r8_policy",
              "v5_r8_provider_policy",
              "v5_r8_retry_policy",
              "v5_resilient_executor",
              "v5_stage_d_provider_compat",
          }

          for name in sorted(removed_modules):
              if (production_root / f"{name}.py").exists():
                  fatal.append(f"legacy production file: {name}.py")

          for path in production_files:
              text = path.read_text(encoding="utf-8")
              exact_files[hashlib.sha256(text.encode()).hexdigest()].append(str(path))
              tree = ast.parse(text, filename=str(path))
              seen: dict[str, int] = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if node.name in seen:
                          fatal.append(
                              f"duplicate top-level definition: {path}:{node.lineno}:{node.name}"
                          )
                      seen[node.name] = node.lineno
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == "install" and node.col_offset == 0:
                          fatal.append(f"top-level monkey-patch installer: {path}:{node.lineno}")
                      if sum(1 for _ in ast.walk(node)) >= 80:
                          body = ast.Module(body=node.body, type_ignores=[])
                          digest = hashlib.sha256(
                              ast.dump(body, include_attributes=False).encode()
                          ).hexdigest()
                          large_bodies[digest].append(f"{path}:{node.lineno}:{node.name}")
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                      if node.func.id in {"eval", "exec"}:
                          fatal.append(f"dynamic code execution: {path}:{node.lineno}")
                  if (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "install"
                  ):
                      fatal.append(f"monkey-patch install call: {path}:{node.lineno}")
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      if isinstance(node, ast.Import):
                          names = [alias.name.rsplit(".", 1)[-1] for alias in node.names]
                      else:
                          names = [node.module.rsplit(".", 1)[-1]] if node.module else []
                      for name in names:
                          if name in removed_modules:
                              fatal.append(f"legacy import: {path}:{node.lineno}:{name}")

          duplicate_file_groups = [paths for paths in exact_files.values() if len(paths) > 1]
          for paths in duplicate_file_groups:
              fatal.append("exact duplicate production files: " + ", ".join(paths))
          duplicate_function_groups = [
              paths for paths in large_bodies.values() if len(paths) > 1
          ]
          warnings.extend(
              "large duplicate function body: " + ", ".join(paths)
              for paths in duplicate_function_groups
          )

          action_pattern = re.compile(r"^\s*uses:\s*([^#\s]+)")
          pinned_pattern = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          unsafe_trigger_pattern = re.compile(r"^\s*pull_request_target\s*:")
          credential_pattern = re.compile(r"^\s*persist-credentials:\s*true\s*$")
          workflows = sorted(Path(".github/workflows").glob("*.yml"))
          approved_receipt_workflow = Path(
              ".github/workflows/v5-one-time-paid-acceptance.yml"
          )
          for path in workflows:
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              for number, line in enumerate(lines, start=1):
                  if unsafe_trigger_pattern.match(line):
                      fatal.append(f"unsafe trigger: {path}:{number}")
                  action = action_pattern.match(line)
                  if (
                      action
                      and not action.group(1).startswith(("./", "docker://"))
                      and not pinned_pattern.match(action.group(1))
                  ):
                      fatal.append(f"unpinned action: {path}:{number}:{action.group(1)}")
                  if credential_pattern.match(line):
                      approved = (
                          path == approved_receipt_workflow
                          and "Checkout acceptance branch for durable receipt" in text
                          and "contents: write" in text
                          and "github.actor == github.repository_owner" in text
                          and "Build and persist branch receipt" in text
                      )
                      if approved:
                          warnings.append(
                              "scoped credential persistence for owner-only durable receipt: "
                              f"{path}:{number}"
                          )
                      else:
                          fatal.append(f"unapproved persisted checkout credentials: {path}:{number}")

          report = {
              "status": "PASS" if not fatal else "FAIL",
              "production_python_files": len(production_files),
              "production_lines": sum(
                  len(path.read_text(encoding="utf-8").splitlines())
                  for path in production_files
              ),
              "exact_duplicate_file_groups": len(duplicate_file_groups),
              "large_duplicate_function_groups": len(duplicate_function_groups),
              "fatal": sorted(set(fatal)),
              "warnings": sorted(set(warnings)),
          }
          Path("audit-artifacts/structure-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          if fatal:
              raise SystemExit(1)
          PY

      - name: Revalidate workflow, release, and production-cutover contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_workflow_contract \
            tests.test_v5_release_command_contract \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed -v \
            2>&1 | tee audit-logs/workflow-release-contracts.log
          grep -q '^OK$' audit-logs/workflow-release-contracts.log

      - name: Create zero-cost audit receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("audit-artifacts")
          root.mkdir(exist_ok=True)
          def load(name: str):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else None
          receipt = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "paid_model_calls": 0,
              "model_cost_usd": 0.0,
              "canonical_unit_tests": 278,
              "p0_regressions": 50,
              "repeated_matrix_seeds": [0, 1, 7, 42, 99, 31337],
              "repeated_tests_per_seed": 53,
              "line_audit": load("repository-audit.json"),
              "structure_audit": load("structure-audit.json"),
          }
          (root / "full-load-audit-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-load-repository-audit-qualified-${{ github.run_id }}
          path: |
            audit-artifacts/
            audit-logs/
          if-no-files-found: error
          retention-days: 14
