name: Execution Ticket Expert Team V5

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  admit-ticket:
    if: >-
      github.actor == github.repository_owner &&
      ((github.event_name == 'issues' && startsWith(github.event.issue.title, '[execution]')) ||
       (github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[execution]') &&
        startsWith(github.event.comment.body, '/retry-expert-team ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: expert-production-admission
      cancel-in-progress: false
    outputs:
      allowed: ${{ steps.lock.outputs.allowed }}
      reason: ${{ steps.lock.outputs.reason }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout pinned source for admission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Acquire serialized zero-call admission
        id: lock
        run: python open-model-market/v5_admission_lock.py

      - name: Publish explicit busy rejection
        if: steps.lock.outputs.allowed != 'true'
        run: |
          cat > issue-comment.md <<EOF
          ## EXECUTION_REJECTED

          - Error code: \`EXECUTION_BUSY\`
          - Reason: ${{ steps.lock.outputs.reason }}
          - Run: \`${RUN_URL}\`
          - V5模型调用：\`0\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@issue-comment.md

  execute-ticket:
    needs: admit-ticket
    if: needs.admit-ticket.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: expert-production-global
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt

      - name: Compile production modules
        run: python -m py_compile open-model-market/*.py

      - name: Parse, authorize, and de-duplicate V5 ticket
        id: prepare
        run: |
          python open-model-market/v5_issue_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir ticket-artifacts

      - name: Comment V5 ticket accepted
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python open-model-market/v5_issue_ticket.py render \
            --phase accepted --output-dir ticket-artifacts --run-url "$RUN_URL" > issue-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@issue-comment.md

      - name: Comment ticket rejected
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python open-model-market/v5_issue_ticket.py render \
            --phase rejected --output-dir ticket-artifacts --run-url "$RUN_URL" > issue-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@issue-comment.md

      - name: Check OpenRouter secret
        if: steps.prepare.outputs.accepted == 'true'
        id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment missing secret
        if: steps.prepare.outputs.accepted == 'true' && steps.secret.outputs.present != 'true'
        run: |
          cat > issue-comment.md <<EOF
          ## EXECUTION_REJECTED

          票据通过，但仓库缺少 Actions Secret：\`OPENROUTER_API_KEY\`。

          - Run: \`${RUN_URL}\`
          - V5模型调用：\`0\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@issue-comment.md

      - name: Execute hardened V5 R8 dynamic graph
        id: execute
        if: steps.prepare.outputs.accepted == 'true' && steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUALITY_TIER: ${{ steps.prepare.outputs.quality_tier }}
          APPROVED_TOTAL_CALLS: ${{ steps.prepare.outputs.calls }}
          APPROVED_RECOVERY_CALLS: ${{ steps.prepare.outputs.maximum_recovery_calls }}
          COST_ANOMALY_USD: ${{ steps.prepare.outputs.cost_anomaly_usd }}
        run: |
          set -euo pipefail
          EXPERT_TASK="$(cat ticket-artifacts/task.txt)"
          args=(
            --task "$EXPERT_TASK"
            --quality-tier "$QUALITY_TIER"
            --maximum-total-calls "$APPROVED_TOTAL_CALLS"
            --maximum-recovery-calls "$APPROVED_RECOVERY_CALLS"
            --require-live-catalog
            --output-dir ticket-artifacts
          )
          if [[ "$COST_ANOMALY_USD" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            args+=(--cost-anomaly-usd "$COST_ANOMALY_USD")
          fi
          python open-model-market/v5_production_ticket.py "${args[@]}" \
            2>&1 | tee ticket-artifacts/execution-console.log

      - name: Publish and verify full V5 report
        id: publish
        if: steps.execute.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf ticket-artifacts/report-comments
          python open-model-market/publish_report.py \
            --report ticket-artifacts/expert-team-report.md \
            --output-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > /tmp/trusted-issue-comments.txt
          for report_comment in ticket-artifacts/report-comments/report-comment-*.md; do
            marker="$(head -n 1 "$report_comment")"
            if grep -Fqx "$marker" /tmp/trusted-issue-comments.txt; then
              echo "Skipping trusted already published report part: $marker"
              continue
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@"$report_comment"
          done

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > /tmp/trusted-issue-comments-after.txt
          while IFS= read -r report_comment; do
            marker="$(head -n 1 "ticket-artifacts/report-comments/$report_comment")"
            grep -Fqx "$marker" /tmp/trusted-issue-comments-after.txt
          done < <(jq -r '.files[]' ticket-artifacts/report-comments/report-comments-manifest.json)
          report_sha="$(jq -r '.report_sha256' ticket-artifacts/report-comments/report-comments-manifest.json)"
          grep -Fq "Report SHA256: \`${report_sha}\`" /tmp/trusted-issue-comments-after.txt

      - name: Run deterministic V5 execution audit
        id: audit
        if: always() && steps.prepare.outputs.accepted == 'true' && steps.secret.outputs.present == 'true'
        continue-on-error: true
        run: |
          python open-model-market/v5_execution_auditor_integrity.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.publish.outcome }}"

      - name: Refresh primary artifact manifest
        id: manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest

          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload primary ticket artifacts
        id: upload_ticket
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-ticket-v5-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Render authoritative V5 final status
        id: final
        if: always() && steps.prepare.outputs.accepted == 'true' && steps.secret.outputs.present == 'true'
        continue-on-error: true
        run: |
          python open-model-market/v5_final_status.py \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" \
            --audit-outcome "${{ steps.audit.outcome }}" \
            --manifest-outcome "${{ steps.manifest.outcome }}" \
            --ticket-upload-outcome "${{ steps.upload_ticket.outcome }}" \
            --artifact-id "${{ steps.upload_ticket.outputs['artifact-id'] }}" \
            --artifact-url "${{ steps.upload_ticket.outputs['artifact-url'] }}" \
            --artifact-digest "${{ steps.upload_ticket.outputs['artifact-digest'] }}" \
            > final-status.md

      - name: Generate post-upload final attestation
        id: attest
        if: always() && steps.final.outcome == 'success'
        continue-on-error: true
        run: |
          audit_status="$(jq -r '.status // "FAIL"' ticket-artifacts/execution-diagnosis.json)"
          python open-model-market/v5_final_attestation.py \
            --output-dir ticket-artifacts \
            --primary-artifact-id "${{ steps.upload_ticket.outputs['artifact-id'] }}" \
            --primary-artifact-digest "${{ steps.upload_ticket.outputs['artifact-digest'] }}" \
            --primary-artifact-url "${{ steps.upload_ticket.outputs['artifact-url'] }}" \
            --audit-status "$audit_status" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --final-status-file final-status.md \
            --output final-attestation.json

      - name: Upload final attestation artifact
        id: upload_attestation
        if: always() && steps.attest.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-ticket-v5-final-attestation-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            final-attestation.json
            final-status.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish authoritative V5 final status
        id: publish_final
        if: always() && steps.final.outcome == 'success'
        continue-on-error: true
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@final-status.md

      - name: Mark failed execution
        if: >-
          always() &&
          steps.prepare.outputs.accepted == 'true' &&
          (steps.secret.outputs.present != 'true' ||
           steps.final.outcome == 'failure' ||
           steps.final.outputs.status == 'FAIL' ||
           steps.attest.outcome != 'success' ||
           steps.upload_attestation.outcome != 'success' ||
           steps.publish_final.outcome != 'success')
        run: exit 1
