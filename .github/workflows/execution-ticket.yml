name: Execution Ticket Expert Team V5

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  admit-ticket:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[execution]') &&
      (startsWith(github.event.comment.body, '/run-expert-team ') ||
       startsWith(github.event.comment.body, '/retry-expert-team '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: expert-production-admission
      cancel-in-progress: false
    outputs:
      allowed: ${{ steps.lock.outputs.allowed }}
      reason: ${{ steps.lock.outputs.reason }}
      accepted: ${{ steps.ticket.outputs.accepted }}
      calls: ${{ steps.ticket.outputs.calls }}
      quality_tier: ${{ steps.ticket.outputs.quality_tier }}
      maximum_recovery_calls: ${{ steps.ticket.outputs.maximum_recovery_calls }}
      maximum_initial_calls: ${{ steps.ticket.outputs.maximum_initial_calls }}
      cost_anomaly_usd: ${{ steps.ticket.outputs.cost_anomaly_usd }}
      task_id: ${{ steps.ticket.outputs.task_id }}
      trigger_mode: ${{ steps.ticket.outputs.trigger_mode }}
      execution_id: ${{ steps.ticket.outputs.execution_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout production source for admission
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce frozen production control plane
        shell: bash
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$production"
          test -n "$main"
          test "$checked" = "$production"
          test "$main" = "$production"
          printf '%s\n' "$checked" > checked-out-production-sha.txt

      - name: Acquire serialized zero-call admission
        id: lock
        run: python open-model-market/v5_admission_lock.py

      - name: Publish explicit busy rejection
        if: steps.lock.outputs.allowed != 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## EXECUTION_REJECTED\n\n${{ steps.lock.outputs.reason }}\n\n模型调用：\`0\`。请等待当前生产任务完成后，在本 Issue 评论新的唯一命令。\n- Run: \`${process.env.RUN_URL}\``
            })

      - name: Validate explicit V5 ticket command
        if: steps.lock.outputs.allowed == 'true'
        id: ticket
        run: |
          python open-model-market/v5_issue_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir ticket-artifacts

      - name: Render admission status
        if: steps.lock.outputs.allowed == 'true'
        id: receipt
        run: |
          if [[ "${{ steps.ticket.outputs.accepted }}" == "true" ]]; then
            phase=accepted
          else
            phase=rejected
          fi
          python open-model-market/v5_issue_ticket.py render \
            --phase "$phase" \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" > admission-status.md

      - name: Upload admission evidence
        if: always() && steps.lock.outputs.allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ticket-admission-${{ github.run_id }}
          path: |
            ticket-artifacts/
            admission-status.md
            checked-out-production-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish admission status
        if: steps.lock.outputs.allowed == 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS_FILE: admission-status.md
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync(process.env.STATUS_FILE, 'utf8')
            })

  execute-ticket:
    needs: admit-ticket
    if: needs.admit-ticket.outputs.allowed == 'true' && needs.admit-ticket.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: expert-production-global
      cancel-in-progress: false
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "4"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: self-managed-open-model-expert-team-v5
    steps:
      - name: Checkout pinned production source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve authoritative execution source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$production"
          test -n "$main"
          test "$checked" = "$production"
          test "$main" = "$production"
          echo "execution_sha=$checked" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$checked" > checked-out-production-sha.txt

      - name: Download admitted ticket
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ticket-admission-${{ github.run_id }}
          path: admission-download

      - name: Restore immutable admission evidence
        run: |
          rm -rf ticket-artifacts
          cp -R admission-download/ticket-artifacts ticket-artifacts

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Enforce admitted execution contract
        run: |
          python open-model-market/v5_ticket_gate.py \
            --output-dir ticket-artifacts \
            --expected-calls "${{ needs.admit-ticket.outputs.calls }}" \
            --expected-recovery-calls "${{ needs.admit-ticket.outputs.maximum_recovery_calls }}" \
            --expected-quality-tier "${{ needs.admit-ticket.outputs.quality_tier }}" \
            --expected-cost-anomaly-usd "${{ needs.admit-ticket.outputs.cost_anomaly_usd }}"

      - name: Execute explicit V5 production runtime
        id: execute
        continue-on-error: true
        run: |
          task="$(cat ticket-artifacts/task.txt)"
          args=(
            --task "$task"
            --output-dir ticket-artifacts
            --quality-tier "${{ needs.admit-ticket.outputs.quality_tier }}"
            --maximum-total-calls "${{ needs.admit-ticket.outputs.calls }}"
            --maximum-recovery-calls "${{ needs.admit-ticket.outputs.maximum_recovery_calls }}"
            --require-live-catalog
          )
          if [[ -n "${{ needs.admit-ticket.outputs.cost_anomaly_usd }}" ]]; then
            args+=(--cost-anomaly-usd "${{ needs.admit-ticket.outputs.cost_anomaly_usd }}")
          fi
          python open-model-market/v5_production_ticket.py "${args[@]}"

      - name: Prepare report publication package
        id: prepare_report
        continue-on-error: true
        run: |
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

      - name: Audit complete native V5 evidence before publication
        id: audit
        continue-on-error: true
        run: |
          python open-model-market/v5_execution_auditor_integrity.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.prepare_report.outcome }}"

      - name: Freeze primary artifact manifest after audit
        id: manifest
        continue-on-error: true
        env:
          AUTHORITATIVE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$AUTHORITATIVE_EXECUTION_SHA"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload primary ticket artifacts
        id: ticket_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ticket-result-${{ github.run_id }}
          path: ticket-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Independently revalidate uploaded primary artifact
        id: independent
        if: always()
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          AUTHORITATIVE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
          MAXIMUM_TOTAL_CALLS: ${{ needs.admit-ticket.outputs.calls }}
          MAXIMUM_COST_USD: ${{ needs.admit-ticket.outputs.cost_anomaly_usd }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_ARTIFACT_ID"
          test -n "$PRIMARY_ARTIFACT_DIGEST"
          maximum_cost="$MAXIMUM_COST_USD"
          if [[ -z "$maximum_cost" ]]; then
            maximum_cost="1000000000"
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$PRIMARY_ARTIFACT_ID/zip" \
            > uploaded-primary-artifact.zip
          rm -rf independently-downloaded-primary
          mkdir independently-downloaded-primary
          unzip -q uploaded-primary-artifact.zip -d independently-downloaded-primary
          set +e
          python open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir independently-downloaded-primary \
            --expected-sha "$AUTHORITATIVE_EXECUTION_SHA" \
            --expected-run-id "${{ github.run_id }}" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-cost-usd "$maximum_cost" \
            --archive uploaded-primary-artifact.zip \
            --expected-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --output independent-revalidation.json
          revalidation_exit=$?
          set -e
          status="$(jq -r '.status // "FAIL"' independent-revalidation.json 2>/dev/null || printf 'FAIL')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$revalidation_exit" -eq 0
          test "$status" = "PASS"

      - name: Publish report only after audit and artifact freeze
        id: publish
        if: >-
          steps.execute.outcome == 'success' &&
          steps.prepare_report.outcome == 'success' &&
          steps.audit.outputs.status == 'PASS' &&
          steps.manifest.outcome == 'success' &&
          steps.ticket_artifact.outcome == 'success' &&
          steps.independent.outcome == 'success' &&
          steps.independent.outputs.status == 'PASS'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          COMMENT_DIR: ticket-artifacts/report-comments
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync(process.env.COMMENT_DIR)
              .filter(name => /^report-comment-\d+\.md$/.test(name))
              .sort();
            if (files.length === 0) {
              throw new Error('No audited report comments found');
            }
            for (const name of files) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fs.readFileSync(path.join(process.env.COMMENT_DIR, name), 'utf8')
              });
            }

      - name: Render authoritative V5 final status
        id: final
        if: always()
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.ticket_artifact.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
        run: |
          effective_audit_outcome="${{ steps.audit.outcome }}"
          if [[ "${{ steps.independent.outcome }}" != "success" || \
                "${{ steps.independent.outputs.status }}" != "PASS" ]]; then
            effective_audit_outcome="independent-artifact-revalidation-failed"
          fi
          python open-model-market/v5_final_status.py \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" \
            --ticket-upload-outcome "${{ steps.ticket_artifact.outcome }}" \
            --audit-outcome "$effective_audit_outcome" \
            --manifest-outcome "${{ steps.manifest.outcome }}" \
            --artifact-id "$PRIMARY_ARTIFACT_ID" \
            --artifact-url "$PRIMARY_ARTIFACT_URL" \
            --artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            | tee final-status.md

      - name: Generate post-upload final attestation
        id: attest
        if: always()
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.ticket_artifact.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          AUTHORITATIVE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
        run: |
          python open-model-market/v5_final_attestation.py \
            --output-dir ticket-artifacts \
            --primary-artifact-id "$PRIMARY_ARTIFACT_ID" \
            --primary-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --primary-artifact-url "$PRIMARY_ARTIFACT_URL" \
            --audit-status "${{ steps.final.outputs.status }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "$AUTHORITATIVE_EXECUTION_SHA" \
            --final-status-file final-status.md \
            --output final-attestation.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          independent_path = Path("independent-revalidation.json")
          if not independent_path.is_file():
              raise SystemExit("independent artifact revalidation is missing")
          independent = json.loads(independent_path.read_text(encoding="utf-8"))
          if independent.get("schema_version") != "v5-independent-artifact-revalidation-3":
              raise SystemExit("independent artifact revalidation schema is not current")
          final_status = json.loads(
              Path("ticket-artifacts/final-status.json").read_text(encoding="utf-8")
          )
          if final_status.get("status") in {"PASS", "DEGRADED"} and independent.get("status") != "PASS":
              raise SystemExit("successful final status requires PASS independent revalidation")
          attestation_path = Path("final-attestation.json")
          attestation = json.loads(attestation_path.read_text(encoding="utf-8"))
          attestation["independent_artifact_revalidation"] = {
              **independent,
              "evidence_sha256": hashlib.sha256(independent_path.read_bytes()).hexdigest(),
          }
          attestation["evidence_chain"] = (
              "frozen-business-evidence -> primary-artifact -> "
              "independent-artifact-revalidation -> final-status -> "
              "final-attestation-artifact"
          )
          attestation_path.write_text(
              json.dumps(attestation, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload final attestation artifact
        id: proof_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-attestation-${{ github.run_id }}
          path: |
            final-attestation.json
            final-status.md
            ticket-artifacts/final-status.json
            independent-revalidation.json
            checked-out-production-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish authoritative V5 final status
        if: always()
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS_FILE: final-status.md
          FINAL_ARTIFACT_ID: ${{ steps.proof_artifact.outputs.artifact-id }}
          FINAL_ARTIFACT_URL: ${{ steps.proof_artifact.outputs.artifact-url }}
          FINAL_ARTIFACT_DIGEST: ${{ steps.proof_artifact.outputs.artifact-digest }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync(process.env.STATUS_FILE, 'utf8');
            body += `\n- Final attestation Artifact ID: \`${process.env.FINAL_ARTIFACT_ID || 'unavailable'}\``;
            body += `\n- Final attestation Artifact digest: \`${process.env.FINAL_ARTIFACT_DIGEST || 'unavailable'}\``;
            if (process.env.FINAL_ARTIFACT_URL) {
              body += `\n- Final attestation Artifact: ${process.env.FINAL_ARTIFACT_URL}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

      - name: Verify authoritative V5 final outcome
        if: always()
        run: |
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.prepare_report.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.status }}" = "PASS"
          test "${{ steps.manifest.outcome }}" = "success"
          test "${{ steps.ticket_artifact.outcome }}" = "success"
          test "${{ steps.independent.outcome }}" = "success"
          test "${{ steps.independent.outputs.status }}" = "PASS"
          test "${{ steps.publish.outcome }}" = "success"
          test "${{ steps.final.outcome }}" = "success"
          test "${{ steps.attest.outcome }}" = "success"
          test "${{ steps.proof_artifact.outcome }}" = "success"
          test "${{ steps.final.outputs.status }}" = "PASS"
