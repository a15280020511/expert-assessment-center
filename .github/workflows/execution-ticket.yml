name: Dynamic Expert Team V5

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  execute-dynamic-team:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[execution]') &&
      (startsWith(github.event.comment.body, '/run-expert-team') ||
       startsWith(github.event.comment.body, '/retry-expert-team'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: dynamic-open-expert-team-v5
      MODEL_TIMEOUT_SECONDS: "240"
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Fetch all governance candidate transport comments
        run: |
          set -euo pipefail
          mkdir -p ticket-artifacts
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments?per_page=100" \
            | jq 'add // []' > ticket-artifacts/issue-comments.json
          jq -e 'type == "array"' ticket-artifacts/issue-comments.json >/dev/null

      - name: Build task-dynamic expert plan
        id: ticket
        run: |
          python open-model-market/v5_price_ranked_issue_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --comments-path ticket-artifacts/issue-comments.json \
            --output-dir ticket-artifacts

      - name: Publish dynamic admission receipt
        env:
          ACCEPTED: ${{ steps.ticket.outputs.accepted }}
        run: |
          if [[ "$ACCEPTED" == "true" ]]; then phase=accepted; else phase=rejected; fi
          python open-model-market/v5_price_ranked_issue_ticket.py render \
            --phase "$phase" \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" > admission-status.md
          gh issue comment "${{ github.event.issue.number }}" --body-file admission-status.md

      - name: Execute dynamic expert graph
        id: execute
        if: steps.ticket.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          task="$(cat ticket-artifacts/task.txt)"
          advisory="$(jq -r '.cost_anomaly_usd // empty' ticket-artifacts/ticket-status.json)"
          args=(
            --task "$task"
            --output-dir ticket-artifacts
            --governance-plan-file ticket-artifacts/ticket.json
            --ranking-limit 1000000
            --require-live-catalog
          )
          if [[ -n "$advisory" ]]; then args+=(--cost-anomaly-usd "$advisory"); fi
          python open-model-market/v5_dynamic_pipeline.py "${args[@]}"

      - name: Publish whatever expert delivery exists
        if: always() && steps.ticket.outputs.accepted == 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.issue.number;
            const candidates = [
              'ticket-artifacts/expert-team-report.md',
              'ticket-artifacts/final-report.md',
              'ticket-artifacts/v5-final-report.md'
            ];
            let text = '';
            let source = '';
            for (const path of candidates) {
              if (fs.existsSync(path)) {
                text = fs.readFileSync(path, 'utf8').trim();
                source = path;
                if (text) break;
              }
            }
            if (!text) {
              for (const path of ['ticket-artifacts/v5-result.json','ticket-artifacts/v5-run-summary.json','ticket-artifacts/expert-team-error.json']) {
                if (fs.existsSync(path)) {
                  text = '```json\n' + fs.readFileSync(path, 'utf8').trim() + '\n```';
                  source = path;
                  break;
                }
              }
            }
            if (!text) {
              text = `执行结束，但没有找到可发布正文。执行步骤状态：${process.env.EXECUTE_OUTCOME}`;
              source = 'runtime-status';
            }
            const limit = 55000;
            const parts = [];
            for (let offset = 0; offset < text.length; offset += limit) {
              parts.push(text.slice(offset, offset + limit));
            }
            if (parts.length === 0) parts.push(text);
            for (let i = 0; i < parts.length; i++) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `## DYNAMIC_EXPERT_RESULT ${i + 1}/${parts.length}\n\n- Source: \`${source}\`\n- Run: \`${process.env.RUN_URL}\`\n- Execution step: \`${process.env.EXECUTE_OUTCOME}\`\n\n${parts[i]}`
              });
            }

      - name: Upload execution evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-expert-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            ticket-artifacts/
            admission-status.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish authoritative governance terminal
        if: always() && steps.ticket.outputs.accepted == 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = context.issue.number;
            const ticketPath = 'ticket-artifacts/ticket-status.json';
            const summaryPath = 'ticket-artifacts/v5-execution-summary.json';
            const ticket = fs.existsSync(ticketPath)
              ? JSON.parse(fs.readFileSync(ticketPath, 'utf8'))
              : {};
            const summary = fs.existsSync(summaryPath)
              ? JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
              : {};
            const taskId = String(ticket.task_id || '').trim();
            const artifactId = String(process.env.ARTIFACT_ID || '').trim();
            const artifactUrl = String(process.env.ARTIFACT_URL || '').trim();
            const artifactDigest = String(process.env.ARTIFACT_DIGEST || '')
              .trim()
              .replace(/^sha256:/i, '');
            const artifactValid = /^\d+$/.test(artifactId)
              && /^[0-9a-f]{64}$/i.test(artifactDigest)
              && artifactUrl.endsWith(`/artifacts/${artifactId}`);

            let heading = 'EXECUTION_FAILED';
            const status = String(summary.status || '').trim();
            const completion = String(summary.completion_mode || '').trim();
            const quality = String(summary.quality_status || '').trim();
            let terminalReason = String(summary.stop_reason || '').trim();
            if (status === 'success' && completion === 'full' && quality === 'full_success') {
              heading = 'EXECUTION_COMPLETED';
            } else if (status === 'success' && completion === 'degraded') {
              heading = 'EXECUTION_DEGRADED';
            } else if (!terminalReason) {
              terminalReason = `execution-step-${process.env.EXECUTE_OUTCOME || 'unknown'}`;
            }
            if (heading === 'EXECUTION_COMPLETED' && !artifactValid) {
              heading = 'EXECUTION_FAILED';
              terminalReason = 'success-evidence-artifact-identity-invalid';
            }

            const totalCalls = summary.total_model_calls ?? summary.model_calls ?? '';
            const actualCost = summary.actual_cost_usd ?? '';
            const providerMode = summary.provider_routing_mode ?? '';
            const lines = [
              `## ${heading}`,
              '',
              `- Task ID: \`${taskId}\``,
              `- Execution status: \`${status || 'missing'}\``,
              `- Completion mode: \`${completion || 'missing'}\``,
              `- Quality status: \`${quality || 'missing'}\``,
              `- Stop reason: \`${terminalReason || 'none'}\``,
              `- Total model calls: \`${totalCalls}\``,
              `- Actual cost USD: \`${actualCost}\``,
              `- Provider routing mode: \`${providerMode || 'missing'}\``,
              `- Run: \`${process.env.RUN_URL}\``,
              `- Artifact topology: \`single-self-contained-v9-artifact\``,
              `- Primary Artifact ID: \`${artifactId}\``,
              `- Primary Artifact digest: \`${artifactDigest}\``,
              `- Primary Artifact: ${artifactUrl}`,
              `- Final attestation Artifact ID: \`${artifactId}\``,
              `- Final attestation Artifact digest: \`${artifactDigest}\``,
              `- Final attestation Artifact: ${artifactUrl}`,
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: lines.join('\n'),
            });
