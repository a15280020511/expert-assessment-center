name: Execution Ticket Price-Ranked Expert Team V5

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  admit-ticket:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[execution]') &&
      (startsWith(github.event.comment.body, '/run-expert-team ') ||
       startsWith(github.event.comment.body, '/retry-expert-team '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: expert-production-admission
      cancel-in-progress: false
    outputs:
      allowed: ${{ steps.lock.outputs.allowed }}
      accepted: ${{ steps.ticket.outputs.accepted }}
      calls: ${{ steps.ticket.outputs.calls }}
      maximum_recovery_calls: ${{ steps.ticket.outputs.maximum_recovery_calls }}
      maximum_initial_calls: ${{ steps.ticket.outputs.maximum_initial_calls }}
      cost_anomaly_usd: ${{ steps.ticket.outputs.cost_anomaly_usd }}
      task_id: ${{ steps.ticket.outputs.task_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout production source for admission
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce frozen production control plane
        shell: bash
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$production"
          test -n "$main"
          test "$checked" = "$production"
          test "$main" = "$production"
          printf '%s\n' "$checked" > checked-out-production-sha.txt

      - name: Acquire serialized zero-call admission
        id: lock
        run: python open-model-market/v5_admission_lock.py

      - name: Publish explicit busy rejection
        if: steps.lock.outputs.allowed != 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## EXECUTION_REJECTED\n\n${{ steps.lock.outputs.reason }}\n\n模型调用：\`0\`。当前生产任务完成后再提交唯一命令。\n- Run: \`${process.env.RUN_URL}\``
            })

      - name: Validate explicit price-ranked ticket command
        if: steps.lock.outputs.allowed == 'true'
        id: ticket
        run: |
          python open-model-market/v5_price_ranked_issue_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir ticket-artifacts

      - name: Render admission status
        if: steps.lock.outputs.allowed == 'true'
        run: |
          if [[ "${{ steps.ticket.outputs.accepted }}" == "true" ]]; then
            phase=accepted
          else
            phase=rejected
          fi
          python open-model-market/v5_price_ranked_issue_ticket.py render \
            --phase "$phase" \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" > admission-status.md

      - name: Upload admission evidence
        if: always() && steps.lock.outputs.allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ticket-admission-${{ github.run_id }}
          path: |
            ticket-artifacts/
            admission-status.md
            checked-out-production-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish admission status
        if: steps.lock.outputs.allowed == 'true'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS_FILE: admission-status.md
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync(process.env.STATUS_FILE, 'utf8')
            })

  execute-ticket:
    needs: admit-ticket
    if: needs.admit-ticket.outputs.allowed == 'true' && needs.admit-ticket.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: expert-production-global
      cancel-in-progress: false
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "4"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: price-ranked-networkx-expert-team-v5
    steps:
      - name: Checkout pinned production source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve authoritative execution source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$production"
          test -n "$main"
          test "$checked" = "$production"
          test "$main" = "$production"
          echo "execution_sha=$checked" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$checked" > checked-out-production-sha.txt

      - name: Download admitted ticket
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ticket-admission-${{ github.run_id }}
          path: admission-download

      - name: Restore immutable admission evidence
        run: |
          rm -rf ticket-artifacts
          cp -R admission-download/ticket-artifacts ticket-artifacts

      - name: Install pinned runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Enforce admitted price-ranked execution contract
        run: |
          python open-model-market/v5_price_ranked_ticket_gate.py \
            --output-dir ticket-artifacts \
            --expected-calls "${{ needs.admit-ticket.outputs.calls }}" \
            --expected-recovery-calls "${{ needs.admit-ticket.outputs.maximum_recovery_calls }}" \
            --expected-cost-anomaly-usd "${{ needs.admit-ticket.outputs.cost_anomaly_usd }}"

      - name: Execute explicit price-ranked production runtime
        id: execute
        continue-on-error: true
        env:
          AUTHORITATIVE_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
        run: |
          task="$(cat ticket-artifacts/task.txt)"
          args=(
            --task "$task"
            --output-dir ticket-artifacts
            --maximum-total-calls "${{ needs.admit-ticket.outputs.calls }}"
            --maximum-recovery-calls "${{ needs.admit-ticket.outputs.maximum_recovery_calls }}"
            --require-live-catalog
          )
          if [[ -n "${{ needs.admit-ticket.outputs.cost_anomaly_usd }}" ]]; then
            args+=(--cost-anomaly-usd "${{ needs.admit-ticket.outputs.cost_anomaly_usd }}")
          fi
          python open-model-market/v5_price_ranked_production_ticket.py "${args[@]}"

      - name: Prepare report publication package
        id: prepare_report
        continue-on-error: true
        run: |
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

      - name: Audit complete price-ranked evidence before publication
        id: audit
        continue-on-error: true
        run: |
          python open-model-market/v5_price_ranked_execution_auditor.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.prepare_report.outcome }}"

      - name: Freeze primary artifact manifest after audit
        id: manifest
        continue-on-error: true
        run: |
          PYTHONPATH=open-model-market python - <<'PY'
          from pathlib import Path
          from v5_price_ranked_artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload primary ticket artifacts
        id: ticket_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expert-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Download uploaded primary artifact by immutable ID
        id: artifact_download
        if: steps.ticket_artifact.outcome == 'success'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          mkdir -p primary-artifact-download
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > primary-artifact.zip
          unzip -q primary-artifact.zip -d primary-artifact-download

      - name: Independently revalidate uploaded primary artifact
        id: independent
        if: steps.artifact_download.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p final-proof
          cost_advisory="${{ needs.admit-ticket.outputs.cost_anomaly_usd }}"
          if [[ -z "$cost_advisory" ]]; then cost_advisory=0; fi
          python open-model-market/v5_price_ranked_independent_revalidation.py \
            --artifact-dir primary-artifact-download \
            --expected-sha "${{ steps.source.outputs.execution_sha }}" \
            --expected-run-id "${{ github.run_id }}" \
            --maximum-calls "${{ needs.admit-ticket.outputs.calls }}" \
            --cost-advisory-usd "$cost_advisory" \
            --archive primary-artifact.zip \
            --expected-artifact-digest "${{ steps.ticket_artifact.outputs.artifact-digest }}" \
            --output final-proof/independent-artifact-revalidation.json
          status="$(jq -r '.status' final-proof/independent-artifact-revalidation.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish report only after audit and artifact freeze
        id: publish
        if: >-
          steps.audit.outputs.status == 'PASS' &&
          steps.manifest.outcome == 'success' &&
          steps.ticket_artifact.outcome == 'success' &&
          steps.independent.outputs.status == 'PASS'
        continue-on-error: true
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          COMMENTS_DIR: ticket-artifacts/report-comments
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = process.env.COMMENTS_DIR;
            const files = fs.readdirSync(dir)
              .filter(name => name.endsWith('.md'))
              .sort();
            for (const name of files) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fs.readFileSync(path.join(dir, name), 'utf8')
              });
            }

      - name: Render authoritative V5 final status
        id: final
        if: always()
        env:
          V5_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
          V5_PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          V5_PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          V5_PRIMARY_ARTIFACT_URL: ${{ steps.ticket_artifact.outputs.artifact-url }}
        run: |
          python open-model-market/v5_final_status.py \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --prepare-outcome "${{ steps.prepare_report.outcome }}" \
            --audit-outcome "${{ steps.audit.outcome }}" \
            --audit-status "${{ steps.audit.outputs.status }}" \
            --manifest-outcome "${{ steps.manifest.outcome }}" \
            --primary-artifact-outcome "${{ steps.ticket_artifact.outcome }}" \
            --independent-outcome "${{ steps.independent.outcome }}" \
            --independent-status "${{ steps.independent.outputs.status }}" \
            --publish-outcome "${{ steps.publish.outcome }}" \
            --output ticket-artifacts/final-status.md \
            --record-output ticket-artifacts/final-status.json

      - name: Generate post-upload final attestation
        id: attest
        if: always() && steps.ticket_artifact.outcome == 'success'
        continue-on-error: true
        env:
          V5_EXECUTION_SHA: ${{ steps.source.outputs.execution_sha }}
          V5_PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          V5_PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          V5_PRIMARY_ARTIFACT_URL: ${{ steps.ticket_artifact.outputs.artifact-url }}
        run: |
          python open-model-market/v5_final_attestation.py \
            --output-dir ticket-artifacts \
            --final-status ticket-artifacts/final-status.json \
            --independent-revalidation final-proof/independent-artifact-revalidation.json \
            --output final-proof/final-attestation.json

      - name: Upload final attestation artifact
        id: proof_artifact
        if: always() && steps.attest.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expert-ticket-final-proof-${{ github.event.issue.number }}-${{ github.run_id }}
          path: final-proof/
          if-no-files-found: error
          retention-days: 30

      - name: Publish authoritative final status
        if: always()
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS_FILE: ticket-artifacts/final-status.md
        with:
          script: |
            const fs = require('fs');
            const fallback = `## V5_FINAL_STATUS: FAIL\n\nRun: ${process.env.RUN_URL}`;
            const body = fs.existsSync(process.env.STATUS_FILE)
              ? fs.readFileSync(process.env.STATUS_FILE, 'utf8')
              : fallback;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Verify authoritative V5 final outcome
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.prepare_report.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.status }}" = "PASS"
          test "${{ steps.manifest.outcome }}" = "success"
          test "${{ steps.ticket_artifact.outcome }}" = "success"
          test "${{ steps.independent.outcome }}" = "success"
          test "${{ steps.independent.outputs.status }}" = "PASS"
          test "${{ steps.publish.outcome }}" = "success"
          test "${{ steps.attest.outcome }}" = "success"
          test "${{ steps.proof_artifact.outcome }}" = "success"
          test "${{ steps.final.outputs.status }}" = "PASS"
