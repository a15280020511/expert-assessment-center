name: PR227 Live Contract Fix

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.pr227-live-contract-fix.patch
      - .github/workflows/pr227-live-contract-fix.yml

permissions:
  contents: write

concurrency:
  group: pr227-live-contract-fix
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply root-cause patch
        run: |
          set -euo pipefail
          echo "684d0ab5ba6b8788873145e6ec4ee98df668e9f3bdec616e9e4dbef0904f08aa  tools/.pr227-live-contract-fix.patch" | sha256sum --check
          git apply --check tools/.pr227-live-contract-fix.patch
          git apply tools/.pr227-live-contract-fix.patch
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked development dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static, focused and full regression gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest tests.test_v5_claude_red_team_advice -v
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-live-contract-audit \
            --fail-on medium

      - name: Commit validated fix and remove staging assets
        run: |
          set -euo pipefail
          rm tools/.pr227-live-contract-fix.patch
          rm .github/workflows/pr227-live-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: align GPT and Claude function contracts"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
