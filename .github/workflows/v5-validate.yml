name: Validate V5 Governance-Plan Architecture

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-governance-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Verify current architecture contract
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('open-model-market/constitutional_policy.json').read_text())
          assert policy['schema_version'] == 'v5-constitutional-policy-8-task-adaptive-value-ortools'
          assert policy['candidate_pool']['pool_size'] == 50
          assert policy['candidate_pool']['popularity_period'] == 'week'
          optimizer = policy['optimizer_runtime']
          assert optimizer['engine'] == 'ortools-cp-sat'
          assert optimizer['primary_expert_count'] == 4
          assert optimizer['warm_recovery_count'] == 4
          assert optimizer['required_solver_status'] == 'OPTIMAL'
          assert optimizer['selection_principles'] == [
              'concrete-problem-concrete-analysis',
              'dynamic-adaptation',
              'small-effort-large-return',
          ]
          assert optimizer['provider_metric_used'] is False
          matching = policy['dynamic_task_matching']
          assert matching['recomputed_from_current_task'] is True
          assert matching['cross_task_history_allowed'] is False
          assert matching['keyword_routing_allowed'] is False
          assert matching['domain_hardcoding_allowed'] is False
          privacy = policy['expert_endpoint_privacy']
          assert privacy['provider_routing_mode'] == 'unrestricted-openrouter'
          assert privacy['provider_allowlist_allowed'] is False
          assert privacy['provider_order_allowed'] is False
          assert privacy['openrouter_selects_provider'] is True
          assert privacy['model_substitution_allowed'] is False
          source = Path('open-model-market/v5_price_ranked_pipeline.py').read_text()
          assert 'provider_lock_required=False' in source
          assert 'fetch_live_endpoint_payloads' not in source
          PY

      - name: Run current architecture tests
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python -m unittest -v \
            tests.test_v5_task_adaptive_scoring \
            tests.test_top50_pool_optimizer \
            tests.test_v5_top50_ticket_gate_capacity \
            tests.test_v5_constitution_policy \
            tests.test_v5_planned_catalog_scope

      - name: Run exact Top50 4+4 zero-call materialization
        run: |
          set -euo pipefail
          rm -rf v5-validation-artifacts
          mkdir -p v5-validation-artifacts
          PYTHONPATH=open-model-market:. python - <<'PY'
          import json
          from pathlib import Path
          from tests.test_top50_pool_optimizer import _packet
          from v5_governance_model_plan import validate_governance_model_plan
          from v5_top50_pool_optimizer import materialize_top50_selection

          packet, receipt = materialize_top50_selection(_packet())
          plan = validate_governance_model_plan(packet)
          assert receipt['model_calls'] == 0
          assert len(plan['selected_models']) == 4
          assert len(plan['recovery_models']) == 4
          assert len({r['company'] for r in [*plan['selected_models'], *plan['recovery_models']]}) == 8
          assert plan['optimizer_audit']['optimality_proven'] is True
          assert plan['task_adaptive_scoring_completed'] is True
          assert plan['provider_routing_mode'] == 'unrestricted-openrouter'
          Path('v5-validation-artifacts/materialized-ticket.json').write_text(
              json.dumps(packet, ensure_ascii=False, indent=2)
          )
          Path('v5-validation-artifacts/selection-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2)
          )
          PY

      - name: Upload V5 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-plan-validation-${{ github.run_id }}
          path: v5-validation-artifacts/
          if-no-files-found: warn
          retention-days: 14
