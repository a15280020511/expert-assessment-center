name: Validate V5 Advisory Architecture

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/v5-validate.yml"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/v5-validate.yml"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  validate-v5-advisory:
    name: Validate GPT Claude advisory runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Verify advisory-only architecture
        shell: bash
        run: |
          set -euo pipefail
          required=(
            open-model-market/v5_pipeline.py
            open-model-market/v5_gpt_expert_selector.py
            open-model-market/v5_claude_red_team_policy.py
            open-model-market/v5_single_pass_advisory.py
            open-model-market/v5_governance_runtime.py
            open-model-market/v5_proposal_materializer.py
            open-model-market/execution_graph_validator.py
            open-model-market/v5_runtime.py
          )
          for path in "${required[@]}"; do test -s "$path"; done
          removed=(
            open-model-market/v5_constitutional_pipeline.py
            open-model-market/v5_planner.py
            open-model-market/v5_value_optimizer.py
            open-model-market/v5_operational_resilience.py
            open-model-market/v5_benchmark.py
            open-model-market/v5_cross_endpoint_planner.py
            open-model-market/v5_cross_endpoint_planner_impl.py
            open-model-market/v5_dynamic_configuration.py
            open-model-market/v5_planning_diagnostics.py
            open-model-market/v5_single_pass_dialectic_gate.py
          )
          for path in "${removed[@]}"; do test ! -e "$path"; done
          ! grep -R --line-number --exclude-dir=.git \
            -E 'ortools|cp_model|google-or-tools-cp-sat|optimize_execution_graph|pareto_prune' \
            open-model-market requirements-runtime.txt
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          from v5_claude_red_team_policy import (
              CLAUDE_RED_TEAM_GOVERNANCE_CALLS,
              CLAUDE_RED_TEAM_MAX_CALLS_PER_TASK,
              CLAUDE_RED_TEAM_MODEL,
              GPT_SYNTHESIS_CALLS_MAX,
          )
          from v5_gpt_expert_selector import GPT_SELECTOR_MODEL

          assert GPT_SELECTOR_MODEL == "~openai/gpt-latest"
          assert CLAUDE_RED_TEAM_MODEL == "~anthropic/claude-opus-latest"
          assert CLAUDE_RED_TEAM_MAX_CALLS_PER_TASK == 1
          assert GPT_SYNTHESIS_CALLS_MAX == 1
          assert CLAUDE_RED_TEAM_GOVERNANCE_CALLS == 3
          source = Path(
              "open-model-market/v5_governance_runtime.py"
          ).read_text(encoding="utf-8")
          assert "claude_is_advisory_only" in source
          assert "claude_gatekeeping_allowed" in source
          assert "final_authority" in source
          assert "deterministic-constitutional-validator" in source
          PY
      - name: Run static and constitutional tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5-validation-logs
          python -m ruff check . 2>&1 | tee v5-validation-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee v5-validation-logs/compileall.log
          python -m unittest \
            tests.test_v5_claude_red_team_advice \
            tests.test_v5_single_pass_advisory \
            tests.test_v5_admission_task_isolation \
            tests.test_v5_full_load_stability \
            tests.test_execution_graph_validator \
            tests.test_v5_constitutional_runtime \
            tests.test_v5_task_constraints \
            tests.test_v5_evidence_bundle \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed \
            -v 2>&1 | tee v5-validation-logs/critical-tests.log
      - name: Run zero-call advisory dry-run
        shell: bash
        run: |
          set -euo pipefail
          python open-model-market/v5_pipeline.py \
            --task "比较三个公共投资方案，给出风险、证据和最终决策。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 8 \
            --maximum-recovery-calls 1 \
            --quality-tier value \
            --output-dir v5-validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("v5-validation-artifacts")
          dry = json.loads((root / "v5-dry-run.json").read_text())
          runtime = json.loads((root / "v5-runtime-config.json").read_text())
          assert dry["status"] == "validated-not-executed"
          assert dry["model_calls"] == 0
          assert dry["proposal_request"]["model"] == "~openai/gpt-latest"
          assert dry["claude_model"] == "~anthropic/claude-opus-latest"
          assert dry["claude_calls_per_task"] == 1
          assert dry["claude_is_advisory_only"] is True
          assert dry["claude_gatekeeping_allowed"] is False
          assert dry["gpt_synthesis_calls"] == 1
          assert dry["local_scoring_used"] is False
          assert dry["optimizer_used"] is False
          assert dry["cp_sat_used"] is False
          assert runtime["final_authority"] == "deterministic-constitutional-validator"
          assert not (root / "v5-execution-graph.json").exists()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v5-advisory-validation-${{ github.run_id }}
          path: |
            v5-validation-artifacts/
            v5-validation-logs/
          if-no-files-found: warn
          retention-days: 7
