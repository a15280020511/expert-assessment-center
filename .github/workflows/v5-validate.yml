name: Validate V5 Fully Dynamic Expert Architecture

on:
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-dynamic-expert-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dynamic-experts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Verify fully dynamic no-tools architecture contract
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          import v5_top50_pool_optimizer as optimizer
          from pathlib import Path
          policy = json.loads(Path('open-model-market/constitutional_policy.json').read_text())
          assert policy['schema_version'] == 'v5-constitutional-policy-10-fully-dynamic-no-tools'
          assert policy['only_hard_model_boundary'] == 'no-tools'
          admission = policy['execution_admission']
          for key in (
              'free_first_required', 'zero_call_qualification_required',
              'free_canary_required', 'full_ci_pass_required_before_task_execution',
              'exact_sha_evidence_required', 'paid_execution_requires_prior_qualification',
          ):
              assert admission[key] is False, key
          pool = policy['candidate_pool']
          assert pool['source'] == 'openrouter-live-reasoning-most-popular-catalog'
          assert pool['source_definition']['sort'] == 'most-popular'
          assert pool['source_definition']['supported_parameters'] == 'reasoning'
          assert pool['source_definition']['output_modalities'] == 'text'
          assert pool['fixed_pool_size'] is None
          assert pool['fixed_top_n_allowed'] is False
          for key in (
              'top50_only', 'top20_only', 'weekly_rank_required',
              'reasoning_rank_required', 'flagship_filter_required',
              'price_filter_required', 'company_diversity_required',
              'provider_endpoint_qualification_required', 'zdr_provider_qualification_required',
          ):
              assert pool[key] is False, key
          assert pool['tool_use_forbidden'] is True
          assert pool['tools_allowed'] is False
          matching = policy['dynamic_task_matching']
          assert matching['required'] is True
          assert matching['all_calculable_planning_parameters_dynamic'] is True
          for key in (
              'task_volume', 'evidence_volume', 'constraint_pressure',
              'delivery_pressure', 'prompt_token_estimate',
              'completion_token_estimate', 'protocol_reserve',
              'dependency_fan_in', 'team_size', 'recovery_size',
              'roles', 'role_topology', 'model_assignment', 'role_weights',
              'solver_time',
          ):
              assert matching[key] == 'task-derived', key
          assert matching['solver_seed'] == 'task-derived-reproducible'
          assert matching['company_mix'] == 'unconstrained'
          assert matching['model_substitution_allowed'] is True
          optimizer_runtime = policy['optimizer_runtime']
          assert optimizer_runtime['engine'] == 'ortools-cp-sat'
          assert optimizer_runtime['optimality_required'] is False
          assert optimizer_runtime['feasible_solution_allowed'] is True
          assert optimizer_runtime['heuristic_fallback_allowed'] is True
          for key in (
              'company_uniqueness_constraint', 'top50_membership_constraint',
              'fixed_role_slot_constraint', 'fixed_recovery_slot_constraint',
              'approved_budget_constraint', 'provider_constraint',
              'capacity_constraint', 'free_route_penalty_required',
              'company_overlap_penalty_required',
          ):
              assert optimizer_runtime[key] is False, key
          provider = policy['provider_routing']
          assert provider['mode'] == 'unrestricted-openrouter'
          assert provider['provider_allowlist_allowed'] is False
          assert provider['provider_order_allowed'] is False
          assert provider['provider_ignore_list_allowed'] is False
          assert provider['provider_price_filter_allowed'] is False
          assert provider['provider_zdr_filter_required'] is False
          assert provider['exact_provider_lock_required'] is False
          assert provider['openrouter_selects_provider'] is True
          assert provider['provider_fallback_allowed'] is True
          assert provider['provider_may_change_model_identity'] is False
          assert provider['model_substitution_authority'] == 'expert-assessment-center-dynamic-recovery'
          resource = policy['resource_governance']
          assert resource['fixed_total_call_ceiling'] is False
          assert resource['fixed_initial_call_ceiling'] is False
          assert resource['fixed_recovery_call_ceiling'] is False
          assert resource['finite_execution_graph_required'] is True
          assert resource['unbounded_recursive_retry_allowed'] is False
          tools = policy['tool_policy']
          assert tools['request_tool_fields_forbidden'] is True
          assert tools['response_tool_evidence_forbidden'] is True
          source = Path('open-model-market/v5_price_ranked_pipeline.py').read_text()
          assert 'provider_lock_required=False' in source
          dynamic = Path('open-model-market/v5_dynamic_pipeline.py').read_text()
          assert 'only_hard_model_boundary' in dynamic
          assert 'model_substitution_allowed": True' in dynamic
          assert getattr(optimizer, 'HIERARCHICAL_TASK_PARAMETER_PLANNER_ACTIVE', False) is True

          # There must be one planning implementation, not a legacy fixed planner
          # beside the new Parameter Graph. The historical module is only a facade.
          facade = Path('open-model-market/v5_hierarchical_task_planner.py').read_text()
          assert 'v5_dynamic_parameter_graph' in facade
          assert 'legacy_fixed_parameter_catalog_used' in facade
          assert 'legacy_fixed_role_grammar_used' in facade
          planner = Path('open-model-market/v5_dynamic_parameter_graph.py').read_text()
          for token in (
              'task-derived-work-dag',
              'effective-parameter-instance-discovery',
              'parameter-dependency-graph',
              'conditional-optuna-team-and-recovery-resolution',
              'task-dag-role-partition',
              'ortools-model-assignment',
              'consumed_by',
              'unconsumed_parameter_count',
          ):
              assert token in planner, token
          orchestrator = Path('open-model-market/v5_governed_plan_orchestrator.py').read_text()
          assert 'depends_on_role_ids' in orchestrator
          assert 'fixed_role_grammar_used' in orchestrator
          PY

      - name: Compile dynamic expert runtime
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests

      - name: Run dynamic architecture tests
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python -m unittest -v \
            tests.test_workflow_contract \
            tests.test_legacy_runtime_removed \
            tests.test_v5_constitution_policy \
            tests.test_v5_task_adaptive_scoring \
            tests.test_top50_pool_optimizer \
            tests.test_v5_hierarchical_task_parameter_planner \
            tests.test_v5_task_derived_parameter_graph \
            tests.test_v5_no_tools_network_policy

      - name: Verify active execution path has no Provider pinning or model business gates
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import v5_top50_pool_optimizer as optimizer
          from pathlib import Path
          for name in (
              'v5_dynamic_pipeline.py',
              'v5_price_ranked_pipeline.py',
              'v5_production_expert_policy.py',
              'v5_provider_lock.py',
          ):
              text = (Path('open-model-market') / name).read_text().casefold()
              assert 'allow_fallbacks": false' not in text, name
              assert "allow_fallbacks': false" not in text, name
              assert 'require_parameters": true' not in text, name
              assert 'provider.only' not in text, name
              assert 'provider.order' not in text, name
          dynamic = (Path('open-model-market') / 'v5_dynamic_pipeline.py').read_text().casefold()
          assert 'model_substitution_allowed": true' in dynamic
          no_tools = (Path('open-model-market') / 'v5_no_tools_policy.py').read_text().casefold()
          for token in ('tools', 'tool_choice', 'function_call', 'web_search', 'mcp'):
              assert token in no_tools, token
          assert getattr(optimizer, 'HIERARCHICAL_TASK_PARAMETER_PLANNER_ACTIVE', False) is True
          PY
