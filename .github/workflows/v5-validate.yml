name: Validate V5 Dynamic Graph

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/v5-validate.yml"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/v5-validate.yml"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  validate-v5:
    name: Validate V5 optimizer and DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify dependencies and compile V5
        run: |
          python -m pip check
          python -m py_compile \
            open-model-market/execution_graph.py \
            open-model-market/execution_graph_validator.py \
            open-model-market/task_semantic_compiler.py \
            open-model-market/atomic_work_graph.py \
            open-model-market/resource_matrix.py \
            open-model-market/v5_planner.py \
            open-model-market/v5_planning_runtime.py \
            open-model-market/v5_global_company_calibration.py \
            open-model-market/v5_cross_endpoint_planner.py \
            open-model-market/v5_task_constraints.py \
            open-model-market/v5_constitutional_runtime.py \
            open-model-market/v5_constitutional_pipeline.py \
            open-model-market/v5_value_optimizer.py \
            open-model-market/v5_runtime.py \
            open-model-market/v5_benchmark.py \
            open-model-market/v5_pipeline.py \
            open-model-market/v5_production_ticket.py \
            open-model-market/v5_execution_auditor.py \
            open-model-market/v5_execution_auditor_integrity.py \
            open-model-market/v5_independent_artifact_revalidation.py \
            open-model-market/v5_final_attestation.py \
            open-model-market/v5_total_call_cap.py
      - name: Run V5 unit and recovery tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests.test_v5_task_resource_compiler \
            tests.test_execution_graph_validator \
            tests.test_execution_graph_properties \
            tests.test_v5_planner_executor \
            tests.test_v5_explicit_runtime \
            tests.test_v5_empty_output_recovery \
            tests.test_v5_constitutional_runtime \
            tests.test_v5_task_constraints \
            tests.test_v5_dynamic_model_fit \
            tests.test_v5_global_company_calibration \
            tests.test_v5_r8_gate_wiring \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed \
            -v 2>&1 | tee v5-unit-test.log
      - name: Run deterministic constitutional V5 end-to-end dry-run
        run: |
          python open-model-market/v5_constitutional_pipeline.py \
            --task "比较三个城市公共投资方案，完成财务建模、政策与法律合规、证据核验、预测推演、独立红队反证和最终决策。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 16 \
            --maximum-recovery-calls 2 \
            --quality-tier value \
            --output-dir v5-validation-artifacts
      - name: Verify V5 artifacts and safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("v5-validation-artifacts")
          market = json.loads((root / "v5-model-endpoint-market.json").read_text())
          candidates = json.loads((root / "v5-candidate-graph.json").read_text())
          optimization = json.loads((root / "v5-optimization.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          dry = json.loads((root / "v5-dry-run.json").read_text())
          search = json.loads((root / "v5-adaptive-search.json").read_text())
          benchmark = json.loads((root / "v5-planning-benchmark.json").read_text())
          runtime = json.loads((root / "v5-runtime-config.json").read_text())
          snapshot = json.loads((root / "catalog-snapshot.json").read_text())
          constraints = json.loads((root / "task-constraints.json").read_text())
          forbidden = {
              "tools", "tool_choice", "plugins", "web_search", "web_search_options",
              "file_search", "browser", "code_interpreter", "models",
          }

          assert market["version"] == 5
          assert market["real_endpoint_count"] > 0
          assert market["synthetic_fixture_count"] == 0
          assert market["phase_b_invariants"]["provider_endpoint_is_explicit"] is True
          assert market["candidate_pool_policy"] == "task-adaptive-multi-channel-deduplicated"
          assert market["candidate_pool_expansion_policy"] == "feasibility-and-marginal-value-driven"
          assert market["planning_policy"]["capability_pool_policy"] == "evidence-backed-global-company-assignment-calibration"
          assert market["planning_policy"]["proxy_floor_lowered"] is False
          assert market["cross_task_history_used"] is False
          assert market["fixed_preselection_weight_tuple_used"] is False
          assert market["fixed_task_fit_weight_tuple_used"] is False
          assert market["preselection_policy"] == "task-derived-normalized-objective"
          assert market["task_fit_policy"] == "task-profile-derived-normalized-features"
          assert abs(sum(market["preselection_objective_weights"].values()) - 1.0) < 1e-9
          assert abs(sum(market["task_fit_feature_weights"].values()) - 1.0) < 1e-9
          assert search["policy"] == "task-shape-feasibility-marginal-value"
          assert search["attempts"]
          assert search["ranking_emergency_ceiling"] <= 150
          assert search["candidate_emergency_ceiling_per_work"] == 64
          assert search["cross_task_history_used"] is False
          assert 0.0 <= search["dynamic_quality_tolerance_pct"] <= search["quality_tolerance_platform_ceiling_pct"]
          assert candidates["candidate_count_after_pareto"] > 0
          assert candidates["candidate_count_after_pareto"] <= candidates["candidate_count_before_pareto"]
          calibration = candidates["hard_capability_calibration"]
          assert calibration["version"] == 3
          assert calibration["model_company_policy"] == "task-global-all-different"
          assert calibration["capability_scores_modified"] is False
          assert calibration["task_demands_modified"] is False
          assert calibration["hard_labels_modified"] is False
          assert calibration["proxy_floor_lowered"] is False
          assert calibration["cross_task_history_used"] is False
          assert optimization["version"] == 5
          assert optimization["optimizer"] == "google-or-tools-cp-sat"
          assert optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"}
          assert optimization["fallback_used"] is False
          assert optimization["highest_principle"] == "maximum_cost_performance"
          assert optimization["objective_order"] == ["hard_constraints", "maximum_expected_cost_performance"]
          assert optimization["cost_performance_ratio"] > 0
          assert optimization["selected_initial_cost_usd"] > 0
          assert optimization["selected_expected_recovery_cost_usd"] >= 0
          assert optimization["selected_effective_cost_usd"] >= optimization["selected_initial_cost_usd"]
          assert optimization["marginal_utility_stop"]["mandatory_work_exception"]
          assert optimization["approved_budget"]["maximum_total_calls"] == 16
          assert optimization["approved_budget"]["maximum_recovery_calls"] == 2
          assert optimization["approved_budget"]["maximum_initial_calls"] == 14
          assert optimization["approved_budget"]["planning_node_policy"] == "optimizer-decides-within-call-budget"
          assert optimization["approved_budget"]["quality_tier_policy"] == "compatibility-label-not-fixed-weight-tuple"
          assert graph["metadata"]["highest_principle"] == "maximum_cost_performance"
          assert graph["metadata"]["marginal_utility_stop"]
          assert 1 <= len(graph["nodes"]) <= 14
          assert len(graph["execution_stages"]) <= 8
          assert graph["entry_nodes"]
          assert graph["final_nodes"]
          assert graph["required_work"]
          companies = [node["parameter_profile"]["model_company"] for node in graph["nodes"]]
          assert len(companies) == len(set(companies))
          assert dry["status"] == "planned-not-executed"
          assert dry["production_entrypoint_changed"] is True
          assert dry["global_monkey_patching"] is False
          assert dry["model_company_policy"] == "task-global-all-different"
          assert dry["approved_budget"]["maximum_total_calls"] == 16
          assert dry["task_constraints"] == constraints
          assert constraints["external_tools_allowed"] is False
          assert constraints["fail_closed"] is True
          assert runtime["global_monkey_patching"] is False
          assert runtime["cross_task_history_used"] is False
          assert runtime["configuration"]["initial_call_limit"] == 14
          assert snapshot["cross_task_history_used"] is False
          assert snapshot["catalog_snapshot_id"] == dry["catalog_snapshot_id"]
          assert benchmark["planning_gate_passed"] is True
          assert benchmark["cost_performance_claim_allowed"] is True
          assert benchmark["feasible_comparator_count"] >= 2
          assert benchmark["runtime_policy"] == "v5-only-no-alternate-runtime"
          assert set(benchmark["strategies"]) == {
              "v5_joint_graph",
              "strongest_single_model",
              "lowest_price_single_model",
              "random_feasible",
              "lowest_cost_feasible",
              "highest_utility_feasible",
          }
          assert benchmark["strategies"]["lowest_cost_feasible"]["feasible"] is True
          assert benchmark["strategies"]["highest_utility_feasible"]["feasible"] is True

          allowances = []
          for node, request in zip(graph["nodes"], dry["requests"]):
              assert not forbidden.intersection(request)
              token_fields = [
                  key for key in ("max_tokens", "max_completion_tokens")
                  if key in request
              ]
              assert len(token_fields) <= 1
              if token_fields:
                  allowance = request[token_fields[0]]
                  assert isinstance(allowance, int)
                  assert 1024 <= allowance <= 32768
                  assert node["parameter_profile"]["output_allowance_is_cost_assumption"] is False
                  assert node["parameter_profile"]["estimated_completion_usage_tokens"] <= allowance
                  allowances.append(allowance)
              assert not request["model"].startswith("openrouter/")
              assert ":online" not in request["model"]
              assert ":batch" not in request["model"]
              assert request["provider"]["allow_fallbacks"] is False
              assert request["provider"]["only"]
              assert request["provider"]["order"] == request["provider"]["only"]
          assert allowances

          assert (root / "task-interpretations.json").exists()
          assert (root / "atomic-work-graph.json").exists()
          assert (root / "task-resource-matrix.json").exists()
          assert (root / "v5-adaptive-search.json").exists()
          assert (root / "task-constraints.json").exists()
          assert (root / "artifact-manifest.json").exists()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v5-validation-${{ github.run_id }}
          path: |
            v5-validation-artifacts/
            v5-unit-test.log
          if-no-files-found: warn
          retention-days: 7
