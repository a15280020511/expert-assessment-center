name: Validate V5 Dynamic Graph

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/v5-validate.yml"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - "open-model-market/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/v5-validate.yml"
      - "requirements*.txt"

permissions:
  contents: read

jobs:
  validate-v5:
    name: Validate constitutional V5 optimizer and DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Verify constitutional architecture
        shell: bash
        run: |
          set -euo pipefail
          test -s open-model-market/v5_constitutional_pipeline.py
          test -s open-model-market/v5_constitutional_runtime.py
          test -s open-model-market/v5_task_constraints.py
          test -s open-model-market/v5_execution_primitives.py
          test -s open-model-market/v5_independent_artifact_revalidation.py
          test -s open-model-market/legacy-cleanup-report.json
          test -s open-model-market/constitutional-qualification-report.json
          test ! -e open-model-market/v5_executor.py
          test ! -e open-model-market/v5_total_call_cap.py
          test ! -e open-model-market/v5_production_hardening.py
          test ! -e open-model-market/v5_r8_executor.py
          test "$(jq -r '.status' open-model-market/legacy-cleanup-report.json)" = "PASS"
          test "$(jq -r '.v5_executor_production_reachable' open-model-market/legacy-cleanup-report.json)" = "false"
          if grep -RInE --include='*.py' 'def install\(|\.install\(' open-model-market tests; then
            echo "Legacy install hook remains" >&2
            exit 1
          fi
      - name: Run canonical static gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v5-validation-logs
          python -m ruff check . 2>&1 | tee v5-validation-logs/ruff.log
          python -m compileall -q open-model-market tests tools 2>&1 | tee v5-validation-logs/compileall.log
      - name: Run critical constitutional and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_v5_task_resource_compiler \
            tests.test_execution_graph_validator \
            tests.test_execution_graph_properties \
            tests.test_v5_constitutional_runtime \
            tests.test_v5_task_constraints \
            tests.test_v5_dynamic_model_fit \
            tests.test_v5_global_company_calibration \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_independent_artifact_revalidation \
            tests.test_v5_full_load_stability \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed \
            -v 2>&1 | tee v5-validation-logs/critical-tests.log
      - name: Run deterministic constitutional dry-run
        shell: bash
        run: |
          set -euo pipefail
          python open-model-market/v5_constitutional_pipeline.py \
            --task "比较三个城市公共投资方案，完成财务建模、政策与法律合规、证据核验、预测推演、独立红队反证和最终决策。" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 16 \
            --maximum-recovery-calls 2 \
            --quality-tier value \
            --output-dir v5-validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("v5-validation-artifacts")
          market = json.loads((root / "v5-model-endpoint-market.json").read_text())
          optimization = json.loads((root / "v5-optimization.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          dry = json.loads((root / "v5-dry-run.json").read_text())
          constraints = json.loads((root / "task-constraints.json").read_text())
          companies = [
              node["parameter_profile"]["model_company"]
              for node in graph["nodes"]
          ]
          assert optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"}
          assert optimization["optimizer"] == "google-or-tools-cp-sat"
          assert len(companies) == len(set(companies))
          assert dry["global_monkey_patching"] is False
          assert dry["model_company_policy"] == "task-global-all-different"
          assert dry["task_constraints"] == constraints
          assert constraints["external_tools_allowed"] is False
          assert constraints["fail_closed"] is True
          assert market["fixed_preselection_weight_tuple_used"] is False
          assert market["fixed_task_fit_weight_tuple_used"] is False
          assert abs(sum(market["preselection_objective_weights"].values()) - 1.0) < 1e-9
          assert abs(sum(market["task_fit_feature_weights"].values()) - 1.0) < 1e-9
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v5-dynamic-validation-${{ github.run_id }}
          path: |
            v5-validation-artifacts/
            v5-validation-logs/
          if-no-files-found: warn
          retention-days: 7
