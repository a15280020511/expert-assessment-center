name: Validate V5 Governance-Plan Architecture

on:
  pull_request:
    paths:
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-governance-plan-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-governance-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Verify governance-plan modules and inactive legacy selectors
        run: |
          set -euo pipefail
          test -f open-model-market/v5_governance_model_plan.py
          test -f open-model-market/v5_governed_plan_orchestrator.py
          grep -q 'SELECTION_AUTHORITY = "decision-system-governance"' \
            open-model-market/v5_governance_model_plan.py
          grep -q 'model_selection_performed_locally.*False' \
            open-model-market/v5_price_ranked_pipeline.py
          grep -q 'model_reranking_performed_locally.*False' \
            open-model-market/v5_price_ranked_pipeline.py
          grep -q 'model_substitution_allowed.*False' \
            open-model-market/v5_price_ranked_pipeline.py
          ! grep -q 'build_price_ranked_proposal' \
            open-model-market/v5_price_ranked_pipeline.py
          ! grep -q 'v5_governance_runtime' \
            open-model-market/v5_price_ranked_pipeline.py
          ! grep -q 'v5_claude_red_team_policy' \
            open-model-market/v5_price_ranked_pipeline.py

      - name: Run targeted governance-plan tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_v5_governance_model_plan \
            tests.test_v5_governed_plan_orchestrator \
            tests.test_v5_repository_residue_audit -v

      - name: Run governance-plan dry-run
        run: |
          set -euo pipefail
          rm -rf v5-validation-artifacts
          mkdir -p v5-validation-artifacts
          cp tests/fixtures/governance-ticket.json v5-validation-artifacts/ticket.json
          python open-model-market/v5_price_ranked_pipeline.py \
            --task "仅依据题面比较A与B，禁止工具，输出已知事实和最终建议。" \
            --governance-plan-file v5-validation-artifacts/ticket.json \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 8 \
            --maximum-recovery-calls 1 \
            --output-dir v5-validation-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("v5-validation-artifacts")
          dry = json.loads((root / "v5-dry-run.json").read_text())
          selection = json.loads((root / "v5-price-ranked-selection.json").read_text())
          assert dry["status"] == "validated-not-executed"
          assert dry["model_calls"] == 0
          assert selection["selection_authority"] == "decision-system-governance"
          assert selection["model_selection_performed_locally"] is False
          assert selection["model_reranking_performed_locally"] is False
          assert selection["model_substitution_performed_locally"] is False
          assert selection["provider_resolution_performed_locally"] is True
          PY

      - name: Upload V5 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-governance-plan-validation-${{ github.run_id }}
          path: v5-validation-artifacts/
          if-no-files-found: warn
          retention-days: 14
