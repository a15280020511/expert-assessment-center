name: GitHub Models Catalog Read-Only Observer

on:
  push:
    branches:
      - "observer/github-models-catalog-*"
    paths:
      - ".github/github-models-catalog-observer-request.json"

permissions:
  contents: write
  actions: read

jobs:
  observe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out observer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Validate immutable observation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=.github/github-models-catalog-observer-request.json
          jq -e '
            type == "object" and
            (keys | sort) == ["request_id", "schema_version", "target_run_head_sha"] and
            .schema_version == "github-models-catalog-observer-request-1" and
            (.request_id | test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
            (.target_run_head_sha | test("^[0-9a-f]{40}$"))
          ' "$request" >/dev/null
          test "$(git diff --name-only HEAD^ HEAD)" = "$request"
          {
            echo "request_id=$(jq -er '.request_id' "$request")"
            echo "target_sha=$(jq -er '.target_run_head_sha' "$request")"
          } >> "$GITHUB_OUTPUT"

      - name: Observe unique catalog diagnostic Run
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
              > runs.json
            run_id=$(jq -r '
              .workflow_runs
              | map(select(.name == "GitHub Models Catalog Diagnostic" and .event == "push"))
              | if length == 1 then .[0].id else empty end
            ' runs.json)
            if [[ -n "$run_id" ]]; then
              status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' runs.json)
              if [[ "$status" == "completed" ]]; then
                break
              fi
            fi
            sleep 5
          done
          test -n "$run_id"
          gh api "/repos/$REPOSITORY/actions/runs/$run_id" > run.json
          gh api "/repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > jobs.json
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg target_sha "$TARGET_SHA" \
            --slurpfile run run.json \
            --slurpfile jobs jobs.json \
            '{
              schema_version: "github-models-catalog-observer-result-1",
              status: (if $run[0].conclusion == "success" then "PASS" else "FAIL" end),
              request_id: $request_id,
              target_run_head_sha: $target_sha,
              run: {
                id: $run[0].id,
                name: $run[0].name,
                status: $run[0].status,
                conclusion: $run[0].conclusion,
                run_attempt: $run[0].run_attempt,
                html_url: $run[0].html_url
              },
              jobs: [
                $jobs[0].jobs[] | {
                  id, name, status, conclusion,
                  failed_steps: [.steps[] | select(.conclusion == "failure") | {number, name}]
                }
              ],
              inference_calls_triggered_by_observer: 0,
              production_ref_moved: false
            }' > observer-result.json

      - name: Persist observation receipt
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          cp observer-result.json \
            acceptance-evidence/github-models-catalog-observer-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acceptance-evidence/github-models-catalog-observer-result.json
          git commit -m "audit: persist GitHub Models catalog observation"
          git push origin "HEAD:${GITHUB_REF}"
