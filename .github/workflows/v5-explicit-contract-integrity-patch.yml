name: Apply V5 Explicit Contract Integrity Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-explicit-contract-pipeline-integrity'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-explicit-contract-pipeline-integrity
          persist-credentials: true

      - name: Apply deterministic source patches
        run: |
          if grep -q 'output_contract_integrity_sha256' open-model-market/v5_planner.py && \
             grep -q 'explicit-output-contract-metadata-stripped' open-model-market/v5_task_delivery_contract.py; then
            echo 'Explicit contract integrity patch already applied.'
            exit 0
          fi
          python scripts/apply_v5_explicit_contract_pipeline_integrity_patch.py

      - name: Commit patch when changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add open-model-market/v5_task_delivery_contract.py open-model-market/v5_planner.py open-model-market/v5_output_contract_delivery.py open-model-market/v5_runtime.py
          git diff --cached --check
          git commit -m 'fix(v5): preserve explicit contracts across candidate planning'
          git push origin HEAD:fix/v5-explicit-contract-pipeline-integrity
