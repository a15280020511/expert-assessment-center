name: V5 Evidence Builder Wiring

on:
  push:
    branches:
      - refactor/v5-explicit-runtime
    paths:
      - tools/apply_v5_evidence_builder_wiring.py
      - .github/workflows/v5-evidence-builder-wiring.yml

permissions:
  contents: write

concurrency:
  group: v5-evidence-builder-wiring
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v5-explicit-runtime
          fetch-depth: 0
      - name: Apply deterministic evidence wiring
        run: python tools/apply_v5_evidence_builder_wiring.py
      - name: Remove one-shot files
        run: |
          rm tools/apply_v5_evidence_builder_wiring.py
          rm .github/workflows/v5-evidence-builder-wiring.yml
      - name: Commit evidence wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v5): route evidence through unified builder"
          git push origin HEAD:refactor/v5-explicit-runtime
