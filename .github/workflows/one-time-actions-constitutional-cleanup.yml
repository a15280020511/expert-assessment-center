name: One-Time Actions Constitutional Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-actions-constitutional-cleanup.yml"
      - ".github/workflows/one-time-actions-constitutional-rebuild.yml"
      - "open-model-market/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: one-time-actions-constitutional-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'a15280020511/expert-assessment-center' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-constitutional-semantic-evidence-dynamic-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout staged remediation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Rebuild and clean legacy compatibility architecture
        id: cleanup
        env:
          BASE_SHA: be9529ad2e38380954373c129250e6e24f8d3d11
          TARGET_BRANCH: actions/v5-constitutional-remediation-20260801
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary "$BASE_SHA" HEAD -- \
            . \
            ':(exclude).github/workflows/one-time-actions-constitutional-rebuild.yml' \
            ':(exclude).github/workflows/one-time-actions-constitutional-cleanup.yml' \
            > /tmp/constitutional-remediation.patch
          test -s /tmp/constitutional-remediation.patch
          git switch --detach "$BASE_SHA"
          git switch -C "$TARGET_BRANCH"
          git apply --index /tmp/constitutional-remediation.patch

          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          from pathlib import Path

          ROOT = Path("open-model-market")
          TEST_ROOT = Path("tests")
          REPORT = Path("/tmp/legacy-cleanup-report.json")

          def replace_top_level_function(path: Path, name: str, replacement: str) -> None:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              matches = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == name
              ]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected one top-level {name} in {path}, got {len(matches)}"
                  )
              node = matches[0]
              lines = source.splitlines(keepends=True)
              lines[node.lineno - 1 : node.end_lineno] = [replacement.rstrip() + "\n\n"]
              path.write_text("".join(lines), encoding="utf-8")

          def remove_top_level_functions(path: Path, names: set[str]) -> list[str]:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              nodes = [
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name in names
              ]
              if not nodes:
                  return []
              lines = source.splitlines(keepends=True)
              removed = []
              for node in sorted(nodes, key=lambda value: value.lineno, reverse=True):
                  removed.append(node.name)
                  del lines[node.lineno - 1 : node.end_lineno]
              path.write_text("".join(lines), encoding="utf-8")
              return sorted(removed)

          def remove_test_methods_with_install_calls(path: Path) -> list[str]:
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source)
              targets: list[ast.AST] = []
              names: list[str] = []
              for parent in tree.body:
                  candidates = []
                  if isinstance(parent, ast.ClassDef):
                      candidates = [
                          node
                          for node in parent.body
                          if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      ]
                  elif isinstance(parent, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      candidates = [parent]
                  for node in candidates:
                      has_install = any(
                          isinstance(value, ast.Call)
                          and isinstance(value.func, ast.Attribute)
                          and value.func.attr == "install"
                          for value in ast.walk(node)
                      )
                      if has_install:
                          targets.append(node)
                          names.append(node.name)
              if not targets:
                  return []
              lines = source.splitlines(keepends=True)
              for node in sorted(targets, key=lambda value: value.lineno, reverse=True):
                  del lines[node.lineno - 1 : node.end_lineno]
              path.write_text("".join(lines), encoding="utf-8")
              return sorted(names)

          runtime_path = ROOT / "v5_runtime.py"
          runtime_source = runtime_path.read_text(encoding="utf-8")
          old_import = "import v5_executor as legacy_executor\n"
          if runtime_source.count(old_import) != 1:
              raise RuntimeError("unexpected legacy executor import count")
          runtime_source = runtime_source.replace(old_import, "")
          marker = 'STRICT_SUCCESS_STATUSES = {"success", "success_retried", "success_recovered"}\n'
          if runtime_source.count(marker) != 1:
              raise RuntimeError("unexpected native runtime constant marker count")
          native = '''STRICT_SUCCESS_STATUSES = {"success", "success_retried", "success_recovered"}\nFORBIDDEN_REQUEST_FIELDS = {\n    "tools",\n    "tool_choice",\n    "plugins",\n    "web_search",\n    "web_search_options",\n    "file_search",\n    "browser",\n    "code_interpreter",\n    "models",\n}\n'''
          runtime_source = runtime_source.replace(marker, native)
          if "legacy_executor.FORBIDDEN_FIELDS" not in runtime_source:
              raise RuntimeError("legacy forbidden-field reference is missing")
          runtime_path.write_text(
              runtime_source.replace(
                  "legacy_executor.FORBIDDEN_FIELDS",
                  "FORBIDDEN_REQUEST_FIELDS",
              ),
              encoding="utf-8",
          )

          replace_top_level_function(
              ROOT / "v5_task_constraints.py",
              "dynamic_objective_weights",
              '''def dynamic_objective_weights(profile: Any, task: str) -> dict[str, float]:
    """Derive a normalized objective vector from current-task pressure signals."""
    constraints = compile_task_constraints(task)
    complexity = max(
        0.0,
        min(1.0, float(getattr(profile, "complexity_score", 0) or 0) / 7.0),
    )
    high_stakes = float(bool(getattr(profile, "high_stakes", False)))
    closed_world = float(not constraints.external_facts_allowed)
    domains = {
        str(value)
        for value in (getattr(profile, "domains", []) or [])
        if str(value)
    }
    domain_breadth = min(1.0, max(0.0, float(len(domains) - 1) / 3.0))
    requested_context = max(
        1.0,
        float(getattr(profile, "requested_context", 1) or 1),
    )
    context_pressure = min(1.0, requested_context / 131_072.0)
    long_context = float(bool(getattr(profile, "long_context", False)))
    strictness = max(complexity, high_stakes, closed_world)
    epsilon = 1e-9
    raw = {
        "intelligence": max(epsilon, strictness),
        "task_fit": 1.0 + domain_breadth,
        "value": max(epsilon, 1.0 - strictness),
        "context": max(epsilon, context_pressure, long_context),
    }
    total = sum(raw.values())
    return {key: value / total for key, value in raw.items()}''',
          )
          replace_top_level_function(
              ROOT / "v5_constitutional_pipeline.py",
              "_task_fit_feature_weights",
              '''def _task_fit_feature_weights(profile: Any) -> dict[str, float]:
    """Normalize task-fit needs without a fixed feature-weight tuple."""
    complexity = max(
        0.0,
        min(1.0, float(getattr(profile, "complexity_score", 0) or 0) / 7.0),
    )
    primary = str(getattr(profile, "primary_domain", "") or "")
    secondary = str(getattr(profile, "secondary_domain", "") or "")
    return _normalized(
        {
            "primary_domain": 1.0,
            "secondary_domain": float(bool(secondary and secondary != primary)),
            "reasoning_capability": complexity,
            "structured_output": max(
                complexity,
                float(bool(getattr(profile, "high_stakes", False))),
            ),
            "language_fit": float(bool(getattr(profile, "chinese", False))),
        }
    )''',
          )
          replace_top_level_function(
              ROOT / "v5_constitutional_pipeline.py",
              "_dynamic_quality_tolerance",
              '''def _dynamic_quality_tolerance(
    profile: Any,
    constraints: TaskConstraints,
    shape: Mapping[str, int | bool],
    platform_ceiling: float,
) -> float:
    complexity = max(0.0, min(1.0, float(profile.complexity_score) / 7.0))
    strictness = max(
        complexity,
        float(bool(profile.high_stakes)),
        float(not constraints.external_facts_allowed),
        float(bool(shape["explicit_output_contract"])),
    )
    ceiling = max(0.0, min(20.0, float(platform_ceiling)))
    return ceiling * (1.0 - strictness)''',
          )

          legacy_pipeline = ROOT / "v5_pipeline.py"
          legacy_source = legacy_pipeline.read_text(encoding="utf-8")
          old_main = 'if __name__ == "__main__":\n    raise SystemExit(main())\n'
          delegated_main = '''if __name__ == "__main__":
    from v5_constitutional_pipeline import main as constitutional_main

    raise SystemExit(constitutional_main())
'''
          if legacy_source.count(old_main) != 1:
              raise RuntimeError("legacy CLI delegation marker is missing")
          legacy_pipeline.write_text(
              legacy_source.replace(old_main, delegated_main),
              encoding="utf-8",
          )

          modules = {
              path.stem: path
              for path in ROOT.glob("*.py")
              if path.name != "__init__.py"
          }
          dependencies: dict[str, set[str]] = {name: set() for name in modules}
          install_definitions_before: dict[str, list[int]] = {}
          install_calls_before: dict[str, list[int]] = {}
          for name, path in modules.items():
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          local = alias.name.split(".", 1)[0]
                          if local in modules:
                              dependencies[name].add(local)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      local = node.module.split(".", 1)[0]
                      if local in modules:
                          dependencies[name].add(local)
                  elif (
                      isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name == "install"
                      and node.col_offset == 0
                  ):
                      install_definitions_before.setdefault(name, []).append(node.lineno)
                  elif (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "install"
                  ):
                      install_calls_before.setdefault(name, []).append(node.lineno)

          roots = {
              "v5_production_ticket",
              "v5_constitutional_pipeline",
              "v5_constitutional_runtime",
              "v5_recovery_runtime",
              "v5_execution_auditor_integrity",
              "v5_independent_artifact_revalidation",
              "artifact_manifest",
              "v5_final_status",
              "v5_final_attestation",
              "v5_issue_ticket",
              "v5_admission_lock",
          }
          reachable = set(roots)
          pending = list(roots)
          while pending:
              current = pending.pop()
              for dependency in dependencies.get(current, set()):
                  if dependency not in reachable:
                      reachable.add(dependency)
                      pending.append(dependency)

          prohibited = {
              name
              for name in modules
              if name.startswith("v5_r8_")
              or name in {
                  "v5_production_hardening",
                  "v5_resilient_executor",
                  "v5_stage_d_provider_compat",
              }
          }
          prohibited_reachable = sorted(reachable.intersection(prohibited))
          prohibited_unreachable = sorted(prohibited - reachable)

          removed_install_functions: dict[str, list[str]] = {}
          for name, path in modules.items():
              removed = remove_top_level_functions(path, {"install"})
              if removed:
                  removed_install_functions[name] = removed

          removed_test_methods: dict[str, list[str]] = {}
          for path in TEST_ROOT.glob("test*.py"):
              removed = remove_test_methods_with_install_calls(path)
              if removed:
                  removed_test_methods[str(path)] = removed

          deleted_modules: list[str] = []
          for name in prohibited_unreachable:
              path = modules[name]
              path.unlink()
              deleted_modules.append(str(path))

          deleted_tests: list[str] = []
          unresolved_deleted_module_references: dict[str, list[str]] = {}
          for path in TEST_ROOT.glob("test*.py"):
              text = path.read_text(encoding="utf-8")
              refs = [name for name in prohibited_unreachable if name in text]
              if not refs:
                  continue
              legacy_named = any(
                  token in path.stem
                  for token in (
                      "r8",
                      "production_hardening",
                      "resilient_executor",
                      "stage_d_provider_compat",
                  )
              )
              if legacy_named:
                  path.unlink()
                  deleted_tests.append(str(path))
              else:
                  unresolved_deleted_module_references[str(path)] = refs

          deleted_test_modules = {Path(value).stem for value in deleted_tests}
          cleanup_names = set(prohibited_unreachable).union(deleted_test_modules)
          for workflow in Path(".github/workflows").glob("*.yml"):
              lines = workflow.read_text(encoding="utf-8").splitlines(keepends=True)
              filtered = [
                  line
                  for line in lines
                  if not any(name in line for name in cleanup_names)
              ]
              workflow.write_text("".join(filtered), encoding="utf-8")

          test_path = TEST_ROOT / "test_v5_capability_calibration.py"
          test_source = test_path.read_text(encoding="utf-8")
          needle = '        self.assertNotIn(".install()", recovery)\n'
          addition = '''        self.assertNotIn(".install()", recovery)\n        native_runtime = (\n            ROOT / "open-model-market" / "v5_runtime.py"\n        ).read_text(encoding="utf-8")\n        self.assertNotIn("import v5_executor", native_runtime)\n        self.assertNotIn("legacy_executor", native_runtime)\n        legacy_pipeline = (\n            ROOT / "open-model-market" / "v5_pipeline.py"\n        ).read_text(encoding="utf-8")\n        self.assertIn("constitutional_main()", legacy_pipeline)\n'''
          if needle not in test_source:
              raise RuntimeError("runtime decoupling test insertion point missing")
          test_path.write_text(
              test_source.replace(needle, addition, 1),
              encoding="utf-8",
          )

          remaining_install_definitions: dict[str, list[int]] = {}
          remaining_install_calls: dict[str, list[int]] = {}
          for path in ROOT.glob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if (
                      isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name == "install"
                      and node.col_offset == 0
                  ):
                      remaining_install_definitions.setdefault(path.stem, []).append(node.lineno)
                  elif (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "install"
                  ):
                      remaining_install_calls.setdefault(path.stem, []).append(node.lineno)

          remaining_test_install_calls: dict[str, list[int]] = {}
          for path in TEST_ROOT.glob("test*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == "install"
                  ):
                      remaining_test_install_calls.setdefault(str(path), []).append(node.lineno)

          report = {
              "schema_version": "v5-legacy-cleanup-report-1",
              "production_roots": sorted(roots),
              "production_reachable_module_count": len(reachable),
              "production_install_definitions_before": {
                  name: install_definitions_before[name]
                  for name in sorted(reachable.intersection(install_definitions_before))
              },
              "production_install_calls_before": {
                  name: install_calls_before[name]
                  for name in sorted(reachable.intersection(install_calls_before))
              },
              "prohibited_legacy_reachable": prohibited_reachable,
              "prohibited_legacy_unreachable": prohibited_unreachable,
              "removed_install_functions": removed_install_functions,
              "removed_test_methods": removed_test_methods,
              "deleted_modules": deleted_modules,
              "deleted_tests": deleted_tests,
              "unresolved_deleted_module_references": unresolved_deleted_module_references,
              "remaining_install_definitions": remaining_install_definitions,
              "remaining_install_calls": remaining_install_calls,
              "remaining_test_install_calls": remaining_test_install_calls,
          }
          REPORT.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          print(REPORT.read_text(encoding="utf-8"))

          failures = []
          if prohibited_reachable:
              failures.append("prohibited legacy modules remain production-reachable")
          if report["production_install_calls_before"]:
              failures.append("production still invokes install hooks")
          if unresolved_deleted_module_references:
              failures.append("non-legacy tests still reference deleted modules")
          if remaining_install_definitions or remaining_install_calls:
              failures.append("install compatibility interfaces remain")
          if remaining_test_install_calls:
              failures.append("tests still invoke install compatibility interfaces")
          if failures:
              raise RuntimeError("; ".join(failures))
          PY

          test ! -e .github/workflows/one-time-actions-constitutional-rebuild.yml
          test ! -e .github/workflows/one-time-actions-constitutional-cleanup.yml
          ! grep -q "import v5_executor" open-model-market/v5_runtime.py
          ! grep -q "legacy_executor" open-model-market/v5_runtime.py
          git diff --cached --check

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Remove deterministic unused imports after compatibility cleanup
        run: |
          python -m ruff check . --fix
          python -m ruff check .

      - name: Validate cleaned constitutional branch
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Commit and push Actions-authored cleaned branch
        env:
          TARGET_BRANCH: actions/v5-constitutional-remediation-20260801
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v5): constitutional remediation and legacy architecture cleanup"
          remote_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [[ -n "$remote_target" ]]; then
            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$remote_target" \
              origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Upload legacy cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-legacy-cleanup-${{ github.run_id }}
          path: /tmp/legacy-cleanup-report.json
          if-no-files-found: warn
          retention-days: 14
