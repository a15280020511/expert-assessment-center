name: PR227 R7 Acceptance Workflow Generator

on:
  push:
    branches:
      - acceptance/pr227-final-paid-20260803-r7
    paths:
      - .github/workflows/pr227-r7-workflow-generator.yml

permissions:
  contents: write

concurrency:
  group: pr227-r7-workflow-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
      TEMPLATE_REF: acceptance/pr227-final-paid-20260803-r6
      TARGET_SHA: 2a0d1b5d2d8bc77b52a7af5a4d257843675c662e
      OLD_TARGET_SHA: 9360c9f05892e02c42c84d28f1cf10dc2461ebcb
    steps:
      - name: Generate audited R7 workflow blob from R6 template
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_sha = os.environ["TARGET_SHA"]
          old_target_sha = os.environ["OLD_TARGET_SHA"]
          template_ref = os.environ["TEMPLATE_REF"]
          template_path = ".github/workflows/pr227-production-paid-acceptance-r6.yml"

          def api(url: str, *, method: str = "GET", payload: dict | None = None) -> bytes:
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pr227-r7-workflow-generator",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read()

          encoded_ref = urllib.parse.quote(template_ref, safe="")
          encoded_path = urllib.parse.quote(template_path, safe="/")
          raw = api(
              f"https://api.github.com/repos/{repository}/contents/{encoded_path}"
              f"?ref={encoded_ref}"
          )
          template = json.loads(raw.decode("utf-8"))
          source = base64.b64decode(template["content"]).decode("utf-8")

          generated = source.replace("R6", "R7").replace("r6", "r7")
          replacements = {
              old_target_sha: target_sha,
              "pr227-production-paid-acceptance-6": "pr227-production-paid-acceptance-7",
              "final-pr227-authoritative-production-qualification-after-route-envelope": (
                  "final-pr227-authoritative-production-qualification-after-evidence-contract-remediation"
              ),
          }
          for old, new in replacements.items():
              count = generated.count(old)
              if count < 1:
                  raise SystemExit(f"required R7 replacement source missing: {old}")
              generated = generated.replace(old, new)

          final_status_marker = (
              '            --artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \\\n'
              '            | tee final-status.md'
          )
          final_status_replacement = (
              '            --artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \\\n'
              '            --independent-revalidation-file independent-revalidation.json \\\n'
              '            | tee final-status.md'
          )
          if generated.count(final_status_marker) != 1:
              raise SystemExit("final-status independent-revalidation insertion point changed")
          generated = generated.replace(
              final_status_marker,
              final_status_replacement,
              1,
          )

          attestation_marker = (
              '            --final-status-file final-status.md \\\n'
              '            --output final-attestation.json'
          )
          attestation_replacement = (
              '            --final-status-file final-status.md \\\n'
              '            --independent-revalidation-file independent-revalidation.json \\\n'
              '            --output final-attestation.json'
          )
          if generated.count(attestation_marker) != 1:
              raise SystemExit("attestation independent-revalidation insertion point changed")
          generated = generated.replace(
              attestation_marker,
              attestation_replacement,
              1,
          )

          forbidden = [
              "R6",
              "r6",
              old_target_sha,
              "pr227-production-paid-acceptance-6",
              "after-route-envelope",
          ]
          remaining = [value for value in forbidden if value in generated]
          if remaining:
              raise SystemExit(f"R6 residue remains in generated workflow: {remaining}")
          required = [
              "acceptance/pr227-final-paid-20260803-r7",
              ".github/v5-paid-production-request-r7.json",
              target_sha,
              "pr227-production-paid-acceptance-7",
              "--independent-revalidation-file independent-revalidation.json",
              "pr227-production-paid-r7-receipt-1",
              "acceptance-evidence/pr227-production-paid-r7-result.json",
          ]
          missing = [value for value in required if value not in generated]
          if missing:
              raise SystemExit(f"required R7 contract missing: {missing}")
          if generated.count("--independent-revalidation-file independent-revalidation.json") != 2:
              raise SystemExit("R7 must bind independent revalidation exactly twice")

          content = generated.encode("utf-8")
          blob_response = api(
              f"https://api.github.com/repos/{repository}/git/blobs",
              method="POST",
              payload={
                  "content": base64.b64encode(content).decode("ascii"),
                  "encoding": "base64",
              },
          )
          blob = json.loads(blob_response.decode("utf-8"))
          blob_sha = str(blob.get("sha") or "")
          if not blob_sha:
              raise SystemExit("GitHub did not return the generated workflow blob SHA")

          receipt = {
              "schema_version": "pr227-r7-workflow-generator-1",
              "status": "PASS",
              "template_ref": template_ref,
              "template_path": template_path,
              "template_blob_sha": template.get("sha"),
              "target_sha": target_sha,
              "generated_path": ".github/workflows/pr227-production-paid-acceptance-r7.yml",
              "generated_sha256": hashlib.sha256(content).hexdigest(),
              "generated_size_bytes": len(content),
              "generated_blob_sha": blob_sha,
              "independent_revalidation_bindings": 2,
              "maximum_total_calls": 4,
              "maximum_recovery_calls": 0,
              "maximum_cost_usd": 0.25,
              "chat_model_calls": 0,
              "paid_model_calls": 0,
          }
          Path("pr227-r7-workflow-generator-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"blob_sha={blob_sha}\n")
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Upload R7 workflow generator receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-r7-workflow-generator-${{ github.run_id }}
          path: pr227-r7-workflow-generator-receipt.json
          if-no-files-found: error
          retention-days: 30
