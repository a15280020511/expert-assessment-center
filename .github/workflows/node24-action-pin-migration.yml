name: Apply Node 24 Action Pins

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/node24-actions-production-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/node24-actions-production-hardening
          persist-credentials: false

      - name: Apply immutable Node 24 pins
        run: |
          python scripts/apply_node24_action_pins.py
          git diff --name-only -- .github/workflows > node24-changed-files.txt
          test -s node24-changed-files.txt
          git diff --check
          cat node24-changed-files.txt

      - name: Upload deterministic migration result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node24-workflow-migration-${{ github.run_id }}
          path: |
            .github/workflows/
            node24-changed-files.txt
          if-no-files-found: error
          retention-days: 1
