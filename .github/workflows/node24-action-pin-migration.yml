name: Apply Node 24 Action Pins

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/node24-actions-production-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/node24-actions-production-hardening
          persist-credentials: true

      - name: Apply immutable Node 24 pins
        run: python scripts/apply_node24_action_pins.py

      - name: Commit migration when changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git diff --cached --check
          git commit -m 'chore(actions): upgrade workflows to immutable Node 24 releases'
          git push origin HEAD:chore/node24-actions-production-hardening
