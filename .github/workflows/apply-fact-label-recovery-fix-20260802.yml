name: Apply Fact Label Recovery Fix 2026-08-02

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-fact-label-recovery-fix-20260802
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'fix/v5-fact-label-recovery-reserve-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-fact-label-recovery-reserve-20260802
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_fact_label_recovery_fix_20260802.py
          rm tools/apply_fact_label_recovery_fix_20260802.py
          rm .github/workflows/apply-fact-label-recovery-fix-20260802.yml

      - name: Verify targeted and existing suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m ruff check \
            open-model-market/v5_deterministic_answer_normalization.py \
            open-model-market/v5_constitutional_runtime.py \
            open-model-market/v5_cross_endpoint_planner.py \
            tests/test_v5_deterministic_answer_normalization.py \
            tests/test_v5_fact_label_purity_normalization.py \
            tests/test_v5_critical_delivery_reliability.py \
            tests/test_v5_recovery_absolute_budget_feasibility.py
          python -m compileall -q open-model-market tests
          python -m unittest \
            tests.test_v5_deterministic_answer_normalization \
            tests.test_v5_fact_label_purity_normalization \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_recovery_absolute_budget_feasibility \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_task_constraints -v

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): normalize fact labels and executable recovery"
          git push origin HEAD:fix/v5-fact-label-recovery-reserve-20260802
