name: PR227 R12 Workflow Generator

on:
  push:
    branches:
      - acceptance/pr227-final-paid-20260803-r12
    paths:
      - .github/workflows/pr227-r12-generator.yml

permissions:
  contents: write

concurrency:
  group: pr227-r12-workflow-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout generator source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: acceptance/pr227-final-paid-20260803-r12
          fetch-depth: 1
          persist-credentials: false

      - name: Generate R12 workflow and persist receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr227_r12_workflow_generator.py
