name: Apply Constitutional Patch Temporary

on:
  push:
    branches:
      - fix/v5-constitutional-completeness-dynamic
    paths:
      - .github/v5-constitutional-patch.ready
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-constitutional-completeness-dynamic
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply frozen source bundle
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/v5-constitutional-patch.ready ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected=(
            '00 7000 cf82e036c4f24472a83fc881f9d46fe5d3ac75917f007ccb748561f0f167859e'
            '01 14000 218ff2ac32f51d5355643ad69c2f8e051a5f41af2d6e1c4d7310112a5c474026'
            '02 20000 236748a953eebaa2cbb36af2496b695dccc2a546632710f35e863ae0037c67c7'
            '03 20000 6d54253d6cdb365a49781cf4de8467852a8663696a1bc0d7972faeee61abdaf2'
            '04 20000 28924f7390cd5ece7b184b7f3ec2b69c8a26625e636fb5aa9655ab3b479a8c45'
            '05 20000 2d36f0f90fa165de70fd63c7a111198c6e9f737733a710910ddef2cb5c5138df'
            '06a 4000 6e61f0d3e48c18837f5941073b23572516ee59d4994193d6ace1c7378b83bd7a'
            '06b 4000 9d9dc50de9b199f8b5964e129adc21240b7c5b6733243545c80d1b747102e8ce'
            '06c 4468 aac7ca6672575227fffb6b581dff3e5b08a2d1cbc562893a85475fbabdb82287'
          )
          for row in "${expected[@]}"; do
            read -r index size digest <<< "$row"
            file=".github/v5-constitutional-patch.part-$index"
            observed_size="$(wc -c < "$file")"
            observed_digest="$(sha256sum "$file" | awk '{print $1}')"
            echo "$index expected=$size/$digest observed=$observed_size/$observed_digest"
            test "$observed_size" = "$size"
            test "$observed_digest" = "$digest"
          done
          cat .github/v5-constitutional-patch.part-* > /tmp/v5-constitutional-patch.b64
          test "$(wc -c < /tmp/v5-constitutional-patch.b64)" = '113468'
          test "$(sha256sum /tmp/v5-constitutional-patch.b64 | awk '{print $1}')" = '010103815d536b749474790aacefdcfb0f3a319825911cf61e8d911526b61f4e'
          base64 --decode /tmp/v5-constitutional-patch.b64 > /tmp/v5-constitutional-patch.tar.xz
          test "$(sha256sum /tmp/v5-constitutional-patch.tar.xz | awk '{print $1}')" = "0b8be9624564a130087fa07528ee06703e484343345c7b7b9bfbfe17fa5461cd"
          tar -xJf /tmp/v5-constitutional-patch.tar.xz
          git checkout -- \
            .github/workflows/execution-ticket.yml \
            .github/workflows/v5-one-time-paid-acceptance.yml \
            .github/workflows/export-source-temp.yml
          rm .github/v5-constitutional-patch.part-* .github/v5-constitutional-patch.ready
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python -m compileall -q open-model-market tests tools
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit constitutional hardening source
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow file unexpectedly entered the source-only commit.' >&2
            exit 1
          fi
          git commit -m "fix(v5): enforce constitutional completeness and dynamic planning"
          git push origin HEAD:fix/v5-constitutional-completeness-dynamic
