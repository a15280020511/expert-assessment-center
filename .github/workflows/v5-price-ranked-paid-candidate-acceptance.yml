name: V5 Governance-Owned Paid Candidate Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-governance-owned-paid-candidate-acceptance
  cancel-in-progress: false

jobs:
  accept-governed-main-candidate:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[acceptance]') &&
      startsWith(github.event.comment.body, '/accept-governed-main ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "4"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: governance-owned-paid-candidate-acceptance

    steps:
      - name: Validate exact governed candidate command
        id: source
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            const body = String(context.payload.comment?.body || '').trim();
            const match = body.match(/^\/accept-governed-main ([0-9a-f]{40})$/);
            if (!match) {
              core.setFailed('command must be /accept-governed-main <40-character-main-sha>');
              return;
            }
            const candidate = match[1];
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const production = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'production'
            });
            const mainSha = String(main.data.commit.sha || '');
            const productionSha = String(production.data.commit.sha || '');
            if (candidate !== mainSha) {
              core.setFailed(`candidate ${candidate} is not current main ${mainSha}`);
              return;
            }
            if (candidate === productionSha) {
              core.setFailed('candidate is already deployed to production');
              return;
            }
            core.setOutput('candidate_sha', candidate);
            core.setOutput('previous_production_sha', productionSha);

      - name: Checkout exact main candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze candidate and production identities
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$CANDIDATE_SHA"
          test "$main" = "$CANDIDATE_SHA"
          test "$production" = "$PREVIOUS_PRODUCTION_SHA"
          test "$main" != "$production"
          printf '%s\n' "$CANDIDATE_SHA" > checked-out-candidate-sha.txt
          printf '%s\n' "$PREVIOUS_PRODUCTION_SHA" > previous-production-sha.txt

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Validate governance-signed acceptance ticket
        id: ticket
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p ticket-artifacts
          PYTHONPATH=open-model-market python - <<'PY'
          import argparse
          import json
          import os
          from pathlib import Path

          import v5_price_ranked_issue_ticket

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          raw = str((event.get("issue") or {}).get("body") or "").strip()
          packet = json.loads(raw)
          if not isinstance(packet, dict):
              raise SystemExit("acceptance Issue body must be one JSON object")
          plan = packet.get("governance_model_plan")
          if not isinstance(plan, dict):
              raise SystemExit("governance_model_plan is required")
          if packet.get("route") != "expert-team":
              raise SystemExit("route must be expert-team")
          if packet.get("private_output") is not False:
              raise SystemExit("private_output must be false")
          if plan.get("selection_authority") != "decision-system-governance":
              raise SystemExit("selection authority must be decision-system-governance")
          if plan.get("model_calls") != 0:
              raise SystemExit("governance plan must prove zero model calls")
          if plan.get("expert_center_reranking_allowed") is not False:
              raise SystemExit("expert center reranking must be disabled")
          if plan.get("model_substitution_allowed") is not False:
              raise SystemExit("model substitution must be disabled")

          budget = packet.get("approved_budget")
          if not isinstance(budget, dict):
              raise SystemExit("approved_budget is required")
          calls = budget.get("calls")
          recovery = budget.get("maximum_recovery_calls")
          if not isinstance(calls, int) or not isinstance(recovery, int):
              raise SystemExit("acceptance call budget is invalid")
          if calls < 4 or calls > 16 or recovery < 0 or recovery > 4:
              raise SystemExit("acceptance call budget is outside constitutional bounds")

          root = Path("ticket-artifacts")
          (root / "governance-acceptance-ticket.json").write_text(
              json.dumps(packet, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          task_id = str(packet.get("task_id") or "")
          args = argparse.Namespace(
              event_path=None,
              issue_title="[execution] exact governance-owned main candidate acceptance",
              issue_body=json.dumps(packet, ensure_ascii=False),
              issue_number=int(os.environ["ISSUE_NUMBER"]),
              actor=os.environ["GITHUB_REPOSITORY_OWNER"],
              author_association="OWNER",
              comment_body=f"/run-expert-team {task_id}",
              output_dir=str(root),
          )
          raise SystemExit(v5_price_ranked_issue_ticket.prepare(args))
          PY
          test "$(jq -r '.accepted' ticket-artifacts/ticket-status.json)" = "true"
          calls="$(jq -r '.approved_budget.calls' ticket-artifacts/ticket.json)"
          recovery="$(jq -r '.approved_budget.maximum_recovery_calls' ticket-artifacts/ticket.json)"
          anomaly="$(jq -r '.approved_budget.cost_anomaly_usd // empty' ticket-artifacts/ticket.json)"
          gate=(python open-model-market/v5_price_ranked_ticket_gate.py
            --output-dir ticket-artifacts
            --expected-calls "$calls"
            --expected-recovery-calls "$recovery")
          if [ -n "$anomaly" ]; then
            gate+=(--expected-cost-anomaly-usd "$anomaly")
          fi
          "${gate[@]}"
          echo "calls=$calls" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          echo "anomaly=$anomaly" >> "$GITHUB_OUTPUT"

      - name: Execute exact candidate with governance-owned runtime
        id: execute
        continue-on-error: true
        env:
          AUTHORITATIVE_EXECUTION_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          task="$(cat ticket-artifacts/task.txt)"
          command=(python open-model-market/v5_price_ranked_production_ticket.py
            --task "$task"
            --output-dir ticket-artifacts
            --maximum-total-calls "${{ steps.ticket.outputs.calls }}"
            --maximum-recovery-calls "${{ steps.ticket.outputs.recovery }}"
            --require-live-catalog)
          if [ -n "${{ steps.ticket.outputs.anomaly }}" ]; then
            command+=(--cost-anomaly-usd "${{ steps.ticket.outputs.anomaly }}")
          fi
          "${command[@]}"

      - name: Prepare report package
        id: prepare_report
        continue-on-error: true
        run: |
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

      - name: Audit complete governance-owned evidence
        id: audit
        continue-on-error: true
        run: |
          python open-model-market/v5_price_ranked_execution_auditor.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.prepare_report.outcome }}"

      - name: Freeze primary artifact manifest
        id: manifest
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          PYTHONPATH=open-model-market python - <<'PY'
          from pathlib import Path
          from artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload immutable primary artifact
        id: ticket_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-owned-paid-candidate-primary-${{ github.run_id }}
          path: ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Download and independently revalidate primary artifact
        id: independent
        if: steps.ticket_artifact.outcome == 'success'
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/actions/artifacts/$PRIMARY_ARTIFACT_ID/zip" \
            > uploaded-primary-artifact.zip
          rm -rf independently-downloaded-primary
          mkdir independently-downloaded-primary
          unzip -q uploaded-primary-artifact.zip -d independently-downloaded-primary
          set +e
          command=(python open-model-market/v5_price_ranked_independent_revalidation.py
            --artifact-dir independently-downloaded-primary
            --expected-sha "$CANDIDATE_SHA"
            --expected-run-id "${{ github.run_id }}"
            --maximum-calls "${{ steps.ticket.outputs.calls }}"
            --archive uploaded-primary-artifact.zip
            --expected-artifact-digest "$PRIMARY_ARTIFACT_DIGEST"
            --output independent-revalidation.json)
          if [ -n "${{ steps.ticket.outputs.anomaly }}" ]; then
            command+=(--cost-advisory-usd "${{ steps.ticket.outputs.anomaly }}")
          fi
          "${command[@]}"
          exit_code=$?
          set -e
          status="$(jq -r '.status // "FAIL"' independent-revalidation.json 2>/dev/null || printf 'FAIL')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$exit_code" -eq 0
          test "$status" = "PASS"

      - name: Generate final governance-owned attestation and receipt
        id: attest
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          REPORT_OUTCOME: ${{ steps.prepare_report.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.ticket_artifact.outcome }}
          INDEPENDENT_OUTCOME: ${{ steps.independent.outcome }}
          INDEPENDENT_STATUS: ${{ steps.independent.outputs.status }}
        run: |
          PYTHONPATH=open-model-market python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("ticket-artifacts")
          errors = []
          outcomes = {
              "execute": os.environ.get("EXECUTE_OUTCOME", ""),
              "report": os.environ.get("REPORT_OUTCOME", ""),
              "audit": os.environ.get("AUDIT_OUTCOME", ""),
              "manifest": os.environ.get("MANIFEST_OUTCOME", ""),
              "upload": os.environ.get("UPLOAD_OUTCOME", ""),
              "independent": os.environ.get("INDEPENDENT_OUTCOME", ""),
          }
          for key, value in outcomes.items():
              if value != "success":
                  errors.append(f"{key}-outcome:{value}")
          if os.environ.get("INDEPENDENT_STATUS") != "PASS":
              errors.append("independent-status-not-pass")

          def load(name):
              path = root / name
              if not path.is_file():
                  errors.append(f"missing:{name}")
                  return {}
              return json.loads(path.read_text(encoding="utf-8"))

          runtime = load("production-runtime.json")
          config = load("v5-runtime-config.json")
          selection = load("v5-price-ranked-selection.json")
          request_audit = load("v5-request-audit.json")
          governance = load("v5-governance-calls.json")
          plan = load("governance-model-plan.json")
          ticket = load("ticket.json")
          manifest = load("artifact-manifest.json")

          authority = "decision-system-governance"
          plan_sha = str(plan.get("plan_sha256") or "")
          if runtime.get("runtime_version") != "v5-governance-plan-runtime-1":
              errors.append("wrong-runtime-version")
          if config.get("selection_authority") != authority:
              errors.append("runtime-selection-authority-not-governance")
          if config.get("model_selection_performed_locally") is not False:
              errors.append("runtime-local-selection-not-disabled")
          if config.get("model_reranking_performed_locally") is not False:
              errors.append("runtime-local-reranking-not-disabled")
          if config.get("governance_model_plan_sha256") != plan_sha:
              errors.append("runtime-plan-digest-mismatch")
          if selection.get("status") != "PASS":
              errors.append("selection-materialization-not-pass")
          if selection.get("selection_authority") != authority:
              errors.append("selection-authority-not-governance")
          if selection.get("model_selection_performed_locally") is not False:
              errors.append("selection-local-selection-not-disabled")
          if selection.get("model_reranking_performed_locally") is not False:
              errors.append("selection-local-reranking-not-disabled")
          if selection.get("model_substitution_performed_locally") is not False:
              errors.append("selection-local-substitution-not-disabled")
          if ticket.get("governance_model_plan", {}).get("plan_sha256") != plan_sha:
              errors.append("ticket-plan-digest-mismatch")
          if request_audit.get("status") != "PASS":
              errors.append("request-audit-not-pass")
          if request_audit.get("external_tools_allowed") is not False:
              errors.append("request-audit-allows-tools")
          if request_audit.get("provider_fallback_allowed") is not False:
              errors.append("request-audit-allows-provider-fallback")
          if int(governance.get("actual_governance_calls") or 0) != 0:
              errors.append("expert-center-governance-calls-not-zero")
          if not manifest:
              errors.append("manifest-not-readable")

          independent_path = Path("independent-revalidation.json")
          independent_sha = ""
          if independent_path.is_file():
              independent = json.loads(independent_path.read_text(encoding="utf-8"))
              if independent.get("status") != "PASS":
                  errors.append("independent-revalidation-not-pass")
              independent_sha = hashlib.sha256(independent_path.read_bytes()).hexdigest()
          else:
              errors.append("missing-independent-revalidation")

          status = "PASS" if not errors else "FAIL"
          attestation = {
              "schema_version": "v5-governance-owned-paid-candidate-attestation-1",
              "status": status,
              "candidate_sha": os.environ.get("CANDIDATE_SHA", ""),
              "previous_production_sha": os.environ.get("PREVIOUS_PRODUCTION_SHA", ""),
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "primary_artifact_id": os.environ.get("PRIMARY_ARTIFACT_ID", ""),
              "primary_artifact_digest": os.environ.get("PRIMARY_ARTIFACT_DIGEST", ""),
              "independent_revalidation_sha256": independent_sha,
              "selection_authority": authority,
              "model_selection_performed_locally": False,
              "model_reranking_performed_locally": False,
              "orchestration_library": "networkx",
              "governance_model_calls": 0,
              "outcomes": outcomes,
              "errors": errors,
          }
          rendered = json.dumps(attestation, ensure_ascii=False, indent=2)
          Path("final-governance-owned-attestation.json").write_text(
              rendered + "\n", encoding="utf-8"
          )
          receipt = {
              "schema_version": "v5-governance-owned-paid-candidate-receipt-1",
              "status": status,
              "candidate_sha": attestation["candidate_sha"],
              "production_moved": False,
              "primary_artifact_id": attestation["primary_artifact_id"],
              "primary_artifact_digest": attestation["primary_artifact_digest"],
              "attestation_sha256": hashlib.sha256(rendered.encode("utf-8")).hexdigest(),
              "selection_authority": authority,
              "model_selection_performed_locally": False,
              "errors": errors,
          }
          Path("candidate-acceptance-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, ensure_ascii=False))
          PY
          echo "status=$(jq -r '.status' candidate-acceptance-receipt.json)" >> "$GITHUB_OUTPUT"

      - name: Upload final candidate acceptance evidence
        id: final_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-owned-paid-candidate-final-${{ github.run_id }}
          path: |
            final-governance-owned-attestation.json
            candidate-acceptance-receipt.json
            independent-revalidation.json
            checked-out-candidate-sha.txt
            previous-production-sha.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish candidate acceptance receipt
        if: always()
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS: ${{ steps.attest.outputs.status }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          FINAL_ARTIFACT_ID: ${{ steps.final_artifact.outputs.artifact-id }}
        with:
          script: |
            const status = process.env.STATUS || 'FAIL';
            const body = [
              `## GOVERNANCE_OWNED_CANDIDATE_${status}`,
              '',
              `- Candidate SHA: \`${process.env.CANDIDATE_SHA || ''}\``,
              '- Selection authority: `decision-system-governance`',
              '- Expert-center local model selection: `false`',
              `- Primary Artifact ID: \`${process.env.PRIMARY_ARTIFACT_ID || ''}\``,
              `- Primary Artifact digest: \`${process.env.PRIMARY_ARTIFACT_DIGEST || ''}\``,
              `- Final Artifact ID: \`${process.env.FINAL_ARTIFACT_ID || ''}\``,
              '- Production moved: `false`',
              `- Run: \`${process.env.RUN_URL}\``
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Verify authoritative governance-owned acceptance outcome
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.prepare_report.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.manifest.outcome }}" = "success"
          test "${{ steps.ticket_artifact.outcome }}" = "success"
          test "${{ steps.independent.outcome }}" = "success"
          test "${{ steps.independent.outputs.status }}" = "PASS"
          test "${{ steps.attest.outputs.status }}" = "PASS"
          test "${{ steps.final_artifact.outcome }}" = "success"
          test "$(jq -r '.status' candidate-acceptance-receipt.json)" = "PASS"
