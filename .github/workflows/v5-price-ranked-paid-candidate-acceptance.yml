name: V5 Price-Ranked Paid Candidate Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-price-ranked-paid-candidate-acceptance
  cancel-in-progress: false

jobs:
  accept-price-ranked-main-candidate:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[acceptance]') &&
      startsWith(github.event.comment.body, '/accept-price-main ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "4"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: price-ranked-paid-candidate-acceptance
      MAXIMUM_TOTAL_CALLS: "10"
      MAXIMUM_RECOVERY_CALLS: "3"
      COST_ADVISORY_USD: "1.0"

    steps:
      - name: Validate exact price-ranked candidate command
        id: source
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            const body = String(context.payload.comment?.body || '').trim();
            const match = body.match(/^\/accept-price-main ([0-9a-f]{40})$/);
            if (!match) {
              core.setFailed('command must be /accept-price-main <40-character-main-sha>');
              return;
            }
            const candidate = match[1];
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const production = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'production'
            });
            const mainSha = String(main.data.commit.sha || '');
            const productionSha = String(production.data.commit.sha || '');
            if (candidate !== mainSha) {
              core.setFailed(`candidate ${candidate} is not current main ${mainSha}`);
              return;
            }
            if (candidate === productionSha) {
              core.setFailed('candidate is already deployed to production');
              return;
            }
            core.setOutput('candidate_sha', candidate);
            core.setOutput('previous_production_sha', productionSha);

      - name: Checkout exact main candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze candidate and production identities
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$CANDIDATE_SHA"
          test "$main" = "$CANDIDATE_SHA"
          test "$production" = "$PREVIOUS_PRODUCTION_SHA"
          test "$main" != "$production"
          printf '%s\n' "$CANDIDATE_SHA" > checked-out-candidate-sha.txt
          printf '%s\n' "$PREVIOUS_PRODUCTION_SHA" > previous-production-sha.txt

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Create isolated price-ranked acceptance ticket
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import argparse
          import json
          import os

          import v5_price_ranked_issue_ticket

          candidate = os.environ["CANDIDATE_SHA"]
          task_id = f"price-acceptance-{candidate[:16]}"
          packet = {
              "task_id": task_id,
              "route": "expert-team",
              "objective": "One explicit paid acceptance of the exact price-ranked main candidate.",
              "task": {
                  "question": (
                      "某机构只能选择一个实施方案。已知方案A成本100万元、交付30天、"
                      "失败概率12%；方案B成本140万元、交付20天、失败概率7%；"
                      "方案C成本220万元、交付10天、失败概率4%。仅依据题面比较成本、"
                      "时效和风险，给出条件化选择。"
                  ),
                  "requirements": [
                      "严格使用四个Markdown二级标题：已知条件、计算与比较、风险与反证、结论与下一步。",
                      "明确区分题面事实、推断和建议，不得引入题面外事实。",
                      "禁止工具、搜索、联网、插件、MCP、代码执行和外部数据调用。",
                      "只复用题面数字进行排序和条件化比较，不得编造外部数据。",
                      "完整交付优先，删除重复和无关扩展。"
                  ],
                  "language": "zh-CN"
              },
              "execution_acceptance": [
                  "exact candidate SHA",
                  "price-ranked runtime success",
                  "distinct model companies",
                  "NetworkX DAG",
                  "zero governance model calls",
                  "request and response no-tools boundary",
                  "independent primary Artifact revalidation PASS",
                  "final price-ranked Attestation PASS"
              ],
              "approved_budget": {
                  "calls": 10,
                  "maximum_recovery_calls": 3,
                  "cost_policy": "prompt_led_soft_governance",
                  "cost_anomaly_usd": 1.0
              },
              "private_output": False
          }
          args = argparse.Namespace(
              event_path=None,
              issue_title="[execution] exact price-ranked main candidate acceptance",
              issue_body=json.dumps(packet, ensure_ascii=False),
              issue_number=int(os.environ["ISSUE_NUMBER"]),
              actor=os.environ["GITHUB_REPOSITORY_OWNER"],
              author_association="OWNER",
              comment_body=f"/run-expert-team {task_id}",
              output_dir="ticket-artifacts"
          )
          raise SystemExit(v5_price_ranked_issue_ticket.prepare(args))
          PY
          test "$(jq -r '.accepted' ticket-artifacts/ticket-status.json)" = "true"
          test "$(jq -r '.task_id' ticket-artifacts/ticket-status.json)" = "price-acceptance-${CANDIDATE_SHA:0:16}"
          python open-model-market/v5_price_ranked_ticket_gate.py \
            --output-dir ticket-artifacts \
            --expected-calls "$MAXIMUM_TOTAL_CALLS" \
            --expected-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --expected-cost-anomaly-usd "$COST_ADVISORY_USD"

      - name: Execute exact candidate with price-ranked runtime
        id: execute
        continue-on-error: true
        env:
          AUTHORITATIVE_EXECUTION_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          task="$(cat ticket-artifacts/task.txt)"
          python open-model-market/v5_price_ranked_production_ticket.py \
            --task "$task" \
            --output-dir ticket-artifacts \
            --maximum-total-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --cost-anomaly-usd "$COST_ADVISORY_USD" \
            --require-live-catalog

      - name: Prepare report package
        id: prepare_report
        continue-on-error: true
        run: |
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

      - name: Audit complete price-ranked evidence
        id: audit
        continue-on-error: true
        run: |
          python open-model-market/v5_price_ranked_execution_auditor.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.prepare_report.outcome }}"

      - name: Freeze primary artifact manifest
        id: manifest
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          PYTHONPATH=open-model-market python - <<'PY'
          from pathlib import Path
          from artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload immutable primary artifact
        id: ticket_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-ranked-paid-candidate-primary-${{ github.run_id }}
          path: ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Download and independently revalidate primary artifact
        id: independent
        if: steps.ticket_artifact.outcome == 'success'
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_ARTIFACT_ID"
          test -n "$PRIMARY_ARTIFACT_DIGEST"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/actions/artifacts/$PRIMARY_ARTIFACT_ID/zip" \
            > uploaded-primary-artifact.zip
          rm -rf independently-downloaded-primary
          mkdir independently-downloaded-primary
          unzip -q uploaded-primary-artifact.zip -d independently-downloaded-primary
          set +e
          python open-model-market/v5_price_ranked_independent_revalidation.py \
            --artifact-dir independently-downloaded-primary \
            --expected-sha "$CANDIDATE_SHA" \
            --expected-run-id "${{ github.run_id }}" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --cost-advisory-usd "$COST_ADVISORY_USD" \
            --archive uploaded-primary-artifact.zip \
            --expected-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --output independent-revalidation.json
          exit_code=$?
          set -e
          status="$(jq -r '.status // "FAIL"' independent-revalidation.json 2>/dev/null || printf 'FAIL')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$exit_code" -eq 0
          test "$status" = "PASS"

      - name: Generate final price-ranked attestation and receipt
        id: attest
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          REPORT_OUTCOME: ${{ steps.prepare_report.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.ticket_artifact.outcome }}
          INDEPENDENT_OUTCOME: ${{ steps.independent.outcome }}
          INDEPENDENT_STATUS: ${{ steps.independent.outputs.status }}
        run: |
          PYTHONPATH=open-model-market python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("ticket-artifacts")
          def load(name):
              return json.loads((root / name).read_text(encoding="utf-8"))

          errors = []
          outcomes = {
              "execute": os.environ.get("EXECUTE_OUTCOME", ""),
              "report": os.environ.get("REPORT_OUTCOME", ""),
              "audit": os.environ.get("AUDIT_OUTCOME", ""),
              "manifest": os.environ.get("MANIFEST_OUTCOME", ""),
              "upload": os.environ.get("UPLOAD_OUTCOME", ""),
              "independent": os.environ.get("INDEPENDENT_OUTCOME", "")
          }
          for key, value in outcomes.items():
              if value != "success":
                  errors.append(f"{key}-outcome:{value}")
          if os.environ.get("INDEPENDENT_STATUS") != "PASS":
              errors.append("independent-status-not-pass")

          required = [
              "production-runtime.json",
              "v5-runtime-config.json",
              "v5-price-ranked-selection.json",
              "v5-request-audit.json",
              "v5-governance-calls.json",
              "artifact-manifest.json"
          ]
          for name in required:
              if not (root / name).is_file():
                  errors.append(f"missing:{name}")

          if not errors:
              runtime = load("production-runtime.json")
              runtime_config = load("v5-runtime-config.json")
              selection = load("v5-price-ranked-selection.json")
              request_audit = load("v5-request-audit.json")
              governance = load("v5-governance-calls.json")
              if runtime.get("runtime_version") != "v5-price-ranked-runtime-1":
                  errors.append("wrong-runtime-version")
              if runtime.get("entrypoint") != "v5_price_ranked_production_ticket.py":
                  errors.append("wrong-runtime-entrypoint")
              if runtime.get("selection_authority") != "python-price-ranked-orchestrator":
                  errors.append("wrong-selection-authority")
              if runtime.get("orchestration_library") != "networkx":
                  errors.append("networkx-not-active")
              if runtime_config.get("governance_model_calls") != 0:
                  errors.append("runtime-governance-calls-not-zero")
              if runtime_config.get("claude_mechanism_enabled") is not False:
                  errors.append("claude-mechanism-not-disabled")
              if selection.get("status") != "PASS":
                  errors.append("selection-not-pass")
              companies = [
                  str(row.get("company") or "")
                  for row in selection.get("cheapest_candidate_set", [])
              ]
              if len(companies) < 3 or len(companies) != len(set(companies)):
                  errors.append("selected-companies-not-distinct")
              costs = [
                  float(row.get("estimated_call_cost_usd") or 0.0)
                  for row in selection.get("cheapest_candidate_set", [])
              ]
              if costs != sorted(costs):
                  errors.append("candidate-cost-order-invalid")
              if request_audit.get("status") != "PASS":
                  errors.append("request-audit-not-pass")
              if governance.get("actual_governance_calls") != 0:
                  errors.append("actual-governance-calls-not-zero")
              if governance.get("claude_mechanism_enabled") is not False:
                  errors.append("governance-claude-flag-invalid")

          independent_path = Path("independent-revalidation.json")
          independent_sha = ""
          if independent_path.is_file():
              independent_sha = hashlib.sha256(independent_path.read_bytes()).hexdigest()
          else:
              errors.append("missing-independent-revalidation")

          status = "PASS" if not errors else "FAIL"
          attestation = {
              "schema_version": "v5-price-ranked-paid-candidate-attestation-1",
              "status": status,
              "candidate_sha": os.environ.get("CANDIDATE_SHA", ""),
              "previous_production_sha": os.environ.get("PREVIOUS_PRODUCTION_SHA", ""),
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "primary_artifact_id": os.environ.get("PRIMARY_ARTIFACT_ID", ""),
              "primary_artifact_digest": os.environ.get("PRIMARY_ARTIFACT_DIGEST", ""),
              "independent_revalidation_sha256": independent_sha,
              "selection_authority": "python-price-ranked-orchestrator",
              "orchestration_library": "networkx",
              "claude_mechanism_enabled": False,
              "governance_model_calls": 0,
              "outcomes": outcomes,
              "errors": errors
          }
          rendered = json.dumps(attestation, ensure_ascii=False, indent=2)
          Path("final-price-ranked-attestation.json").write_text(rendered, encoding="utf-8")
          receipt = {
              "schema_version": "v5-price-ranked-paid-candidate-receipt-1",
              "status": status,
              "candidate_sha": attestation["candidate_sha"],
              "production_moved": False,
              "primary_artifact_id": attestation["primary_artifact_id"],
              "primary_artifact_digest": attestation["primary_artifact_digest"],
              "attestation_sha256": hashlib.sha256(rendered.encode("utf-8")).hexdigest(),
              "actual_governance_calls": 0,
              "claude_mechanism_enabled": False,
              "errors": errors
          }
          Path("candidate-acceptance-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(json.dumps(receipt, ensure_ascii=False))
          PY
          echo "status=$(jq -r '.status' candidate-acceptance-receipt.json)" >> "$GITHUB_OUTPUT"

      - name: Upload final candidate acceptance evidence
        id: final_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-ranked-paid-candidate-final-${{ github.run_id }}
          path: |
            checked-out-candidate-sha.txt
            previous-production-sha.txt
            independently-downloaded-primary/
            independent-revalidation.json
            uploaded-primary-artifact.zip
            final-price-ranked-attestation.json
            candidate-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish authoritative price-ranked acceptance status
        if: always()
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          RECEIPT_FILE: candidate-acceptance-receipt.json
          FINAL_ARTIFACT_ID: ${{ steps.final_artifact.outputs.artifact-id }}
          RUN_URL: ${{ env.RUN_URL }}
        with:
          script: |
            const fs = require('fs');
            let receipt = {status: 'FAIL', errors: ['receipt-missing']};
            if (fs.existsSync(process.env.RECEIPT_FILE)) {
              receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_FILE, 'utf8'));
            }
            const body = [
              `## PRICE_RANKED_CANDIDATE_${receipt.status}`,
              '',
              `- Candidate SHA: \`${receipt.candidate_sha || ''}\``,
              `- Run: ${process.env.RUN_URL}`,
              `- Primary Artifact ID: \`${receipt.primary_artifact_id || ''}\``,
              `- Primary Artifact Digest: \`${receipt.primary_artifact_digest || ''}\``,
              `- Final Evidence Artifact ID: \`${process.env.FINAL_ARTIFACT_ID || ''}\``,
              `- Selection: \`python-price-ranked-orchestrator\``,
              `- Orchestration: \`networkx\``,
              `- Claude mechanism: \`disabled\``,
              `- Governance model calls: \`0\``,
              `- Production moved: \`false\``,
              `- Errors: \`${JSON.stringify(receipt.errors || [])}\``
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Verify authoritative price-ranked acceptance outcome
        if: always()
        run: |
          set -euo pipefail
          test -f candidate-acceptance-receipt.json
          test "$(jq -r '.status' candidate-acceptance-receipt.json)" = "PASS"
          test "${{ steps.attest.outputs.status }}" = "PASS"
