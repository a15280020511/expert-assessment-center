name: PR227 Remediate Quality Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/remediate_pr227.py"
      - ".github/workflows/pr227-remediate-quality-contracts.yml"

permissions:
  contents: write

concurrency:
  group: pr227-remediate-quality-contracts
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Apply deterministic remediation
        run: python tools/remediate_pr227.py

      - name: Verify removed interfaces and stale records
        run: |
          set -euo pipefail
          ! grep -R --line-number --exclude='test*.py' --exclude-dir=.git \
            'quality_tier' open-model-market .github/workflows
          ! test -e .github/v5-paid-acceptance-request.json
          ! test -e .github/v5-paid-acceptance-attestation.json
          ! grep -q -- '--quality-tier' .github/workflows/v5-one-time-paid-acceptance.yml
          grep -q 'v5-paid-acceptance-3' .github/workflows/v5-one-time-paid-acceptance.yml
          grep -q 'dynamic_execution' open-model-market/expert-team-capabilities.json

      - name: Run full zero-cost validation
        env:
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v
          rm -rf remediation-audit
          python tools/repository_audit.py \
            --root . \
            --output-dir remediation-audit \
            --fail-on high

      - name: Commit remediation and remove temporary files
        run: |
          set -euo pipefail
          rm tools/remediate_pr227.py
          rm .github/workflows/pr227-remediate-quality-contracts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: remove dead quality tier and stale acceptance contracts"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
