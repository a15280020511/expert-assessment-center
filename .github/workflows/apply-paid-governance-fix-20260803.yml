name: Apply Paid Governance Fix 2026-08-03

on:
  push:
    branches:
      - "fix/v5-paid-governance-output-ledger-20260803"
    paths:
      - ".github/paid-fix/fix.patch.b64"

permissions:
  contents: write

concurrency:
  group: apply-paid-governance-fix-20260803
  cancel-in-progress: false

jobs:
  apply-fix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply verified fix and run zero-cost validation
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/paid-fix/fix.patch.b64
          test "$(sha256sum "$payload" | awk '{print $1}')" = "b9813d11f32575cc572ba22072059dc486a9f23b90e2612aaea2f8d08e677aef"
          base64 --decode "$payload" | gzip --decompress > /tmp/fix.patch
          test "$(sha256sum /tmp/fix.patch | awk '{print $1}')" = "6312fc0ed45dbd92347fee8793dd33ad28129b1bc8fab41600d60b0d730dc47e"
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          rm -rf .github/paid-fix
          rm -f .github/workflows/apply-paid-governance-fix-20260803.yml
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v
          python tools/repository_audit.py --root . --output-dir /tmp/repository-audit --fail-on info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve failed paid ledgers and separate governance output cap"
          git push origin "HEAD:${GITHUB_REF_NAME}"
