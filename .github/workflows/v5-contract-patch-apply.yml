name: Apply V5 Contract Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/v5-planner-runtime-budget-parity-r126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-planner-runtime-budget-parity-r126
          persist-credentials: true

      - name: Apply patch when needed
        run: |
          if grep -q 'import v5_task_delivery_contract as task_delivery_contract' open-model-market/task_semantic_compiler.py; then
            echo 'Contract patch already applied.'
            exit 0
          fi
          python scripts/apply_v5_contract_patch_r126.py

      - name: Commit patch when changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add open-model-market/task_semantic_compiler.py open-model-market/v5_output_contract_delivery.py open-model-market/v5_runtime.py
          git diff --cached --check
          git commit -m 'fix(v5): enforce explicit final delivery contracts'
          git push origin HEAD:fix/v5-planner-runtime-budget-parity-r126
