name: Apply V5 Live Acceptance Contract Fix

on:
  push:
    branches:
      - fix/v5-live-acceptance-contract-20260802

permissions:
  contents: write

concurrency:
  group: apply-v5-live-acceptance-contract-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/v5-live-acceptance-contract-20260802
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Apply exact production patch
        run: python tools/apply_v5_live_acceptance_contract_patch.py
      - name: Verify focused regressions
        run: |
          set -euo pipefail
          python -m ruff check \
            open-model-market/v5_task_constraints.py \
            open-model-market/v5_constitutional_runtime.py \
            open-model-market/v5_independent_artifact_revalidation.py \
            tests/test_v5_task_constraints.py \
            tests/test_v5_independent_artifact_revalidation.py \
            tests/test_v5_failure_evidence_persistence.py
          python -m compileall -q open-model-market tests tools
          python -m unittest -v \
            tests.test_v5_task_constraints \
            tests.test_v5_independent_artifact_revalidation \
            tests.test_v5_failure_evidence_persistence \
            tests.test_v5_fact_label_purity_normalization \
            tests.test_v5_fact_provenance_semantic_normalization \
            tests.test_v5_native_audit_contract
      - name: Commit verified patch and self-remove
        env:
          BRANCH: fix/v5-live-acceptance-contract-20260802
        run: |
          set -euo pipefail
          git rm tools/apply_v5_live_acceptance_contract_patch.py
          git rm .github/workflows/apply-v5-live-acceptance-contract-fix.yml
          git add \
            open-model-market/v5_task_constraints.py \
            open-model-market/v5_constitutional_runtime.py \
            open-model-market/v5_independent_artifact_revalidation.py \
            tests/test_v5_task_constraints.py \
            tests/test_v5_independent_artifact_revalidation.py \
            tests/test_v5_failure_evidence_persistence.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(runtime): preserve live acceptance evidence contracts"
          git push origin "HEAD:$BRANCH"
