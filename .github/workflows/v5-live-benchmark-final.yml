name: V5 Economy Blind Benchmark

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-economy-blind-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[v5-benchmark-economy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_HISTORY_PATH: v5-live-benchmark-artifacts/runtime-state/model-performance.json
      V5_BENCHMARK_OUTPUT_ALLOWANCE_TOKENS: "1800"

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt

      - name: Compile benchmark and production modules
        run: |
          python -m pip check
          python -m py_compile open-model-market/*.py

      - name: Parse economical benchmark request
        id: prepare
        run: |
          python open-model-market/v5_live_benchmark_economy.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir v5-live-benchmark-artifacts

      - name: Publish benchmark acceptance
        run: |
          cat > benchmark-accepted.md <<EOF
          ## V5_ECONOMY_BENCHMARK_ACCEPTED

          - Tasks: ${{ steps.prepare.outputs.task_count }} diverse real tasks
          - Strategies: active V5 cost-performance graph versus preserved V3 only
          - Blind judges: two distinct models/providers per task; third only when disagreement exceeds 15 points
          - Global actual-cost ceiling: ${{ steps.prepare.outputs.max_cost_usd }} USD
          - Global paid-call ceiling: ${{ steps.prepare.outputs.max_calls }}
          - Output allowance: up to ${{ steps.prepare.outputs.output_allowance_tokens }} completion tokens; not required output
          - Expensive strongest/cheapest/fixed/random reference baselines: not executed
          - V3 production entry: preserved and unchanged during benchmark
          - Run: ${RUN_URL}
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-accepted.md

      - name: Check OpenRouter secret
        id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish missing-secret rejection
        if: steps.secret.outputs.present != 'true'
        run: |
          cat > benchmark-rejected.md <<EOF
          ## V5_ECONOMY_BENCHMARK_REJECTED

          The repository is missing the Actions Secret OPENROUTER_API_KEY.

          - Model inference calls: 0
          - Production entrypoint changed: false
          - V3 deleted: false
          - Run: ${RUN_URL}
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-rejected.md

      - name: Verify bounded spending evidence
        id: credit
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
        run: |
          python open-model-market/v5_live_benchmark_economy.py credit-check \
            --config v5-live-benchmark-artifacts/benchmark-config.json \
            --output-dir v5-live-benchmark-artifacts

      - name: Publish spending-preflight rejection
        if: steps.secret.outputs.present == 'true' && steps.credit.outcome != 'success'
        run: |
          python - <<'PY' > benchmark-credit-rejected.md
          import json
          from pathlib import Path
          path = Path("v5-live-benchmark-artifacts/credit-preflight.json")
          data = json.loads(path.read_text()) if path.exists() else {}
          print("## V5_ECONOMY_BENCHMARK_REJECTED")
          print()
          print("已在任何模型推理前停止：可验证额度低于本次低成本硬上限。")
          print()
          print(f"- Required reserve: `{data.get('required_reserve_usd', 'unknown')} USD`")
          print(f"- Status: `{data.get('status', 'unknown')}`")
          print(f"- Blockers: `{','.join(data.get('blockers') or ['preflight-failed'])}`")
          print("- Model inference calls: `0`")
          print("- Production entrypoint changed: `false`")
          print("- V3 deleted: `false`")
          PY
          printf '\n- Run: `%s`\n' "$RUN_URL" >> benchmark-credit-rejected.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-credit-rejected.md

      - name: Run economical live blind benchmark
        id: execute
        if: steps.secret.outputs.present == 'true' && steps.credit.outcome == 'success'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_APP_NAME: Expert Assessment Center Economy Benchmark
          OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MODEL_HISTORY_PATH")"
          printf '{"version":1,"models":{}}\n' > "$MODEL_HISTORY_PATH"
          python open-model-market/v5_live_benchmark_economy.py run \
            --config v5-live-benchmark-artifacts/benchmark-config.json \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-live-benchmark-artifacts \
            2>&1 | tee v5-live-benchmark-artifacts/benchmark-console.log

      - name: Refresh artifact manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          root = Path("v5-live-benchmark-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          write_manifest(root)
          PY

      - name: Upload economical benchmark artifacts
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v5-economy-benchmark-${{ github.event.issue.number }}-${{ github.run_id }}
          path: v5-live-benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish benchmark result
        if: always() && steps.secret.outputs.present == 'true' && steps.credit.outcome == 'success'
        continue-on-error: true
        run: |
          if [[ -s v5-live-benchmark-artifacts/v5-live-benchmark-results.json ]]; then
            python open-model-market/v5_live_benchmark.py render \
              --output-dir v5-live-benchmark-artifacts \
              --run-url "$RUN_URL" > benchmark-result.md
          else
            cat > benchmark-result.md <<EOF
          ## V5_ECONOMY_BENCHMARK_FAILED

          No complete benchmark result was generated.

          - Execute outcome: ${{ steps.execute.outcome }}
          - Production entrypoint changed: false
          - V3 deleted: false
          - Run: ${RUN_URL}
          EOF
          fi
          cat >> benchmark-result.md <<EOF

          - Artifact ID: ${{ steps.upload.outputs.artifact-id }}
          - Artifact URL: ${{ steps.upload.outputs.artifact-url }}
          - Artifact digest: ${{ steps.upload.outputs.artifact-digest }}
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-result.md

      - name: Mark incomplete benchmark
        if: >-
          always() &&
          (steps.secret.outputs.present != 'true' ||
           steps.credit.outcome == 'failure' ||
           steps.execute.outcome == 'failure' ||
           steps.upload.outcome == 'failure')
        run: exit 1
