name: V5 Free Shadow Production Qualification

on:
  push:
    branches:
      - "acceptance/v5-free-shadow-*"
    paths:
      - ".github/v5-free-shadow-request.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: v5-free-shadow-production-qualification
  cancel-in-progress: false

jobs:
  execute-free-shadow:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      target_sha: ${{ steps.request.outputs.target_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      artifact_name: v5-free-shadow-primitive-${{ github.run_id }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "180"
      PARALLEL_WORKERS: "1"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-free-shadow-qualification
    steps:
      - name: Check out immutable free-shadow request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
          path: request-source

      - name: Resolve exact authorized target
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=request-source/.github/v5-free-shadow-request.json
          jq -e '
            type == "object" and
            (keys | sort) == [
              "authorization",
              "maximum_model_calls",
              "maximum_paid_model_calls",
              "request_id",
              "schema_version",
              "target_sha"
            ] and
            .schema_version == "v5-free-shadow-request-1" and
            .authorization == "FREE-SHADOW-ONLY-NO-PAID-FALLBACK" and
            (.request_id | test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
            (.target_sha | test("^[0-9a-f]{40}$")) and
            .maximum_model_calls == 4 and
            .maximum_paid_model_calls == 0
          ' "$request" >/dev/null
          test "$(git -C request-source diff --name-only HEAD^ HEAD)" = ".github/v5-free-shadow-request.json"
          target="$(jq -er '.target_sha' "$request")"
          test "$(git -C request-source rev-parse HEAD^)" = "$target"
          {
            echo "target_sha=$target"
            echo "request_id=$(jq -er '.request_id' "$request")"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runtime-source/requirements-runtime.txt
            runtime-source/requirements-dev.txt

      - name: Install pinned validation dependencies
        working-directory: runtime-source
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Complete zero-call gates before free inference
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Execute production protocol with four explicit free calls
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf free-shadow-artifacts
          GITHUB_SHA="$TARGET_SHA" PYTHONPATH=open-model-market python \
            open-model-market/v5_free_shadow_acceptance.py \
            --output-dir free-shadow-artifacts \
            --max-completion-tokens 2048

      - name: Verify free-only full-chain constitution
        working-directory: runtime-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("free-shadow-artifacts")
          receipt = json.loads((root / "free-shadow-acceptance-receipt.json").read_text())
          boundary = json.loads((root / "free-shadow-call-boundary.json").read_text())
          identity = json.loads((root / "free-shadow-identity.json").read_text())
          governance = json.loads((root / "v5-governance-calls.json").read_text())
          result = json.loads((root / "expert-team-result.json").read_text())
          audit = json.loads((root / "v5-request-audit.json").read_text())

          assert receipt["status"] == "PASS"
          assert receipt["target_sha"] == os.environ["TARGET_SHA"]
          assert receipt["total_model_calls"] == 4
          assert receipt["successful_free_model_calls"] == 4
          assert receipt["paid_model_calls"] == 0
          assert receipt["actual_cost_usd"] == 0.0
          assert receipt["completion_mode"] == "full"
          assert receipt["quality_status"] == "full_success"
          assert receipt["formal_model_identity_qualified"] is False
          assert receipt["production_promotion_authorized"] is False
          assert receipt["production_ref_moved"] is False
          assert boundary["status"] == "PASS"
          assert boundary["actual_calls"] == 4
          assert boundary["paid_model_calls"] == 0
          assert boundary["actual_cost_usd"] == 0.0
          assert all(row["model"].endswith(":free") for row in boundary["calls"])
          assert len({row["company"] for row in boundary["calls"]}) >= 3
          assert [row["kind"] for row in governance["calls"]] == [
              "gpt_proposal", "claude_red_team", "gpt_synthesis"
          ]
          assert result["status"] == "success"
          assert result["total_model_calls"] == 4
          assert result["actual_cost_usd"] == 0.0
          assert audit["status"] == "PASS"
          assert audit["request_count"] == 4
          assert audit["external_tools_allowed"] is False
          assert audit["provider_fallback_allowed"] is False
          assert identity["formal_model_identity_qualified"] is False
          assert identity["production_promotion_authorized"] is False
          assert identity["production_ref_moved"] is False

          receipt["request_id"] = os.environ["REQUEST_ID"]
          (root / "free-shadow-acceptance-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          PYTHONPATH=open-model-market python - <<'PY'
          from pathlib import Path
          from artifact_manifest import write_manifest
          write_manifest(Path("free-shadow-artifacts"))
          PY

      - name: Upload primitive free-shadow Artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-free-shadow-primitive-${{ github.run_id }}
          path: runtime-source/free-shadow-artifacts/
          if-no-files-found: error
          retention-days: 30

  independently-recompute-free-shadow:
    needs: execute-free-shadow
    if: needs.execute-free-shadow.result == 'success' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SHADOW_RUN_ID: ${{ github.run_id }}
      TARGET_SHA: ${{ needs.execute-free-shadow.outputs.target_sha }}
      REQUEST_ID: ${{ needs.execute-free-shadow.outputs.request_id }}
      EXPECTED_ARTIFACT_NAME: ${{ needs.execute-free-shadow.outputs.artifact_name }}
    steps:
      - name: Check out exact independent validator source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.execute-free-shadow.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: runtime-source

      - name: Set up independent Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime-source/requirements-runtime.txt

      - name: Install independent validator dependencies
        working-directory: runtime-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Resolve and download this Run Artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C runtime-source rev-parse HEAD)" = "$TARGET_SHA"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/runs/$SHADOW_RUN_ID/artifacts?per_page=100" \
            > artifacts.json
          artifact_id=$(jq -er --arg name "$EXPECTED_ARTIFACT_NAME" '
            .artifacts
            | map(select(.name == $name and .expired == false))
            | if length == 1 then .[0].id else error("expected exactly one free-shadow artifact") end
          ' artifacts.json)
          artifact_digest=$(jq -er --argjson id "$artifact_id" '
            .artifacts[] | select(.id == $id) | .digest
          ' artifacts.json)
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > free-shadow.zip
          rm -rf free-shadow-evidence
          mkdir free-shadow-evidence
          unzip -q free-shadow.zip -d free-shadow-evidence
          {
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Independently recompute from primitive evidence
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          PYTHONPATH=runtime-source/open-model-market python \
            runtime-source/open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir free-shadow-evidence \
            --expected-sha "$TARGET_SHA" \
            --expected-run-id "$SHADOW_RUN_ID" \
            --maximum-calls 4 \
            --maximum-cost-usd 0.000001 \
            --archive free-shadow.zip \
            --expected-artifact-digest "$ARTIFACT_DIGEST" \
            --output independent-free-shadow-revalidation.json

      - name: Create non-production shadow attestation
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg run_id "$SHADOW_RUN_ID" \
            --arg target_sha "$TARGET_SHA" \
            --arg artifact_name "$EXPECTED_ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --slurpfile recomputed independent-free-shadow-revalidation.json \
            '{
              schema_version: "v5-free-shadow-attestation-1",
              status: (if $recomputed[0].status == "PASS" then "PASS" else "FAIL" end),
              request_id: $request_id,
              workflow_run_id: $run_id,
              target_sha: $target_sha,
              artifact_id: $artifact_id,
              artifact_name: $artifact_name,
              artifact_digest: $artifact_digest,
              independent_revalidation: $recomputed[0],
              independently_recomputed_from_primitive_evidence: true,
              paid_acceptance_verdict_used_as_source: false,
              successful_free_model_calls: 4,
              paid_model_calls: 0,
              actual_cost_usd: 0.0,
              formal_model_identity_qualified: false,
              production_promotion_authorized: false,
              production_ref_moved: false
            }' > free-shadow-attestation.json
          test "$(jq -r '.status' free-shadow-attestation.json)" = "PASS"
          test "$(jq -r '.formal_model_identity_qualified' free-shadow-attestation.json)" = "false"
          test "$(jq -r '.production_promotion_authorized' free-shadow-attestation.json)" = "false"

      - name: Check out request branch for durable receipt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          path: receipt-source

      - name: Persist authoritative free-shadow evidence
        run: |
          set -euo pipefail
          mkdir -p receipt-source/acceptance-evidence
          cp independent-free-shadow-revalidation.json \
            receipt-source/acceptance-evidence/v5-free-shadow-independent-revalidation.json
          cp free-shadow-attestation.json \
            receipt-source/acceptance-evidence/v5-free-shadow-attestation.json
          git -C receipt-source config user.name "github-actions[bot]"
          git -C receipt-source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C receipt-source add acceptance-evidence/
          git -C receipt-source commit -m "audit: persist independently revalidated free shadow acceptance"
          git -C receipt-source push origin "HEAD:${GITHUB_REF}"

      - name: Upload independent free-shadow attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-free-shadow-attestation-${{ github.run_id }}
          path: |
            independent-free-shadow-revalidation.json
            free-shadow-attestation.json
          if-no-files-found: error
          retention-days: 30
