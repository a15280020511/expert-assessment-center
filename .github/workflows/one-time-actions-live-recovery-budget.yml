name: One-Time Actions Live Recovery Budget Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-actions-live-recovery-budget.yml"
      - "tools/one_time_live_recovery_budget_fix.py"

permissions:
  contents: write

concurrency:
  group: one-time-actions-live-recovery-budget-fix
  cancel-in-progress: true

jobs:
  build-qualified-fix:
    if: >-
      github.repository == 'a15280020511/expert-assessment-center' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bootstrap/v5-live-recovery-budget-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: c5aa7eae08618644e8bd13e4acb4c868d10115bf
      TARGET_BRANCH: actions/v5-live-recovery-budget-20260802
      BOOTSTRAP_BRANCH: bootstrap/v5-live-recovery-budget-20260802
    steps:
      - name: Checkout exact production-candidate main baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: c5aa7eae08618644e8bd13e4acb4c868d10115bf
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Apply deterministic transformer from bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin "$BOOTSTRAP_BRANCH"
          git show "origin/$BOOTSTRAP_BRANCH:tools/one_time_live_recovery_budget_fix.py" \
            > tools/.one_time_live_recovery_budget_fix.py
          python tools/.one_time_live_recovery_budget_fix.py
          rm tools/.one_time_live_recovery_budget_fix.py
          # GitHub App cannot update workflow files. The validated control-plane
          # delta is applied separately to the target PR after this code commit.
          git checkout -- .github/workflows/validate.yml
          git diff --check

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and targeted recovery gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-recovery-validation-logs
          python -m ruff check . --fix 2>&1 | tee live-recovery-validation-logs/ruff-fix.log
          python -m ruff check . 2>&1 | tee live-recovery-validation-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee live-recovery-validation-logs/compileall.log
          python -m unittest \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_full_load_stability \
            -v 2>&1 | tee live-recovery-validation-logs/targeted-tests.log

      - name: Run full unit suite and 38 native P0 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee live-recovery-validation-logs/unit-test.log
          grep -Eq '^Ran [0-9]+ tests? in ' live-recovery-validation-logs/unit-test.log
          grep -q '^OK$' live-recovery-validation-logs/unit-test.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee live-recovery-validation-logs/p0-regressions.log
          grep -q 'REGISTERED V5CriticalDeliveryReliabilityTests: 4' \
            live-recovery-validation-logs/p0-regressions.log
          grep -q 'REGISTERED TOTAL: 38' live-recovery-validation-logs/p0-regressions.log
          grep -q 'P0 REGRESSION RESULT: run=38, passed=38, failures=0, errors=0, skipped=0' \
            live-recovery-validation-logs/p0-regressions.log

      - name: Freeze live-ledger recovery qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          unit_tests="$(python - <<'PY'
          import re
          from pathlib import Path
          values = re.findall(
              r'^Ran (\d+) tests? in ',
              Path('live-recovery-validation-logs/unit-test.log').read_text(),
              re.MULTILINE,
          )
          if not values:
              raise SystemExit('unit test count missing')
          print(values[-1])
          PY
          )"
          python - <<PY
          import json
          from pathlib import Path
          path = Path('open-model-market/live-recovery-budget-fix-evidence.json')
          value = json.loads(path.read_text())
          value.update({
              'status': 'PASS',
              'source_baseline_sha': '$BASE_SHA',
              'full_unit_test_count': int('$unit_tests'),
              'p0_regression_count': 38,
              'targeted_recovery_tests': 'PASS',
              'ruff': 'PASS',
              'compileall': 'PASS',
              'paid_model_calls': 0,
              'production_ref_moved': False,
          })
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')
          PY
          cat open-model-market/live-recovery-budget-fix-evidence.json

      - name: Commit exact qualified code tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf live-recovery-validation-logs
          git switch -C "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v5): admit recovery from live actual-cost ledger"
          remote_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [[ -n "$remote_target" ]]; then
            git push \
              --force-with-lease="refs/heads/$TARGET_BRANCH:$remote_target" \
              origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

      - name: Upload zero-cost diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-live-recovery-budget-${{ github.run_id }}
          path: live-recovery-validation-logs/
          if-no-files-found: warn
          retention-days: 14
