name: Apply Soft Governance Audit Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-soft-governance-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'a15280020511/expert-assessment-center' &&
      github.event.pull_request.head.ref == 'codex/soft-governance-granular-audit-20260804' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/soft-governance-granular-audit-20260804
          fetch-depth: 0

      - name: Verify and apply frozen patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .audit-payload -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 6
          cat .audit-payload/part-*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/soft-governance-audit.patch
          git apply --check --binary /tmp/soft-governance-audit.patch
          git apply --binary /tmp/soft-governance-audit.patch
          rm -rf .audit-payload
          rm -f .github/workflows/apply-soft-governance-audit.yml
          git diff --check

      - name: Commit audited source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: eliminate residual token and cost hard gates'
          git push origin HEAD:codex/soft-governance-granular-audit-20260804
