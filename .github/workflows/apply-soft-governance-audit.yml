name: Apply Soft Governance Audit Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-soft-governance-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'a15280020511/expert-assessment-center' &&
      github.event.pull_request.head.ref == 'codex/soft-governance-granular-audit-20260804' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/soft-governance-granular-audit-20260804
          fetch-depth: 0

      - name: Verify and apply frozen patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .audit-payload -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 8
          cat > /tmp/expected.sha256 <<'EOF'
          2f5f808774541382a35850894ffca1149706339f79fe8c2f823db3054e36ff0a  .audit-payload/part-001.b64
          d0726187100b300866a2c781600cc99a2d312ceab516110a1736ce2445fba816  .audit-payload/part-002.b64
          26ace4f308297b5b462c4f0328bbe64f2a87bee604c8ce3a664a88ed9478bae7  .audit-payload/part-003.b64
          f74355c28fc66c1bea3792ca64fbcd3faeb7447efc1fd238a92fec5b9629f706  .audit-payload/part-004.b64
          046e87339f25cf1a10ca4fec1ffea8fa3b8b01c1d17ef082a2ecb32fde85148a  .audit-payload/part-005.b64
          1f7b8035e74f05058295edd327ffec897db4e79b001e5eda3e5decd4d5975015  .audit-payload/part-006a.b64
          7b087b963a77871d7c916b18dbcb73c1251e858b1f318afef68442841c5aa9b1  .audit-payload/part-006b.b64
          EOF
          sha256sum --check /tmp/expected.sha256
          cat \
            .audit-payload/part-001.b64 \
            .audit-payload/part-002.b64 \
            .audit-payload/part-003.b64 \
            .audit-payload/part-004.b64 \
            .audit-payload/part-005.b64 \
            .audit-payload/part-006a.b64 \
            .audit-payload/part-006b.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/soft-governance-audit.patch
          git apply --check --binary /tmp/soft-governance-audit.patch
          git apply --binary /tmp/soft-governance-audit.patch
          rm -rf .audit-payload
          rm -f .github/workflows/apply-soft-governance-audit.yml
          git diff --check

      - name: Commit audited source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: eliminate residual token and cost hard gates'
          git push origin HEAD:codex/soft-governance-granular-audit-20260804
