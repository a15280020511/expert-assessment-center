name: Copy Refreshed Plan To Original Task

on:
  push:
    branches:
      - "ops/copy-refreshed-plan-to-316"

permissions:
  contents: read
  issues: write

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and validate refreshed signed ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/issues/322 > source.json
          jq -e '.title == "[execution] gov-221-expert via governance"' source.json
          jq -e '.body | fromjson | .task_id == "gov-221-expert"' source.json
          jq -e '.body | fromjson | .governance_model_plan.model_calls == 0' source.json
          jq -e '.body | fromjson | .governance_model_plan.catalog_fetch_mode == "live-per-task-no-cross-task-cache"' source.json
          jq -e '.body | fromjson | .governance_model_plan.selected_models | length == 4' source.json
          jq -e '.body | fromjson | .governance_model_plan.recovery_models | length == 4' source.json
          jq -e '[.body | fromjson | .governance_model_plan.price_ranked_models[].company] | length == 8 and (unique | length == 8)' source.json
          jq -r '.body' source.json > signed-body.json

      - name: Copy exact signed body to original Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --rawfile body signed-body.json \
            '{title:"[execution] gov-221-expert via governance", body:$body, state:"open"}' \
            > patch.json
          gh api \
            --method PATCH \
            repos/${GITHUB_REPOSITORY}/issues/316 \
            --input patch.json \
            > updated.json
          jq -e '.number == 316 and .state == "open" and .title == "[execution] gov-221-expert via governance"' updated.json
          test "$(jq -r '.body' updated.json | sha256sum | cut -d' ' -f1)" = \
               "$(sha256sum signed-body.json | cut -d' ' -f1)"

      - name: Publish zero-call copy receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan_sha="$(jq -r '.body | fromjson | .governance_model_plan.plan_sha256' source.json)"
          gh issue comment 316 --body "## GOVERNANCE_PLAN_COPIED\n\n- Source Issue: \`#322\`\n- Target Issue: \`#316\`\n- Plan SHA256: \`${plan_sha}\`\n- Model calls during copy: \`0\`\n- Retry command not emitted by automation."
