name: Maintenance Source Export

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

env:
  EXPORT_ISSUE_TITLE: "[maintenance-source-export] production audit snapshot"
  EXPORT_COMMAND: "/export-production-source"

jobs:
  export-source:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance-source-export] production audit snapshot' &&
      github.event.comment.body == '/export-production-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production
          persist-credentials: false
          fetch-depth: 1

      - name: Build read-only source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p maintenance-export
          git rev-parse HEAD > maintenance-export/PRODUCTION_COMMIT.txt
          find . -type f \
            ! -path './.git/*' \
            ! -path './maintenance-export/*' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > maintenance-export/SHA256SUMS.txt
          tar \
            --exclude='./.git' \
            --exclude='./maintenance-export/source.tar.gz' \
            -czf maintenance-export/source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-source-${{ github.run_id }}
          path: maintenance-export/
          if-no-files-found: error
          retention-days: 1
