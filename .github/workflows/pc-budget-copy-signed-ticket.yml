name: Copy Governance Signed Ticket For One Real Run

on:
  push:
    branches:
      - control/pc-budget-real-run-20260807

permissions:
  contents: read
  issues: write

jobs:
  copy-signed-ticket:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_REPO: ${{ github.repository }}
      SOURCE_REPO: a15280020511/decision-system-governance
      SOURCE_ISSUE: "252"
    steps:
      - name: Fetch and validate immutable governance ticket
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SOURCE_REPO/issues/$SOURCE_ISSUE" \
            > /tmp/source.json
          test "$(jq -r '.state' /tmp/source.json)" = "closed"
          jq -er '.body | fromjson | select(.task_id == "run-20260807-pc-budget") | select(.route == "expert-team") | select(.private_output == false) | select(.governance_model_plan.top50_reasoning_pool_size == 50)' /tmp/source.json >/dev/null
          jq -r '.body' /tmp/source.json > /tmp/signed-ticket.json

      - name: Create exact acceptance Issue without execution command
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg title '[acceptance] run-20260807-pc-budget real execution' \
            --rawfile body /tmp/signed-ticket.json \
            '{title:$title, body:$body}' > /tmp/create.json
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPO/issues" \
            --data-binary @/tmp/create.json \
            > /tmp/created.json
          jq -e '.number and .html_url' /tmp/created.json
          echo "Created acceptance issue #$(jq -r '.number' /tmp/created.json)"
