name: Validate V5 Admission Task Isolation

on:
  pull_request:
    paths:
      - "open-model-market/resource_matrix.py"
      - "open-model-market/v5_production_ticket.py"
      - "tests/test_v5_admission_task_isolation.py"
      - ".github/workflows/v5-admission-task-isolation-validate.yml"
  push:
    branches: [main]
    paths:
      - "open-model-market/resource_matrix.py"
      - "open-model-market/v5_production_ticket.py"
      - "tests/test_v5_admission_task_isolation.py"
      - ".github/workflows/v5-admission-task-isolation-validate.yml"

permissions:
  contents: read

jobs:
  validate-admission-task-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Compile changed production modules
        run: |
          python -m py_compile \
            open-model-market/resource_matrix.py \
            open-model-market/v5_production_ticket.py
      - name: Replay Issue 113 at zero model cost
        run: python -m unittest tests.test_v5_admission_task_isolation -v
