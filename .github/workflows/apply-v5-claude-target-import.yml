name: Apply V5 Claude Target Import

on:
  push:
    branches:
      - fix/v5-claude-exact-target-enum-20260804
    paths:
      - .github/v5-claude-target-import.trigger

permissions:
  contents: write

concurrency:
  group: apply-v5-claude-target-import
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-exact-target-enum-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Switch production governance to exact-target request builder
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('open-model-market/v5_governance_runtime.py')
          text = path.read_text(encoding='utf-8')
          before = '''from v5_claude_red_team_policy import (
              CLAUDE_RED_TEAM_GOVERNANCE_CALLS,
              build_claude_red_team_request,
              parse_claude_red_team_advice,
          )
          from v5_execution_primitives import actual_cost, extract_answer
          '''
          after = '''from v5_claude_red_team_policy import (
              CLAUDE_RED_TEAM_GOVERNANCE_CALLS,
              parse_claude_red_team_advice,
          )
          from v5_execution_primitives import actual_cost, extract_answer
          from v5_production_claude_request import build_claude_red_team_request
          '''
          if text.count(before) != 1:
              raise SystemExit('expected governance import block was not found exactly once')
          path.write_text(text.replace(before, after), encoding='utf-8')
          PY
          rm -f .github/v5-claude-target-import.trigger
          rm -f .github/workflows/apply-v5-claude-target-import.yml
          python -m compileall -q open-model-market tests
          git diff --check

      - name: Commit exact import switch
        run: |
          set -euo pipefail
          git config user.name 'a15280020511'
          git config user.email 'a15280020511@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use exact-target Claude production request'
          git push origin HEAD:fix/v5-claude-exact-target-enum-20260804
