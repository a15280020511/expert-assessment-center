name: One-Time Final Head Audit 2026-08-03

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-final-head-audit-20260803.yml"

permissions:
  contents: read

jobs:
  architecture-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MODEL_MAX_RETRIES: "0"
      PARALLEL_WORKERS: "1"
    steps:
      - name: Check out exact final PR227 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: b91e5744e467ab43f4dc50a5c4a9318786c397b1
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Verify architecture residue is zero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-head-audit
          test "$(git rev-parse HEAD)" = "b91e5744e467ab43f4dc50a5c4a9318786c397b1"
          removed=(
            open-model-market/issue_ticket.py
            open-model-market/issue_ticket_hardened.py
            open-model-market/v5_value_optimizer.py
            open-model-market/v5_planner.py
            open-model-market/v5_planning_runtime.py
            open-model-market/v5_constitutional_pipeline.py
            open-model-market/v5_cross_endpoint_planner.py
            open-model-market/v5_cross_endpoint_planner_impl.py
            open-model-market/v5_operational_resilience.py
            open-model-market/v5_general_task_planning.py
            open-model-market/task_semantic_compiler.py
            open-model-market/resource_matrix.py
            open-model-market/atomic_work_graph.py
            open-model-market/team_policy.json
            .github/workflows/v5-one-time-paid-claude-acceptance-20260803.yml
            .github/workflows/pr227-remediate-quality-contracts.yml
          )
          for path in "${removed[@]}"; do test ! -e "$path"; done
          ! grep -R --line-number --exclude-dir=.git \
            -E 'quality_tier|--quality-tier|expected-quality-tier' \
            open-model-market .github/workflows
          ! grep -R --line-number --exclude-dir=.git \
            -E 'ortools|cp_model|CpSolver|CpModel|optimize_execution_graph|pareto_prune|compile_v5_task_resources|compile_task_semantics' \
            open-model-market requirements-runtime.txt
          ! grep -R --line-number --exclude-dir=.git \
            -E '\._format_schema_error\s*=|\._issue_comments\s*=|\._execution_state\s*=|\.task_fingerprint\s*=|_install_schema_messages' \
            open-model-market
          grep -q '~openai/gpt-latest' open-model-market/v5_gpt_expert_selector.py
          grep -q '~anthropic/claude-opus-latest' open-model-market/v5_claude_red_team_policy.py
          grep -q 'CLAUDE_RED_TEAM_MAX_CALLS_PER_TASK = 1' open-model-market/v5_claude_red_team_policy.py
          grep -q 'claude_is_advisory_only.*True' open-model-market/v5_governance_runtime.py
          grep -q 'claude_gatekeeping_allowed.*False' open-model-market/v5_governance_runtime.py
          grep -q 'second_claude_review_allowed.*False' open-model-market/v5_governance_runtime.py
          grep -q 'model_loop_allowed.*False' open-model-market/v5_governance_runtime.py
          grep -q 'workflow_dispatch' .github/workflows/v5-final-paid-claude-acceptance-20260803.yml
          grep -q 'inputs.confirm' .github/workflows/v5-final-paid-claude-acceptance-20260803.yml
          ! grep -q 'hashFiles(' .github/workflows/v5-final-paid-claude-acceptance-20260803.yml
          grep -q 'v5-paid-acceptance-3' .github/workflows/v5-one-time-paid-acceptance.yml
          ! test -e .github/v5-paid-acceptance-request.json
          ! test -e .github/v5-paid-acceptance-attestation.json
          python - <<'PY'
          import ast
          import hashlib
          import json
          from collections import defaultdict, deque
          from pathlib import Path

          root = Path("open-model-market")
          paths = sorted(root.glob("*.py"))
          modules = {p.stem: p for p in paths}
          imports = {name: set() for name in modules}
          mutations = []
          bodies = defaultdict(list)
          large = []
          for name, path in modules.items():
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              aliases = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          aliases.add(alias.asname or alias.name.split(".")[0])
                          target = alias.name.split(".")[0]
                          if target in modules:
                              imports[name].add(target)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      target = node.module.split(".")[0]
                      if target in modules:
                          imports[name].add(target)
                      aliases.update(alias.asname or alias.name for alias in node.names)
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id in aliases:
                              mutations.append({"path": str(path), "line": node.lineno, "target": f"{target.value.id}.{target.attr}"})
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      end = int(getattr(node, "end_lineno", node.lineno))
                      size = end - node.lineno + 1
                      if size >= 180:
                          large.append({"path": str(path), "function": node.name, "lines": size})
                      body = list(node.body)
                      if body and isinstance(body[0], ast.Expr) and isinstance(getattr(body[0], "value", None), ast.Constant) and isinstance(body[0].value.value, str):
                          body = body[1:]
                      if len(body) >= 4:
                          digest = hashlib.sha256(ast.dump(ast.Module(body=body, type_ignores=[]), include_attributes=False).encode()).hexdigest()
                          bodies[digest].append({"path": str(path), "function": node.name, "lines": size})
          reachable = set()
          queue = deque(name for name in ("v5_issue_ticket", "v5_production_ticket", "v5_pipeline") if name in modules)
          while queue:
              current = queue.popleft()
              if current in reachable:
                  continue
              reachable.add(current)
              queue.extend(sorted(imports[current] - reachable))
          forbidden = {
              "issue_ticket", "issue_ticket_hardened", "v5_value_optimizer", "v5_planner",
              "v5_planning_runtime", "v5_constitutional_pipeline", "v5_cross_endpoint_planner",
              "v5_cross_endpoint_planner_impl", "v5_operational_resilience", "v5_general_task_planning",
              "task_semantic_compiler", "resource_matrix", "atomic_work_graph",
          }
          duplicates = [rows for rows in bodies.values() if len({row["path"] for row in rows}) > 1]
          report = {
              "baseline_sha": "b91e5744e467ab43f4dc50a5c4a9318786c397b1",
              "status": "PASS",
              "production_python_files": len(paths),
              "reachable_forbidden_modules": sorted(reachable & forbidden),
              "imported_module_mutations": mutations,
              "duplicate_function_groups": duplicates,
              "large_functions": sorted(large, key=lambda row: (-row["lines"], row["path"])),
          }
          if report["reachable_forbidden_modules"] or mutations or duplicates:
              report["status"] = "FAIL"
          Path("final-head-audit/architecture.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "status": report["status"],
              "reachable_forbidden": len(report["reachable_forbidden_modules"]),
              "imported_mutations": len(mutations),
              "duplicate_groups": len(duplicates),
              "large_functions": len(large),
          }, sort_keys=True))
          if report["status"] != "PASS":
              raise SystemExit("FINAL_HEAD_ARCHITECTURE_FAILED")
          PY

      - name: Run full regression, P0 and repository audit
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . 2>&1 | tee final-head-audit/ruff.log
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee final-head-audit/full-suite.log
          python tools/run_v5_p0_regressions.py 2>&1 | tee final-head-audit/p0.log
          python tools/repository_audit.py --root . --output-dir final-head-audit/repository --fail-on high
          git diff --check

      - name: Upload final exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-head-audit-${{ github.run_id }}
          path: final-head-audit/
          if-no-files-found: error
          retention-days: 30

  full-load-matrix:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 7, 42, 31337, 65535, 99991, 104729]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MODEL_MAX_RETRIES: "0"
      PARALLEL_WORKERS: "1"
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - name: Check out exact final PR227 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: b91e5744e467ab43f4dc50a5c4a9318786c397b1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Run deterministic load matrix
        run: |
          python -m unittest -v \
            tests.test_v5_claude_red_team_advice \
            tests.test_v5_extreme_advisory_stress \
            tests.test_v5_full_load_stability \
            tests.test_v5_repository_residue_audit \
            tests.test_v5_complete_cleanup_regression \
            tests.test_v5_governance_model_resolution \
            tests.test_v5_catalog_endpoint_eligibility \
            tests.test_v5_structured_output_compat \
            tests.test_execution_graph_validator \
            tests.test_v5_admission_task_isolation \
            tests.test_v5_p0_governance \
            tests.test_v5_ticket_gate \
            tests.test_v5_command_trigger \
            tests.test_v5_release_advisory_regression

  same-process-randomized:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MODEL_MAX_RETRIES: "0"
      PARALLEL_WORKERS: "1"
    steps:
      - name: Check out exact final PR227 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: b91e5744e467ab43f4dc50a5c4a9318786c397b1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check
      - name: Randomize governance and ticket tests in one process
        run: |
          python - <<'PY'
          import random
          import unittest
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          loader = unittest.TestLoader()
          patterns = ["*ticket*.py", "*governance*.py", "*claude*.py", "*advisory*.py", "*cleanup*.py"]
          seeds = [0, 1, 7, 42, 31337, 65535, 99991, 104729]
          total = 0
          per_seed = None
          for seed in seeds:
              cases = {}
              for pattern in patterns:
                  for case in flatten(loader.discover("tests", pattern=pattern)):
                      cases[case.id()] = case
              ordered = list(cases.values())
              if per_seed is None:
                  per_seed = len(ordered)
              random.Random(seed).shuffle(ordered)
              result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(ordered))
              total += result.testsRun
              if result.failures or result.errors or result.unexpectedSuccesses:
                  raise SystemExit(f"same-process randomized failure at seed={seed}")
          print(f"same_process_tests_per_seed={per_seed}")
          print(f"same_process_randomized_tests={total}")
          PY
