name: PR227 Optional Functions and Attestation

on:
  pull_request:
    branches: [main]
    paths:
      - tools/.pr227-functions-core.patch
      - tools/.pr227-attestation-status.patch
      - tools/.pr227-functions-tests.patch
      - .github/workflows/pr227-optional-functions-attestation.yml

permissions:
  contents: write

concurrency:
  group: pr227-optional-functions-attestation
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply semantic convergence patches
        run: |
          set -euo pipefail
          echo "84202e0f2762f75ec3a898917aa3166b2949cca47ed57928c9e0ac2f4ba09cc6  tools/.pr227-functions-core.patch" | sha256sum --check
          echo "79db54d2ebb6728d1c8ba05f98f0e4b9e5a00c3e2c38d36c1a6e0cab8b9c49e1  tools/.pr227-attestation-status.patch" | sha256sum --check
          echo "fad6cff9bf943df250ae7443ad96c0ea5d6e9871699b0f147526a0f0cf5f6225  tools/.pr227-functions-tests.patch" | sha256sum --check
          git apply --check tools/.pr227-functions-core.patch
          git apply tools/.pr227-functions-core.patch
          git apply --check tools/.pr227-attestation-status.patch
          git apply tools/.pr227-attestation-status.patch
          git apply --check tools/.pr227-functions-tests.patch
          git apply tools/.pr227-functions-tests.patch
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked development dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and semantic contract gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          ! grep -R -n -E '"(synthesis|implementation)" in node\.functions' open-model-market
          ! grep -R -n -E 'missing_function|every expert node needs functions' open-model-market
          python -m unittest \
            tests.test_v5_gpt_selector_contract \
            tests.test_v5_optional_functions_semantics \
            tests.test_v5_claude_red_team_advice \
            tests.test_v5_output_contract_delivery \
            tests.test_v5_v4_contract_isolation \
            tests.test_v5_evidence_bundle \
            tests.test_v5_failure_evidence_chain \
            tests.test_v5_attestation_source_commit \
            -v

      - name: Run complete regression including Hypothesis
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run eight-seed same-process semantic stress
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import os
          import random
          import sys
          import unittest

          def flatten(suite: unittest.TestSuite) -> list[unittest.TestCase]:
              rows: list[unittest.TestCase] = []
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      rows.extend(flatten(item))
                  else:
                      rows.append(item)
              return rows

          names = [
              "tests.test_v5_gpt_selector_contract",
              "tests.test_v5_optional_functions_semantics",
              "tests.test_v5_claude_red_team_advice",
              "tests.test_v5_output_contract_delivery",
              "tests.test_v5_v4_contract_isolation",
              "tests.test_v5_evidence_bundle",
              "tests.test_v5_failure_evidence_chain",
              "tests.test_v5_attestation_source_commit",
              "tests.test_v5_extreme_advisory_stress",
          ]
          for seed in (0, 1, 7, 42, 31337, 65535, 99991, 104729):
              os.environ["PYTHONHASHSEED"] = str(seed)
              cases = flatten(unittest.defaultTestLoader.loadTestsFromNames(names))
              random.Random(seed).shuffle(cases)
              result = unittest.TextTestRunner(verbosity=1).run(
                  unittest.TestSuite(cases)
              )
              if not result.wasSuccessful():
                  sys.exit(1)
          PY

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-optional-functions-audit \
            --fail-on medium

      - name: Commit validated fix and remove staging assets
        run: |
          set -euo pipefail
          rm tools/.pr227-functions-core.patch
          rm tools/.pr227-attestation-status.patch
          rm tools/.pr227-functions-tests.patch
          rm .github/workflows/pr227-optional-functions-attestation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: make node functions descriptive metadata"
          git push origin HEAD:fix/v5-claude-unified-red-team-cleanup-20260803
