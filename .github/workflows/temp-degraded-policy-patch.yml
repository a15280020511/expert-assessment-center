name: Temporary degraded policy patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/temp-degraded-patch-trigger
      - .github/temp_degraded_patch.py
      - .github/workflows/temp-degraded-policy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v5-single-node-recovery-reserve-20260804'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-single-node-recovery-reserve-20260804
          fetch-depth: 0

      - name: Apply atomic degraded-delivery patches
        run: python .github/temp_degraded_patch.py

      - name: Commit patched contracts and remove temporary machinery
        shell: bash
        run: |
          rm -f .github/workflows/temp-degraded-policy-patch.yml
          rm -f .github/temp-degraded-patch-trigger
          rm -f .github/temp_degraded_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: support audited degraded delivery without extra paid calls"
          git push origin HEAD:fix/v5-single-node-recovery-reserve-20260804
