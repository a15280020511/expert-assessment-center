name: PR232 Free Shadow Capacity Remediation

on:
  push:
    branches:
      - "remediation/pr232-shadow-capacity-*"
    paths:
      - ".github/pr232-shadow-capacity-request.json"

permissions:
  contents: write

concurrency:
  group: pr232-free-shadow-capacity-remediation
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable remediation request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: request-source

      - name: Validate exact remediation authorization
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request=request-source/.github/pr232-shadow-capacity-request.json
          jq -e '
            type == "object" and
            (keys | sort) == [
              "authorization",
              "patch_id",
              "request_id",
              "schema_version",
              "target_branch",
              "target_sha"
            ] and
            .schema_version == "pr232-shadow-capacity-request-1" and
            .authorization == "EXACT-ZERO-CALL-SOURCE-PATCH" and
            .patch_id == "free-shadow-dynamic-capacity-schema" and
            .target_branch == "fix/v5-free-shadow-production-qualification-20260803" and
            (.request_id | test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
            (.target_sha | test("^[0-9a-f]{40}$"))
          ' "$request" >/dev/null
          test "$(git -C request-source diff --name-only HEAD^ HEAD)" = ".github/pr232-shadow-capacity-request.json"
          target="$(jq -er '.target_sha' "$request")"
          git -C request-source merge-base --is-ancestor "$target" HEAD^
          {
            echo "target_branch=$(jq -er '.target_branch' "$request")"
            echo "target_sha=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.request.outputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true
          path: target-source

      - name: Apply exact dynamic capacity patch
        working-directory: target-source
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match")
              path.write_text(text.replace(old, new), encoding="utf-8")

          compat = Path("open-model-market/v5_free_shadow_compat.py")
          old_protocol = '''def _topology_instruction(schema: Mapping[str, Any]) -> str:
              properties = schema.get("properties")
              if not isinstance(properties, Mapping):
                  return ""
              if not {"selected_nodes", "edges"}.issubset(properties):
                  return ""
              return (
                  "引用完整性硬约束："
                  "selected_nodes中的node_id必须唯一；"
                  "edges中的from_node_id和to_node_id只能引用selected_nodes中已定义的node_id；"
                  "禁止创建source、sink、start、end、final等虚拟节点；"
                  "若selected_nodes只有一个元素，edges必须为[]；"
                  "若硬上限maximum_recovery_nodes为0，recovery_selection必须为[]；"
                  "每个work_item只能分配给已定义节点，且不得遗漏或重复。\\n"
              )


          def _schema_instruction(response_format: Mapping[str, Any]) -> str:
              json_schema = response_format.get("json_schema")
              json_schema = json_schema if isinstance(json_schema, Mapping) else {}
              schema = json_schema.get("schema")
              schema = schema if isinstance(schema, Mapping) else {}
              compact = json.dumps(
                  schema,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              return (
                  "\\n\\nFREE_SHADOW_JSON_COMPATIBILITY:\\n"
                  "只输出一个有效JSON对象；不要Markdown代码块、解释或额外文字。"
                  "对象必须严格满足以下JSON Schema，禁止额外字段。\\n"
                  + _topology_instruction(schema)
                  + "JSON Schema：\\n"
                  + compact
              )


          def _adapt_messages(
              messages: Any,
              response_format: Mapping[str, Any] | None,
          ) -> list[dict[str, Any]]:
              if not isinstance(messages, list):
                  raise FreeShadowError("free compatibility request has no messages")
              adapted = [dict(row) for row in messages if isinstance(row, Mapping)]
              if response_format:
                  instruction = _schema_instruction(response_format)
                  if adapted and adapted[-1].get("role") == "user":
                      adapted[-1]["content"] = (
                          str(adapted[-1].get("content") or "") + instruction
                      )
                  else:
                      adapted.append({"role": "user", "content": instruction.strip()})
              return adapted
          '''
          new_protocol = '''def _limit(value: Any) -> int | None:
              if isinstance(value, bool):
                  return None
              try:
                  parsed = int(value)
              except (TypeError, ValueError):
                  return None
              return parsed if parsed >= 0 else None


          def _hard_limits_from_messages(
              messages: list[dict[str, Any]],
          ) -> dict[str, Any]:
              for message in reversed(messages):
                  if message.get("role") != "user":
                      continue
                  content = message.get("content")
                  if not isinstance(content, str):
                      continue
                  try:
                      value = json.loads(content)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(value, Mapping):
                      continue
                  limits = value.get("hard_limits")
                  if isinstance(limits, Mapping):
                      return dict(limits)
              return {}


          def _bounded_maximum(row: dict[str, Any], maximum: int) -> None:
              current = _limit(row.get("maxItems"))
              row["maxItems"] = maximum if current is None else min(current, maximum)


          def _tightened_schema(
              schema: Mapping[str, Any],
              hard_limits: Mapping[str, Any],
          ) -> dict[str, Any]:
              tightened = json.loads(json.dumps(schema, ensure_ascii=False))
              properties = tightened.get("properties")
              if not isinstance(properties, dict):
                  return tightened
              maximum_nodes = _limit(
                  hard_limits.get("maximum_expert_initial_calls")
              )
              recovery_calls = _limit(
                  hard_limits.get("approved_recovery_calls")
              )
              nodes = properties.get("nodes")
              final_nodes = properties.get("final_nodes")
              if maximum_nodes is not None and maximum_nodes >= 1:
                  if isinstance(nodes, dict):
                      _bounded_maximum(nodes, maximum_nodes)
                  if isinstance(final_nodes, dict):
                      _bounded_maximum(final_nodes, maximum_nodes)
              if recovery_calls is not None and isinstance(nodes, dict):
                  items = nodes.get("items")
                  items = items if isinstance(items, dict) else {}
                  node_properties = items.get("properties")
                  if isinstance(node_properties, dict):
                      recovery = node_properties.get("recovery")
                      if isinstance(recovery, dict):
                          _bounded_maximum(recovery, recovery_calls)
              return tightened


          def _topology_instruction(
              schema: Mapping[str, Any],
              hard_limits: Mapping[str, Any],
          ) -> str:
              properties = schema.get("properties")
              if not isinstance(properties, Mapping):
                  return ""
              if not {"nodes", "edges", "final_nodes"}.issubset(properties):
                  return ""
              maximum_nodes = _limit(
                  hard_limits.get("maximum_expert_initial_calls")
              )
              recovery_calls = _limit(
                  hard_limits.get("approved_recovery_calls")
              )
              capacity = (
                  f"nodes数量不得超过maximum_expert_initial_calls={maximum_nodes}；"
                  if maximum_nodes is not None
                  else ""
              )
              single = (
                  "本次maximum_expert_initial_calls=1，因此nodes必须恰好一个元素，"
                  "该节点必须承接全部work_items，edges必须为[]，"
                  "final_nodes必须仅包含该node_id；"
                  if maximum_nodes == 1
                  else ""
              )
              recovery = (
                  "本次approved_recovery_calls=0，因此每个node.recovery必须为[]；"
                  if recovery_calls == 0
                  else ""
              )
              return (
                  "引用与容量硬约束："
                  + capacity
                  + "nodes中的node_id必须唯一；"
                  + "edges中的source和target只能引用nodes中已定义的node_id；"
                  + "禁止创建source、sink、start、end、final等虚拟节点；"
                  + single
                  + recovery
                  + "每个work_item必须由已定义节点恰好分配一次，不得遗漏或重复。\\n"
              )


          def _schema_instruction(
              response_format: Mapping[str, Any],
              hard_limits: Mapping[str, Any],
          ) -> str:
              json_schema = response_format.get("json_schema")
              json_schema = json_schema if isinstance(json_schema, Mapping) else {}
              schema = json_schema.get("schema")
              schema = schema if isinstance(schema, Mapping) else {}
              tightened = _tightened_schema(schema, hard_limits)
              compact = json.dumps(
                  tightened,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              return (
                  "\\n\\nFREE_SHADOW_JSON_COMPATIBILITY:\\n"
                  "只输出一个有效JSON对象；不要Markdown代码块、解释或额外文字。"
                  "对象必须严格满足以下JSON Schema，禁止额外字段。\\n"
                  + _topology_instruction(tightened, hard_limits)
                  + "JSON Schema：\\n"
                  + compact
              )


          def _adapt_messages(
              messages: Any,
              response_format: Mapping[str, Any] | None,
          ) -> list[dict[str, Any]]:
              if not isinstance(messages, list):
                  raise FreeShadowError("free compatibility request has no messages")
              adapted = [dict(row) for row in messages if isinstance(row, Mapping)]
              if response_format:
                  hard_limits = _hard_limits_from_messages(adapted)
                  instruction = _schema_instruction(response_format, hard_limits)
                  if adapted and adapted[-1].get("role") == "user":
                      adapted[-1]["content"] = (
                          str(adapted[-1].get("content") or "") + instruction
                      )
                  else:
                      adapted.append({"role": "user", "content": instruction.strip()})
              return adapted
          '''
          replace_once(compat, old_protocol, new_protocol, "dynamic capacity protocol")

          old_summary = '''    work_items = value.get("work_items")
              selected_nodes = value.get("selected_nodes")
              edges = value.get("edges")
              recovery = value.get("recovery_selection")
              if isinstance(work_items, list):
                  summary["work_item_ids"] = [
                      str(row.get("id") or "")
                      for row in work_items
                      if isinstance(row, Mapping)
                  ]
              if isinstance(selected_nodes, list):
                  summary["selected_node_ids"] = [
                      str(row.get("node_id") or "")
                      for row in selected_nodes
                      if isinstance(row, Mapping)
                  ]
              if isinstance(edges, list):
                  summary["edge_pairs"] = [
                      {
                          "from_node_id": str(row.get("from_node_id") or ""),
                          "to_node_id": str(row.get("to_node_id") or ""),
                      }
                      for row in edges
                      if isinstance(row, Mapping)
                  ]
              if isinstance(recovery, list):
                  summary["recovery_node_ids"] = [
                      str(row.get("node_id") or "")
                      for row in recovery
                      if isinstance(row, Mapping)
                  ]
          '''
          new_summary = '''    work_items = value.get("work_items")
              nodes = value.get("nodes")
              edges = value.get("edges")
              final_nodes = value.get("final_nodes")
              if isinstance(work_items, list):
                  summary["work_item_ids"] = [
                      str(row.get("work_id") or "")
                      for row in work_items
                      if isinstance(row, Mapping)
                  ]
              if isinstance(nodes, list):
                  summary["node_ids"] = [
                      str(row.get("node_id") or "")
                      for row in nodes
                      if isinstance(row, Mapping)
                  ]
                  summary["node_recovery_counts"] = [
                      len(row.get("recovery") or [])
                      if isinstance(row, Mapping)
                      and isinstance(row.get("recovery"), list)
                      else None
                      for row in nodes
                  ]
              if isinstance(edges, list):
                  summary["edge_pairs"] = [
                      {
                          "source": str(row.get("source") or ""),
                          "target": str(row.get("target") or ""),
                      }
                      for row in edges
                      if isinstance(row, Mapping)
                  ]
              if isinstance(final_nodes, list):
                  summary["final_node_ids"] = [str(value) for value in final_nodes]
          '''
          replace_once(compat, old_summary, new_summary, "actual schema diagnostics")

          tests = Path("tests/test_v5_free_shadow_acceptance.py")
          old_tests = '''    def test_topology_instruction_forbids_virtual_single_node_edges(self) -> None:
                  schema = {
                      "type": "object",
                      "properties": {
                          "selected_nodes": {"type": "array"},
                          "edges": {"type": "array"},
                      },
                  }
                  text = shadow_compat._topology_instruction(schema)
                  self.assertIn("edges必须为[]", text)
                  self.assertIn("禁止创建source", text)
                  self.assertIn("只能引用selected_nodes", text)

              def test_safe_output_summary_records_topology_without_raw_text(self) -> None:
                  value = {
                      "work_items": [{"id": "work_1"}],
                      "selected_nodes": [{"node_id": "node_1"}],
                      "edges": [
                          {
                              "from_node_id": "node_1",
                              "to_node_id": "ghost_node",
                          }
                      ],
                      "recovery_selection": [],
                  }
                  text = json.dumps(value, ensure_ascii=False)
                  summary = shadow_compat._safe_output_summary(text)
                  self.assertTrue(summary["parsed_json_object"])
                  self.assertEqual(summary["selected_node_ids"], ["node_1"])
                  self.assertEqual(
                      summary["edge_pairs"][0]["to_node_id"],
                      "ghost_node",
                  )
                  self.assertNotIn("raw_output", summary)
                  self.assertEqual(summary["output_characters"], len(text))
          '''
          new_tests = '''    def test_dynamic_schema_caps_nodes_and_recovery(self) -> None:
                  schema = {
                      "type": "object",
                      "properties": {
                          "nodes": {
                              "type": "array",
                              "minItems": 1,
                              "maxItems": 13,
                              "items": {
                                  "type": "object",
                                  "properties": {
                                      "recovery": {
                                          "type": "array",
                                          "maxItems": 2,
                                      }
                                  },
                              },
                          },
                          "edges": {"type": "array"},
                          "final_nodes": {
                              "type": "array",
                              "minItems": 1,
                              "maxItems": 13,
                          },
                      },
                  }
                  limits = {
                      "maximum_expert_initial_calls": 1,
                      "approved_recovery_calls": 0,
                  }
                  tightened = shadow_compat._tightened_schema(schema, limits)
                  properties = tightened["properties"]
                  self.assertEqual(properties["nodes"]["maxItems"], 1)
                  self.assertEqual(properties["final_nodes"]["maxItems"], 1)
                  self.assertEqual(
                      properties["nodes"]["items"]["properties"]["recovery"]["maxItems"],
                      0,
                  )
                  text = shadow_compat._topology_instruction(tightened, limits)
                  self.assertIn("nodes必须恰好一个元素", text)
                  self.assertIn("edges必须为[]", text)
                  self.assertIn("只能引用nodes", text)
                  self.assertIn("node.recovery必须为[]", text)

              def test_safe_output_summary_records_topology_without_raw_text(self) -> None:
                  value = {
                      "work_items": [{"work_id": "work_1"}],
                      "nodes": [
                          {
                              "node_id": "node_1",
                              "recovery": [],
                          }
                      ],
                      "edges": [
                          {
                              "source": "node_1",
                              "target": "ghost_node",
                          }
                      ],
                      "final_nodes": ["node_1"],
                  }
                  text = json.dumps(value, ensure_ascii=False)
                  summary = shadow_compat._safe_output_summary(text)
                  self.assertTrue(summary["parsed_json_object"])
                  self.assertEqual(summary["work_item_ids"], ["work_1"])
                  self.assertEqual(summary["node_ids"], ["node_1"])
                  self.assertEqual(summary["node_recovery_counts"], [0])
                  self.assertEqual(
                      summary["edge_pairs"][0]["target"],
                      "ghost_node",
                  )
                  self.assertEqual(summary["final_node_ids"], ["node_1"])
                  self.assertNotIn("raw_output", summary)
                  self.assertEqual(summary["output_characters"], len(text))
          '''
          replace_once(tests, old_tests, new_tests, "dynamic capacity tests")
          PY
          python -m compileall -q open-model-market tests
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            open-model-market/v5_free_shadow_compat.py \
            tests/test_v5_free_shadow_acceptance.py | sort)"

      - name: Commit exact remediation to PR branch
        working-directory: target-source
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            open-model-market/v5_free_shadow_compat.py \
            tests/test_v5_free_shadow_acceptance.py
          git commit -m "fix: bind free shadow schema to dynamic expert capacity"
          git push origin "HEAD:$TARGET_BRANCH"
