name: V5 Low-Cost Pilot

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-low-cost-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[v5-pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_HISTORY_PATH: v5-pilot-artifacts/runtime-state/model-performance.json
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt

      - name: Compile pilot and production modules
        run: |
          python -m pip check
          python -m py_compile open-model-market/*.py

      - name: Parse bounded pilot request
        id: prepare
        run: |
          python open-model-market/v5_low_cost_pilot.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-pilot-artifacts

      - name: Publish pilot acceptance
        run: |
          cat > pilot-accepted.md <<EOF
          ## V5_PILOT_ACCEPTED

          - Pilot ID: \`${{ steps.prepare.outputs.pilot_id }}\`
          - Task: \`${{ steps.prepare.outputs.task_id }}\`
          - Strategies: \`V5, V3, strongest single, lowest-price single, fixed 3+1, random feasible\`
          - Blind judges: \`at least 2 different model/provider endpoints\`
          - Hard actual-cost ceiling: \`${{ steps.prepare.outputs.max_cost_usd }} USD\`
          - Hard paid-call ceiling: \`${{ steps.prepare.outputs.max_calls }}\`
          - Output allowance: \`up to ${{ steps.prepare.outputs.output_allowance_tokens }} tokens; not required output\`
          - Production cutover eligibility: \`false\`
          - Run: \`${RUN_URL}\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-accepted.md

      - name: Check OpenRouter secret
        id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish missing-secret rejection
        if: steps.secret.outputs.present != 'true'
        run: |
          cat > pilot-rejected.md <<EOF
          ## V5_PILOT_REJECTED

          The repository is missing the Actions Secret \`OPENROUTER_API_KEY\`.

          - Model inference calls: \`0\`
          - Production entrypoint changed: \`false\`
          - Run: \`${RUN_URL}\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-rejected.md

      - name: Verify bounded pilot reserve
        id: credit
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
        run: |
          python open-model-market/v5_low_cost_pilot.py credit-check \
            --config v5-pilot-artifacts/pilot-config.json \
            --output-dir v5-pilot-artifacts

      - name: Publish pilot reserve rejection
        if: steps.secret.outputs.present == 'true' && steps.credit.outcome != 'success'
        run: |
          python - <<'PY' > pilot-credit-rejected.md
          import json
          from pathlib import Path
          path = Path("v5-pilot-artifacts/pilot-credit-preflight.json")
          data = json.loads(path.read_text()) if path.exists() else {}
          key = data.get("current_key") or {}
          print("## V5_PILOT_REJECTED")
          print()
          print("低成本试运行的可用额度不足，已在模型推理前停止。")
          print()
          print(f"- Required reserve: `{data.get('required_reserve_usd', 'unknown')} USD`")
          print(f"- API-key limit remaining: `{key.get('limit_remaining_usd', 'unknown')} USD`")
          print(f"- Account remaining: `{data.get('account_remaining_usd', 'unverified')} USD`")
          print(f"- Blockers: `{','.join(data.get('blockers') or ['pilot-preflight-unavailable'])}`")
          print("- Model inference calls: `0`")
          print("- Production entrypoint changed: `false`")
          PY
          printf '\n- Run: `%s`\n' "$RUN_URL" >> pilot-credit-rejected.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-credit-rejected.md

      - name: Run bounded low-cost pilot
        id: execute
        if: steps.secret.outputs.present == 'true' && steps.credit.outcome == 'success'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_APP_NAME: Expert Assessment Center V5 Low-Cost Pilot
          OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
          V5_BENCHMARK_OUTPUT_ALLOWANCE_TOKENS: ${{ steps.prepare.outputs.output_allowance_tokens }}
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MODEL_HISTORY_PATH")"
          printf '{"version":1,"models":{}}\n' > "$MODEL_HISTORY_PATH"
          python open-model-market/v5_low_cost_pilot_entry.py run \
            --config v5-pilot-artifacts/pilot-config.json \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-pilot-artifacts \
            2>&1 | tee v5-pilot-artifacts/pilot-console.log

      - name: Refresh artifact manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          root = Path("v5-pilot-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          write_manifest(root)
          PY

      - name: Upload pilot artifacts
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v5-low-cost-pilot-${{ github.event.issue.number }}-${{ github.run_id }}
          path: v5-pilot-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish pilot result
        if: always() && steps.secret.outputs.present == 'true' && steps.credit.outcome == 'success'
        continue-on-error: true
        run: |
          if [[ -s v5-pilot-artifacts/v5-low-cost-pilot-result.json ]]; then
            python open-model-market/v5_low_cost_pilot.py render \
              --output-dir v5-pilot-artifacts \
              --run-url "$RUN_URL" > pilot-result.md || true
          else
            cat > pilot-result.md <<EOF
          ## V5_PILOT_FAILED

          No complete pilot result was generated.

          - Execute outcome: \`${{ steps.execute.outcome }}\`
          - Production entrypoint changed: \`false\`
          - Run: \`${RUN_URL}\`
          EOF
          fi
          cat >> pilot-result.md <<EOF

          - Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`
          - Artifact URL: \`${{ steps.upload.outputs.artifact-url }}\`
          - Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-result.md

      - name: Mark technical pilot failure
        if: >-
          always() &&
          (steps.secret.outputs.present != 'true' ||
           steps.credit.outcome == 'failure' ||
           steps.execute.outcome == 'failure' ||
           steps.upload.outcome == 'failure')
        run: exit 1
