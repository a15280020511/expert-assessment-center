name: V5 Low-Cost Pilot

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-low-cost-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[v5-pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_HISTORY_PATH: v5-pilot-artifacts/runtime-state/model-performance.json
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt

      - name: Run zero-cost repository validation
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p v5-pilot-artifacts
          python -m pip check 2>&1 | tee v5-pilot-artifacts/pip-check.log
          python -m ruff check --select E9,F63,F7,F82 open-model-market tests 2>&1 | tee v5-pilot-artifacts/ruff.log
          python -m py_compile open-model-market/*.py
          python -m unittest discover -s tests -v 2>&1 | tee v5-pilot-artifacts/unit-test.log

      - name: Publish validation rejection
        if: steps.validate.outcome != 'success'
        run: |
          python - <<'PY' > pilot-validation-rejected.md
          print("## V5_PILOT_REJECTED")
          print()
          print("仓库完整单测、Ruff、编译或依赖检查未通过，已在读取 OpenRouter Secret 和模型调用前停止。")
          print()
          print("- Validation outcome: `failure`")
          print("- OpenRouter Secret read: `false`")
          print("- Model inference calls: `0`")
          print("- Production entrypoint changed: `false`")
          PY
          printf '\n- Run: `%s`\n' "$RUN_URL" >> pilot-validation-rejected.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-validation-rejected.md

      - name: Parse bounded pilot request
        id: prepare
        if: steps.validate.outcome == 'success'
        run: |
          python open-model-market/v5_low_cost_pilot.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-pilot-artifacts

      - name: Publish pilot acceptance
        if: steps.validate.outcome == 'success'
        run: |
          python - <<'PY' > pilot-accepted.md
          import os
          print("## V5_PILOT_ACCEPTED")
          print()
          print(f"- Pilot ID: `{os.environ['PILOT_ID']}`")
          print(f"- Task: `{os.environ['TASK_ID']}`")
          print("- Strategies: `V5, V3, strongest single, lowest-price single, fixed 3+1, random feasible`")
          print("- Blind judges: `at least 2 different model/provider endpoints`")
          print(f"- Hard actual-cost ceiling: `{os.environ['MAX_COST']} USD`")
          print(f"- Hard paid-call ceiling: `{os.environ['MAX_CALLS']}`")
          print(f"- Output allowance: `up to {os.environ['ALLOWANCE']} tokens; not required output`")
          print("- Zero-cost full repository validation: `passed`")
          print("- Production cutover eligibility: `false`")
          PY
          printf '\n- Run: `%s`\n' "$RUN_URL" >> pilot-accepted.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-accepted.md
        env:
          PILOT_ID: ${{ steps.prepare.outputs.pilot_id }}
          TASK_ID: ${{ steps.prepare.outputs.task_id }}
          MAX_COST: ${{ steps.prepare.outputs.max_cost_usd }}
          MAX_CALLS: ${{ steps.prepare.outputs.max_calls }}
          ALLOWANCE: ${{ steps.prepare.outputs.output_allowance_tokens }}

      - name: Check OpenRouter secret
        id: secret
        if: steps.validate.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish missing-secret rejection
        if: steps.validate.outcome == 'success' && steps.secret.outputs.present != 'true'
        run: |
          python - <<'PY' > pilot-secret-rejected.md
          print("## V5_PILOT_REJECTED")
          print()
          print("The repository is missing the Actions Secret `OPENROUTER_API_KEY`.")
          print()
          print("- Model inference calls: `0`")
          print("- Production entrypoint changed: `false`")
          PY
          printf '\n- Run: `%s`\n' "$RUN_URL" >> pilot-secret-rejected.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-secret-rejected.md

      - name: Verify bounded pilot reserve
        id: credit
        if: steps.validate.outcome == 'success' && steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
        run: |
          python open-model-market/v5_low_cost_pilot.py credit-check \
            --config v5-pilot-artifacts/pilot-config.json \
            --output-dir v5-pilot-artifacts

      - name: Publish pilot reserve rejection
        if: steps.validate.outcome == 'success' && steps.secret.outputs.present == 'true' && steps.credit.outcome != 'success'
        run: |
          python - <<'PY' > pilot-credit-rejected.md
          import json
          from pathlib import Path
          path = Path("v5-pilot-artifacts/pilot-credit-preflight.json")
          data = json.loads(path.read_text()) if path.exists() else {}
          key = data.get("current_key") or {}
          print("## V5_PILOT_REJECTED")
          print()
          print("低成本试运行的可用额度不足，已在模型推理前停止。")
          print()
          print(f"- Required reserve: `{data.get('required_reserve_usd', 'unknown')} USD`")
          print(f"- API-key limit remaining: `{key.get('limit_remaining_usd', 'unknown')} USD`")
          print(f"- Account remaining: `{data.get('account_remaining_usd', 'unverified')} USD`")
          print(f"- Blockers: `{','.join(data.get('blockers') or ['pilot-preflight-unavailable'])}`")
          print("- Model inference calls: `0`")
          print("- Production entrypoint changed: `false`")
          PY
          printf '\n- Run: `%s`\n' "$RUN_URL" >> pilot-credit-rejected.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-credit-rejected.md

      - name: Run bounded low-cost pilot
        id: execute
        if: steps.validate.outcome == 'success' && steps.secret.outputs.present == 'true' && steps.credit.outcome == 'success'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_APP_NAME: Expert Assessment Center V5 Low-Cost Pilot
          OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
          V5_BENCHMARK_OUTPUT_ALLOWANCE_TOKENS: ${{ steps.prepare.outputs.output_allowance_tokens }}
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MODEL_HISTORY_PATH")"
          printf '{"version":1,"models":{}}\n' > "$MODEL_HISTORY_PATH"
          python open-model-market/v5_low_cost_pilot_entry.py run \
            --config v5-pilot-artifacts/pilot-config.json \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-pilot-artifacts \
            2>&1 | tee v5-pilot-artifacts/pilot-console.log

      - name: Refresh artifact manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          root = Path("v5-pilot-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          write_manifest(root)
          PY

      - name: Upload pilot artifacts
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v5-low-cost-pilot-${{ github.event.issue.number }}-${{ github.run_id }}
          path: v5-pilot-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish pilot result
        if: always() && steps.validate.outcome == 'success' && steps.secret.outputs.present == 'true' && steps.credit.outcome == 'success'
        continue-on-error: true
        run: |
          if [[ -s v5-pilot-artifacts/v5-low-cost-pilot-result.json ]]; then
            python open-model-market/v5_low_cost_pilot.py render \
              --output-dir v5-pilot-artifacts \
              --run-url "$RUN_URL" > pilot-result.md || true
          else
            python - <<'PY' > pilot-result.md
          import os
          print("## V5_PILOT_FAILED")
          print()
          print("No complete pilot result was generated.")
          print()
          print(f"- Execute outcome: `{os.environ.get('EXECUTE_OUTCOME', 'unknown')}`")
          print("- Production entrypoint changed: `false`")
          PY
            printf '\n- Run: `%s`\n' "$RUN_URL" >> pilot-result.md
          fi
          python - <<'PY' >> pilot-result.md
          import os
          print()
          print(f"- Artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`")
          print(f"- Artifact URL: `{os.environ.get('ARTIFACT_URL', '')}`")
          print(f"- Artifact digest: `{os.environ.get('ARTIFACT_DIGEST', '')}`")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@pilot-result.md
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}

      - name: Mark technical pilot failure
        if: >-
          always() &&
          (steps.validate.outcome != 'success' ||
           steps.secret.outputs.present != 'true' ||
           steps.credit.outcome == 'failure' ||
           steps.execute.outcome == 'failure' ||
           steps.upload.outcome == 'failure')
        run: exit 1
