name: One-Time Full Load Repository Audit V3 2026-08-02

on:
  pull_request:
    branches: [main]
    paths: ["**"]

permissions:
  contents: read

concurrency:
  group: one-time-full-load-v3-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  comprehensive-audit:
    name: Full repository, saturation, chaos, and invariant audit
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Bind exact source and install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts audit-logs
          checked="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$expected"
          test "$base" = "$production"
          printf 'checked_sha=%s\nbase_sha=%s\nproduction_sha=%s\n' \
            "$checked" "$base" "$production" | tee audit-artifacts/source-binding.txt
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt \
            2>&1 | tee audit-logs/dependency-install.log
          python -m pip check 2>&1 | tee audit-logs/pip-check.log

      - name: Static, compile, full unit, and P0 gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee audit-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee audit-logs/full-unit-suite.log
          grep -Eq '^Ran [0-9]+ tests? in ' audit-logs/full-unit-suite.log
          grep -q '^OK$' audit-logs/full-unit-suite.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee audit-logs/p0-regressions.log
          grep -q 'P0 REGRESSION RESULT: run=50, passed=50, failures=0, errors=0, skipped=0' \
            audit-logs/p0-regressions.log

      - name: Repeated load, chaos, recovery, and contract matrix
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            tests.test_v5_full_load_stability
            tests.test_v5_stress_stability
            tests.test_execution_graph_properties
            tests.test_v5_cross_endpoint_recovery
            tests.test_v5_critical_delivery_reliability
            tests.test_v5_v4_contract_isolation
            tests.test_v5_deterministic_answer_normalization
          )
          for seed in 0 1 7 42 99 31337; do
            echo "=== PYTHONHASHSEED=$seed ===" | tee -a audit-logs/repeated-chaos.log
            PYTHONHASHSEED="$seed" python -m unittest "${modules[@]}" -v \
              2>&1 | tee -a audit-logs/repeated-chaos.log
          done

      - name: Parallel planning saturation and determinism matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee audit-logs/parallel-saturation.log
          from __future__ import annotations
          import concurrent.futures
          import json
          import os
          import subprocess
          import sys
          from collections import defaultdict
          from pathlib import Path

          tasks = [
              ("比较方案A与方案B，给出简洁、可执行的最终建议。", False),
              ("仅依据题面：方案A成本100、收益130；方案B成本90、收益118。不得引入其他数字，完成比较与决策。", False),
              ("比较三个城市公共投资方案，完成财务、法律合规、证据核验、预测推演、红队反证和最终决策。", False),
              ("输出八个二级标题：问题、假设、证据、分析、风险、反例、实施、结论；不得调用外部工具。", False),
              ("禁止降级交付，禁止外部工具，证据不足时必须失败关闭；评估两个候选方案。", False),
              ("明确允许完整交付不可行时降级，但必须标记缺口；评估三个候选方案。", True),
              ("同时出现允许降级与禁止降级时，以禁止降级为准；分析两个运营方案。", False),
              ("为资源受限项目设计多阶段决策，包含独立红队、恢复策略和最终综合，不设固定职业模板。", False),
              ("Compare two infrastructure proposals with finance, compliance, uncertainty, red-team challenge, and a final recommendation.", False),
              ("评估公共政策的法律、财政、执行、社会影响和不确定性，给出条件化结论。", False),
              ("对高风险供应链中断方案进行情景推演、边界条件、失败模式审计和最终选择。", False),
              ("题面不提供精确数字，不得自行生成阈值或概率；只做定性敏感性分析并给出决策条件。", False),
          ]
          seeds = [0, 1, 7, 42]
          root = Path("audit-artifacts/saturation")
          root.mkdir(parents=True, exist_ok=True)

          def run(case: tuple[int, int, str, bool]) -> dict[str, object]:
              index, seed, task, expected_degraded = case
              out = root / f"task-{index:02d}-seed-{seed}"
              env = dict(os.environ, PYTHONHASHSEED=str(seed))
              cmd = [
                  sys.executable, "open-model-market/v5_constitutional_pipeline.py",
                  "--task", task,
                  "--catalog-file", "tests/fixtures/models.json",
                  "--endpoint-file", "tests/fixtures/endpoints.json",
                  "--dry-run", "--maximum-total-calls", "16",
                  "--maximum-recovery-calls", "2", "--quality-tier", "value",
                  "--output-dir", str(out),
              ]
              done = subprocess.run(cmd, capture_output=True, text=True, env=env, timeout=150)
              if done.returncode:
                  return {"index": index, "seed": seed, "ok": False,
                          "stdout": done.stdout[-3000:], "stderr": done.stderr[-3000:]}
              load = lambda name: json.loads((out / name).read_text())
              constraints = load("task-constraints.json")
              market = load("v5-model-endpoint-market.json")
              optimization = load("v5-optimization.json")
              graph = load("v5-execution-graph.json")
              dry = load("v5-dry-run.json")
              companies = [n["parameter_profile"]["model_company"] for n in graph["nodes"]]
              degraded = bool(constraints["allow_degraded_success"])
              checks = {
                  "solver": optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"},
                  "unique_companies": len(companies) == len(set(companies)),
                  "tools_forbidden": constraints["external_tools_allowed"] is False,
                  "degraded_polarity": degraded is expected_degraded,
                  "fail_closed": bool(constraints["fail_closed"]) is (not degraded),
                  "call_cap": len(graph["nodes"]) <= dry["approved_budget"]["maximum_initial_calls"],
                  "weights": abs(sum(market["preselection_objective_weights"].values()) - 1.0) < 1e-9,
                  "fit_weights": abs(sum(market["task_fit_feature_weights"].values()) - 1.0) < 1e-9,
                  "dynamic_weights": market["fixed_preselection_weight_tuple_used"] is False,
                  "dynamic_fit": market["fixed_task_fit_weight_tuple_used"] is False,
              }
              signature = {
                  "constraints": constraints,
                  "weights": market["preselection_objective_weights"],
                  "fit": market["task_fit_feature_weights"],
                  "status": optimization["solver_status"],
                  "companies": companies,
                  "roles": [n.get("role") for n in graph["nodes"]],
                  "dependencies": [n.get("depends_on", []) for n in graph["nodes"]],
              }
              return {"index": index, "seed": seed, "ok": all(checks.values()),
                      "checks": checks, "signature": signature}

          cases = [(i, seed, task, degraded) for i, (task, degraded) in enumerate(tasks) for seed in seeds]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(run, cases))
          failures = [r for r in results if not r["ok"]]
          signatures: dict[int, list[str]] = defaultdict(list)
          for result in results:
              if result["ok"]:
                  signatures[int(result["index"])].append(
                      json.dumps(result["signature"], ensure_ascii=False, sort_keys=True)
                  )
          nondeterministic = {i: len(set(values)) for i, values in signatures.items()
                              if len(set(values)) != 1}
          summary = {"cases": len(cases), "passed": len(cases) - len(failures),
                     "failed": len(failures), "nondeterministic": nondeterministic,
                     "failures": failures}
          Path("audit-artifacts/saturation-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          if failures or nondeterministic:
              raise SystemExit(1)
          PY

      - name: Granular repository audit and duplicate scan
        shell: bash
        run: |
          set -euo pipefail
          python tools/repository_audit.py --root . --output-dir audit-artifacts --fail-on high \
            2>&1 | tee audit-logs/repository-line-audit.log
          python - <<'PY' 2>&1 | tee audit-logs/duplicate-structure-audit.log
          import ast
          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          root = Path("open-model-market")
          files = sorted(root.rglob("*.py"))
          fatal, warnings = [], []
          exact = defaultdict(list)
          functions = defaultdict(list)
          forbidden = {
              "v5_executor", "v5_empty_output_recovery", "v5_total_call_cap",
              "v5_production_hardening", "v5_r8_executor", "v5_r8_gate_wiring",
              "v5_r8_policy", "v5_r8_provider_policy", "v5_r8_retry_policy",
              "v5_resilient_executor", "v5_stage_d_provider_compat",
          }
          for name in forbidden:
              if (root / f"{name}.py").exists():
                  fatal.append(f"legacy file: {name}.py")
          for path in files:
              text = path.read_text()
              exact[hashlib.sha256(text.encode()).hexdigest()].append(str(path))
              tree = ast.parse(text, filename=str(path))
              seen = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if node.name in seen:
                          fatal.append(f"duplicate top-level definition {path}:{node.name}")
                      seen[node.name] = node.lineno
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == "install" and node.col_offset == 0:
                          fatal.append(f"top-level install {path}:{node.lineno}")
                      if sum(1 for _ in ast.walk(node)) >= 80:
                          body = ast.Module(body=node.body, type_ignores=[])
                          digest = hashlib.sha256(ast.dump(body, include_attributes=False).encode()).hexdigest()
                          functions[digest].append(f"{path}:{node.lineno}:{node.name}")
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {"eval", "exec"}:
                      fatal.append(f"dynamic execution {path}:{node.lineno}")
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == "install":
                      fatal.append(f"install call {path}:{node.lineno}")
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      names = [a.name.rsplit('.', 1)[-1] for a in node.names] if isinstance(node, ast.Import) else ([node.module.rsplit('.', 1)[-1]] if node.module else [])
                      for name in names:
                          if name in forbidden:
                              fatal.append(f"legacy import {path}:{node.lineno}:{name}")
          for paths in exact.values():
              if len(paths) > 1:
                  fatal.append("exact duplicate production files: " + ", ".join(paths))
          duplicate_functions = [paths for paths in functions.values() if len(paths) > 1]
          warnings.extend("large duplicate function bodies: " + ", ".join(paths)
                          for paths in duplicate_functions)
          action_re = re.compile(r"^\s*uses:\s*([^#\s]+)")
          pinned_re = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          workflows = list(Path(".github/workflows").glob("*.y*ml"))
          for path in workflows:
              text = path.read_text()
              if "pull_request_target:" in text:
                  fatal.append(f"unsafe trigger {path}")
              if re.search(r"persist-credentials:\s*true", text):
                  fatal.append(f"persisted credentials {path}")
              for number, line in enumerate(text.splitlines(), 1):
                  match = action_re.match(line)
                  if match and not match.group(1).startswith(("./", "docker://")) and not pinned_re.match(match.group(1)):
                      fatal.append(f"unpinned action {path}:{number}:{match.group(1)}")
          report = {
              "status": "PASS" if not fatal else "FAIL",
              "production_python_files": len(files),
              "production_lines": sum(len(p.read_text().splitlines()) for p in files),
              "exact_duplicate_file_groups": sum(1 for p in exact.values() if len(p) > 1),
              "large_duplicate_function_groups": len(duplicate_functions),
              "fatal": sorted(set(fatal)), "warnings": sorted(set(warnings)),
          }
          Path("audit-artifacts/duplicate-structure-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          if fatal:
              raise SystemExit(1)
          PY

      - name: Workflow and release contract revalidation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_workflow_contract \
            tests.test_v5_release_command_contract \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed -v \
            2>&1 | tee audit-logs/workflow-release-contracts.log

      - name: Render zero-cost audit receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("audit-artifacts"); root.mkdir(exist_ok=True)
          def load(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else None
          receipt = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
              "paid_model_calls": 0, "model_cost_usd": 0.0,
              "saturation": load("saturation-summary.json"),
              "structure": load("duplicate-structure-audit.json"),
              "line_audit": load("repository-audit.json"),
          }
          (root / "full-load-audit-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-load-repository-audit-v3-${{ github.run_id }}
          path: |
            audit-artifacts/
            audit-logs/
          if-no-files-found: error
          retention-days: 14
