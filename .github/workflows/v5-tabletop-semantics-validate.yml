name: Validate V5 Tabletop Production Semantics

on:
  pull_request:
    paths:
      - "open-model-market/v5_pipeline.py"
      - "open-model-market/v5_general_task_planning.py"
      - "open-model-market/v5_closed_book_safety.py"
      - "open-model-market/v5_strict_safety_runtime.py"
      - "open-model-market/v5_task_delivery_contract.py"
      - "open-model-market/v5_output_contract_delivery.py"
      - "open-model-market/resource_matrix.py"
      - "tests/test_v5_tabletop_production_semantics.py"
      - "tests/test_v5_extreme_tabletop_fail_closed.py"
      - ".github/workflows/v5-tabletop-semantics-validate.yml"
  push:
    branches: [main]
    paths:
      - "open-model-market/v5_pipeline.py"
      - "open-model-market/v5_general_task_planning.py"
      - "open-model-market/v5_closed_book_safety.py"
      - "open-model-market/v5_strict_safety_runtime.py"
      - "open-model-market/v5_task_delivery_contract.py"
      - "open-model-market/v5_output_contract_delivery.py"
      - "open-model-market/resource_matrix.py"
      - "tests/test_v5_tabletop_production_semantics.py"
      - "tests/test_v5_extreme_tabletop_fail_closed.py"
      - ".github/workflows/v5-tabletop-semantics-validate.yml"

permissions:
  contents: read

jobs:
  validate-tabletop-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run explicit semantic and safety regressions
        run: |
          python tests/test_v5_general_task_planning.py
          python tests/test_v5_planning_scenario_matrix.py
          python tests/test_v5_consumer_decision_budget.py
          python tests/test_v5_tabletop_production_semantics.py
          python -m unittest tests.test_v5_extreme_tabletop_fail_closed -v
      - name: Run original failed task zero-call planning regression
        shell: bash
        run: |
          python - <<'PY' > tabletop-task.txt
          from tests.test_v5_tabletop_production_semantics import FAILED_PRODUCTION_TASK
          print(FAILED_PRODUCTION_TASK)
          PY
          python open-model-market/v5_pipeline.py \
            --task "$(cat tabletop-task.txt)" \
            --catalog-file tests/fixtures/models.json \
            --endpoint-file tests/fixtures/endpoints.json \
            --dry-run \
            --maximum-total-calls 6 \
            --maximum-recovery-calls 1 \
            --cost-anomaly-usd 0.25 \
            --quality-tier value \
            --output-dir v5-tabletop-regression-artifacts
      - name: Verify production planning contract
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "open-model-market")
          from v5_model_company import canonical_model_company

          root = Path("v5-tabletop-regression-artifacts")
          semantics = json.loads((root / "task-interpretations.json").read_text())
          optimization = json.loads((root / "v5-optimization.json").read_text())
          graph = json.loads((root / "v5-execution-graph.json").read_text())
          dry = json.loads((root / "v5-dry-run.json").read_text())

          signals = semantics["task_signals"]
          works = semantics["interpretations"][0]["atomic_work"]
          synthesis = next(
              work for work in works if "synthesis" in work["operation_requirements"]
          )
          selected_companies = {
              canonical_model_company(node["model"]) for node in graph["nodes"]
          }
          diagnostics = {
              "solver_status": optimization.get("solver_status"),
              "work_count": len(works),
              "node_count": len(graph["nodes"]),
              "request_count": len(dry["requests"]),
              "selected_companies": sorted(selected_companies),
              "selected_models": [node["model"] for node in graph["nodes"]],
              "assigned_work": [node["assigned_work"] for node in graph["nodes"]],
              "execution_stages": graph.get("execution_stages"),
              "estimated_total_cost": graph.get("estimated_total_cost"),
              "approved_budget": dry.get("approved_budget"),
              "active_operations": signals.get("active_operations"),
          }
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))

          assert signals["closed_book_tabletop_compaction_applied"] is False, diagnostics
          assert signals["closed_book_tabletop_decomposition_applied"] is True, diagnostics
          assert signals["minimum_planned_work_units"] == 4, diagnostics
          assert signals["minimum_distinct_model_companies"] == 4, diagnostics
          assert signals["high_stakes_degraded_delivery_allowed"] is False, diagnostics
          assert signals["external_evidence_required"] is False, diagnostics
          assert signals["active_operations"] == [
              "analysis", "decision_comparison", "adversarial_reasoning", "synthesis"
          ], diagnostics
          assert len(semantics["interpretations"]) == 1, diagnostics
          assert len(works) == 4, diagnostics
          assert synthesis["output_contract"]["explicit_markdown_contract"] is True, diagnostics
          assert synthesis["output_contract"]["fail_closed_on_quality_gate"] is True, diagnostics
          assert optimization["solver_status"] in {"OPTIMAL", "FEASIBLE"}, diagnostics
          assert len(graph["nodes"]) == 4, diagnostics
          assert len(selected_companies) == 4, diagnostics
          assert len(dry["requests"]) == 4, diagnostics
          assert float(graph["estimated_total_cost"]) <= 0.25, diagnostics
          assert dry["approved_budget"]["maximum_total_calls"] == 6, diagnostics
          assert dry["approved_budget"]["maximum_initial_calls"] == 5, diagnostics
          assert dry["approved_budget"]["maximum_recovery_calls"] == 1, diagnostics
          assert dry["global_monkey_patching"] is False, diagnostics
          assert not (root / "v5-planning-infeasibility.json").exists(), diagnostics
          PY
