name: Validate V5 Constitutional Properties

on:
  pull_request:
    paths:
      - "open-model-market/v5_constitutional_pipeline.py"
      - "open-model-market/v5_general_task_planning.py"
      - "open-model-market/v5_task_constraints.py"
      - "open-model-market/v5_task_delivery_contract.py"
      - "open-model-market/v5_constitutional_runtime.py"
      - "open-model-market/v5_planning_runtime.py"
      - "tools/v5_fixture_planning_diagnostics.py"
      - "tests/test_v5_general_task_planning.py"
      - "tests/test_v5_tabletop_production_semantics.py"
      - ".github/workflows/v5-tabletop-semantics-validate.yml"
  push:
    branches: [main]
    paths:
      - "open-model-market/v5_constitutional_pipeline.py"
      - "open-model-market/v5_general_task_planning.py"
      - "open-model-market/v5_task_constraints.py"
      - "open-model-market/v5_task_delivery_contract.py"
      - "open-model-market/v5_constitutional_runtime.py"
      - "open-model-market/v5_planning_runtime.py"
      - "tools/v5_fixture_planning_diagnostics.py"
      - "tests/test_v5_general_task_planning.py"
      - "tests/test_v5_tabletop_production_semantics.py"
      - ".github/workflows/v5-tabletop-semantics-validate.yml"

permissions:
  contents: read

jobs:
  validate-constitutional-properties:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run generic semantic and contract properties
        run: |
          python tests/test_v5_general_task_planning.py
          python tests/test_v5_tabletop_production_semantics.py
          python tests/test_v5_explicit_task_delivery_contract.py
          python tests/test_v5_long_markdown_contract_integrity.py
          python tests/test_v5_task_constraints.py
          python tests/test_v5_dynamic_model_fit.py
      - name: Run task-independent zero-call matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          tasks = {
              "compact": "比较方案A和方案B的成本并给出决策阈值。",
              "strict-contract": (
                  "比较两个方案。严格使用以下4个Markdown二级标题，顺序不得改变，"
                  "每项不得为空：\n1）已知条件\n2）计算与比较\n3）风险与反证\n4）结论与下一步"
              ),
              "multi-work": (
                  "评估三个方案，分别完成定量计算、证据核验、情景推演、独立红队反证，"
                  "最后综合决策并列出实施条件。"
              ),
              "closed-world": (
                  "仅依据题面，不得调用外部工具，不联网，不得编造。"
                  "比较方案A和方案B，只接受完整交付。"
              ),
          }
          accepted_fail_closed_messages = {
              "Recovery reserve is not executable under the absolute cost anomaly guard.",
              "Recovery reserve is not executable because every cross-company candidate "
              "exceeds the absolute cost anomaly guard.",
          }
          root = Path("constitutional-matrix-artifacts")
          weights = {}
          outcomes = {}
          for name, task in tasks.items():
              output = root / name
              command = [
                  sys.executable,
                  "open-model-market/v5_constitutional_pipeline.py",
                  "--task", task,
                  "--catalog-file", "tests/fixtures/models.json",
                  "--endpoint-file", "tests/fixtures/endpoints.json",
                  "--dry-run",
                  "--maximum-total-calls", "16",
                  "--maximum-recovery-calls", "2",
                  "--cost-anomaly-usd", "0.25",
                  "--quality-tier", "value",
                  "--output-dir", str(output),
              ]
              completed = subprocess.run(
                  command,
                  check=False,
                  text=True,
                  capture_output=True,
              )
              if completed.returncode != 0:
                  diagnostic = subprocess.run(
                      [
                          sys.executable,
                          "tools/v5_fixture_planning_diagnostics.py",
                          "--task", task,
                          "--output-dir", str(output),
                      ],
                      check=False,
                      text=True,
                      capture_output=True,
                  )
                  infeasibility_path = output / "v5-planning-infeasibility.json"
                  diagnostic_path = output / "fixture-planning-diagnostics.json"
                  if not infeasibility_path.exists() or not diagnostic_path.exists():
                      raise SystemExit(
                          completed.stdout
                          + "\n"
                          + completed.stderr
                          + "\nZERO-CALL DIAGNOSTIC:\n"
                          + diagnostic.stdout
                          + "\n"
                          + diagnostic.stderr
                      )
                  infeasibility = json.loads(infeasibility_path.read_text())
                  diagnostics = json.loads(diagnostic_path.read_text())
                  message = str(infeasibility.get("message") or "")
                  assert infeasibility["status"] == "INFEASIBLE"
                  assert message in accepted_fail_closed_messages
                  assert infeasibility["model_calls_performed"] == 0
                  assert diagnostics["model_calls_performed"] == 0
                  assert diagnostics["model_cost_usd"] == 0
                  assert diagnostics["stage_error"] == message
                  assert not (output / "v5-execution-graph.json").exists()
                  assert not (output / "v5-dry-run.json").exists()
                  outcomes[name] = "zero-call-fail-closed"
                  continue

              semantics = json.loads(
                  (output / "task-interpretations.json").read_text()
              )
              search = json.loads(
                  (output / "v5-adaptive-search.json").read_text()
              )
              graph = json.loads(
                  (output / "v5-execution-graph.json").read_text()
              )
              dry = json.loads((output / "v5-dry-run.json").read_text())
              constraints = json.loads(
                  (output / "task-constraints.json").read_text()
              )
              market = json.loads(
                  (output / "v5-model-endpoint-market.json").read_text()
              )
              signals = semantics["task_signals"]

              assert signals["task_specific_production_branching"] is False
              assert signals["case_derived_compaction_applied"] is False
              assert (
                  signals["architecture_selection_policy"]
                  == "generic-semantic-matrix-only"
              )
              assert signals["dynamic_interpretation_limit"] >= 1
              assert (
                  search["policy"]
                  == "task-shape-feasibility-marginal-value"
              )
              assert search["attempts"]
              assert (
                  len(graph["nodes"])
                  <= dry["approved_budget"]["maximum_initial_calls"]
              )
              companies = [
                  node["parameter_profile"]["model_company"]
                  for node in graph["nodes"]
              ]
              assert len(companies) == len(set(companies))
              assert dry["approved_budget"]["maximum_initial_calls"] == 14
              assert dry["model_company_policy"] == "task-global-all-different"
              assert dry["global_monkey_patching"] is False
              assert dry["task_constraints"] == constraints
              assert constraints["external_tools_allowed"] is False
              assert constraints["fail_closed"] is True
              assert market["fixed_preselection_weight_tuple_used"] is False
              assert market["fixed_task_fit_weight_tuple_used"] is False

              metadata = graph["metadata"]
              recovery_pool = metadata["recovery_pool"]
              recovery_policy = metadata["recovery_pool_policy"]
              selected_companies = set(companies)
              selected_node_ids = {
                  node["node_id"] for node in graph["nodes"]
              }
              recovery_companies = []
              remaining_budget = float(
                  recovery_policy["remaining_recovery_budget_usd"]
              )
              assert recovery_policy["different_model_company_required"] is True
              assert recovery_policy["recovery_companies_globally_unique"] is True
              assert (
                  recovery_policy["risk_adjusted_remaining_budget_enforced_at_planning"]
                  is True
              )
              assert (
                  recovery_policy["runtime_ledger_revalidates_frozen_risk_multiplier"]
                  is True
              )
              for selected_node_id, candidates in recovery_pool.items():
                  assert selected_node_id in selected_node_ids
                  for candidate in candidates:
                      profile = candidate["parameter_profile"]
                      company = candidate["model_company"]
                      serviceability = profile["operational_serviceability"]
                      risk_adjusted_cost = float(
                          candidate["recovery_risk_adjusted_cost_usd"]
                      )
                      assert company not in selected_companies
                      assert serviceability["deadline_feasible"] is True
                      if serviceability["estimated_deadline_ratio"] is not None:
                          assert (
                              float(serviceability["estimated_deadline_ratio"])
                              <= float(serviceability["maximum_deadline_ratio"])
                          )
                      assert risk_adjusted_cost <= remaining_budget + 1e-12
                      assert (
                          candidate["estimated_cost_above_planning_remaining_budget"]
                          is False
                      )
                      assert abs(
                          float(profile["recovery_risk_adjusted_cost_usd"])
                          - risk_adjusted_cost
                      ) <= 1e-12
                      recovery_companies.append(company)
              assert len(recovery_companies) == len(set(recovery_companies))
              assert (
                  len(recovery_companies)
                  == recovery_policy["total_executable_recovery_options"]
              )
              weights[name] = market["preselection_objective_weights"]
              outcomes[name] = "planned-with-executable-recovery"

          strict_semantics = json.loads(
              (
                  root
                  / "strict-contract"
                  / "task-interpretations.json"
              ).read_text()
          )
          closed_world = json.loads(
              (root / "closed-world" / "task-constraints.json").read_text()
          )
          assert (
              strict_semantics["task_signals"]["structural_signals"]
              ["explicit_output_contract"]
              is True
          )
          assert (
              strict_semantics["task_signals"]["structural_signals"]
              ["explicit_contract_items"]
              == 4
          )
          assert weights["compact"] != weights["strict-contract"]
          assert "planned-with-executable-recovery" in outcomes.values()
          assert "zero-call-fail-closed" in outcomes.values()
          assert closed_world["external_facts_allowed"] is False
          assert closed_world["unsupported_precise_quantities_allowed"] is False
          assert closed_world["allow_degraded_success"] is False
          PY
      - name: Upload constitutional diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v5-constitutional-diagnostics-${{ github.run_id }}
          path: constitutional-matrix-artifacts/
          if-no-files-found: warn
          retention-days: 7
