name: PR227 R6 Evidence Contract Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr227-r6-evidence-contract-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: pr227-r6-evidence-contract-bootstrap
  cancel-in-progress: false

jobs:
  validate-and-package:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-claude-unified-red-team-cleanup-20260803
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and apply staged remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr227-r6-evidence-contract-remediation.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          normalized = []
          in_triple = False
          for line in text[start:end].splitlines():
              if in_triple:
                  normalized.append(line)
                  if "'''" in line:
                      in_triple = False
                  continue
              current = line[10:] if line.startswith('          ') else line
              normalized.append(current)
              if current.count("'''") % 2 == 1:
                  in_triple = True
          script = '\n'.join(normalized)
          script = script.replace(
              "    if count != 1:\n"
              "        raise SystemExit(f'{path}: expected one replacement, found {count}')",
              "    if count < 1:\n"
              "        raise SystemExit(f'{path}: replacement source not found')",
              1,
          )
          exec(compile(script, str(source) + ':embedded-python', 'exec'))

          fixture = Path('tests/test_v5_independent_artifact_revalidation.py')
          fixture_text = fixture.read_text(encoding='utf-8')
          old = (
              '                    "output_contract": {\n'
              '                        "required_fields": ["facts", "conclusion"],\n'
              '                        "machine_readable_required": False,\n'
              '                    },\n'
              '                    "parameter_profile": {},\n'
          )
          new = (
              '                    "output_contract": {\n'
              '                        "required_fields": ["facts", "conclusion"],\n'
              '                        "machine_readable_required": False,\n'
              '                        "final_delivery_node": True,\n'
              '                    },\n'
              '                    "parameter_profile": {},\n'
          )
          if fixture_text.count(old) != 1:
              raise SystemExit('direct final-contract fixture source not found exactly once')
          fixture.write_text(
              fixture_text.replace(old, new, 1),
              encoding='utf-8',
          )
          PY
          scripts=(
            tools/pr227_r6_refactor_pipeline.py
            tools/pr227_r6_refactor_auditors.py
            tools/pr227_r6_refactor_evidence_bundle.py
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            python -m py_compile "$script"
            python "$script"
          done
          rm -f tools/.pr227-r6-complexity-refactor.py.gz.b64
          rm -f "${scripts[@]}"
          git diff --check

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          python -m pip check

      - name: Run static and complete regression gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m compileall -q open-model-market tests tools
          python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run focused R6 phase-contract stress
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr227-r6-evidence-contract
          for seed in 0 1 7 42 31337 65535 99991 104729; do
            PYTHONPATH=tests PYTHONHASHSEED="$seed" python -m unittest \
              test_v5_native_audit_contract \
              test_v5_independent_artifact_revalidation \
              test_v5_evidence_bundle \
              test_v5_failure_evidence_chain \
              -q
          done
          python - <<'PY'
          import json
          from pathlib import Path

          result = {
              "schema_version": "pr227-r6-evidence-contract-remediation-1",
              "status": "PASS",
              "chat_model_calls": 0,
              "paid_model_calls": 0,
              "provider_order_legacy_dependency": False,
              "canonical_provider_contract": "provider.only/order-exact-single-endpoint",
              "final_delivery_node_explicit": True,
              "report_preparation_receipt": True,
              "preupload_independent_status": "PENDING_POST_UPLOAD",
              "final_status_requires_independent_pass": True,
              "attestation_requires_independent_pass": True,
              "cross_task_history_used": False,
              "random_seeds": [0, 1, 7, 42, 31337, 65535, 99991, 104729],
          }
          Path('/tmp/pr227-r6-evidence-contract/result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Run medium-blocking granular audit
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir /tmp/pr227-r6-evidence-contract/repository-audit \
            --fail-on none
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/pr227-r6-evidence-contract/repository-audit/repository-audit.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          blockers = [
              item
              for item in report.get('findings', [])
              if item.get('severity') in {'critical', 'high', 'medium'}
          ]
          print(json.dumps({'blocking_findings': blockers}, ensure_ascii=False, indent=2))
          if blockers:
              raise SystemExit(1)
          PY

      - name: Prepare exact validated source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr227-r6-evidence-contract-remediation.yml
          rm .github/workflows/pr227-r6-evidence-contract-bootstrap.yml
          bundle=/tmp/pr227-r6-evidence-contract/validated-source
          mkdir -p "$bundle/files"
          git diff --binary --full-index HEAD > "$bundle/validated.patch"
          git diff --name-status HEAD > "$bundle/name-status.txt"
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          bundle = Path('/tmp/pr227-r6-evidence-contract/validated-source')
          raw = subprocess.check_output(
              ['git', 'diff', '--name-status', '-z', 'HEAD']
          )
          fields = raw.decode('utf-8').split('\0')
          entries = []
          index = 0
          while index < len(fields) and fields[index]:
              status = fields[index]
              index += 1
              if status.startswith(('R', 'C')):
                  old_path = fields[index]
                  new_path = fields[index + 1]
                  index += 2
                  path = new_path
              else:
                  old_path = None
                  path = fields[index]
                  index += 1
              item = {
                  'status': status,
                  'path': path,
                  'old_path': old_path,
                  'sha256': None,
                  'size_bytes': None,
              }
              if not status.startswith('D'):
                  source = root / path
                  target = bundle / 'files' / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  data = source.read_bytes()
                  item['sha256'] = hashlib.sha256(data).hexdigest()
                  item['size_bytes'] = len(data)
              entries.append(item)
          manifest = {
              'schema_version': 'pr227-r6-validated-source-bundle-1',
              'base_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'status': 'PASS',
              'chat_model_calls': 0,
              'paid_model_calls': 0,
              'entries': entries,
          }
          (bundle / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          if not entries:
              raise SystemExit('validated source bundle has no changes')
          print(json.dumps(manifest, ensure_ascii=False))
          PY
          tar -C "$bundle" -cf /tmp/pr227-r6-evidence-contract/validated-source.tar \
            manifest.json name-status.txt validated.patch files
          sha256sum /tmp/pr227-r6-evidence-contract/validated-source.tar \
            > /tmp/pr227-r6-evidence-contract/validated-source.tar.sha256

      - name: Upload zero-call validation and exact source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-r6-validated-source-${{ github.run_id }}
          path: /tmp/pr227-r6-evidence-contract/
          if-no-files-found: error
          retention-days: 30
