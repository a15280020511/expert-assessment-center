name: PR227 R6 Validated Workflow Blob

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr227-r6-evidence-contract-bootstrap.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: pr227-r6-validated-workflow-blob
  cancel-in-progress: false

jobs:
  create-validated-workflow-blob:
    if: >-
      github.event.pull_request.number == 227 &&
      github.event.pull_request.head.ref == 'fix/v5-claude-unified-red-team-cleanup-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Rehydrate verified execution workflow and create Git blob
        id: blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "8843793702"
          EXPECTED_ARTIFACT_DIGEST: "sha256:ad337c7451e0f4a78b6dd7604535ff862cf18a6aba3407124c9aaa376429d313"
          EXPECTED_SOURCE_SHA256: "37fdc93373bfd73189dd8e8da9b356cae681e1403790757dee120670dd78a95e"
          EXPECTED_SOURCE_SIZE: "19809"
          EXPECTED_BUNDLE_BASE_SHA: "1450cab4495a911b70312a990b38b9f11a022389"
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          artifact_id = os.environ["SOURCE_ARTIFACT_ID"]
          expected_sha256 = os.environ["EXPECTED_SOURCE_SHA256"]
          expected_size = int(os.environ["EXPECTED_SOURCE_SIZE"])
          expected_base = os.environ["EXPECTED_BUNDLE_BASE_SHA"]

          def request(url: str, *, method: str = "GET", payload: dict | None = None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pr227-r6-validated-workflow-blob",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read(), dict(response.headers)

          archive_url = (
              f"https://api.github.com/repos/{repository}/actions/artifacts/"
              f"{artifact_id}/zip"
          )
          archive_bytes, _ = request(archive_url)
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as outer:
              tar_bytes = outer.read("validated-source.tar")
              tar_receipt = outer.read("validated-source.tar.sha256").decode("utf-8")
          expected_tar_sha = tar_receipt.split()[0]
          actual_tar_sha = hashlib.sha256(tar_bytes).hexdigest()
          if actual_tar_sha != expected_tar_sha:
              raise SystemExit(
                  f"validated source tar digest mismatch: {actual_tar_sha} != {expected_tar_sha}"
              )

          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as bundle:
              manifest_member = bundle.extractfile("manifest.json")
              source_member = bundle.extractfile(
                  "files/.github/workflows/execution-ticket.yml"
              )
              if manifest_member is None or source_member is None:
                  raise SystemExit("validated source tar is missing required members")
              manifest = json.loads(manifest_member.read().decode("utf-8"))
              source = source_member.read()

          if manifest.get("status") != "PASS":
              raise SystemExit("validated source manifest is not PASS")
          if manifest.get("base_sha") != expected_base:
              raise SystemExit("validated source manifest base SHA changed")
          entry = next(
              (
                  row
                  for row in manifest.get("entries", [])
                  if row.get("path") == ".github/workflows/execution-ticket.yml"
              ),
              None,
          )
          if not isinstance(entry, dict):
              raise SystemExit("execution-ticket entry missing from manifest")
          actual_sha256 = hashlib.sha256(source).hexdigest()
          if actual_sha256 != expected_sha256 or entry.get("sha256") != expected_sha256:
              raise SystemExit("execution-ticket SHA-256 does not match validated manifest")
          if len(source) != expected_size or entry.get("size_bytes") != expected_size:
              raise SystemExit("execution-ticket size does not match validated manifest")

          blob_payload = {
              "content": base64.b64encode(source).decode("ascii"),
              "encoding": "base64",
          }
          blob_bytes, _ = request(
              f"https://api.github.com/repos/{repository}/git/blobs",
              method="POST",
              payload=blob_payload,
          )
          blob = json.loads(blob_bytes.decode("utf-8"))
          blob_sha = str(blob.get("sha") or "")
          if not blob_sha:
              raise SystemExit("GitHub did not return a blob SHA")

          receipt = {
              "schema_version": "pr227-r6-validated-workflow-blob-1",
              "status": "PASS",
              "repository": repository,
              "source_artifact_id": int(artifact_id),
              "source_artifact_digest": os.environ["EXPECTED_ARTIFACT_DIGEST"],
              "source_bundle_base_sha": expected_base,
              "source_tar_sha256": actual_tar_sha,
              "path": ".github/workflows/execution-ticket.yml",
              "content_sha256": actual_sha256,
              "size_bytes": len(source),
              "git_blob_sha": blob_sha,
              "chat_model_calls": 0,
              "paid_model_calls": 0,
          }
          Path("validated-workflow-blob.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"blob_sha={blob_sha}\n")
              output.write(f"content_sha256={actual_sha256}\n")
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Upload validated workflow blob receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr227-r6-validated-workflow-blob-${{ github.run_id }}
          path: validated-workflow-blob.json
          if-no-files-found: error
          retention-days: 30
