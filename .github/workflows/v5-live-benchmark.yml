name: V5 Live Blind Benchmark

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-live-blind-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[v5-benchmark]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_HISTORY_PATH: v5-live-benchmark-artifacts/runtime-state/model-performance.json
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt

      - name: Compile benchmark and production modules
        run: |
          python -m pip check
          python -m py_compile open-model-market/*.py

      - name: Parse bounded benchmark request
        id: prepare
        run: |
          python open-model-market/v5_live_benchmark.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir v5-live-benchmark-artifacts

      - name: Publish benchmark acceptance
        run: |
          cat > benchmark-accepted.md <<EOF
          ## V5_BENCHMARK_ACCEPTED

          - Benchmark ID: \`${{ steps.prepare.outputs.benchmark_id }}\`
          - Task suite: \`5 self-contained tasks unless explicitly narrowed\`
          - Strategies: \`V5, V3, strongest single, lowest-price single, fixed 3+1, random feasible\`
          - Blind judges: \`at least 2 distinct models and providers per task\`
          - Global cost ceiling: \`${{ steps.prepare.outputs.max_cost_usd }} USD\`
          - Global paid-call ceiling: \`${{ steps.prepare.outputs.max_calls }}\`
          - Production entrypoint: \`unchanged until the live cutover gate passes\`
          - Run: \`${RUN_URL}\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-accepted.md

      - name: Check OpenRouter secret
        id: secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish missing-secret rejection
        if: steps.secret.outputs.present != 'true'
        run: |
          cat > benchmark-rejected.md <<EOF
          ## V5_BENCHMARK_REJECTED

          The repository is missing the Actions Secret \`OPENROUTER_API_KEY\`.

          - Paid model calls: \`0\`
          - Production entrypoint changed: \`false\`
          - Run: \`${RUN_URL}\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-rejected.md

      - name: Run bounded live blind benchmark
        id: execute
        if: steps.secret.outputs.present == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_APP_NAME: Expert Assessment Center V5 Live Benchmark
          OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$MODEL_HISTORY_PATH")"
          printf '{"version":1,"models":{}}\n' > "$MODEL_HISTORY_PATH"
          python open-model-market/v5_live_benchmark.py run \
            --config v5-live-benchmark-artifacts/benchmark-config.json \
            --suite open-model-market/v5_live_benchmark_suite.json \
            --output-dir v5-live-benchmark-artifacts \
            2>&1 | tee v5-live-benchmark-artifacts/benchmark-console.log

      - name: Refresh artifact manifest
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          root = Path("v5-live-benchmark-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          write_manifest(root)
          PY

      - name: Upload live benchmark artifacts
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v5-live-benchmark-${{ github.event.issue.number }}-${{ github.run_id }}
          path: v5-live-benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish benchmark result
        if: always() && steps.secret.outputs.present == 'true'
        continue-on-error: true
        run: |
          if [[ -s v5-live-benchmark-artifacts/v5-live-benchmark-results.json ]]; then
            python open-model-market/v5_live_benchmark.py render \
              --output-dir v5-live-benchmark-artifacts \
              --run-url "$RUN_URL" > benchmark-result.md
          else
            cat > benchmark-result.md <<EOF
          ## V5_BENCHMARK_FAILED

          No complete benchmark result was generated.

          - Execute outcome: \`${{ steps.execute.outcome }}\`
          - Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`
          - Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          - Production entrypoint changed: \`false\`
          - Run: \`${RUN_URL}\`
          EOF
          fi
          cat >> benchmark-result.md <<EOF

          - Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`
          - Artifact URL: \`${{ steps.upload.outputs.artifact-url }}\`
          - Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@benchmark-result.md

      - name: Mark technical benchmark failure
        if: >-
          always() &&
          (steps.secret.outputs.present != 'true' ||
           steps.execute.outcome == 'failure' ||
           steps.upload.outcome == 'failure')
        run: exit 1
