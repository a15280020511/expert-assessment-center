name: Apply top50 OR-Tools upgrade

on:
  push:
    branches:
      - feat/top50-ortools-routing
    paths:
      - tools/apply_top50_ortools_upgrade.py
      - .github/workflows/apply-top50-ortools-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/top50-ortools-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply migration
        run: python tools/apply_top50_ortools_upgrade.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Validate changed modules
        run: |
          python -m py_compile \
            open-model-market/v5_top50_pool_optimizer.py \
            open-model-market/v5_top50_plan_validation.py \
            open-model-market/v5_provider_lock.py \
            open-model-market/v5_governance_model_plan.py \
            open-model-market/v5_price_ranked_issue_ticket.py \
            open-model-market/v5_proposal_materializer.py
          PYTHONPATH=open-model-market python - <<'PY'
          from v5_provider_lock import canonical_provider_lock
          assert canonical_provider_lock({
              'provider': {
                  'order': ['primary'],
                  'allow_fallbacks': True,
                  'require_parameters': True,
              }
          })
          assert canonical_provider_lock({
              'provider': {
                  'only': ['primary'],
                  'order': ['primary'],
                  'allow_fallbacks': False,
                  'require_parameters': True,
              }
          })
          PY
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_top50_pool_optimizer.py \
            tests/test_top20_pool_selector.py \
            tests/test_v5_soft_proposal_materializer.py
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: optimize weekly top50 expert pool with OR-Tools" || exit 0
          git push origin HEAD:feat/top50-ortools-routing
