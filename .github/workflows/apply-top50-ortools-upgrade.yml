name: Apply top50 OR-Tools upgrade

on:
  push:
    branches:
      - feat/top50-ortools-routing
    paths:
      - CONSTITUTION.md
      - open-model-market/constitutional_policy.json
      - tools/apply_top50_ortools_upgrade.py
      - tools/refine_top50_provider_pool.py
      - .github/workflows/apply-top50-ortools-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/top50-ortools-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply migration
        run: |
          python tools/apply_top50_ortools_upgrade.py
          python tools/refine_top50_provider_pool.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Validate changed modules and policy
        run: |
          python -m py_compile \
            open-model-market/v5_top50_pool_optimizer.py \
            open-model-market/v5_top50_plan_validation.py \
            open-model-market/v5_provider_lock.py \
            open-model-market/v5_governance_model_plan.py \
            open-model-market/v5_price_ranked_issue_ticket.py \
            open-model-market/v5_proposal_materializer.py
          python -m json.tool open-model-market/constitutional_policy.json >/dev/null
          PYTHONPATH=open-model-market python - <<'PY'
          import json
          from pathlib import Path
          from v5_provider_lock import canonical_provider_lock
          policy = json.loads(Path('open-model-market/constitutional_policy.json').read_text())
          assert policy['candidate_pool']['pool_size'] == 50
          assert policy['candidate_pool']['popularity_period'] == 'week'
          assert policy['optimizer_runtime']['engine'] == 'ortools-cp-sat'
          assert policy['expert_endpoint_privacy']['provider_fallback_scope'] == 'same-model-audited-qualified-provider-whitelist'
          assert canonical_provider_lock({
              'provider': {
                  'only': ['primary', 'secondary'],
                  'order': ['primary', 'secondary'],
                  'allow_fallbacks': True,
                  'require_parameters': True,
              }
          })
          assert canonical_provider_lock({
              'provider': {
                  'only': ['primary'],
                  'order': ['primary'],
                  'allow_fallbacks': False,
                  'require_parameters': True,
              }
          })
          assert not canonical_provider_lock({
              'provider': {
                  'order': ['primary'],
                  'allow_fallbacks': True,
                  'require_parameters': True,
              }
          })
          PY
      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_top50_pool_optimizer.py \
            tests/test_top20_pool_selector.py \
            tests/test_v5_soft_proposal_materializer.py
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: optimize weekly top50 expert pool with OR-Tools" || exit 0
          git push origin HEAD:feat/top50-ortools-routing
