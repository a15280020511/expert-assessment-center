name: PR343 Zero-Cost Final Gate

on:
  push:
    branches:
      - feat/task-adaptive-value-optimizer-20260807

permissions:
  contents: write

jobs:
  final-zero-cost-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install zero-cost validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r open-model-market/requirements-runtime.txt ruff

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          ruff check .

      - name: Compile all Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q open-model-market tests tools

      - name: Full unit suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Repository audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/repository_audit.py --root . --format json --fail-on high > /tmp/repository-audit.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/repository-audit.json', encoding='utf-8'))
          counts = report.get('finding_counts', {})
          if counts.get('critical', 0) or counts.get('high', 0):
              raise SystemExit(f'audit blockers remain: {counts}')
          print(f'zero-cost final gate PASS: {counts}')
          PY

      - name: Mark qualification and remove one-time gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr343-zero-cost-final-gate.yml
          : > .pr343-zero-cost-qualified
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record PR343 zero-cost qualification'
          git push origin HEAD:feat/task-adaptive-value-optimizer-20260807
