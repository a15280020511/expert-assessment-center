name: Apply V5 Recovery Guard Contract Efficiency

on:
  push:
    branches:
      - fix/v5-recovery-guard-contract-efficiency-20260802
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

# One-time owner-triggered application workflow; self-deletes after success.
jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/v5-recovery-guard-contract-efficiency-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-recovery-guard-contract-efficiency-20260802
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
      - name: Apply exact production patches
        run: |
          python tools/apply_v5_recovery_guard_patch_part1.py
          python tools/apply_v5_recovery_guard_patch_part2.py
          python tools/apply_v5_recovery_guard_patch_tests.py
          python tools/apply_v5_recovery_guard_patch_test_imports.py
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run static and compile gates
        run: |
          python -m ruff check open-model-market tests
          python -m compileall -q open-model-market tests
      - name: Run focused production regressions
        run: |
          python -m unittest -v \
            tests.test_v5_recovery_guard_production_regression \
            tests.test_v5_closed_world_display_and_compaction \
            tests.test_v5_recovery_absolute_budget_feasibility \
            tests.test_v5_critical_delivery_reliability \
            tests.test_v5_operational_resilience \
            tests.test_v5_operational_resilience_scope \
            tests.test_v5_cross_endpoint_recovery \
            tests.test_v5_quantity_binding_context \
            tests.test_v5_response_diagnostics_evidence
      - name: Remove one-time patch entries
        run: |
          rm -f \
            tools/apply_v5_recovery_guard_patch_part1.py \
            tools/apply_v5_recovery_guard_patch_part2.py \
            tools/apply_v5_recovery_guard_patch_tests.py \
            tools/apply_v5_recovery_guard_patch_test_imports.py \
            .github/workflows/apply-v5-recovery-guard-contract-efficiency.yml
      - name: Commit clean production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "fix(runtime): enforce recovery guard and contract efficiency"
          git push origin HEAD:fix/v5-recovery-guard-contract-efficiency-20260802
