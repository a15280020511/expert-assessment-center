name: Apply Planned Catalog Parity

on:
  push:
    branches:
      - fix/planned-catalog-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == github.repository_owner && !contains(github.event.head_commit.message, 'fix: resolve only governance-planned live endpoints')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/planned-catalog-parity
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Patch live catalog parity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          catalog = Path("open-model-market/v5_catalog_view.py")
          text = catalog.read_text(encoding="utf-8")
          old = "MAX_VISIBLE_MODELS = 150"
          assert old in text
          catalog.write_text(text.replace(old, "MAX_VISIBLE_MODELS = 1000", 1), encoding="utf-8")

          endpoint = Path("open-model-market/v5_endpoint_catalog.py")
          text = endpoint.read_text(encoding="utf-8")
          text = text.replace("    GOVERNANCE_COMPANIES,\n", "", 1)
          text = text.replace("from v5_model_company import canonical_model_company\n", "", 1)
          old = '''    expert_model_ids = {
        str(model.id)
        for model in eligible
        if canonical_model_company(str(model.id)) not in GOVERNANCE_COMPANIES
    }
    zdr_keys = _fetch_zdr_endpoint_keys(run) if expert_model_ids else frozenset()
'''
          new = '''    zdr_model_ids = {str(model.id) for model in eligible}
    zdr_keys = _fetch_zdr_endpoint_keys(run)
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''        if model_id in expert_model_ids:
            payload = _filter_model_payload_to_zdr(model_id, payload, zdr_keys)
'''
          new = '''        if model_id in zdr_model_ids:
            payload = _filter_model_payload_to_zdr(model_id, payload, zdr_keys)
'''
          assert old in text
          endpoint.write_text(text.replace(old, new, 1), encoding="utf-8")

          pipeline = Path("open-model-market/v5_price_ranked_pipeline.py")
          text = pipeline.read_text(encoding="utf-8")
          old = '''from v5_catalog_view import (
    MINIMUM_EXPERT_COMPLETION_TOKENS,
'''
          new = '''from v5_catalog_view import (
    CatalogViewError,
    MINIMUM_EXPERT_COMPLETION_TOKENS,
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = 'parser.add_argument("--ranking-limit", type=int, default=150)'
          assert old in text
          text = text.replace(old, 'parser.add_argument("--ranking-limit", type=int, default=1000)', 1)
          old = '''def _catalog_state(
    args: argparse.Namespace,
    run: Any,
    task_envelope: Mapping[str, Any],
) -> tuple[Mapping[str, Any], str, str]:
    required_context = int(task_envelope["required_context_tokens"])
    models, catalog_source = model_market.fetch_catalog(run)
    ranked = eligible_models(
        models,
        requested_context=required_context,
        maximum_models=int(args.ranking_limit),
    )
'''
          new = '''def _catalog_state(
    args: argparse.Namespace,
    run: Any,
    task_envelope: Mapping[str, Any],
    plan: Mapping[str, Any],
) -> tuple[Mapping[str, Any], str, str]:
    required_context = int(task_envelope["required_context_tokens"])
    models, catalog_source = model_market.fetch_catalog(run)
    eligible = eligible_models(
        models,
        requested_context=required_context,
        maximum_models=int(args.ranking_limit),
        exclude_governance_companies=False,
    )
    planned_rows = [
        *list(plan.get("selected_models") or []),
        *list(plan.get("recovery_models") or []),
    ]
    planned_ids = [
        str(row.get("model") or "").strip()
        for row in planned_rows
        if isinstance(row, Mapping)
    ]
    if not planned_ids or len(planned_ids) != len(set(planned_ids)):
        raise CatalogViewError("governance plan model identities are missing or repeated")
    eligible_by_id = {
        str(getattr(model, "id", "") or ""): model for model in eligible
    }
    missing = [model_id for model_id in planned_ids if model_id not in eligible_by_id]
    if missing:
        raise CatalogViewError(
            "governance-planned models are not live-eligible: " + ", ".join(missing)
        )
    ranked = [eligible_by_id[model_id] for model_id in planned_ids]
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''            "model_substitution_allowed": False,
            "provider_resolution_only": True,
'''
          new = '''            "model_substitution_allowed": False,
            "provider_resolution_only": True,
            "catalog_scope": "governance-plan-models-only",
            "planned_model_ids": planned_ids,
'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    catalog, catalog_source, endpoint_source = _catalog_state(
        args, run, task_envelope
    )
'''
          new = '''    catalog, catalog_source, endpoint_source = _catalog_state(
        args, run, task_envelope, plan
    )
'''
          assert old in text
          pipeline.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_endpoint = Path("tests/test_v5_endpoint_catalog.py")
          text = test_endpoint.read_text(encoding="utf-8")
          old_start = text.index("    def test_governance_models_are_not_filtered_by_expert_zdr_policy")
          old_end = text.index("    def test_missing_zdr_inventory_fails_closed_before_endpoint_fetch", old_start)
          replacement = '''    def test_all_planned_models_are_filtered_by_zdr_policy(self):
        models = [
            SimpleNamespace(id="openai/gpt-latest"),
            SimpleNamespace(id="anthropic/claude-opus-latest"),
        ]
        run = SimpleNamespace(
            api_key="test-key",
            catalog_timeout_seconds=5,
            catalog_max_retries=0,
        )

        def fake_request(url, *_args):
            if url == ZDR_ENDPOINTS_URL:
                return {
                    "data": [
                        {"model_id": model.id, "tag": "direct"}
                        for model in models
                    ]
                }
            return {
                "data": {
                    "endpoints": [
                        {"tag": "direct"},
                        {"tag": "not-zdr"},
                    ]
                }
            }

        with patch(
            "v5_endpoint_catalog.request_json",
            side_effect=fake_request,
        ) as request:
            result = fetch_live_endpoint_payloads(models, run)
        self.assertEqual(request.call_count, 3)
        for model in models:
            self.assertEqual(
                result[model.id]["data"]["endpoints"],
                [{"tag": "direct"}],
            )
            self.assertTrue(result[model.id]["zdr_endpoint_filter"]["required"])

'''
          test_endpoint.write_text(
              text[:old_start] + replacement + text[old_end:], encoding="utf-8"
          )

          new_test = Path("tests/test_v5_planned_catalog_scope.py")
          new_test.write_text('''from __future__ import annotations

import sys
import unittest
from pathlib import Path
from types import SimpleNamespace
from unittest.mock import patch

ROOT = Path(__file__).resolve().parents[1]
sys.path.insert(0, str(ROOT / "open-model-market"))

import v5_price_ranked_pipeline as pipeline  # noqa: E402
from v5_catalog_view import CatalogViewError  # noqa: E402


MODEL_IDS = [
    "openai/gpt-5.6-luna-pro",
    "nex-agi/nex-n2-pro",
    "xiaomi/mimo-v2.5-pro",
    "deepseek/deepseek-v4-pro",
    "amazon/nova-pro-v1",
    "nvidia/nemotron-3-ultra-550b-a55b",
    "google/gemini-2.5-pro",
    "perplexity/sonar-pro",
]
RANKS = [251, 28, 25, 23, 129, 38, 63, 274]


def model(model_id: str, rank: int) -> SimpleNamespace:
    return SimpleNamespace(
        id=model_id,
        context_length=131072,
        input_modalities=["text"],
        output_modalities=["text"],
        prompt_price_per_million=1.0,
        completion_price_per_million=3.0,
        ranks={"intelligence-high-to-low": rank},
    )


def plan() -> dict:
    rows = [
        {"model": model_id, "company": model_id.split("/", 1)[0]}
        for model_id in MODEL_IDS
    ]
    return {"selected_models": rows[:4], "recovery_models": rows[4:]}


class PlannedCatalogScopeTests(unittest.TestCase):
    def test_only_governance_planned_models_are_fetched_in_plan_order(self) -> None:
        models = {
            model_id: model(model_id, rank)
            for model_id, rank in zip(MODEL_IDS, RANKS, strict=True)
        }
        models["unused/cheap"] = model("unused/cheap", 1)
        captured: list[str] = []

        def fake_fetch_endpoints(ranked, _run, **_kwargs):
            captured.extend(row.id for row in ranked)
            return {row.id: {"data": {"endpoints": []}} for row in ranked}

        args = SimpleNamespace(ranking_limit=1000, endpoint_file=None)
        run = SimpleNamespace(dry_run=False, catalog_file=None)
        envelope = {"required_context_tokens": 16384}
        with patch.object(
            pipeline.model_market, "fetch_catalog", return_value=(models, "live")
        ), patch.object(
            pipeline, "fetch_live_endpoint_payloads", side_effect=fake_fetch_endpoints
        ), patch.object(
            pipeline,
            "compact_endpoint_catalog",
            return_value={"endpoints": []},
        ):
            catalog, source, endpoint_source = pipeline._catalog_state(
                args, run, envelope, plan()
            )

        self.assertEqual(captured, MODEL_IDS)
        self.assertNotIn("unused/cheap", captured)
        self.assertEqual(source, "live")
        self.assertEqual(endpoint_source, "openrouter-live-exact-endpoints")
        self.assertEqual(catalog["catalog_scope"], "governance-plan-models-only")
        self.assertEqual(catalog["planned_model_ids"], MODEL_IDS)

    def test_missing_planned_model_fails_closed(self) -> None:
        models = {
            model_id: model(model_id, rank)
            for model_id, rank in zip(MODEL_IDS[:-1], RANKS[:-1], strict=True)
        }
        args = SimpleNamespace(ranking_limit=1000, endpoint_file=None)
        run = SimpleNamespace(dry_run=False, catalog_file=None)
        envelope = {"required_context_tokens": 16384}
        with patch.object(
            pipeline.model_market, "fetch_catalog", return_value=(models, "live")
        ):
            with self.assertRaisesRegex(CatalogViewError, "perplexity/sonar-pro"):
                pipeline._catalog_state(args, run, envelope, plan())

    def test_runtime_default_matches_governance_rank_ceiling(self) -> None:
        args = pipeline.build_parser().parse_args(["--task", "test"])
        self.assertEqual(args.ranking_limit, 1000)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          workflow = Path(".github/workflows/apply-planned-catalog-parity.yml")
          workflow.unlink()
          PY

      - name: Run targeted zero-call tests
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python -m unittest \
            tests.test_v5_endpoint_catalog \
            tests.test_v5_planned_catalog_scope \
            tests.test_v5_governed_plan_orchestrator \
            tests.test_v5_governance_model_plan -v

      - name: Commit parity fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve only governance-planned live endpoints"
          git push origin HEAD:fix/planned-catalog-parity
