name: Native top50 migration

on:
  push:
    branches:
      - feat/top50-ortools-routing
    paths:
      - .github/workflows/native-top50-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Native checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin feat/top50-ortools-routing
          git checkout -B feat/top50-ortools-routing FETCH_HEAD
      - name: Apply all migrations
        run: |
          python3 tools/apply_top50_ortools_upgrade.py
          python3 tools/refine_top50_provider_pool.py
          python3 tools/sync_top50_runtime_contract.py
          rm -f .github/workflows/native-top50-migrate.yml
      - name: Install and validate
        run: |
          python3 -m pip install -r requirements-runtime.txt
          python3 -m py_compile \
            open-model-market/v5_top50_pool_optimizer.py \
            open-model-market/v5_top50_plan_validation.py \
            open-model-market/v5_provider_lock.py \
            open-model-market/v5_governance_model_plan.py \
            open-model-market/v5_price_ranked_issue_ticket.py \
            open-model-market/v5_proposal_materializer.py \
            open-model-market/v5_pipeline.py \
            open-model-market/v5_run_evidence.py
          python3 -m json.tool open-model-market/constitutional_policy.json >/dev/null
          PYTHONPATH=open-model-market python3 -m pytest -q \
            tests/test_top50_pool_optimizer.py \
            tests/test_top20_pool_selector.py \
            tests/test_v5_soft_proposal_materializer.py \
            tests/test_v5_constitution_policy.py \
            tests/test_v5_no_tools_network_policy.py
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: optimize weekly top50 expert pool with OR-Tools"
          git push origin HEAD:feat/top50-ortools-routing
