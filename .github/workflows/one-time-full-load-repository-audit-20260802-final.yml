name: One-Time Full Load Repository Audit 2026-08-02 Final

on:
  pull_request:
    branches: [main]
    paths: ["**"]

permissions:
  contents: read

concurrency:
  group: one-time-full-load-final-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  comprehensive-audit:
    name: Full repository, saturation, chaos, and invariant audit
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Bind source and install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts audit-logs
          checked="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$expected"
          test "$base" = "$production"
          printf 'checked_sha=%s\nbase_sha=%s\nproduction_sha=%s\n' \
            "$checked" "$base" "$production" | tee audit-artifacts/source-binding.txt
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt \
            2>&1 | tee audit-logs/dependency-install.log
          python -m pip check 2>&1 | tee audit-logs/pip-check.log

      - name: Static, compilation, full unit, and P0 gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          python -m ruff check . 2>&1 | tee audit-logs/ruff.log
          python -m compileall -q open-model-market tests tools \
            2>&1 | tee audit-logs/compileall.log
          python -m unittest discover -s tests -p 'test*.py' -v \
            2>&1 | tee audit-logs/full-unit-suite.log
          grep -Eq '^Ran 278 tests in ' audit-logs/full-unit-suite.log
          grep -q '^OK$' audit-logs/full-unit-suite.log
          python tools/run_v5_p0_regressions.py \
            2>&1 | tee audit-logs/p0-regressions.log
          grep -q 'P0 REGRESSION RESULT: run=50, passed=50, failures=0, errors=0, skipped=0' \
            audit-logs/p0-regressions.log

      - name: Six-seed repeated saturation and complex-scenario matrix
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            tests.test_v5_full_load_stability
            tests.test_v5_stress_stability
            tests.test_execution_graph_properties
            tests.test_v5_cross_endpoint_recovery
            tests.test_v5_critical_delivery_reliability
            tests.test_v5_v4_contract_isolation
            tests.test_v5_deterministic_answer_normalization
            tests.test_v5_general_task_planning
            tests.test_v5_planning_scenario_matrix
            tests.test_v5_long_markdown_contract_integrity
            tests.test_v5_explicit_contract_pipeline_integrity
          )
          for seed in 0 1 7 42 99 31337; do
            echo "=== PYTHONHASHSEED=$seed ===" | tee -a audit-logs/repeated-matrix.log
            PYTHONHASHSEED="$seed" python -m unittest "${modules[@]}" -v \
              2>&1 | tee -a audit-logs/repeated-matrix.log
          done

      - name: Granular line, duplicate, legacy, and workflow audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/repository_audit.py --root . --output-dir audit-artifacts --fail-on high \
            2>&1 | tee audit-logs/repository-line-audit.log
          python - <<'PY' 2>&1 | tee audit-logs/structure-audit.log
          import ast
          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          root = Path("open-model-market")
          files = sorted(root.glob("*.py"))
          fatal, warnings = [], []
          exact, bodies = defaultdict(list), defaultdict(list)
          removed = {
              "v5_executor", "v5_empty_output_recovery", "v5_total_call_cap",
              "v5_production_hardening", "v5_r8_executor", "v5_r8_gate_wiring",
              "v5_r8_policy", "v5_r8_provider_policy", "v5_r8_retry_policy",
              "v5_resilient_executor", "v5_stage_d_provider_compat",
          }
          for name in removed:
              if (root / f"{name}.py").exists():
                  fatal.append(f"legacy production file: {name}.py")
          for path in files:
              text = path.read_text(encoding="utf-8")
              exact[hashlib.sha256(text.encode()).hexdigest()].append(str(path))
              tree = ast.parse(text, filename=str(path))
              seen = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if node.name in seen:
                          fatal.append(f"duplicate top-level definition: {path}:{node.name}")
                      seen[node.name] = node.lineno
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.name == "install" and node.col_offset == 0:
                          fatal.append(f"top-level monkey-patch installer: {path}:{node.lineno}")
                      if sum(1 for _ in ast.walk(node)) >= 80:
                          body = ast.Module(body=node.body, type_ignores=[])
                          digest = hashlib.sha256(
                              ast.dump(body, include_attributes=False).encode()
                          ).hexdigest()
                          bodies[digest].append(f"{path}:{node.lineno}:{node.name}")
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id in {"eval", "exec"}:
                      fatal.append(f"dynamic code execution: {path}:{node.lineno}")
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == "install":
                      fatal.append(f"monkey-patch install call: {path}:{node.lineno}")
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      names = [a.name.rsplit('.', 1)[-1] for a in node.names] if isinstance(node, ast.Import) else ([node.module.rsplit('.', 1)[-1]] if node.module else [])
                      for name in names:
                          if name in removed:
                              fatal.append(f"legacy import: {path}:{node.lineno}:{name}")
          for paths in exact.values():
              if len(paths) > 1:
                  fatal.append("exact duplicate production files: " + ", ".join(paths))
          duplicated = [paths for paths in bodies.values() if len(paths) > 1]
          warnings.extend("large duplicate function body: " + ", ".join(paths) for paths in duplicated)
          action_re = re.compile(r"^\s*uses:\s*([^#\s]+)")
          pinned_re = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          workflows = list(Path(".github/workflows").glob("*.yml"))
          for path in workflows:
              text = path.read_text(encoding="utf-8")
              if "pull_request_target:" in text:
                  fatal.append(f"unsafe trigger: {path}")
              if re.search(r"persist-credentials:\s*true", text):
                  fatal.append(f"persisted checkout credentials: {path}")
              for number, line in enumerate(text.splitlines(), 1):
                  match = action_re.match(line)
                  if match and not match.group(1).startswith(("./", "docker://")) and not pinned_re.match(match.group(1)):
                      fatal.append(f"unpinned action: {path}:{number}:{match.group(1)}")
          report = {
              "status": "PASS" if not fatal else "FAIL",
              "production_python_files": len(files),
              "production_lines": sum(len(p.read_text(encoding='utf-8').splitlines()) for p in files),
              "exact_duplicate_file_groups": sum(1 for paths in exact.values() if len(paths) > 1),
              "large_duplicate_function_groups": len(duplicated),
              "fatal": sorted(set(fatal)),
              "warnings": sorted(set(warnings)),
          }
          Path("audit-artifacts/structure-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          if fatal:
              raise SystemExit(1)
          PY

      - name: Workflow, release, and production-cutover contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_workflow_contract \
            tests.test_v5_release_command_contract \
            tests.test_v5_production_cutover \
            tests.test_v5_p0_governance \
            tests.test_legacy_runtime_removed -v \
            2>&1 | tee audit-logs/workflow-release-contracts.log

      - name: Create zero-cost audit receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("audit-artifacts"); root.mkdir(exist_ok=True)
          def load(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else None
          receipt = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
              "paid_model_calls": 0,
              "model_cost_usd": 0.0,
              "structure": load("structure-audit.json"),
              "line_audit": load("repository-audit.json"),
          }
          (root / "full-load-audit-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-load-repository-audit-${{ github.run_id }}
          path: |
            audit-artifacts/
            audit-logs/
          if-no-files-found: error
          retention-days: 14
