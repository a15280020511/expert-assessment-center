name: Apply V5 Live Acceptance Fix

on:
  push:
    branches:
      - fix/v5-live-acceptance-evidence-recovery-20260804
    paths:
      - .github/v5-live-acceptance-fix.patch
      - .github/workflows/apply-v5-live-acceptance-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-v5-live-acceptance-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/v5-live-acceptance-evidence-recovery-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize and verify patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/v5-live-acceptance-fix.patch')
          lines = path.read_text(encoding='utf-8').splitlines()
          normalized = []
          escaped = False
          for line in lines:
              if line.startswith('+diff --git '):
                  escaped = True
              if escaped and line.startswith('+'):
                  line = line[1:]
              normalized.append(line)
          Path('/tmp/v5-live-acceptance-fix.patch').write_text(
              '\n'.join(normalized) + '\n',
              encoding='utf-8',
          )
          PY
          git apply --recount --check /tmp/v5-live-acceptance-fix.patch

      - name: Apply patch and run syntax validation
        run: |
          set -euo pipefail
          git apply --recount /tmp/v5-live-acceptance-fix.patch
          rm -f .github/v5-live-acceptance-fix.patch
          rm -f .github/workflows/apply-v5-live-acceptance-fix.yml
          python -m compileall -q open-model-market tests
          git diff --check

      - name: Commit exact patch result
        run: |
          set -euo pipefail
          git config user.name 'a15280020511'
          git config user.email 'a15280020511@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden live acceptance evidence recovery and quantities'
          git push origin HEAD:fix/v5-live-acceptance-evidence-recovery-20260804
