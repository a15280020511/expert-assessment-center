name: Deprecated Paid Candidate Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reject-deprecated-command:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[acceptance]') &&
      startsWith(github.event.comment.body, '/accept-main ')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject obsolete acceptance entrypoint without model calls
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## DEPRECATED_ACCEPTANCE_REJECTED',
                '',
                '`/accept-main` 已禁用，因为旧入口允许专家中心自行形成模型计划。',
                '',
                '请先把治理中心签发的完整专家票据作为本 Issue 正文，再使用：',
                '`/accept-governed-main <40位main SHA>`。',
                '',
                '模型调用：`0`。'
              ].join('\n')
            });
            core.setFailed('deprecated paid acceptance entrypoint is disabled');
