name: Deprecated Paid Candidate Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reject-deprecated-command:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[acceptance]') &&
      startsWith(github.event.comment.body, '/accept-main ')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Reject obsolete acceptance entrypoint without model calls
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## DEPRECATED_ACCEPTANCE_REJECTED',
                '',
                '`/accept-main` 已禁用，因为旧入口调用退役的 GPT/Claude 治理运行时。',
                '',
                '请使用：`/accept-price-main <40位main SHA>`。',
                '',
                '模型调用：`0`。'
              ].join('\n')
            });
            core.setFailed('deprecated paid acceptance entrypoint is disabled');
