name: V5 Paid Candidate Acceptance

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: v5-paid-candidate-acceptance
  cancel-in-progress: false

jobs:
  accept-main-candidate:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[acceptance]') &&
      startsWith(github.event.comment.body, '/accept-main ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MODEL_MAX_RETRIES: "0"
      MODEL_TIMEOUT_SECONDS: "240"
      PARALLEL_WORKERS: "4"
      OPENROUTER_SITE_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_NAME: expert-center-paid-candidate-acceptance
      MAXIMUM_TOTAL_CALLS: "10"
      MAXIMUM_RECOVERY_CALLS: "3"
      COST_ADVISORY_USD: "1.0"

    steps:
      - name: Validate explicit candidate command
        id: source
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        with:
          script: |
            const body = String(context.payload.comment?.body || '').trim();
            const match = body.match(/^\/accept-main ([0-9a-f]{40})$/);
            if (!match) {
              core.setFailed('command must be /accept-main <40-character-main-sha>');
              return;
            }
            const candidate = match[1];
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const production = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'production'
            });
            const mainSha = String(main.data.commit.sha || '');
            const productionSha = String(production.data.commit.sha || '');
            if (candidate !== mainSha) {
              core.setFailed(`candidate ${candidate} is not current main ${mainSha}`);
              return;
            }
            if (candidate === productionSha) {
              core.setFailed('candidate is already deployed to production');
              return;
            }
            core.setOutput('candidate_sha', candidate);
            core.setOutput('previous_production_sha', productionSha);

      - name: Checkout exact main candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze candidate and production identities
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
        run: |
          set -euo pipefail
          checked="$(git rev-parse HEAD)"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          production="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
          test "$checked" = "$CANDIDATE_SHA"
          test "$main" = "$CANDIDATE_SHA"
          test "$production" = "$PREVIOUS_PRODUCTION_SHA"
          test "$main" != "$production"
          printf '%s\n' "$CANDIDATE_SHA" > checked-out-candidate-sha.txt
          printf '%s\n' "$PREVIOUS_PRODUCTION_SHA" > previous-production-sha.txt

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install pinned runtime dependencies
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test "${#OPENROUTER_API_KEY}" -ge 20
          python -m pip install --disable-pip-version-check --no-input -r requirements-runtime.txt
          python -m pip check

      - name: Create and validate isolated acceptance ticket
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=open-model-market python - <<'PY'
          import argparse
          import json
          import os

          import v5_issue_ticket

          candidate = os.environ["CANDIDATE_SHA"]
          task_id = f"acceptance-{candidate[:16]}"
          packet = {
              "task_id": task_id,
              "route": "expert-team",
              "objective": "One explicit paid candidate acceptance for the exact main SHA.",
              "task": {
                  "question": (
                      "某机构只能选择一个实施方案。已知方案A成本100万元、交付30天、"
                      "失败概率12%；方案B成本140万元、交付20天、失败概率7%；"
                      "方案C成本220万元、交付10天、失败概率4%。仅依据这些题面数据，"
                      "比较成本、时效和风险，给出条件化选择。"
                  ),
                  "requirements": [
                      "严格使用四个Markdown二级标题：已知条件、计算与比较、风险与反证、结论与下一步。",
                      "明确区分题面事实、推断和建议，不得引入题面外事实。",
                      "禁止工具、搜索、联网、插件、MCP、代码执行和外部数据调用。",
                      "不得计算或报告题面未直接给出的差值、阈值或其他新精确数值；只复用题面数字做排序和条件化比较。",
                      "完整交付优先，删除重复和无关扩展。",
                  ],
                  "language": "zh-CN",
              },
              "execution_acceptance": [
                  "exact candidate SHA",
                  "native V5 runtime success",
                  "request and response no-tools boundary",
                  "independent primary Artifact revalidation PASS",
                  "final Attestation PASS",
              ],
              "approved_budget": {
                  "calls": 10,
                  "maximum_recovery_calls": 3,
                  "cost_policy": "prompt_led_soft_governance",
                  "cost_anomaly_usd": 1.0,
              },
              "private_output": False,
          }
          args = argparse.Namespace(
              event_path=None,
              issue_title="[execution] exact main candidate acceptance",
              issue_body=json.dumps(packet, ensure_ascii=False),
              issue_number=int(os.environ["ISSUE_NUMBER"]),
              actor=os.environ["GITHUB_REPOSITORY_OWNER"],
              author_association="OWNER",
              comment_body=f"/run-expert-team {task_id}",
              output_dir="ticket-artifacts",
          )
          raise SystemExit(v5_issue_ticket.prepare(args))
          PY
          test "$(jq -r '.accepted' ticket-artifacts/ticket-status.json)" = "true"
          test "$(jq -r '.task_id' ticket-artifacts/ticket-status.json)" = "acceptance-${CANDIDATE_SHA:0:16}"
          python open-model-market/v5_ticket_gate.py \
            --output-dir ticket-artifacts \
            --expected-calls "$MAXIMUM_TOTAL_CALLS" \
            --expected-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --expected-cost-anomaly-usd "$COST_ADVISORY_USD"

      - name: Execute exact candidate with production runtime
        id: execute
        continue-on-error: true
        run: |
          task="$(cat ticket-artifacts/task.txt)"
          python open-model-market/v5_production_ticket.py \
            --task "$task" \
            --output-dir ticket-artifacts \
            --maximum-total-calls "$MAXIMUM_TOTAL_CALLS" \
            --maximum-recovery-calls "$MAXIMUM_RECOVERY_CALLS" \
            --cost-anomaly-usd "$COST_ADVISORY_USD" \
            --require-live-catalog

      - name: Prepare report publication package
        id: prepare_report
        continue-on-error: true
        run: |
          python open-model-market/publish_report.py \
            --output-dir ticket-artifacts \
            --comments-dir ticket-artifacts/report-comments \
            --run-url "$RUN_URL"

      - name: Audit complete native V5 evidence
        id: audit
        continue-on-error: true
        run: |
          python open-model-market/v5_execution_auditor_integrity.py \
            --output-dir ticket-artifacts \
            --execute-outcome "${{ steps.execute.outcome }}" \
            --publish-outcome "${{ steps.prepare_report.outcome }}"

      - name: Freeze primary artifact manifest
        id: manifest
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "open-model-market")
          from artifact_manifest import write_manifest
          write_manifest(Path("ticket-artifacts"))
          PY

      - name: Upload immutable primary artifact
        id: ticket_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paid-candidate-primary-${{ github.run_id }}
          path: ticket-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Independently revalidate uploaded primary artifact
        id: independent
        if: always()
        continue-on-error: true
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_ARTIFACT_ID"
          test -n "$PRIMARY_ARTIFACT_DIGEST"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$PRIMARY_ARTIFACT_ID/zip" \
            > uploaded-primary-artifact.zip
          rm -rf independently-downloaded-primary
          mkdir independently-downloaded-primary
          unzip -q uploaded-primary-artifact.zip -d independently-downloaded-primary
          set +e
          python open-model-market/v5_independent_artifact_revalidation.py \
            --artifact-dir independently-downloaded-primary \
            --expected-sha "$CANDIDATE_SHA" \
            --expected-run-id "${{ github.run_id }}" \
            --maximum-calls "$MAXIMUM_TOTAL_CALLS" \
            --cost-advisory-usd "$COST_ADVISORY_USD" \
            --archive uploaded-primary-artifact.zip \
            --expected-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --output independent-revalidation.json
          revalidation_exit=$?
          set -e
          status="$(jq -r '.status // "FAIL"' independent-revalidation.json 2>/dev/null || printf 'FAIL')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$revalidation_exit" -eq 0
          test "$status" = "PASS"

      - name: Publish audited report to acceptance issue
        id: publish
        if: >-
          steps.execute.outcome == 'success' &&
          steps.prepare_report.outcome == 'success' &&
          steps.audit.outputs.status == 'PASS' &&
          steps.manifest.outcome == 'success' &&
          steps.ticket_artifact.outcome == 'success' &&
          steps.independent.outcome == 'success' &&
          steps.independent.outputs.status == 'PASS'
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          COMMENT_DIR: ticket-artifacts/report-comments
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync(process.env.COMMENT_DIR)
              .filter(name => /^report-comment-\d+\.md$/.test(name))
              .sort();
            if (files.length === 0) {
              throw new Error('No audited report comments found');
            }
            for (const name of files) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fs.readFileSync(path.join(process.env.COMMENT_DIR, name), 'utf8')
              });
            }

      - name: Render authoritative final status
        id: final
        if: always()
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.ticket_artifact.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
        run: |
          effective_audit_outcome="${{ steps.audit.outcome }}"
          if [[ "${{ steps.independent.outcome }}" != "success" || \
                "${{ steps.independent.outputs.status }}" != "PASS" ]]; then
            effective_audit_outcome="independent-artifact-revalidation-failed"
          fi
          python open-model-market/v5_final_status.py \
            --output-dir ticket-artifacts \
            --run-url "$RUN_URL" \
            --ticket-upload-outcome "${{ steps.ticket_artifact.outcome }}" \
            --audit-outcome "$effective_audit_outcome" \
            --manifest-outcome "${{ steps.manifest.outcome }}" \
            --artifact-id "$PRIMARY_ARTIFACT_ID" \
            --artifact-url "$PRIMARY_ARTIFACT_URL" \
            --artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --independent-revalidation-file independent-revalidation.json \
            | tee final-status.md

      - name: Generate final attestation and acceptance receipt
        id: attest
        if: always()
        env:
          PRIMARY_ARTIFACT_ID: ${{ steps.ticket_artifact.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.ticket_artifact.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.ticket_artifact.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
        run: |
          python open-model-market/v5_final_attestation.py \
            --output-dir ticket-artifacts \
            --primary-artifact-id "$PRIMARY_ARTIFACT_ID" \
            --primary-artifact-digest "$PRIMARY_ARTIFACT_DIGEST" \
            --primary-artifact-url "$PRIMARY_ARTIFACT_URL" \
            --audit-status "${{ steps.final.outputs.status }}" \
            --run-id "${{ github.run_id }}" \
            --commit-sha "$CANDIDATE_SHA" \
            --final-status-file final-status.md \
            --independent-revalidation-file independent-revalidation.json \
            --output final-attestation.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          independent_path = Path("independent-revalidation.json")
          final_path = Path("ticket-artifacts/final-status.json")
          attestation_path = Path("final-attestation.json")
          independent = json.loads(independent_path.read_text(encoding="utf-8"))
          final_status = json.loads(final_path.read_text(encoding="utf-8"))
          attestation = json.loads(attestation_path.read_text(encoding="utf-8"))
          status = "PASS" if (
              independent.get("status") == "PASS"
              and final_status.get("status") == "PASS"
          ) else "FAIL"
          receipt = {
              "schema_version": "v5-paid-candidate-acceptance-1",
              "status": status,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "previous_production_sha": os.environ["PREVIOUS_PRODUCTION_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "primary_artifact_id": os.environ["PRIMARY_ARTIFACT_ID"],
              "primary_artifact_digest": os.environ["PRIMARY_ARTIFACT_DIGEST"],
              "independent_revalidation_status": independent.get("status"),
              "final_status": final_status.get("status"),
              "production_ref_moved": False,
              "attestation_sha256": hashlib.sha256(attestation_path.read_bytes()).hexdigest(),
              "independent_revalidation_sha256": hashlib.sha256(independent_path.read_bytes()).hexdigest(),
          }
          Path("candidate-acceptance.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          attestation["candidate_acceptance"] = receipt
          attestation_path.write_text(
              json.dumps(attestation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if status != "PASS":
              raise SystemExit("candidate acceptance receipt is not PASS")
          PY

      - name: Upload final candidate acceptance evidence
        id: proof_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paid-candidate-attestation-${{ github.run_id }}
          path: |
            final-attestation.json
            candidate-acceptance.json
            final-status.md
            ticket-artifacts/final-status.json
            independent-revalidation.json
            checked-out-candidate-sha.txt
            previous-production-sha.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish authoritative candidate acceptance status
        if: always()
        uses: actions/github-script@ff4b64fc288a21d5291396a384c1273f032e6333 # v9.0.0
        env:
          STATUS_FILE: final-status.md
          ACCEPTANCE_FILE: candidate-acceptance.json
          FINAL_ARTIFACT_ID: ${{ steps.proof_artifact.outputs.artifact-id }}
          FINAL_ARTIFACT_URL: ${{ steps.proof_artifact.outputs.artifact-url }}
          FINAL_ARTIFACT_DIGEST: ${{ steps.proof_artifact.outputs.artifact-digest }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.existsSync(process.env.STATUS_FILE)
              ? fs.readFileSync(process.env.STATUS_FILE, 'utf8')
              : '## PAID_CANDIDATE_ACCEPTANCE_FAILED\n\nFinal status file is unavailable.';
            if (fs.existsSync(process.env.ACCEPTANCE_FILE)) {
              const receipt = JSON.parse(fs.readFileSync(process.env.ACCEPTANCE_FILE, 'utf8'));
              body += `\n- Candidate acceptance: \`${receipt.status}\``;
              body += `\n- Candidate SHA: \`${receipt.candidate_sha}\``;
              body += `\n- Previous production SHA: \`${receipt.previous_production_sha}\``;
              body += `\n- Production moved during acceptance: \`${receipt.production_ref_moved}\``;
            }
            body += `\n- Final attestation Artifact ID: \`${process.env.FINAL_ARTIFACT_ID || 'unavailable'}\``;
            body += `\n- Final attestation Artifact digest: \`${process.env.FINAL_ARTIFACT_DIGEST || 'unavailable'}\``;
            if (process.env.FINAL_ARTIFACT_URL) {
              body += `\n- Final attestation Artifact: ${process.env.FINAL_ARTIFACT_URL}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Verify authoritative candidate acceptance outcome
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.source.outputs.candidate_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ steps.source.outputs.previous_production_sha }}
        run: |
          set -euo pipefail
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.prepare_report.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.audit.outputs.status }}" = "PASS"
          test "${{ steps.manifest.outcome }}" = "success"
          test "${{ steps.ticket_artifact.outcome }}" = "success"
          test "${{ steps.independent.outcome }}" = "success"
          test "${{ steps.independent.outputs.status }}" = "PASS"
          test "${{ steps.publish.outcome }}" = "success"
          test "${{ steps.final.outcome }}" = "success"
          test "${{ steps.final.outputs.status }}" = "PASS"
          test "${{ steps.attest.outcome }}" = "success"
          test "${{ steps.proof_artifact.outcome }}" = "success"
          test "$(jq -r '.status' candidate-acceptance.json)" = "PASS"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/production | awk '{print $1}')" = "$PREVIOUS_PRODUCTION_SHA"
