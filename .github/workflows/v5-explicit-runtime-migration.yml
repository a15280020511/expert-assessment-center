name: V5 Explicit Runtime Migration

on:
  push:
    branches:
      - refactor/v5-explicit-runtime
    paths:
      - tools/apply_v5_explicit_runtime_migration.py
      - .github/workflows/v5-explicit-runtime-migration.yml

permissions:
  contents: write

concurrency:
  group: v5-explicit-runtime-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v5-explicit-runtime
          fetch-depth: 0
      - name: Apply deterministic migration
        run: python tools/apply_v5_explicit_runtime_migration.py
      - name: Remove one-shot migration files
        run: |
          rm tools/apply_v5_explicit_runtime_migration.py
          rm .github/workflows/v5-explicit-runtime-migration.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v5): remove history and production monkey patches"
          git push origin HEAD:refactor/v5-explicit-runtime
